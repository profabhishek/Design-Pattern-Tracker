<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>JavaQuest · Java Backend Interview Course</title>
<meta name="description" content="A game-like Java backend interview course: easy notes, an in-browser Java compiler with auto-graded challenges, flashcards, mock interviews, XP, streaks and badges.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>☕</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="app/style.css">
<script>try{var t=localStorage.getItem("jq-theme");if(t)document.documentElement.dataset.theme=t;}catch(e){}</script>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <a class="brand" href="#/">
      <span class="brand-logo">☕</span>
      <span><b>JavaQuest</b><small>Backend interview course</small></span>
    </a>
    <nav class="nav" id="nav">
      <a href="#/" data-nav="home"><span>🏠</span>Home</a>
      <a href="#/tracks" data-nav="tracks"><span>🗺️</span>All tracks</a>
      <a href="#/revise" data-nav="revise"><span>🃏</span>Flashcards <em class="pill" id="dueCount" hidden></em></a>
      <a href="#/boss" data-nav="boss"><span>🐉</span>Mock interview</a>
      <a href="#/playground" data-nav="playground"><span>⌨️</span>Java playground</a>
      <a href="#/badges" data-nav="badges"><span>🏅</span>Badges</a>
      <a href="#/stats" data-nav="stats"><span>📈</span>Stats & settings</a>
    </nav>
    <div class="side-tracks" id="sideTracks"></div>
    <div class="side-foot">
      <a href="learn.html">📘 Pattern notes</a> · <a href="patterns.html">Old tracker</a>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Menu">☰</button>
      <button class="search-btn" id="searchBtn" type="button"><span>🔎</span><span class="hide-sm">Search topics…</span><kbd class="hide-sm">/</kbd></button>
      <div class="hud">
        <div class="hud-chip streak" id="hudStreak" title="Daily streak"><span class="flame">🔥</span><b id="streakN">0</b></div>
        <div class="hud-chip freeze" id="hudFreeze" title="Streak freezes: save your streak if you miss a day"><span>🧊</span><b id="freezeN">0</b></div>
        <div class="hud-chip goal" id="hudGoal" title="Today's XP goal">
          <svg viewBox="0 0 36 36" class="ring"><circle cx="18" cy="18" r="15" class="ring-bg"/><circle cx="18" cy="18" r="15" class="ring-fg" id="goalRing"/></svg>
          <b id="goalTxt">0/60</b>
        </div>
        <a class="hud-level" href="#/stats" title="Your level">
          <span class="lvl-badge" id="lvlBadge">1</span>
          <span class="lvl-info"><small id="lvlTitle">Hello World Kid</small><span class="xpbar"><i id="xpFill"></i></span></span>
        </a>
        <button class="icon-btn" id="timerBtn" title="Focus timer (25 min = +20 XP)">⏱️</button>
        <button class="icon-btn" id="soundBtn" title="Sound on/off">🔊</button>
        <button class="icon-btn" id="themeBtn" title="Light/dark">🌓</button>
      </div>
    </header>
    <main id="view" class="view" tabindex="-1"></main>
  </div>
</div>

<nav class="bottom-nav" id="bottomNav">
  <a href="#/" data-nav="home"><span>🏠</span>Home</a>
  <a href="#/tracks" data-nav="tracks"><span>🗺️</span>Learn</a>
  <a href="#/revise" data-nav="revise"><span>🃏</span>Cards</a>
  <a href="#/boss" data-nav="boss"><span>🐉</span>Mock</a>
  <a href="#/playground" data-nav="playground"><span>⌨️</span>Code</a>
</nav>

<div class="focus-timer" id="focusTimer" hidden>
  <span>⏱️</span><b id="focusTime">25:00</b>
  <button type="button" id="focusStop">Stop</button>
</div>

<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="modal-wrap" id="modal" hidden><div class="modal" id="modalBox"></div></div>
<div class="search-wrap" id="search" hidden>
  <div class="search-box">
    <input id="searchInput" type="search" placeholder="Search: hashmap, saga, two sum, @Transactional…" autocomplete="off">
    <div id="searchRes" class="search-res"></div>
  </div>
</div>
<canvas id="fx" class="fx"></canvas>

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/clike/clike.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
<script src="app/course.js"></script>
<script src="app/runner.js"></script>
<script src="app/app.js"></script>
</body>
</html>

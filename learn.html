<script id="data" type="application/json">{"topics":[{"id":"singleton","n":"Singleton","p":1,"focus":"One instance, one global access point.","build":"Write a thread-safe singleton, then replace it with dependency injection.","trade":"hidden global state, testing pain, thread safety","day":1,"theme":"Creational patterns","title":"Singleton","lede":"Make sure a class has <strong>only one object<\/strong> in the whole app, and give everyone one place to get it.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>Think of the <strong>principal of a school<\/strong>. There is only one principal. Every teacher who needs the principal goes to the same person. Nobody \"creates\" a new principal when they need one.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Some things should exist only once:<\/p>\n<ul>\n<li>A configuration object (app settings)<\/li>\n<li>A connection pool to the database<\/li>\n<li>A cache shared by the whole app<\/li>\n<\/ul>\n<p>If every class made its own copy, you would waste memory and the copies could go out of sync.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"how-does-it-work\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How does it work?<\/span><\/h2><div class=\"sec-body\"><ol>\n<li>Make the constructor <code>private<\/code> so nobody can call <code>new<\/code>.<\/li>\n<li>Keep one <code>static<\/code> object inside the class.<\/li>\n<li>Give a <code>static<\/code> method (<code>getInstance()<\/code>) that returns that one object.<\/li>\n<\/ol><\/div><\/section>\n<section class=\"sec k-code\" id=\"plain-java-code\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Plain Java code<\/span><\/h2><div class=\"sec-body\"><h3>Simple (eager) version – created when the class loads<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"n\">INSTANCE<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"p\">();<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"nf\">AppConfig<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">            <\/span><span class=\"c1\">// nobody outside can call new<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"nf\">getInstance<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">INSTANCE<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Thread-safe lazy version (double-checked locking)<\/h3>\n<p>\"Lazy\" means: create it only when somebody asks for it the first time.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">volatile<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"n\">instance<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// volatile = all threads see the latest value<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"nf\">AppConfig<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"nf\">getInstance<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">instance<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// 1st check (fast, no lock)<\/span>\n<span class=\"w\">            <\/span><span class=\"kd\">synchronized<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">AppConfig<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">instance<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">            <\/span><span class=\"c1\">// 2nd check (inside lock)<\/span>\n<span class=\"w\">                    <\/span><span class=\"n\">instance<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">instance<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Why two checks? Two threads can pass the first check at the same time. The lock lets only one in; the second check stops the other thread from creating a second object.<\/p>\n<h3>Best simple trick – Holder class (lazy + thread-safe, no locks)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"nf\">AppConfig<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">Holder<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"n\">INSTANCE<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"n\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"nf\">getInstance<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">Holder<\/span><span class=\"p\">.<\/span><span class=\"na\">INSTANCE<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// Holder loads only when this line runs first time<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>You can also use an <code>enum<\/code> with one value – Java guarantees only one exists.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-way-what-you-actually-use-at-work\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot way (what you actually use at work)<\/span><\/h2><div class=\"sec-body\"><p>In Spring, <strong>every bean is a singleton by default<\/strong>. Spring creates one object and gives the same one to everyone. You don't write <code>getInstance()<\/code> at all.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// Spring creates ONE OrderService for the whole app<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">AppSettings<\/span><span class=\"w\"> <\/span><span class=\"n\">settings<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">AppSettings<\/span><span class=\"w\"> <\/span><span class=\"n\">settings<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">   <\/span><span class=\"c1\">// Spring passes the same AppSettings object<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">settings<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">settings<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">AppConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span><span class=\"w\">                      <\/span><span class=\"c1\">// scope is \"singleton\" by default<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">AppSettings<\/span><span class=\"w\"> <\/span><span class=\"nf\">appSettings<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">AppSettings<\/span><span class=\"p\">(<\/span><span class=\"s\">\"INR\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">18<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>If you ever need a new object each time, you can change the scope:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@Scope<\/span><span class=\"p\">(<\/span><span class=\"s\">\"prototype\"<\/span><span class=\"p\">)<\/span><span class=\"w\">   <\/span><span class=\"c1\">// a new object every time it is injected<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ReportBuilder<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p><strong>Note:<\/strong> A Spring singleton means \"one per Spring container\", not \"one per JVM\" like the classic pattern.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-from-the-tracker\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task from the tracker<\/span><\/h2><div class=\"sec-body\"><blockquote>\n<p>Write a thread-safe singleton, then replace it with dependency injection.<\/p>\n<\/blockquote>\n<p>Before (classic singleton – hard to test):<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PriceService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">finalPrice<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"n\">TaxConfig<\/span><span class=\"p\">.<\/span><span class=\"na\">getInstance<\/span><span class=\"p\">().<\/span><span class=\"na\">getRate<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">/<\/span><span class=\"w\"> <\/span><span class=\"mi\">100<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>After (Spring DI – easy to test, still only one TaxConfig):<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PriceService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">TaxConfig<\/span><span class=\"w\"> <\/span><span class=\"n\">taxConfig<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">PriceService<\/span><span class=\"p\">(<\/span><span class=\"n\">TaxConfig<\/span><span class=\"w\"> <\/span><span class=\"n\">taxConfig<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">taxConfig<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">taxConfig<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">finalPrice<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"n\">taxConfig<\/span><span class=\"p\">.<\/span><span class=\"na\">getRate<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">/<\/span><span class=\"w\"> <\/span><span class=\"mi\">100<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>In a test you can now pass a fake <code>TaxConfig<\/code> with <code>new PriceService(fakeConfig)<\/code>.<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Exactly one shared thing is needed (config, pool, cache)<\/td>\n<td>You just want \"global variables\" for convenience<\/td>\n<\/tr>\n<tr>\n<td>The object is costly to create<\/td>\n<td>The object holds user-specific data<\/td>\n<\/tr>\n<tr>\n<td><\/td>\n<td>You need to swap it in tests (prefer DI)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Hidden global state:<\/strong> any class can call <code>getInstance()<\/code>, so it is hard to see who depends on it.<\/li>\n<li><strong>Testing pain:<\/strong> you can't easily replace it with a fake object in unit tests.<\/li>\n<li><strong>Thread safety:<\/strong> a lazy singleton without <code>synchronized<\/code>/<code>volatile<\/code> can create two objects. Also, a singleton with changing fields must be thread-safe, since all threads share it.<\/li>\n<li>In Spring, keep singleton beans <strong>stateless<\/strong> (no per-request data in fields).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>One object, private constructor, static access method.<\/li>\n<li>Use Holder class or enum for an easy thread-safe version.<\/li>\n<li>In Spring Boot, beans are singletons already – use DI instead of <code>getInstance()<\/code>.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"how-does-it-work","t":"How does it work?","k":"idea"},{"id":"plain-java-code","t":"Plain Java code","k":"code"},{"id":"spring-boot-way-what-you-actually-use-at-work","t":"Spring Boot way (what you actually use at work)","k":"code"},{"id":"build-task-from-the-tracker","t":"Build task from the tracker","k":"build"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this think of the principal of a school . there is only one principal. every teacher who needs the principal goes to the same person. nobody \"creates\" a new principal when they need one. what problem does it solve? some things should exist only once: a configuration object (app settings) a connection pool to the database a cache shared by the whole app if every class made its own copy, you would waste memory and the copies could go out of sync. how does it work? make the constructor private so nobody can call new . keep one static object inside the class. give a static method ( getinstance() ) that returns that one object. plain java code simple (eager) version – created when the class loads java copy public class appconfig { private static final appconfig instance = new appconfig (); private appconfig () { } // nobody outside can call new public static appconfig getinstance () { return instance ; } } thread-safe lazy version (double-checked locking) \"lazy\" means: create it only when somebody asks for it the first time. java copy public class appconfig { private static volatile appconfig instance ; // volatile = all threads see the latest value private appconfig () { } public static appconfig getinstance () { if ( instance == null ) { // 1st check (fast, no lock) synchronized ( appconfig . class ) { if ( instance == null ) { // 2nd check (inside lock) instance = new appconfig (); } } } return instance ; } } why two checks? two threads can pass the first check at the same time. the lock lets only one in; the second check stops the other thread from creating a second object. best simple trick – holder class (lazy + thread-safe, no locks) java copy public class appconfig { private appconfig () { } private static class holder { private static final appconfig instance = new appconfig (); } public static appconfig getinstance () { return holder . instance ; // holder loads only when this line runs first time } } you can also use an enum with one value – java guarantees only one exists. spring boot way (what you actually use at work) in spring, every bean is a singleton by default . spring creates one object and gives the same one to everyone. you don't write getinstance() at all. java copy @service // spring creates one orderservice for the whole app public class orderservice { private final appsettings settings ; public orderservice ( appsettings settings ) { // spring passes the same appsettings object this . settings = settings ; } } java copy @configuration public class appconfig { @bean // scope is \"singleton\" by default public appsettings appsettings () { return new appsettings ( \"inr\" , 18 ); } } if you ever need a new object each time, you can change the scope: java copy @component @scope ( \"prototype\" ) // a new object every time it is injected public class reportbuilder { } note: a spring singleton means \"one per spring container\", not \"one per jvm\" like the classic pattern. build task from the tracker write a thread-safe singleton, then replace it with dependency injection. before (classic singleton – hard to test): java copy public class priceservice { public double finalprice ( double p ) { return p + p * taxconfig . getinstance (). getrate () / 100 ; } } after (spring di – easy to test, still only one taxconfig): java copy @service public class priceservice { private final taxconfig taxconfig ; public priceservice ( taxconfig taxconfig ) { this . taxconfig = taxconfig ; } public double finalprice ( double p ) { return p + p * taxconfig . getrate () / 100 ; } } in a test you can now pass a fake taxconfig with new priceservice(fakeconfig) . when to use / when not to use use it when avoid it when exactly one shared thing is needed (config, pool, cache) you just want \"global variables\" for convenience the object is costly to create the object holds user-specific data you need to swap it in tests (prefer di) points to explain in an interview hidden global state: any class can call getinstance() , so it is hard to see who depends on it. testing pain: you can't easily replace it with a fake object in unit tests. thread safety: a lazy singleton without synchronized / volatile can create two objects. also, a singleton with changing fields must be thread-safe, since all threads share it. in spring, keep singleton beans stateless (no per-request data in fields). quick revision one object, private constructor, static access method. use holder class or enum for an easy thread-safe version. in spring boot, beans are singletons already – use di instead of getinstance() ."},{"id":"factory","n":"Factory","p":1,"focus":"Hide object creation behind an interface.","build":"Payment gateway factory that returns the right client by type.","trade":"simple factory vs factory method vs abstract factory","day":1,"theme":"Creational patterns","title":"Factory","lede":"Instead of using <code>new<\/code> everywhere, ask a <strong>factory<\/strong> to give you the right object. The caller does not need to know which exact class is created.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>At a pizza shop you just say \"one Margherita\". You don't go into the kitchen and make it. The kitchen (factory) decides how to make it and hands it to you.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Without a factory, code looks like this everywhere:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"UPI\"<\/span><span class=\"p\">))<\/span><span class=\"w\">   <\/span><span class=\"n\">gateway<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">UpiGateway<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"CARD\"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"n\">gateway<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">CardGateway<\/span><span class=\"p\">();<\/span>\n<span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"WALLET\"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"n\">gateway<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">WalletGateway<\/span><span class=\"p\">();<\/span><\/code><\/pre><\/figure>\n<p>If you add a new payment type, you must change this code in many places. A factory keeps the \"which class to create\" logic in <strong>one place<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"three-flavours-common-interview-question\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Three flavours (common interview question)<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Simple meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Simple Factory<\/strong><\/td>\n<td>One class with a method like <code>create(type)<\/code> that returns the right object. (Not an official GoF pattern, but very common.)<\/td>\n<\/tr>\n<tr>\n<td><strong>Factory Method<\/strong><\/td>\n<td>A parent class says \"I need a product\", and <strong>child classes decide<\/strong> which product to create by overriding a method.<\/td>\n<\/tr>\n<tr>\n<td><strong>Abstract Factory<\/strong><\/td>\n<td>A factory that creates a <strong>family<\/strong> of related objects (e.g. <code>DarkThemeFactory<\/code> makes DarkButton + DarkCheckbox).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-payment-gateway-factory\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – Payment Gateway Factory<\/span><\/h2><div class=\"sec-body\"><h3>Step 1: A common interface<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">type<\/span><span class=\"p\">();<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// \"UPI\", \"CARD\", ...<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Step 2: Implementations (each is a Spring bean)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">UpiGateway<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">type<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"UPI\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Paid ₹\"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" by UPI\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CardGateway<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">type<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"CARD\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Paid ₹\"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" by Card\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Step 3: The factory<\/h3>\n<p>Spring gives us <strong>all<\/strong> <code>PaymentGateway<\/code> beans as a list. We put them in a map by type.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentGatewayFactory<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">gateways<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">PaymentGatewayFactory<\/span><span class=\"p\">(<\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">PaymentGateway<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">list<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">gateways<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">list<\/span><span class=\"p\">.<\/span><span class=\"na\">stream<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">collect<\/span><span class=\"p\">(<\/span><span class=\"n\">Collectors<\/span><span class=\"p\">.<\/span><span class=\"na\">toMap<\/span><span class=\"p\">(<\/span><span class=\"n\">PaymentGateway<\/span><span class=\"p\">::<\/span><span class=\"n\">type<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">g<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">g<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"nf\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">type<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"n\">g<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">gateways<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">toUpperCase<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">g<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalArgumentException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Unknown payment type: \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">type<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">g<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Step 4: Use it<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RestController<\/span>\n<span class=\"nd\">@RequestMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/pay\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentController<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGatewayFactory<\/span><span class=\"w\"> <\/span><span class=\"n\">factory<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">PaymentController<\/span><span class=\"p\">(<\/span><span class=\"n\">PaymentGatewayFactory<\/span><span class=\"w\"> <\/span><span class=\"n\">factory<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">factory<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">factory<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@PostMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/{type}\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"nd\">@PathVariable<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">type<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nd\">@RequestParam<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">factory<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">).<\/span><span class=\"na\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p><strong>Adding a new type (e.g. Wallet)?<\/strong> Just create a new <code>@Component<\/code> class. No <code>if/else<\/code> to change. This follows the <strong>Open/Closed principle<\/strong> – open for extension, closed for modification.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"factory-method-tiny-example\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Factory Method – tiny example<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">abstract<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">NotificationService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">abstract<\/span><span class=\"w\"> <\/span><span class=\"n\">Notifier<\/span><span class=\"w\"> <\/span><span class=\"nf\">createNotifier<\/span><span class=\"p\">();<\/span><span class=\"w\">       <\/span><span class=\"c1\">// the \"factory method\"<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">notifyUser<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">msg<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">createNotifier<\/span><span class=\"p\">().<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"n\">msg<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">class<\/span> <span class=\"nc\">EmailNotificationService<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">NotificationService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Notifier<\/span><span class=\"w\"> <\/span><span class=\"nf\">createNotifier<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">EmailNotifier<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"where-spring-itself-uses-factory\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Where Spring itself uses Factory<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><code>BeanFactory<\/code> / <code>ApplicationContext<\/code> – the whole Spring container is a giant factory.<\/li>\n<li><code>@Bean<\/code> methods are factory methods.<\/li>\n<li><code>FactoryBean&lt;T&gt;<\/code> interface lets you write custom creation logic.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>You pick a class at runtime (by type, config, user input)<\/td>\n<td>There is only one implementation and it will never change<\/td>\n<\/tr>\n<tr>\n<td>Object creation is complex<\/td>\n<td>A plain <code>new<\/code> is clear enough<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Simple factory vs factory method vs abstract factory<\/strong> (see the table above).<\/li>\n<li>Factory hides <code>new<\/code>, so the caller depends on an <strong>interface<\/strong>, not a concrete class.<\/li>\n<li>In Spring, \"inject a <code>List<\/code> or <code>Map<\/code> of beans\" is the cleanest factory.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Factory = one place that decides which object to create.<\/li>\n<li>Caller only knows the interface.<\/li>\n<li>New type = new class, no if/else changes.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"three-flavours-common-interview-question","t":"Three flavours (common interview question)","k":"idea"},{"id":"spring-boot-code-payment-gateway-factory","t":"Spring Boot code – Payment Gateway Factory","k":"code"},{"id":"factory-method-tiny-example","t":"Factory Method – tiny example","k":"default"},{"id":"where-spring-itself-uses-factory","t":"Where Spring itself uses Factory","k":"default"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this at a pizza shop you just say \"one margherita\". you don't go into the kitchen and make it. the kitchen (factory) decides how to make it and hands it to you. what problem does it solve? without a factory, code looks like this everywhere: java copy if ( type . equals ( \"upi\" )) gateway = new upigateway (); else if ( type . equals ( \"card\" )) gateway = new cardgateway (); else if ( type . equals ( \"wallet\" )) gateway = new walletgateway (); if you add a new payment type, you must change this code in many places. a factory keeps the \"which class to create\" logic in one place . three flavours (common interview question) type simple meaning simple factory one class with a method like create(type) that returns the right object. (not an official gof pattern, but very common.) factory method a parent class says \"i need a product\", and child classes decide which product to create by overriding a method. abstract factory a factory that creates a family of related objects (e.g. darkthemefactory makes darkbutton + darkcheckbox). spring boot code – payment gateway factory step 1: a common interface java copy public interface paymentgateway { string type (); // \"upi\", \"card\", ... string pay ( double amount ); } step 2: implementations (each is a spring bean) java copy @component public class upigateway implements paymentgateway { public string type () { return \"upi\" ; } public string pay ( double amount ) { return \"paid ₹\" + amount + \" by upi\" ; } } @component public class cardgateway implements paymentgateway { public string type () { return \"card\" ; } public string pay ( double amount ) { return \"paid ₹\" + amount + \" by card\" ; } } step 3: the factory spring gives us all paymentgateway beans as a list. we put them in a map by type. java copy @component public class paymentgatewayfactory { private final map < string , paymentgateway > gateways ; public paymentgatewayfactory ( list < paymentgateway > list ) { this . gateways = list . stream () . collect ( collectors . tomap ( paymentgateway :: type , g -> g )); } public paymentgateway get ( string type ) { paymentgateway g = gateways . get ( type . touppercase ()); if ( g == null ) throw new illegalargumentexception ( \"unknown payment type: \" + type ); return g ; } } step 4: use it java copy @restcontroller @requestmapping ( \"/pay\" ) public class paymentcontroller { private final paymentgatewayfactory factory ; public paymentcontroller ( paymentgatewayfactory factory ) { this . factory = factory ; } @postmapping ( \"/{type}\" ) public string pay ( @pathvariable string type , @requestparam double amount ) { return factory . get ( type ). pay ( amount ); } } adding a new type (e.g. wallet)? just create a new @component class. no if/else to change. this follows the open/closed principle – open for extension, closed for modification. factory method – tiny example java copy abstract class notificationservice { abstract notifier createnotifier (); // the \"factory method\" public void notifyuser ( string msg ) { createnotifier (). send ( msg ); } } class emailnotificationservice extends notificationservice { notifier createnotifier () { return new emailnotifier (); } } where spring itself uses factory beanfactory / applicationcontext – the whole spring container is a giant factory. @bean methods are factory methods. factorybean<t> interface lets you write custom creation logic. when to use / when not to use use it when avoid it when you pick a class at runtime (by type, config, user input) there is only one implementation and it will never change object creation is complex a plain new is clear enough points to explain in an interview simple factory vs factory method vs abstract factory (see the table above). factory hides new , so the caller depends on an interface , not a concrete class. in spring, \"inject a list or map of beans\" is the cleanest factory. quick revision factory = one place that decides which object to create. caller only knows the interface. new type = new class, no if/else changes."},{"id":"builder","n":"Builder","p":1,"focus":"Construct complex objects step by step.","build":"Fluent builder for an HTTP request or a SQL query object.","trade":"builder vs telescoping constructors, immutability","day":1,"theme":"Creational patterns","title":"Builder","lede":"Build a big object <strong>step by step<\/strong> with readable method calls, instead of one huge constructor.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>At Subway you build your sandwich step by step: bread → cheese → veggies → sauce → done. You skip what you don't want. That's a builder.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Imagine a class with many fields, some optional:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Ravi\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"ravi@mail.com\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">25<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kc\">false<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"IN\"<\/span><span class=\"p\">);<\/span><\/code><\/pre><\/figure>\n<p>What is <code>null<\/code>? What is <code>true<\/code>? Nobody knows. This is called a <strong>telescoping constructor<\/strong> problem (many constructors with more and more parameters).<\/p>\n<p>With a builder:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"n\">user<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"p\">.<\/span><span class=\"na\">builder<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">name<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Ravi\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">email<\/span><span class=\"p\">(<\/span><span class=\"s\">\"ravi@mail.com\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">age<\/span><span class=\"p\">(<\/span><span class=\"mi\">25<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">country<\/span><span class=\"p\">(<\/span><span class=\"s\">\"IN\"<\/span><span cl  class=\"p\">.<\/span><span class=\"na\">builder<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">baseUrl<\/span><span class=\"p\">(<\/span><span class=\"s\">\"https://api.example.com\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">defaultHeader<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Accept\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"application/json\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">build<\/span><span class=\"p\">();<\/span>\n\n<span class=\"n\">UriComponentsBuilder<\/span><span class=\"p\">.<\/span><span class=\"na\">fromPath<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/orders\"<\/span><span class=\"p\">).<\/span><span class=\"na\">queryParam<\/span><span class=\"p\">(<\/span><span class=\"s\">\"page\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">).<\/span><span class=\"na\">build<\/span><span class=\"p\">();<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Many fields, many are optional<\/td>\n<td>Only 2–3 required fields (a constructor is fine)<\/td>\n<\/tr>\n<tr>\n<td>You want immutable objects<\/td>\n<td>The object is a simple JPA entity that frameworks fill via setters<\/td>\n<\/tr>\n<tr>\n<td>You need validation before creation<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Builder vs telescoping constructors:<\/strong> builder is readable, no wrong order of arguments, no <code>null<\/code> placeholders.<\/li>\n<li><strong>Immutability:<\/strong> fields are <code>final<\/code>, no setters → thread-safe and safe to share.<\/li>\n<li><code>build()<\/code> is the right place to <strong>validate<\/strong>.<\/li>\n<li>Builder vs Factory: Factory picks <em>which<\/em> object; Builder controls <em>how<\/em> one object is assembled.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Chain methods, call <code>build()<\/code> at the end.<\/li>\n<li>Great for many optional fields.<\/li>\n<li>In Spring Boot: Lombok <code>@Builder<\/code>, <code>ResponseEntity<\/code>, <code>WebClient.builder()<\/code>.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"how-does-it-work","t":"How does it work?","k":"idea"},{"id":"plain-java-code-http-request-builder","t":"Plain Java code – HTTP request builder","k":"code"},{"id":"spring-boot-way-lombok-builder","t":"Spring Boot way – Lombok @Builder","k":"code"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this at subway you build your sandwich step by step: bread → cheese → veggies → sauce → done. you skip what you don't want. that's a builder. what problem does it solve? imagine a class with many fields, some optional: java copy new user ( \"ravi\" , \"ravi@mail.com\" , null , null , 25 , true , false , \"in\" ); what is null ? what is true ? nobody knows. this is called a telescoping constructor problem (many constructors with more and more parameters). with a builder: java copy user user = user . builder () . name ( \"ravi\" ) . email ( \"ravi@mail.com\" ) . age ( 25 ) . country ( \"in\" ) . build (); easy to read, and you only set what you need. how does it work? make a static inner builder class with the same fields. each setter-like method returns this (so you can chain calls). build() creates the real object, often checking that required fields exist. the real object has only getters → it is immutable (cannot change after creation). plain java code – http request builder java copy public final class httprequest { private final string url ; private final string method ; private final map < string , string > headers ; private final string body ; private final int timeoutms ; private httprequest ( builder b ) { this . url = b . url ; this . method = b . method ; this . headers = map . copyof ( b . headers ); this . body = b . body ; this . timeoutms = b . timeoutms ; } public static builder builder ( string url ) { return new builder ( url ); } public string geturl () { return url ; } // ... other getters, no setters public static class builder { private final string url ; // required private string method = \"get\" ; // defaults private final map < string , string > headers = new hashmap <> (); private string body ; private int timeoutms = 5000 ; private builder ( string url ) { this . url = url ; } public builder method ( string m ) { this . method = m ; return this ; } public builder header ( string k , string v ) { headers . put ( k , v ); return this ; } public builder body ( string b ) { this . body = b ; return this ; } public builder timeoutms ( int t ) { this . timeoutms = t ; return this ; } public httprequest build () { if ( url == null || url . isblank ()) throw new illegalstateexception ( \"url is required\" ); if ( method . equals ( \"get\" ) && body != null ) throw new illegalstateexception ( \"get cannot have a body\" ); return new httprequest ( this ); } } } usage: java copy httprequest req = httprequest . builder ( \"https://api.shop.com/orders\" ) . method ( \"post\" ) . header ( \"content-type\" , \"application/json\" ) . body ( \"{\\\"item\\\":\\\"pen\\\"}\" ) . timeoutms ( 2000 ) . build (); spring boot way – lombok @builder in real projects we use lombok so we don't write all that code by hand. java copy @getter @builder @allargsconstructor ( access = accesslevel . private ) public class orderresponse { private final long id ; private final string status ; private final double total ; @builder.default private final string currency = \"inr\" ; } java copy @getmapping ( \"/orders/{id}\" ) public orderresponse get ( @pathvariable long id ) { return orderresponse . builder () . id ( id ) . status ( \"shipped\" ) . total ( 499.0 ) . build (); } builders you already use in spring: java copy responseentity . status ( httpstatus . created ). header ( \"x-id\" , \"10\" ). body ( order ); webclient client = webclient . builder () . baseurl ( \"https://api.example.com\" ) . defaultheader ( \"accept\" , \"application/json\" ) . build (); uricomponentsbuilder . frompath ( \"/orders\" ). queryparam ( \"page\" , 1 ). build (); when to use / when not to use use it when avoid it when many fields, many are optional only 2–3 required fields (a constructor is fine) you want immutable objects the object is a simple jpa entity that frameworks fill via setters you need validation before creation points to explain in an interview builder vs telescoping constructors: builder is readable, no wrong order of arguments, no null placeholders. immutability: fields are final , no setters → thread-safe and safe to share. build() is the right place to validate . builder vs factory: factory picks which object; builder controls how one object is assembled. quick revision chain methods, call build() at the end. great for many optional fields. in spring boot: lombok @builder , responseentity , webclient.builder() ."},{"id":"strategy","n":"Strategy","p":1,"focus":"Swap algorithms at runtime behind one interface.","build":"Discount or sorting strategies chosen from config.","trade":"strategy vs if/else chains, strategy vs State","day":2,"theme":"Behavioural and structural","title":"Strategy","lede":"Keep different ways of doing the same job in <strong>separate classes<\/strong> behind one interface, and pick one at runtime.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>Going to college: you can go by <strong>bus, bike or cab<\/strong>. The goal is the same (reach college), only the <em>way<\/em> changes. You choose based on time, money or weather. Each way is a \"strategy\".<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Without Strategy you get a long <code>if/else<\/code>:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">discount<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">type<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"FESTIVAL\"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"mf\">0.20<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"NEW_USER\"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"mf\">0.10<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">type<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"PREMIUM\"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"mf\">0.15<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Every new discount means editing this method → risky, hard to test. Strategy puts each rule in its own class.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"how-does-it-work\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How does it work?<\/span><\/h2><div class=\"sec-body\"><ol>\n<li>Create an interface, e.g. <code>DiscountStrategy<\/code>.<\/li>\n<li>Write one class per algorithm.<\/li>\n<li>The main code (called the <strong>context<\/strong>) holds a strategy and just calls it.<\/li>\n<\/ol><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-discount-chosen-from-config\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – discount chosen from config<\/span><\/h2><div class=\"sec-body\"><h3>The interface and strategies<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">DiscountStrategy<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">apply<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span><span class=\"p\">(<\/span><span class=\"s\">\"FESTIVAL\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">FestivalDiscount<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">DiscountStrategy<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">apply<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"mf\">0.80<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span><span class=\"p\">(<\/span><span class=\"s\">\"NEW_USER\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">NewUserDiscount<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">DiscountStrategy<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">apply<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"mf\">0.90<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span><span class=\"p\">(<\/span><span class=\"s\">\"NONE\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">NoDiscount<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">DiscountStrategy<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">apply<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Pick the strategy<\/h3>\n<p>Spring can inject a <code>Map&lt;String, Bean&gt;<\/code> where the <strong>key is the bean name<\/strong>.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CheckoutService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">DiscountStrategy<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">strategies<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">defaultStrategy<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">CheckoutService<\/span><span class=\"p\">(<\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">DiscountStrategy<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">strategies<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">                           <\/span><span class=\"nd\">@Value<\/span><span class=\"p\">(<\/span><span class=\"s\">\"${shop.discount:NONE}\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">defaultStrategy<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">strategies<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">strategies<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">defaultStrategy<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">defaultStrategy<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"nf\">finalPrice<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">code<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">code<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">?<\/span><span class=\"w\"> <\/span><span class=\"n\">defaultStrategy<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">code<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">DiscountStrategy<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">strategies<\/span><span class=\"p\">.<\/span><span class=\"na\">getOrDefault<\/span><span class=\"p\">(<\/span><span class=\"n\">key<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">strategies<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"s\">\"NONE\"<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">apply<\/span><span class=\"p\">(<\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p><code>application.properties<\/code>:<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">shop.discount<\/span><span class=\"o\">=<\/span><span class=\"s\">FESTIVAL<\/span><\/code><\/pre><\/figure>\n<p>Change the property → behaviour changes, no code change.<\/p>\n<h3>Sorting strategy (plain Java)<\/h3>\n<p><code>Comparator<\/code> is a strategy you already use:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"n\">products<\/span><span class=\"p\">.<\/span><span class=\"na\">sort<\/span><span class=\"p\">(<\/span><span class=\"n\">Comparator<\/span><span class=\"p\">.<\/span><span class=\"na\">comparing<\/span><span class=\"p\">(<\/span><span class=\"n\">Product<\/span><span class=\"p\">::<\/span><span class=\"n\">getPrice<\/span><span class=\"p\">));<\/span><span class=\"w\">      <\/span><span class=\"c1\">// cheapest first<\/span>\n<span class=\"n\">products<\/span><span class=\"p\">.<\/span><span class=\"na\">sort<\/span><span class=\"p\">(<\/span><span class=\"n\">Comparator<\/span><span class=\"p\">.<\/span><span class=\"na\">comparing<\/span><span class=\"p\">(<\/span><span class=\"n\">Product<\/span><span class=\"p\">::<\/span><span class=\"n\">getRating<\/span><span class=\"p\">).<\/span><span class=\"na\">reversed<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"c1\">// best rated first<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-compare\" id=\"strategy-vs-state-common-confusion\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Strategy vs State (common confusion)<\/span><\/h2><div class=\"sec-body\"><div class=\"ta

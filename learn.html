lass=\"edge\"><span class=\"el\">wait time is over<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>HALF_OPEN<\/b><small>a few test calls allowed<\/small><\/div><\/div><div class=\"dg-title\">What happens in HALF_OPEN<\/div><div class=\"branch\"><div class=\"node s-warn\"><b>HALF_OPEN<\/b><\/div><div class=\"stub\"><\/div><div class=\"targets\"><div class=\"trow\"><div class=\"edge\"><span class=\"el\">test calls succeed<\/span><i><\/i><\/div><div class=\"node s-good\"><b>back to CLOSED<\/b><\/div><\/div><div class=\"trow\"><div class=\"edge\"><span class=\"el\">test calls fail<\/span><i><\/i><\/div><div class=\"node s-fail\"><b>back to OPEN<\/b><\/div><\/div><\/div><\/div><\/div><\/figure>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>State<\/th>\n<th>What happens<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>CLOSED<\/strong> (normal)<\/td>\n<td>Calls go through. Failures are counted.<\/td>\n<\/tr>\n<tr>\n<td><strong>OPEN<\/strong> (tripped)<\/td>\n<td>Calls are <strong>not<\/strong> sent. Fallback is returned immediately.<\/td>\n<\/tr>\n<tr>\n<td><strong>HALF_OPEN<\/strong> (testing)<\/td>\n<td>After a wait, allow a few <strong>trial<\/strong> calls. If they succeed → CLOSED. If they fail → OPEN again.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-code\" id=\"plain-java-build-the-state-machine-yourself\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Plain Java – build the state machine yourself<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">SimpleCircuitBreaker<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">enum<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">CLOSED<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">OPEN<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">HALF_OPEN<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"w\"> <\/span><span class=\"n\">state<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"p\">.<\/span><span class=\"na\">CLOSED<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">failures<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">openedAt<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">failureThreshold<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">openTimeoutMs<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">SimpleCircuitBreaker<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">failureThreshold<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">openTimeoutMs<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">failureThreshold<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">failureThreshold<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">openTimeoutMs<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">openTimeoutMs<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">synchronized<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">T<\/span><span class=\"w\"> <\/span><span class=\"nf\">call<\/span><span class=\"p\">(<\/span><span class=\"n\">Supplier<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">action<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Supplier<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">fallback<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"p\">.<\/span><span class=\"na\">OPEN<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">currentTimeMillis<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"n\">openedAt<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;=<\/span><span class=\"w\"> <\/span><span class=\"n\">openTimeoutMs<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">state<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"p\">.<\/span><span class=\"na\">HALF_OPEN<\/span><span class=\"p\">;<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// time to test<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">else<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">fallback<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">();<\/span><span class=\"w\">                    <\/span><span class=\"c1\">// fail fast<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">T<\/span><span class=\"w\"> <\/span><span class=\"n\">result<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">action<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">failures<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">state<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"p\">.<\/span><span class=\"na\">CLOSED<\/span><span class=\"p\">;<\/span><span class=\"w\">                         <\/span><span class=\"c1\">// success → close<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">result<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">RuntimeException<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">failures<\/span><span class=\"o\">++<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">state<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"p\">.<\/span><span class=\"na\">HALF_OPEN<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"n\">failures<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;=<\/span><span class=\"w\"> <\/span><span class=\"n\">failureThreshold<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">state<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">State<\/span><span class=\"p\">.<\/span><span class=\"na\">OPEN<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">openedAt<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">currentTimeMillis<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">fallback<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>(Real libraries use a sliding window and failure <em>rate<\/em>, and allow several trial calls in half-open. <code>synchronized<\/code> here keeps it simple but means only one call at a time.)<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-resilience4j\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – Resilience4j<\/span><\/h2><div class=\"sec-body\"><p>Dependency: <code>resilience4j-spring-boot3<\/code> + <code>spring-boot-starter-aop<\/code> (+ actuator to see the state).<\/p>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">resilience4j<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">circuitbreaker<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">instances<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">payment<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">sliding-window-type<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">COUNT_BASED<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">sliding-window-size<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">10<\/span><span class=\"w\">                 <\/span><span class=\"c1\"># look at the last 10 calls<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">minimum-number-of-calls<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">5<\/span><span class=\"w\">              <\/span><span class=\"c1\"># don't judge with fewer calls<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">failure-rate-threshold<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">50<\/span><span class=\"w\">              <\/span><span class=\"c1\"># open if 50% failed<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">slow-call-duration-threshold<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">2s<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">slow-call-rate-threshold<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">50<\/span><span class=\"w\">            <\/span><span class=\"c1\"># slow calls also count as bad<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">wait-duration-in-open-state<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">10s<\/span><span class=\"w\">        <\/span><span class=\"c1\"># stay OPEN for 10s<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">permitted-number-of-calls-in-half-open-state<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">3<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">automatic-transition-from-open-to-half-open-enabled<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span>\n\n<span class=\"nt\">management<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">endpoints.web.exposure.include<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">health,circuitbreakers<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">health.circuitbreakers.enabled<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentClient<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">RestClient<\/span><span class=\"w\"> <\/span><span class=\"n\">restClient<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@CircuitBreaker<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payment\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"paymentFallback\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">restClient<\/span><span class=\"p\">.<\/span><span class=\"na\">post<\/span><span class=\"p\">().<\/span><span class=\"na\">uri<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/pay\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">Map<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">(<\/span><span class=\"s\">\"orderId\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"amount\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">retrieve<\/span><span class=\"p\">().<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"c1\">// same parameters + Throwable at the end<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">paymentFallback<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Throwable<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"PAYMENT_PENDING\"<\/span><span class=\"p\">;<\/span><span class=\"w\">      <\/span><span class=\"c1\">// e.g. save and process later<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Check state: <code>GET /actuator/circuitbreakers<\/code>.<\/p>\n<h3>Combining with Retry and Timeout<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@CircuitBreaker<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payment\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"paymentFallback\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@Retry<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payment\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(...)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Resilience4j default order (outer → inner): <strong>Retry → CircuitBreaker → RateLimiter → TimeLimiter → Bulkhead → your method<\/strong>. So each retry attempt is counted by the circuit breaker, and when the circuit is OPEN, retries fail fast too.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"good-fallbacks\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Good fallbacks<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Return cached / default data (\"show last known price\").<\/li>\n<li>Queue the work for later (\"payment pending\").<\/li>\n<li>Return a friendly error quickly.<\/li>\n<li><strong>Bad fallback:<\/strong> calling another service that is also likely down.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Thresholds:<\/strong> failure rate %, slow-call rate, minimum calls, window size. Too sensitive → opens on random blips; too relaxed → protects too late.<\/li>\n<li><strong>Half-open probing:<\/strong> only a few trial calls go through, so a recovering service isn't flooded.<\/li>\n<li><strong>Fallbacks:<\/strong> must be fast and safe.<\/li>\n<li>Circuit breaker vs Retry: retry helps for short blips; circuit breaker stops hammering a service that is truly down.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>CLOSED → OPEN → HALF_OPEN → CLOSED.<\/li>\n<li>Fail fast + fallback while open.<\/li>\n<li>Resilience4j <code>@CircuitBreaker<\/code> in Spring Boot.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"the-three-states-state-machine","t":"The three states (state machine)","k":"idea"},{"id":"plain-java-build-the-state-machine-yourself","t":"Plain Java – build the state machine yourself","k":"code"},{"id":"spring-boot-resilience4j","t":"Spring Boot – Resilience4j","k":"code"},{"id":"good-fallbacks","t":"Good fallbacks","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this the electric mcb/fuse in your house. when there's a short circuit, it \"trips\" and cuts power to protect the house. after fixing, you switch it on again. what problem does it solve? if the payment service is down and every request still waits 3 seconds and fails: - users wait for nothing, - your threads are blocked, - the sick service gets even more load and can't recover. a circuit breaker fails fast while the dependency is sick, and gives it time to recover. the three states (state machine) the three states of a circuit breaker closed normal · calls go through failures cross the threshold open calls blocked · fallback returned fast wait time is over half_open a few test calls allowed what happens in half_open half_open test calls succeed back to closed test calls fail back to open state what happens closed (normal) calls go through. failures are counted. open (tripped) calls are not sent. fallback is returned immediately. half_open (testing) after a wait, allow a few trial calls. if they succeed → closed. if they fail → open again. plain java – build the state machine yourself java copy public class simplecircuitbreaker { enum state { closed , open , half_open } private state state = state . closed ; private int failures = 0 ; private long openedat = 0 ; private final int failurethreshold ; private final long opentimeoutms ; public simplecircuitbreaker ( int failurethreshold , long opentimeoutms ) { this . failurethreshold = failurethreshold ; this . opentimeoutms = opentimeoutms ; } public synchronized < t > t call ( supplier < t > action , supplier < t > fallback ) { if ( state == state . open ) { if ( system . currenttimemillis () - openedat >= opentimeoutms ) { state = state . half_open ; // time to test } else { return fallback . get (); // fail fast } } try { t result = action . get (); failures = 0 ; state = state . closed ; // success → close return result ; } catch ( runtimeexception e ) { failures ++ ; if ( state == state . half_open || failures >= failurethreshold ) { state = state . open ; openedat = system . currenttimemillis (); } return fallback . get (); } } } (real libraries use a sliding window and failure rate , and allow several trial calls in half-open. synchronized here keeps it simple but means only one call at a time.) spring boot – resilience4j dependency: resilience4j-spring-boot3 + spring-boot-starter-aop (+ actuator to see the state). application.yml copy resilience4j : circuitbreaker : instances : payment : sliding-window-type : count_based sliding-window-size : 10 # look at the last 10 calls minimum-number-of-calls : 5 # don't judge with fewer calls failure-rate-threshold : 50 # open if 50% failed slow-call-duration-threshold : 2s slow-call-rate-threshold : 50 # slow calls also count as bad wait-duration-in-open-state : 10s # stay open for 10s permitted-number-of-calls-in-half-open-state : 3 automatic-transition-from-open-to-half-open-enabled : true management : endpoints.web.exposure.include : health,circuitbreakers health.circuitbreakers.enabled : true java copy @service @requiredargsconstructor public class paymentclient { private final restclient restclient ; @circuitbreaker ( name = \"payment\" , fallbackmethod = \"paymentfallback\" ) public string pay ( string orderid , double amount ) { return restclient . post (). uri ( \"/pay\" ) . body ( map . of ( \"orderid\" , orderid , \"amount\" , amount )) . retrieve (). body ( string . class ); } // same parameters + throwable at the end private string paymentfallback ( string orderid , double amount , throwable t ) { return \"payment_pending\" ; // e.g. save and process later } } check state: get /actuator/circuitbreakers . combining with retry and timeout java copy @circuitbreaker ( name = \"payment\" , fallbackmethod = \"paymentfallback\" ) @retry ( name = \"payment\" ) public string pay (...) { ... } resilience4j default order (outer → inner): retry → circuitbreaker → ratelimiter → timelimiter → bulkhead → your method . so each retry attempt is counted by the circuit breaker, and when the circuit is open, retries fail fast too. good fallbacks return cached / default data (\"show last known price\"). queue the work for later (\"payment pending\"). return a friendly error quickly. bad fallback: calling another service that is also likely down. points to explain in an interview thresholds: failure rate %, slow-call rate, minimum calls, window size. too sensitive → opens on random blips; too relaxed → protects too late. half-open probing: only a few trial calls go through, so a recovering service isn't flooded. fallbacks: must be fast and safe. circuit breaker vs retry: retry helps for short blips; circuit breaker stops hammering a service that is truly down. quick revision closed → open → half_open → closed. fail fast + fallback while open. resilience4j @circuitbreaker in spring boot."},{"id":"idempotency","n":"Idempotency","p":1,"focus":"The same request twice gives the same result.","build":"Idempotency-Key handling for a payment endpoint.","trade":"key storage and TTL, concurrent duplicates","day":5,"theme":"Safe APIs and read/write split","title":"Idempotency","lede":"Sending the <strong>same request twice<\/strong> gives the <strong>same result<\/strong> as sending it once – no double charge, no duplicate order.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>The <strong>lift button<\/strong>. Pressing \"5\" once or ten times – the lift still goes to floor 5 only once.<\/p>\n<p>Bad example: paying at a shop and the card machine hangs. You tap again… and get charged twice. That payment was <strong>not<\/strong> idempotent.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>In networks, these happen all the time:\n- The client sends \"pay ₹500\", the server pays, but the <strong>response is lost<\/strong>. The client retries → pays again.\n- User double-clicks the \"Place Order\" button.\n- A message queue delivers the same message twice (at-least-once delivery).<\/p>\n<p>Idempotency makes retries <strong>safe<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"which-http-methods-are-idempotent\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Which HTTP methods are idempotent?<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Idempotent?<\/th>\n<th>Why<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>GET<\/td>\n<td>✅<\/td>\n<td>Only reads<\/td>\n<\/tr>\n<tr>\n<td>PUT<\/td>\n<td>✅<\/td>\n<td>\"Set the value to X\" – same result every time<\/td>\n<\/tr>\n<tr>\n<td>DELETE<\/td>\n<td>✅<\/td>\n<td>Deleting again: it's still deleted<\/td>\n<\/tr>\n<tr>\n<td>POST<\/td>\n<td>❌<\/td>\n<td>\"Create a new one\" – each call creates another<\/td>\n<\/tr>\n<tr>\n<td>PATCH<\/td>\n<td>Depends<\/td>\n<td><code>\"set name=Ravi\"<\/code> yes; <code>\"add 10 to balance\"<\/code> no<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>To make POST safe, we use an <strong>Idempotency-Key<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"how-idempotency-key-works\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How Idempotency-Key works<\/span><\/h2><div class=\"sec-body\"><ol>\n<li>Client creates a unique key (UUID) <strong>once per action<\/strong> and sends it in a header: <code>Idempotency-Key: 7f9c...<\/code>.<\/li>\n<li>Server checks: \"Have I seen this key?\"\n   - <strong>No<\/strong> → process the request, <strong>save the key + response<\/strong>.\n   - <strong>Yes, finished<\/strong> → return the <strong>saved response<\/strong>, don't process again.\n   - <strong>Yes, still processing<\/strong> → return <code>409 Conflict<\/code> (or wait).<\/li>\n<li>Keys expire after some time (TTL), e.g. 24 hours.<\/li>\n<\/ol><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-payment-endpoint\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – payment endpoint<\/span><\/h2><div class=\"sec-body\"><h3>Table to store keys<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Entity<\/span>\n<span class=\"nd\">@Table<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"idempotency_keys\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@Getter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Setter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@NoArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">IdempotencyRecord<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Id<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">idempotencyKey<\/span><span class=\"p\">;<\/span><span class=\"w\">          <\/span><span class=\"c1\">// PRIMARY KEY → DB blocks duplicates<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">requestHash<\/span><span class=\"p\">;<\/span><span class=\"w\">             <\/span><span class=\"c1\">// to detect same key with a different body<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">status<\/span><span class=\"p\">;<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// IN_PROGRESS / COMPLETED<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">responseCode<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Lob<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">responseBody<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">Instant<\/span><span class=\"w\"> <\/span><span class=\"n\">createdAt<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">IdempotencyRepo<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">JpaRepository<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">IdempotencyRecord<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Service<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">IdempotentPaymentService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">IdempotencyRepo<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentService<\/span><span class=\"w\"> <\/span><span class=\"n\">paymentService<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ObjectMapper<\/span><span class=\"w\"> <\/span><span class=\"n\">mapper<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentRequest<\/span><span class=\"w\"> <\/span><span class=\"n\">req<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">throws<\/span><span class=\"w\"> <\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">hash<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">DigestUtils<\/span><span class=\"p\">.<\/span><span class=\"na\">md5DigestAsHex<\/span><span class=\"p\">(<\/span><span class=\"n\">mapper<\/span><span class=\"p\">.<\/span><span class=\"na\">writeValueAsBytes<\/span><span class=\"p\">(<\/span><span class=\"n\">req<\/span><span class=\"p\">));<\/span>\n\n<span class=\"w\">        <\/span><span class=\"c1\">// 1. Try to \"claim\" the key. Primary key makes this safe for concurrent duplicates.<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">IdempotencyRecord<\/span><span class=\"w\"> <\/span><span class=\"n\">r<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IdempotencyRecord<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">r<\/span><span class=\"p\">.<\/span><span class=\"na\">setIdempotencyKey<\/span><span class=\"p\">(<\/span><span class=\"n\">key<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">r<\/span><span class=\"p\">.<\/span><span class=\"na\">setRequestHash<\/span><span class=\"p\">(<\/span><span class=\"n\">hash<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">r<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"s\">\"IN_PROGRESS\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">r<\/span><span class=\"p\">.<\/span><span class=\"na\">setCreatedAt<\/span><span class=\"p\">(<\/span><span class=\"n\">Instant<\/span><span class=\"p\">.<\/span><span class=\"na\">now<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">saveAndFlush<\/span><span class=\"p\">(<\/span><span class=\"n\">r<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">DataIntegrityViolationException<\/span><span class=\"w\"> <\/span><span class=\"n\">alreadyExists<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">IdempotencyRecord<\/span><span class=\"w\"> <\/span><span class=\"n\">old<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">key<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"o\">!<\/span><span class=\"n\">old<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequestHash<\/span><span class=\"p\">().<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"n\">hash<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"p\">.<\/span><span class=\"na\">unprocessableEntity<\/span><span class=\"p\">().<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Key reused with different body\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">old<\/span><span class=\"p\">.<\/span><span class=\"na\">getStatus<\/span><span class=\"p\">().<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"s\">\"IN_PROGRESS\"<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"p\">.<\/span><span class=\"na\">status<\/span><span class=\"p\">(<\/span><span class=\"n\">HttpStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">CONFLICT<\/span><span class=\"p\">).<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Request already in progress\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"p\">.<\/span><span class=\"na\">status<\/span><span class=\"p\">(<\/span><span class=\"n\">old<\/span><span class=\"p\">.<\/span><span class=\"na\">getResponseCode<\/span><span class=\"p\">()).<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">old<\/span><span class=\"p\">.<\/span><span class=\"na\">getResponseBody<\/span><span class=\"p\">());<\/span><span class=\"w\">  <\/span><span class=\"c1\">// replay<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">        <\/span><span class=\"c1\">// 2. Do the real work only once<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">result<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">paymentService<\/span><span class=\"p\">.<\/span><span class=\"na\">charge<\/span><span class=\"p\">(<\/span><span class=\"n\">req<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"c1\">// 3. Save the response for future duplicates<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">IdempotencyRecord<\/span><span class=\"w\"> <\/span><span class=\"n\">done<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">key<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">done<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"s\">\"COMPLETED\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">done<\/span><span class=\"p\">.<\/span><span class=\"na\">setResponseCode<\/span><span class=\"p\">(<\/span><span class=\"mi\">201<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">done<\/span><span class=\"p\">.<\/span><span class=\"na\">setResponseBody<\/span><span class=\"p\">(<\/span><span class=\"n\">result<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">done<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"p\">.<\/span><span class=\"na\">status<\/span><span class=\"p\">(<\/span><span class=\"mi\">201<\/span><span class=\"p\">).<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">result<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Controller<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RestController<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentController<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">IdempotentPaymentService<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@PostMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/payments\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"nd\">@RequestHeader<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Idempotency-Key\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">                                      <\/span><span class=\"nd\">@RequestBody<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentRequest<\/span><span class=\"w\"> <\/span><span class=\"n\">req<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">throws<\/span><span class=\"w\"> <\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">key<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">req<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Clean up old keys (TTL)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Scheduled<\/span><span class=\"p\">(<\/span><span class=\"n\">cron<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"0 0 * * * *\"<\/span><span class=\"p\">)<\/span><span class=\"w\">     <\/span><span class=\"c1\">// every hour (needs @EnableScheduling)<\/span>\n<span class=\"nd\">@Transactional<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">cleanup<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">em<\/span><span class=\"p\">.<\/span><span class=\"na\">createQuery<\/span><span class=\"p\">(<\/span><span class=\"s\">\"delete from IdempotencyRecord r where r.createdAt &lt; :t\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">      <\/span><span class=\"p\">.<\/span><span class=\"na\">setParameter<\/span><span class=\"p\">(<\/span><span class=\"s\">\"t\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Instant<\/span><span class=\"p\">.<\/span><span class=\"na\">now<\/span><span class=\"p\">().<\/span><span class=\"na\">minus<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofHours<\/span><span class=\"p\">(<\/span><span class=\"mi\">24<\/span><span class=\"p\">)))<\/span>\n<span class=\"w\">      <\/span><span class=\"p\">.<\/span><span class=\"na\">executeUpdate<\/span><span class=\"p\">();<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>With <strong>Redis<\/strong> you can do the claim in one step: <code>SET key IN_PROGRESS NX EX 86400<\/code> (NX = only if not exists, EX = expiry).<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"idempotent-message-consumers\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Idempotent message consumers<\/span><\/h2><div class=\"sec-body\"><p>For Kafka/RabbitMQ, keep a <code>processed_messages(message_id PRIMARY KEY)<\/code> table. In the same DB transaction: insert the message id + do the work. If the insert fails as duplicate → skip.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Key storage and TTL:<\/strong> store in DB or Redis; keep long enough to cover client retries (often 24h); delete after.<\/li>\n<li><strong>Concurrent duplicates:<\/strong> two identical requests at the <em>same moment<\/em>. A simple \"check then insert\" has a race. Use a <strong>unique constraint<\/strong> or Redis <code>SETNX<\/code> so only one wins.<\/li>\n<li>Same key + different body = client bug → reject with 422.<\/li>\n<li>Idempotency is what makes <strong>retries<\/strong> and <strong>at-least-once<\/strong> messaging safe.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Same request many times = same effect as once.<\/li>\n<li>POST needs an Idempotency-Key; server stores key + response.<\/li>\n<li>Use a unique constraint to beat race conditions.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"which-http-methods-are-idempotent","t":"Which HTTP methods are idempotent?","k":"default"},{"id":"how-idempotency-key-works","t":"How Idempotency-Key works","k":"idea"},{"id":"spring-boot-code-payment-endpoint","t":"Spring Boot code – payment endpoint","k":"code"},{"id":"idempotent-message-consumers","t":"Idempotent message consumers","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this the lift button . pressing \"5\" once or ten times – the lift still goes to floor 5 only once. bad example: paying at a shop and the card machine hangs. you tap again… and get charged twice. that payment was not idempotent. what problem does it solve? in networks, these happen all the time: - the client sends \"pay ₹500\", the server pays, but the response is lost . the client retries → pays again. - user double-clicks the \"place order\" button. - a message queue delivers the same message twice (at-least-once delivery). idempotency makes retries safe . which http methods are idempotent? method idempotent? why get ✅ only reads put ✅ \"set the value to x\" – same result every time delete ✅ deleting again: it's still deleted post ❌ \"create a new one\" – each call creates another patch depends \"set name=ravi\" yes; \"add 10 to balance\" no to make post safe, we use an idempotency-key . how idempotency-key works client creates a unique key (uuid) once per action and sends it in a header: idempotency-key: 7f9c... . server checks: \"have i seen this key?\" - no → process the request, save the key + response . - yes, finished → return the saved response , don't process again. - yes, still processing → return 409 conflict (or wait). keys expire after some time (ttl), e.g. 24 hours. spring boot code – payment endpoint table to store keys java copy @entity @table ( name = \"idempotency_keys\" ) @getter @setter @noargsconstructor public class idempotencyrecord { @id private string idempotencykey ; // primary key → db blocks duplicates private string requesthash ; // to detect same key with a different body private string status ; // in_progress / completed private int responsecode ; @lob private string responsebody ; private instant createdat ; } public interface idempotencyrepo extends jparepository < idempotencyrecord , string > { } service java copy @service @requiredargsconstructor public class idempotentpaymentservice { private final idempotencyrepo repo ; private final paymentservice paymentservice ; private final objectmapper mapper ; public responseentity < string > pay ( string key , paymentrequest req ) throws exception { string hash = digestutils . md5digestashex ( mapper . writevalueasbytes ( req )); // 1. try to \"claim\" the key. primary key makes this safe for concurrent duplicates. try { idempotencyrecord r = new idempotencyrecord (); r . setidempotencykey ( key ); r . setrequesthash ( hash ); r . setstatus ( \"in_progress\" ); r . setcreatedat ( instant . now ()); repo . saveandflush ( r ); } catch ( dataintegrityviolationexception alreadyexists ) { idempotencyrecord old = repo . findbyid ( key ). orelsethrow (); if ( ! old . getrequesthash (). equals ( hash )) return responseentity . unprocessableentity (). body ( \"key reused with different body\" ); if ( old . getstatus (). equals ( \"in_progress\" )) return responseentity . status ( httpstatus . conflict ). body ( \"request already in progress\" ); return responseentity . status ( old . getresponsecode ()). body ( old . getresponsebody ()); // replay } // 2. do the real work only once string result = paymentservice . charge ( req ); // 3. save the response for future duplicates idempotencyrecord done = repo . findbyid ( key ). orelsethrow (); done . setstatus ( \"completed\" ); done . setresponsecode ( 201 ); done . setresponsebody ( result ); repo . save ( done ); return responseentity . status ( 201 ). body ( result ); } } controller java copy @restcontroller @requiredargsconstructor public class paymentcontroller { private final idempotentpaymentservice service ; @postmapping ( \"/payments\" ) public responseentity < string > pay ( @requestheader ( \"idempotency-key\" ) string key , @requestbody paymentrequest req ) throws exception { return service . pay ( key , req ); } } clean up old keys (ttl) java copy @scheduled ( cron = \"0 0 * * * *\" ) // every hour (needs @enablescheduling) @transactional public void cleanup () { em . createquery ( \"delete from idempotencyrecord r where r.createdat < :t\" ) . setparameter ( \"t\" , instant . now (). minus ( duration . ofhours ( 24 ))) . executeupdate (); } with redis you can do the claim in one step: set key in_progress nx ex 86400 (nx = only if not exists, ex = expiry). idempotent message consumers for kafka/rabbitmq, keep a processed_messages(message_id primary key) table. in the same db transaction: insert the message id + do the work. if the insert fails as duplicate → skip. points to explain in an interview key storage and ttl: store in db or redis; keep long enough to cover client retries (often 24h); delete after. concurrent duplicates: two identical requests at the same moment . a simple \"check then insert\" has a race. use a unique constraint or redis setnx so only one wins. same key + different body = client bug → reject with 422. idempotency is what makes retries and at-least-once messaging safe. quick revision same request many times = same effect as once. post needs an idempotency-key; server stores key + response. use a unique constraint to beat race conditions."},{"id":"gateway","n":"API Gateway","p":1,"focus":"A single entry point for clients.","build":"Sketch routing, auth and rate limiting for two services behind one gateway.","trade":"gateway vs BFF vs service mesh, single point of failure","day":5,"theme":"Safe APIs and read/write split","title":"API Gateway","lede":"<strong>One front door<\/strong> for all clients. Every request comes to the gateway, and it forwards the request to the right microservice.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>mall's main entrance with security<\/strong>. Visitors enter from one gate, security checks bags, and the help desk tells you which floor has which shop. You don't enter each shop from a different street.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>With 10 microservices, without a gateway:\n- The mobile app must know 10 different URLs.\n- Each service must do auth, rate limiting, CORS, logging by itself (duplicated work).\n- Internal services are exposed to the internet.<\/p>\n<p>The gateway handles these <strong>common concerns in one place<\/strong>:\n- <strong>Routing<\/strong> (<code>/orders/**<\/code> → order-service)\n- <strong>Authentication<\/strong> (check JWT)\n- <strong>Rate limiting<\/strong>\n- SSL termination, CORS, logging, request IDs\n- Sometimes response aggregation<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"picture\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Picture<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"One front door for all clients: Mobile / Web API Gateway auth · rate limit · logs /orders/** order-service /users/** user-service\"><figcaption>One front door for all clients<\/figcaption><div class=\"dg-body\"><div class=\"branch\"><div class=\"src\"><div class=\"node s-muted\"><b>Mobile / Web<\/b><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-accent\"><b>API Gateway<\/b><small>auth · rate limit · logs<\/small><\/div><\/div><div class=\"stub\"><\/div><div class=\"targets\"><div class=\"trow\"><div class=\"edge\"><span class=\"el\">/orders/**<\/span><i><\/i><\/div><div class=\"node s-good\"><b>order-service<\/b><\/div><\/div><div class=\"trow\"><div class=\"edge\"><span class=\"el\">/users/**<\/span><i><\/i><\/div><div class=\"node s-good\"><b>user-service<\/b><\/div><\/div><\/div><\/div><\/div><\/figure><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-spring-cloud-gateway\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – Spring Cloud Gateway<\/span><\/h2><div class=\"sec-body\"><p>Dependency: <code>spring-cloud-starter-gateway<\/code> (reactive). Add <code>spring-boot-starter-data-redis-reactive<\/code> for rate limiting.<\/p>\n<h3>Routing with YAML<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">server<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">port<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">8080<\/span>\n\n<span class=\"nt\">spring<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">cloud<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">gateway<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">routes<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">orders<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://localhost:8081<\/span><span class=\"w\">          <\/span><span class=\"c1\"># or lb://order-service with service discovery<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Path=/api/orders/**<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">filters<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">StripPrefix=1<\/span><span class=\"w\">                    <\/span><span class=\"c1\"># /api/orders/1 → /orders/1<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">RequestRateLimiter<\/span>\n<span class=\"w\">              <\/span><span class=\"nt\">args<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">                <\/span><span class=\"nt\">redis-rate-limiter.replenishRate<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">10<\/span><span class=\"w\">   <\/span><span class=\"c1\"># 10 requests/sec<\/span>\n<span class=\"w\">                <\/span><span class=\"nt\">redis-rate-limiter.burstCapacity<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">20<\/span>\n<span class=\"w\">                <\/span><span class=\"nt\">key-resolver<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s\">\"#{@userKeyResolver}\"<\/span>\n\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">users<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://localhost:8082<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Path=/api/users/**<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">filters<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">StripPrefix=1<\/span><\/code><\/pre><\/figure>\n<h3>Rate limit key (per user / per IP)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">GatewayConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">KeyResolver<\/span><span class=\"w\"> <\/span><span class=\"nf\">userKeyResolver<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">exchange<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">Mono<\/span><span class=\"p\">.<\/span><span class=\"na\">just<\/span><span class=\"p\">(<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">Optional<\/span><span class=\"p\">.<\/span><span class=\"na\">ofNullable<\/span><span class=\"p\">(<\/span><span class=\"n\">exchange<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequest<\/span><span class=\"p\">().<\/span><span class=\"na\">getHeaders<\/span><span class=\"p\">().<\/span><span class=\"na\">getFirst<\/span><span class=\"p\">(<\/span><span class=\"s\">\"X-User-Id\"<\/span><span class=\"p\">))<\/span>\n<span class=\"w\">                    <\/span><span class=\"p\">.<\/span><span class=\"na\">orElse<\/span><span class=\"p\">(<\/span><span class=\"n\">exchange<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequest<\/span><span class=\"p\">().<\/span><span class=\"na\">getRemoteAddress<\/span><span class=\"p\">().<\/span><span class=\"na\">getAddress<\/span><span class=\"p\">().<\/span><span class=\"na\">getHostAddress<\/span><span class=\"p\">()));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Simple auth filter (global)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">AuthFilter<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">GlobalFilter<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Ordered<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Mono<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Void<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">ServerWebExchange<\/span><span class=\"w\"> <\/span><span class=\"n\">exchange<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">GatewayFilterChain<\/span><span class=\"w\"> <\/span><span class=\"n\">chain<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">path<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">exchange<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequest<\/span><span class=\"p\">().<\/span><span class=\"na\">getPath<\/span><span class=\"p\">().<\/span><span class=\"na\">value<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">path<\/span><span class=\"p\">.<\/span><span class=\"na\">startsWith<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/api/users/login\"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">chain<\/span><span class=\"p\">.<\/span><span class=\"na\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">exchange<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// public<\/span>\n\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">auth<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">exchange<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequest<\/span><span class=\"p\">().<\/span><span class=\"na\">getHeaders<\/span><span class=\"p\">().<\/span><span class=\"na\">getFirst<\/span><span class=\"p\">(<\/span><span class=\"n\">HttpHeaders<\/span><span class=\"p\">.<\/span><span class=\"na\">AUTHORIZATION<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">auth<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"o\">!<\/span><span class=\"n\">auth<\/span><span class=\"p\">.<\/span><span class=\"na\">startsWith<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Bearer \"<\/span><span class=\"p\">))<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">exchange<\/span><span class=\"p\">.<\/span><span class=\"na\">getResponse<\/span><span class=\"p\">().<\/span><span class=\"na\">setStatusCode<\/span><span class=\"p\">(<\/span><span class=\"n\">HttpStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">UNAUTHORIZED<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">exchange<\/span><span class=\"p\">.<\/span><span class=\"na\">getResponse<\/span><span class=\"p\">().<\/span><span class=\"na\">setComplete<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// verify JWT here (or use spring-boot-starter-oauth2-resource-server)<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">chain<\/span><span class=\"p\">.<\/span><span class=\"na\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">exchange<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span><span class=\"w\"> <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">getOrder<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// run early<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-compare\" id=\"gateway-vs-bff-vs-service-mesh\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Gateway vs BFF vs Service Mesh<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>What it is<\/th>\n<th>Traffic<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>API Gateway<\/strong><\/td>\n<td>One entry point for all clients; generic concerns<\/td>\n<td>North-south (outside → inside)<\/td>\n<\/tr>\n<tr>\n<td><strong>BFF (Backend For Frontend)<\/strong><\/td>\n<td>A separate gateway <strong>per client type<\/strong> (one for mobile, one for web), shaped for that UI<\/td>\n<td>North-south<\/td>\n<\/tr>\n<tr>\n<td><strong>Service Mesh<\/strong> (Istio, Linkerd)<\/td>\n<td>Sidecar proxies next to every service handling retries, mTLS, metrics between services<\/td>\n<td>East-west (service ↔ service)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>They can be used together: Gateway at the edge + mesh inside.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"single-point-of-failure-trade-off\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Single point of failure (trade-off)<\/span><\/h2><div class=\"sec-body\"><p>If the gateway goes down, <strong>everything<\/strong> is down. So:\n- Run <strong>multiple gateway instances<\/strong> behind a load balancer.\n- Keep the gateway <strong>thin<\/strong> – no business logic, so it's fast and rarely changes.\n- Add timeouts and circuit breakers to its routes.\n- It adds one extra network hop (small latency).<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid / postpone when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Many microservices, many clients<\/td>\n<td>A single monolith – just use a load balancer<\/td>\n<\/tr>\n<tr>\n<td>You need central auth, rate limits, routing<\/td>\n<td>Very small team, two services<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>One front door: routing, auth, rate limit, logging.<\/li>\n<li>Spring Cloud Gateway with routes + filters.<\/li>\n<li>Avoid SPOF: many instances, keep it thin.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"picture","t":"Picture","k":"idea"},{"id":"spring-boot-spring-cloud-gateway","t":"Spring Boot – Spring Cloud Gateway","k":"code"},{"id":"gateway-vs-bff-vs-service-mesh","t":"Gateway vs BFF vs Service Mesh","k":"compare"},{"id":"single-point-of-failure-trade-off","t":"Single point of failure (trade-off)","k":"explain"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a mall's main entrance with security . visitors enter from one gate, security checks bags, and the help desk tells you which floor has which shop. you don't enter each shop from a different street. what problem does it solve? with 10 microservices, without a gateway: - the mobile app must know 10 different urls. - each service must do auth, rate limiting, cors, logging by itself (duplicated work). - internal services are exposed to the internet. the gateway handles these common concerns in one place : - routing ( /orders/** → order-service) - authentication (check jwt) - rate limiting - ssl termination, cors, logging, request ids - sometimes response aggregation picture one front door for all clients mobile / web api gateway auth · rate limit · logs /orders/** order-service /users/** user-service spring boot – spring cloud gateway dependency: spring-cloud-starter-gateway (reactive). add spring-boot-starter-data-redis-reactive for rate limiting. routing with yaml application.yml copy server : port : 8080 spring : cloud : gateway : routes : - id : orders uri : http://localhost:8081 # or lb://order-service with service discovery predicates : - path=/api/orders/** filters : - stripprefix=1 # /api/orders/1 → /orders/1 - name : requestratelimiter args : redis-rate-limiter.replenishrate : 10 # 10 requests/sec redis-rate-limiter.burstcapacity : 20 key-resolver : \"#{@userkeyresolver}\" - id : users uri : http://localhost:8082 predicates : - path=/api/users/** filters : - stripprefix=1 rate limit key (per user / per ip) java copy @configuration public class gatewayconfig { @bean public keyresolver userkeyresolver () { return exchange -> mono . just ( optional . ofnullable ( exchange . getrequest (). getheaders (). getfirst ( \"x-user-id\" )) . orelse ( exchange . getrequest (). getremoteaddress (). getaddress (). gethostaddress ())); } } simple auth filter (global) java copy @component public class authfilter implements globalfilter , ordered { @override public mono < void > filter ( serverwebexchange exchange , gatewayfilterchain chain ) { string path = exchange . getrequest (). getpath (). value (); if ( path . startswith ( \"/api/users/login\" )) return chain . filter ( exchange ); // public string auth = exchange . getrequest (). getheaders (). getfirst ( httpheaders . authorization ); if ( auth == null || ! auth . startswith ( \"bearer \" )) { exchange . getresponse (). setstatuscode ( httpstatus . unauthorized ); return exchange . getresponse (). setcomplete (); } // verify jwt here (or use spring-boot-starter-oauth2-resource-server) return chain . filter ( exchange ); } @override public int getorder () { return - 1 ; } // run early } gateway vs bff vs service mesh what it is traffic api gateway one entry point for all clients; generic concerns north-south (outside → inside) bff (backend for frontend) a separate gateway per client type (one for mobile, one for web), shaped for that ui north-south service mesh (istio, linkerd) sidecar proxies next to every service handling retries, mtls, metrics between services east-west (service ↔ service) they can be used together: gateway at the edge + mesh inside. single point of failure (trade-off) if the gateway goes down, everything is down. so: - run multiple gateway instances behind a load balancer. - keep the gateway thin – no business logic, so it's fast and rarely changes. - add timeouts and circuit breakers to its routes. - it adds one extra network hop (small latency). when to use / when not to use use it when avoid / postpone when many microservices, many clients a single monolith – just use a load balancer you need central auth, rate limits, routing very small team, two services quick revision one front door: routing, auth, rate limit, logging. spring cloud gateway with routes + filters. avoid spof: many instances, keep it thin."},{"id":"cqrs","n":"CQRS","p":1,"focus":"Separate the write model from the read model.","build":"Split one service into command handlers and query handlers.","trade":"when it is overkill, eventual consistency on the read side","day":5,"theme":"Safe APIs and read/write split","title":"CQRS (Command Query Responsibility Segregation)","lede":"Use <strong>one model for writing<\/strong> data (commands) and a <strong>different model for reading<\/strong> data (queries).","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>restaurant<\/strong>: the <strong>kitchen<\

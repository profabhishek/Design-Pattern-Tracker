    }
    if (r.id === "java-basics") renderPrimer();
    else if (BY[r.id]) renderTopic(BY[r.id]);
    else renderHome();
    renderNav();
    var a = document.querySelector('#nav [aria-current="page"]');
    if (a && a.scrollIntoViewIfNeeded) a.scrollIntoViewIfNeeded(); else if (a) a.scrollIntoView({ block: "nearest" });
    if (r.sec) {
      var el = document.getElementById(r.sec);
      if (el) { el.scrollIntoView(); }
    } else if (lastId !== r.id) {
      window.scrollTo(0, 0);
    }
    lastId = r.id;
    onScroll();
  }

  /* ---------- home ---------- */
  function renderHome() {
    var title = "Pattern Notes · Java Spring Boot";
    document.title = title;
    $("layout").classList.remove("has-toc");
    $("toc").innerHTML = "";
    var doneTopics = TOPICS.filter(function (t) { return ticks(t.id) === 3; }).length;
    var allTicks = TOPICS.reduce(function (a, t) { return a + ticks(t.id); }, 0);
    var h = '<div class="wrap wide">';
    if (!query && !prio) {
      h += '<section class="hero"><div class="eyebrow">32 topics · 14 days · Java Spring Boot</div>';
      h += '<h1>Design patterns, explained like a <em>friend</em> would.</h1>';
      h += '<p class="big">Every topic starts with a real-life picture, then shows the problem, the idea, and working Spring Boot code with plain-English comments. Tap any underlined Java word to see what it means.</p>';
      h += '<div class="hero-actions"><a class="btn primary" href="#/' + nextUnfinished().id + '">' + (allTicks ? "Continue: " + esc(nextUnfinished().n) : "Start with Day 1") + svg(ARROW_R) + '</a><a class="btn ghost" href="#/java-basics">New to Java? Start here</a></div>';
      h += '<div class="stats"><div class="stat"><b>' + doneTopics + '<span style="font-size:.6em;color:var(--muted)"> / 32</span></b><span>topics complete</span></div><div class="stat"><b>' + Math.round(allTicks / 96 * 100) + '%</b><span>of all ticks done</span></div><div class="stat"><b>' + Object.keys(GLOSS).length + '</b><span>Java words explained</span></div></div></section>';
      h += '<div class="how">';
      h += '<div class="how-card"><div class="num">1</div><h3>Picture it</h3><p>Each note opens with an everyday example, so the idea makes sense before any code.</p></div>';
      h += '<div class="how-card"><div class="num">2</div><h3>Read the code</h3><p>Short Spring Boot examples with comments on every important line. Copy them with one click.</p></div>';
      h += '<div class="how-card"><div class="num">3</div><h3>Explain it back</h3><p>Finish with the trade-offs and a quick revision list, then tick the three steps.</p></div>';
      h += '</div>';
      h += '<a class="starter" href="#/java-basics"><span class="s-ico">' + svg('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>') + '</span><span><h3>Not comfortable with Java yet?</h3><p>Read the 10-minute primer first: classes, interfaces, annotations, beans and how a Spring Boot request flows.</p></span><span class="go">' + svg(ARROW_R, ' width="22" height="22"') + '</span></a>';
    } else {
      var n = TOPICS.filter(matches).length;
      h += '<h1 style="font-size:1.6rem;letter-spacing:-.02em;margin:4px 0 6px">' + (query ? "Results for “" + esc(query) + "”" : esc(PRIO[prio])) + '</h1>';
      h += '<p class="result-count">' + n + (n === 1 ? " topic" : " topics") + ' found' + (query ? " (searching names and the full text of every note)" : "") + '.</p>';
    }
    var shown = 0;
    DAYS.forEach(function (d) {
      var list = d.topics.map(function (id) { return BY[id]; }).filter(matches);
      if (!list.length && (query || prio || d.topics.length)) return;
      h += '<section class="day-block"><div class="day-head"><span class="dn">DAY ' + String(d.n).padStart(2, "0") + '</span><h2>' + esc(d.theme) + '</h2>';
      if (list.length) h += '<span class="dc">' + list.filter(function (t) { return ticks(t.id) === 3; }).length + '/' + list.length + ' done</span>';
      h += '</div>';
      if (!list.length) {
        h += '<div class="revision-day"><b>Revision day.</b> No new topics. Go back over the topics before this day, explain each one out loud in a minute, and redraw the diagrams from memory in the <a href="patterns.html">tracker</a>.</div>';
      } else {
        h += '<div class="cards">';
        list.forEach(function (t) {
          shown++;
          var an = analogy(t);
          h += '<a class="card" href="#/' + t.id + '"><div class="card-top"><span class="tag p' + t.p + '">P' + t.p + '</span><span class="tag plain">' + t.mins + ' min</span>' + ring(t.id) + '</div>';
          h += '<h3>' + esc(t.n) + '</h3><p>' + esc(t.focus) + '</p>';
          if (an) h += '<div class="analogy"><b>Like:</b> ' + esc(an) + '</div>';
          h += '</a>';
        });
        h += '</div>';
      }
      h += '</section>';
    });
    if ((query || prio) && !shown) h += '<div class="no-results"><p>Nothing found. Try a shorter word, or <a href="#/" data-clear>clear the search</a>.</p></div>';
    h += '</div>';
    $("main").innerHTML = h;
    enhance($("main"));
  }
  function nextUnfinished() {
    for (var i = 0; i < TOPICS.length; i++) if (ticks(TOPICS[i].id) < 3) return TOPICS[i];
    return TOPICS[0];
  }

  /* ---------- topic ---------- */
  function renderTopic(t) {
    document.title = t.n + " · Pattern Notes";
    var h = '<article class="wrap note">';
    h += '<div class="crumb"><a href="#/">All topics</a><span aria-hidden="true">/</span><span>Day ' + t.day + ' · ' + esc(t.theme) + '</span></div>';
    h += '<h1>' + esc(t.n) + '</h1>';
    h += '<div class="meta"><span class="tag p' + t.p + '">' + esc(PRIO[t.p]) + '</span><span class="tag plain">' + t.mins + ' min read</span><span class="tag plain">Topic ' + (t.i + 1) + ' of 32</span></div>';
    if (t.lede) h += '<p class="lede">' + t.lede + '</p>';
    h += '<div class="steps-card"><div class="sc-head"><b>Your 3 steps for this topic</b><span id="sc-count"></span></div><div class="steps">';
    STEPS.forEach(function (s) {
      h += '<button type="button" class="step" data-step="' + t.id + ':' + s.k + '" aria-pressed="false"><span class="box">' + CHECK + '</span><span><b>' + s.label + '</b><span>' + esc(s.text(t)) + '</span></span></button>';
    });
    h += '</div></div>';
    h += '<div class="note-body">' + t.html + '</div>';
    h += pager(TOPICS[t.i - 1] || { id: "java-basics", n: "Java & Spring Boot basics" }, TOPICS[t.i + 1], t);
    h += '</article>';
    $("main").innerHTML = h;
    syncSteps(t.id);
    buildToc(t);
    enhance($("main"));
  }
  function pager(prev, next) {
    var h = '<nav class="pager" aria-label="Previous and next topic">';
    if (prev) h += '<a class="pg prev" href="#/' + prev.id + '"><small>' + svg(ARROW_L, ' width="14" height="14"') + 'Previous <kbd>←</kbd></small><b>' + esc(prev.n) + '</b></a>';
    if (next) h += '<a class="pg next" href="#/' + next.id + '"><small>Next up <kbd>→</kbd>' + svg(ARROW_R, ' width="14" height="14"') + '</small><b>' + esc(next.n) + '</b></a>';
    h += '</nav>';
    h += '<div class="end-actions"><a class="btn ghost" href="#/">All topics</a><a class="btn ghost" href="patterns.html">Open the tracker</a></div>';
    return h;
  }
  function syncSteps(id) {
    var n = 0;
    document.querySelectorAll("[data-step]").forEach(function (b) {
      var on = !!state.done[b.getAttribute("data-step")];
      if (on) n++;
      b.setAttribute("aria-pressed", on ? "true" : "false");
    });
    var c = $("sc-count"); if (c) c.textContent = n === 3 ? "All done — great work" : n + " of 3 done";
  }

  /* ---------- primer ---------- */
  function renderPrimer() {
    var p = PRIMER;
    document.title = p.n + " · Pattern Notes";
    var h = '<article class="wrap note">';
    h += '<div class="crumb"><a href="#/">All topics</a><span aria-hidden="true">/</span><span>Start here</span></div>';
    h += '<h1>' + esc(p.title) + '</h1>';
    h += '<div class="meta"><span class="tag plain">For beginners</span><span class="tag plain">' + p.mins + ' min read</span></div>';
    h += '<p class="lede">' + p.lede + '</p>';
    h += '<div class="note-body">' + p.html;
    h += '<section class="sec k-default" id="words" data-kind="default"><h2><span class="ico" aria-hidden="true"></span><span class="h2t">Every Java & Spring word in these notes</span></h2><div class="sec-body">';
    h += '<p>Forgot what something means? Search it here. The same explanations pop up when you tap an underlined word inside any code block.</p>';
    h += '<div class="words-tools"><div class="search">' + svg('<circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/>') + '<input id="wq" type="search" placeholder="Filter words, e.g. Transactional" aria-label="Filter words"></div><span id="wcount" class="tag plain"></span></div>';
    h += '<div class="words" id="words-list"></div></div></section>';
    h += '</div>';
    h += pager(null, TOPICS[0]);
    h += '</article>';
    $("main").innerHTML = h;
    renderWords("");
    $("wq").addEventListener("input", function () { renderWords(this.value); });
    buildToc(p, true);
    enhance($("main"));
  }
  function renderWords(f) {
    var q = f.trim().toLowerCase().replace(/^@/, "");
    var seen = {}, keys = Object.keys(GLOSS).filter(function (k) {
      var base = k.replace(/^@/, "");
      if (seen[base + GLOSS[k][1]]) return false;
      seen[base + GLOSS[k][1]] = 1;
      return !q || base.toLowerCase().indexOf(q) >= 0 || GLOSS[k][1].toLowerCase().indexOf(q) >= 0 || GLOSS[k][0].toLowerCase().indexOf(q) >= 0;
    }).sort(function (a, b) { return a.replace(/^@/, "").toLowerCase() < b.replace(/^@/, "").toLowerCase() ? -1 : 1; });
    $("words-list").innerHTML = keys.map(function (k) {
      return '<div class="word"><div class="wt"><code>' + esc(k) + '</code><span class="pc">' + esc(GLOSS[k][0]) + '</span></div><p>' + esc(GLOSS[k][1]) + '</p></div>';
    }).join("") || '<p style="color:var(--muted)">No word matches.</p>';
    $("wcount").textContent = keys.length + " words";
  }

  /* ---------- TOC + scroll spy ---------- */
  var spy;
  function buildToc(t, primer) {
    var items = t.toc.slice();
    if (primer) items.push({ id: "words", t: "All Java & Spring words" });
    var h = '<h4>On this page</h4>';
    items.forEach(function (s) { h += '<a href="#/' + (primer ? "java-basics" : t.id) + '/' + s.id + '" data-sec="' + s.id + '">' + esc(s.t) + '</a>'; });
    h += '<div class="toc-actions"><a href="#" data-top>↑ Back to top</a>';
    if (!primer) h += '<a href="patterns.html">Open in tracker</a>';
    h += '</div>';
    $("toc").innerHTML = h;
    $("layout").classList.add("has-toc");
    if (spy) spy.disconnect();
    if (!("IntersectionObserver" in window)) return;
    var vis = {};
    spy = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) { vis[e.target.id] = e.isIntersecting; });
      var first = null;
      document.querySelectorAll(".note-body > .sec").forEach(function (s) { if (!first && vis[s.id]) first = s.id; });
      if (first) document.querySelectorAll("#toc a[data-sec]").forEach(function (a) { a.classList.toggle("on", a.getAttribute("data-sec") === first); });
    }, { rootMargin: "-70px 0px -55% 0px" });
    document.querySelectorAll(".note-body > .sec").forEach(function (s) { spy.observe(s); });
  }

  /* ---------- enhance content: icons, copy, glossary ---------- */
  var COMMON = { "public":1,"private":1,"protected":1,"static":1,"final":1,"class":1,"new":1,"this":1,"return":1,"void":1,"String":1,"int":1,"long":1,"double":1,"boolean":1,"null":1,"try":1,"catch":1,"throw":1,"throws":1,"finally":1,"var":1,"List":1,"Map":1,"Object":1,"switch":1,"if":1,"else":1 };
  var WORD_RE = /@?[A-Za-z_][A-Za-z0-9_]*/g;
  function gl(word) { return GLOSS[word] ? word : (word.charAt(0) === "@" && GLOSS[word.slice(1)] ? word.slice(1) : null); }
  function enhance(root) {
    var basics = currentRoute().id === "java-basics";
    root.querySelectorAll(".sec").forEach(function (s) {
      var k = s.getAttribute("data-kind") || "default";
      var ico = s.querySelector("h2 .ico"); if (ico && !ico.innerHTML) ico.innerHTML = svg(ICON[k] || ICON["default"]);
    });
    var pageSeen = {};
    root.querySelectorAll("figure.code pre code").forEach(function (code) {
      var blockSeen = {};
      var walker = document.createTreeWalker(code, NodeFilter.SHOW_TEXT, null);
      var nodes = []; while (walker.nextNode()) nodes.push(walker.currentNode);
      nodes.forEach(function (node) {
        var p = node.parentNode;
        if (p.classList && (p.classList.contains("c1") || p.classList.contains("cm") || p.classList.contains("s") || p.classList.contains("s2") || p.classList.contains("c"))) return;
        var txt = node.nodeValue, out = null, last = 0, m;
        WORD_RE.lastIndex = 0;
        while ((m = WORD_RE.exec(txt))) {
          var w = m[0], key = gl(w);
          if (!key) continue;
          if (blockSeen[key]) continue;
          if (COMMON[key] && (pageSeen[key] || !basics)) continue;
          var prevCh = txt.charAt(m.index - 1);
          if (prevCh === "." && w.charAt(0) !== "@" && key !== "stream") continue;
          blockSeen[key] = pageSeen[key] = 1;
          out = out || document.createDocumentFragment();
          out.appendChild(document.createTextNode(txt.slice(last, m.index)));
          var sp = document.createElement("span");
          sp.className = "term"; sp.tabIndex = 0; sp.setAttribute("role", "button");
          sp.setAttribute("data-term", key); sp.setAttribute("aria-label", w + ": show meaning");
          sp.textContent = w;
          out.appendChild(sp);
          last = m.index + w.length;
        }
        if (out) { out.appendChild(document.createTextNode(txt.slice(last))); p.replaceChild(out, node); }
      });
    });
    root.querySelectorAll(".sec-body :not(pre) > code").forEach(function (c) {
      var key = gl(c.textContent.trim());
      if (key) { c.classList.add("term"); c.tabIndex = 0; c.setAttribute("role", "button"); c.setAttribute("data-term", key); }
    });
  }

  /* ---------- glossary popover ---------- */
  var pop = $("pop"), popFor = null, hideT = null, showT = null;
  function showPop(el) {
    clearTimeout(hideT);
    var key = el.getAttribute("data-term"), g = GLOSS[key];
    if (!g) return;
    if (popFor && popFor !== el) popFor.classList.remove("open");
    popFor = el; el.classList.add("open");
    pop.innerHTML = '<div class="pt"><code>' + esc(el.textContent) + '</code><span class="pc">' + esc(g[0]) + '</span></div><p>' + esc(g[1]) + '</p><a href="#/java-basics/words">See all Java words →</a>';
    pop.setAttribute("aria-hidden", "false");
    el.setAttribute("aria-describedby", "pop");
    var r = el.getBoundingClientRect();
    pop.style.left = "0px"; pop.style.top = "0px"; pop.classList.add("show");
    var pw = pop.offsetWidth, ph = pop.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
    var left = Math.min(Math.max(12, r.left + r.width / 2 - pw / 2), vw - pw - 12);
    var top = r.bottom + 10;
    if (top + ph > vh - 12 && r.top - ph - 10 > 12) top = r.top - ph - 10;
    pop.style.left = left + "px"; pop.style.top = top + "px";
  }
  function hidePop() {
    clearTimeout(showT);
    pop.classList.remove("show"); pop.setAttribute("aria-hidden", "true");
    if (popFor) { popFor.classList.remove("open"); popFor.removeAttribute("aria-describedby"); }
    popFor = null;
  }
  var finePointer = window.matchMedia && window.matchMedia("(hover: hover) and (pointer: fine)").matches;
  document.addEventListener("mouseover", function (e) {
    if (!finePointer) return;
    var t = e.target.closest && e.target.closest(".term");
    if (t) { clearTimeout(hideT); clearTimeout(showT); showT = setTimeout(function () { showPop(t); }, 140); }
    else if (e.target.closest && e.target.closest("#pop")) clearTimeout(hideT);
  });
  document.addEventListener("mouseout", function (e) {
    if (!finePointer) return;
    var from = e.target.closest && (e.target.closest(".term") || e.target.closest("#pop"));
    if (from) { clearTimeout(showT); hideT = setTimeout(hidePop, 220); }
  });

  /* ---------- global events ---------- */
  document.addEventListener("click", function (e) {
    var term = e.target.closest(".term");
    if (term) { e.preventDefault(); if (popFor === term && pop.classList.contains("show")) hidePop(); else showPop(term); return; }
    if (!e.target.closest("#pop")) hidePop();
    var copy = e.target.closest(".copy");
    if (copy) { doCopy(copy); return; }
    var step = e.target.closest("[data-step]");
    if (step) {
      var k = step.getAttribute("data-step");
      if (state.done[k]) delete state.done[k]; else state.done[k] = true;
      saveState(); syncSteps(k.split(":")[0]); renderNav();
      var id = k.split(":")[0];
      if (ticks(id) === 3) toast("Topic complete. Nice work!");
      return;
    }
    if (e.target.closest("[data-top]")) { e.preventDefault(); window.scrollTo({ top: 0, behavior: "smooth" }); return; }
    if (e.target.closest("[data-clear]")) { setQuery(""); }
    var fc = e.target.closest(".fchip");
    if (fc) {
      prio = +fc.getAttribute("data-f");
      document.querySelectorAll(".fchip").forEach(function (b) { b.setAttribute("aria-pressed", b === fc ? "true" : "false"); });
      renderNav(); if (currentRoute().id === "") renderHome();
    }
  });
  document.addEventListener("keydown", function (e) {
    var tag = (e.target.tagName || "").toLowerCase(), typing = tag === "input" || tag === "textarea";
    if (e.key === "Escape") { hidePop(); closeNav(); if (typing) e.target.blur(); return; }
    if ((e.key === "Enter" || e.key === " ") && e.target.classList && e.target.classList.contains("term")) { e.preventDefault(); showPop(e.target); return; }
    if (typing || e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.key === "/") { e.preventDefault(); if (window.innerWidth <= 960) openNav(); $("q").focus(); }
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      var next = document.querySelector(e.key === "ArrowRight" ? ".pg.next" : ".pg.prev");
      if (next) { location.hash = next.getAttribute("href"); }
    }
  });
  function doCopy(btn) {
    var code = btn.closest("figure").querySelector("pre").innerText;
    var ok = function () { btn.textContent = "Copied"; btn.classList.add("done"); setTimeout(function () { btn.textContent = "Copy"; btn.classList.remove("done"); }, 1600); };
    if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(code).then(ok, fallback); else fallback();
    function fallback() {
      var ta = document.createElement("textarea"); ta.value = code; ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); ok(); } catch (err) { toast("Press Ctrl+C to copy"); }
      document.body.removeChild(ta);
    }
  }
  var toastT;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(function () { t.classList.remove("show"); }, 2200); }

  /* search input */
  var qT;
  function setQuery(v) { query = v.trim(); $("q").value = v; renderNav(); if (currentRoute().id === "") renderHome(); }
  $("q").addEventListener("input", function () {
    var v = this.value; clearTimeout(qT);
    qT = setTimeout(function () {
      query = v.trim(); renderNav();
      if (currentRoute().id === "") renderHome();
      else if (query && window.innerWidth > 960) { /* keep reading; sidebar shows results */ }
    }, 90);
  });
  $("q").addEventListener("keydown", function (e) {
    if (e.key === "Enter") {
      var first = TOPICS.filter(matches)[0];
      if (first) { location.hash = "#/" + first.id; this.blur(); }
    }
  });

  /* mobile drawer */
  function openNav() { document.body.classList.add("nav-open"); $("menu-btn").setAttribute("aria-expanded", "true"); }
  function closeNav() { document.body.classList.remove("nav-open"); $("menu-btn").setAttribute("aria-expanded", "false"); }
  $("menu-btn").addEventListener("click", function () { if (document.body.classList.contains("nav-open")) closeNav(); else { openNav(); } });
  $("backdrop").addEventListener("click", closeNav);

  /* theme */
  function isDark() { var t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : window.matchMedia("(prefers-color-scheme: dark)").matches; }
  function paintThemeBtn() {
    $("theme-btn").innerHTML = isDark()
      ? svg('<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>')
      : svg('<path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/>');
    $("theme-btn").setAttribute("aria-label", isDark() ? "Switch to light mode" : "Switch to dark mode");
  }
  $("theme-btn").addEventListener("click", function () {
    var next = isDark() ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", next);
    try { localStorage.setItem("learn-theme", next); } catch (e) {}
    paintThemeBtn();
  });
  paintThemeBtn();

  /* text size */
  function paintSize() {
    var s = document.documentElement.getAttribute("data-size") || "m";
    document.querySelectorAll(".size-group button").forEach(function (b) { b.setAttribute("aria-pressed", b.getAttribute("data-size") === s ? "true" : "false"); });
  }
  document.querySelectorAll(".size-group button").forEach(function (b) {
    b.addEventListener("click", function () {
      var s = b.getAttribute("data-size");
      document.documentElement.setAttribute("data-size", s);
      try { localStorage.setItem("learn-size", s); } catch (e) {}
      paintSize();
    });
  });
  paintSize();

  /* reading progress */
  function onScroll() {
    var h = document.documentElement.scrollHeight - window.innerHeight;
    $("progress").style.width = (h > 0 ? Math.min(100, window.scrollY / h * 100) : 0) + "%";
    if (pop.classList.contains("show") && !finePointer) hidePop();
  }
  window.addEventListener("scroll", onScroll, { passive: true });
  window.addEventListener("resize", hidePop);

  /* sync with tracker in another tab */
  window.addEventListener("storage", function (e) {
    if (e.key !== LS_KEY) return;
    state = loadState(); renderNav();
    var r = currentRoute(); if (BY[r.id]) syncSteps(r.id); else if (!r.id) renderHome();
  });

  window.addEventListener("hashchange", route);
  route();
})();

"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">          <\/span><span class=\"c1\">// the contract<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">UpiGateway<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">    <\/span><span class=\"c1\">// one way to keep the contract<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Paid by UPI\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CardGateway<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">   <\/span><span class=\"c1\">// another way<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Paid by card\"<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Code that only knows <code>PaymentGateway<\/code> works with <strong>both<\/strong>. Almost every pattern in these notes uses this idea.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"annotations-sticky-notes-for-spring\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Annotations: sticky notes for Spring<\/span><\/h2><div class=\"sec-body\"><p>Words that start with <code>@<\/code> are <strong>annotations<\/strong>. They don't run any logic themselves. They are <strong>sticky notes<\/strong> that tell Spring (or another tool) what to do with the class or method.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span><span class=\"w\">                                 <\/span><span class=\"c1\">// \"Spring, please create and manage this class\"<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// \"Spring, run this inside a database transaction\"<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">placeOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">o<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Every annotation in the notes has a dotted underline the first time it appears in a code block. <strong>Tap or hover it<\/strong> to see what it means.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"beans-and-the-spring-container\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Beans and the Spring container<\/span><\/h2><div class=\"sec-body\"><p>When Spring starts, it looks for classes with <code>@Component<\/code>, <code>@Service<\/code>, <code>@Repository<\/code>, <code>@RestController<\/code> or <code>@Bean<\/code> methods. It creates <strong>one object of each<\/strong> and keeps them in a big box called the <strong>container<\/strong> (<code>ApplicationContext<\/code>). These managed objects are called <strong>beans<\/strong>.<\/p>\n<p>When a bean needs another bean, Spring passes it in through the constructor. This is called <strong>Dependency Injection<\/strong>.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span><span class=\"w\">          <\/span><span class=\"c1\">// what this class needs<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">  <\/span><span class=\"c1\">// Spring hands it over automatically<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">repo<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p><code>final<\/code> means the field is set once and never changes. You will see this pattern in almost every Spring example.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"how-a-request-travels-through-a-spring-boot-app\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How a request travels through a Spring Boot app<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"The journey of one request: Browser / App sends GET /orders/5 Controller reads the request Service business rules Repository talks to the DB Database stores the rows The answer travels back the same way, and Spring turns the Java object into JSON for the browser.\"><figcaption>The journey of one request<\/figcaption><div class=\"dg-body\"><div class=\"flow long\"><div class=\"node s-muted\"><b>Browser / App<\/b><small>sends GET /orders/5<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-accent\"><b>Controller<\/b><small>reads the request<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-plain\"><b>Service<\/b><small>business rules<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-plain\"><b>Repository<\/b><small>talks to the DB<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-db\"><b>Database<\/b><small>stores the rows<\/small><\/div><\/div><p class=\"dg-note t-plain\">The answer travels back the same way, and Spring turns the Java object into JSON for the browser.<\/p><\/div><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RestController<\/span><span class=\"w\">                                  <\/span><span class=\"c1\">// 1. receives the web request<\/span>\n<span class=\"nd\">@RequestMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/orders\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderController<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderController<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">service<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@GetMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/{id}\"<\/span><span class=\"p\">)<\/span><span class=\"w\">                         <\/span><span class=\"c1\">// GET /orders/5<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"nf\">get<\/span><span class=\"p\">(<\/span><span class=\"nd\">@PathVariable<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">    <\/span><span class=\"c1\">// id = 5, taken from the URL<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">find<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// Spring turns the Order into JSON<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span><span class=\"w\">                                         <\/span><span class=\"c1\">// 2. business rules<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">repo<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"nf\">find<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span><span class=\"w\">  <\/span><span class=\"c1\">// \"give me the order, or fail if missing\"<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">JpaRepository<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Order<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// 3. Spring writes the SQL<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"generics-a-box-with-a-label\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Generics: a box with a label<\/span><\/h2><div class=\"sec-body\"><p><code>List&lt;User&gt;<\/code> means \"a list that holds <code>User<\/code> objects\". The part in <code>&lt; &gt;<\/code> is the <strong>label on the box<\/strong>: it says what is allowed inside.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">names<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Ravi\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Priya\"<\/span><span class=\"p\">);<\/span><span class=\"w\">      <\/span><span class=\"c1\">// a list of texts<\/span>\n<span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Integer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">stock<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">HashMap<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span><span class=\"w\">       <\/span><span class=\"c1\">// a lookup table: text → number<\/span>\n<span class=\"n\">stock<\/span><span class=\"p\">.<\/span><span class=\"na\">put<\/span><span class=\"p\">(<\/span><span class=\"s\">\"pen\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">10<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">stock<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"s\">\"pen\"<\/span><span class=\"p\">);<\/span><span class=\"w\">                                    <\/span><span class=\"c1\">// 10<\/span>\n<span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">maybeUser<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"mi\">7L<\/span><span class=\"p\">);<\/span><span class=\"w\">        <\/span><span class=\"c1\">// a box that may be empty<\/span><\/code><\/pre><\/figure>\n<ul>\n<li><code>List<\/code> = ordered items. <code>Map<\/code> = key → value lookup. <code>Optional<\/code> = \"maybe a value, maybe nothing\".<\/li>\n<li><code>7L<\/code> just means \"the number 7, as a long\".<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-default\" id=\"lambdas-and-method-references-tiny-inline-functions\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Lambdas and method references: tiny inline functions<\/span><\/h2><div class=\"sec-body\"><p>An arrow <code>-&gt;<\/code> makes a small function on the spot. Read <code>x -&gt; x * 2<\/code> as \"take x, give back x times 2\".<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"n\">names<\/span><span class=\"p\">.<\/span><span class=\"na\">forEach<\/span><span class=\"p\">(<\/span><span class=\"n\">n<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">n<\/span><span class=\"p\">));<\/span><span class=\"w\">          <\/span><span class=\"c1\">// for each name n, print it<\/span>\n<span class=\"n\">names<\/span><span class=\"p\">.<\/span><span class=\"na\">forEach<\/span><span class=\"p\">(<\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">::<\/span><span class=\"n\">println<\/span><span class=\"p\">);<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// the same thing, shorter (method reference)<\/span>\n\n<span class=\"n\">products<\/span><span class=\"p\">.<\/span><span class=\"na\">sort<\/span><span class=\"p\">(<\/span><span class=\"n\">Comparator<\/span><span class=\"p\">.<\/span><span class=\"na\">comparing<\/span><span class=\"p\">(<\/span><span class=\"n\">Product<\/span><span class=\"p\">::<\/span><span class=\"n\">getPrice<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// sort by price<\/span>\n\n<span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">vip<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">users<\/span><span class=\"p\">.<\/span><span class=\"na\">stream<\/span><span class=\"p\">()<\/span><span class=\"w\">                   <\/span><span class=\"c1\">// start a pipeline<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">getAge<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">18<\/span><span class=\"p\">)<\/span><span class=\"w\">               <\/span><span class=\"c1\">// keep only adults<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">User<\/span><span class=\"p\">::<\/span><span class=\"n\">getName<\/span><span class=\"p\">)<\/span><span class=\"w\">                         <\/span><span class=\"c1\">// turn each User into its name<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">.<\/span><span class=\"na\">toList<\/span><span class=\"p\">();<\/span><span class=\"w\">                                  <\/span><span class=\"c1\">// collect into a new list<\/span><\/code><\/pre><\/figure>\n<p><code>Product::getPrice<\/code> means \"call getPrice on each product\". <code>() -&gt; doSomething()<\/code> is a function that takes nothing.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"a-few-more-words-you-will-meet\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">A few more words you will meet<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">Point<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">x<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">y<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">               <\/span><span class=\"c1\">// a small data class, values can't change<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">enum<\/span><span class=\"w\"> <\/span><span class=\"n\">Status<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">CREATED<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">PAID<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">SHIPPED<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">       <\/span><span class=\"c1\">// a fixed list of allowed values<\/span>\n\n<span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">MAX<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">;<\/span><span class=\"w\">                   <\/span><span class=\"c1\">// one shared constant for the whole class<\/span>\n\n<span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">risky<\/span><span class=\"p\">();<\/span><span class=\"w\">                                        <\/span><span class=\"c1\">// try this...<\/span>\n<span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">handle<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">);<\/span><span class=\"w\">                                      <\/span><span class=\"c1\">// ...and if it fails, do this<\/span>\n<span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">finally<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">cleanUp<\/span><span class=\"p\">();<\/span><span class=\"w\">                                      <\/span><span class=\"c1\">// always runs at the end<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalStateException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Not allowed\"<\/span><span class=\"p\">);<\/span><span class=\"w\">    <\/span><span class=\"c1\">// raise an error on purpose<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"config-files-application-properties-and-yaml\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Config files: application.properties and YAML<\/span><\/h2><div class=\"sec-body\"><p>Settings live outside the code, so you can change behaviour without changing Java. Both files below mean the same thing.<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">server.port<\/span><span class=\"o\">=<\/span><span class=\"s\">8080<\/span>\n<span class=\"na\">shop.discount<\/span><span class=\"o\">=<\/span><span class=\"s\">FESTIVAL<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">server<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">port<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">8080<\/span>\n<span class=\"nt\">shop<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">discount<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">FESTIVAL<\/span><\/code><\/pre><\/figure>\n<p>The code reads them with <code>@Value(\"${shop.discount}\")<\/code>, or a library reads them by name (like the Resilience4j settings in the resilience topics).<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"how-to-read-any-code-block-in-these-notes\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How to read any code block in these notes<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Read the comments first.<\/strong> Every important line has a plain-English comment after <code>//<\/code>.<\/li>\n<li><strong>Find the interface.<\/strong> It tells you <em>what<\/em> the thing does. The classes tell you <em>how<\/em>.<\/li>\n<li><strong>Look at the annotations.<\/strong> They tell you what Spring adds on top. Tap any you don't know.<\/li>\n<li><strong>Skip <code>import<\/code> lines and getters.<\/strong> They are just plumbing.<\/li>\n<li><strong>Then type it out yourself<\/strong> in a small project from start.spring.io. Typing teaches more than reading.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Class = blueprint, object = thing built from it, interface = contract.<\/li>\n<li><code>@Annotations<\/code> are sticky notes telling Spring what to do.<\/li>\n<li>Spring creates beans and injects them through constructors.<\/li>\n<li>Request flow: Controller → Service → Repository → Database.<\/li>\n<li><code>List&lt;User&gt;<\/code> is a labelled box, <code>x -&gt; ...<\/code> is a tiny function, <code>Optional<\/code> may be empty.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"class-and-object-a-blueprint-and-a-house","t":"Class and object: a blueprint and a house","k":"default"},{"id":"interface-a-contract-a-plug-socket","t":"Interface: a contract (a plug socket)","k":"default"},{"id":"annotations-sticky-notes-for-spring","t":"Annotations: sticky notes for Spring","k":"default"},{"id":"beans-and-the-spring-container","t":"Beans and the Spring container","k":"default"},{"id":"how-a-request-travels-through-a-spring-boot-app","t":"How a request travels through a Spring Boot app","k":"code"},{"id":"generics-a-box-with-a-label","t":"Generics: a box with a label","k":"default"},{"id":"lambdas-and-method-references-tiny-inline-functions","t":"Lambdas and method references: tiny inline functions","k":"default"},{"id":"a-few-more-words-you-will-meet","t":"A few more words you will meet","k":"default"},{"id":"config-files-application-properties-and-yaml","t":"Config files: application.properties and YAML","k":"default"},{"id":"how-to-read-any-code-block-in-these-notes","t":"How to read any code block in these notes","k":"code"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":8,"text":"think of it like this think of java as a language, like english. spring boot is a fully equipped kitchen built for that language: the stove, fridge and gas connection are already there, so you can start cooking (writing your app) straight away instead of building the kitchen first. you don't need to know every word of java to follow these notes. you only need to recognise about ten ideas. they are all on this page. class and object: a blueprint and a house a class is a blueprint. an object is a real thing built from that blueprint. one blueprint, many houses. java copy public class user { // the blueprint private string name ; // a field: data each user has private int age ; public user ( string name , int age ) { // constructor: how to build a user this . name = name ; this . age = age ; } public string greet () { // a method: something a user can do return \"hi, i am \" + name ; } } user ravi = new user ( \"ravi\" , 25 ); // build one object from the blueprint ravi . greet (); // \"hi, i am ravi\" private = hidden inside the class. public = anyone can use it. string is text, int is a whole number, double is a decimal number, boolean is true/false. return hands a value back to whoever called the method. void means the method gives nothing back. interface: a contract (a plug socket) an interface lists what something must be able to do, without saying how. any class that implements it must fill in the details. like a plug socket: any charger with the right plug shape fits. java copy public interface paymentgateway { // the contract string pay ( double amount ); } public class upigateway implements paymentgateway { // one way to keep the contract public string pay ( double amount ) { return \"paid by upi\" ; } } public class cardgateway implements paymentgateway { // another way public string pay ( double amount ) { return \"paid by card\" ; } } code that only knows paymentgateway works with both . almost every pattern in these notes uses this idea. annotations: sticky notes for spring words that start with @ are annotations . they don't run any logic themselves. they are sticky notes that tell spring (or another tool) what to do with the class or method. java copy @service // \"spring, please create and manage this class\" public class orderservice { @transactional // \"spring, run this inside a database transaction\" public void placeorder ( order o ) { ... } } every annotation in the notes has a dotted underline the first time it appears in a code block. tap or hover it to see what it means. beans and the spring container when spring starts, it looks for classes with @component , @service , @repository , @restcontroller or @bean methods. it creates one object of each and keeps them in a big box called the container ( applicationcontext ). these managed objects are called beans . when a bean needs another bean, spring passes it in through the constructor. this is called dependency injection . java copy @service public class orderservice { private final orderrepository repo ; // what this class needs public orderservice ( orderrepository repo ) { // spring hands it over automatically this . repo = repo ; } } final means the field is set once and never changes. you will see this pattern in almost every spring example. how a request travels through a spring boot app the journey of one request browser / app sends get /orders/5 controller reads the request service business rules repository talks to the db database stores the rows the answer travels back the same way, and spring turns the java object into json for the browser. java copy @restcontroller // 1. receives the web request @requestmapping ( \"/orders\" ) public class ordercontroller { private final orderservice service ; public ordercontroller ( orderservice service ) { this . service = service ; } @getmapping ( \"/{id}\" ) // get /orders/5 public order get ( @pathvariable long id ) { // id = 5, taken from the url return service . find ( id ); // spring turns the order into json } } @service // 2. business rules public class orderservice { private final orderrepository repo ; public orderservice ( orderrepository repo ) { this . repo = repo ; } public order find ( long id ) { return repo . findbyid ( id ). orelsethrow (); // \"give me the order, or fail if missing\" } } public interface orderrepository extends jparepository < order , long > { } // 3. spring writes the sql generics: a box with a label list<user> means \"a list that holds user objects\". the part in < > is the label on the box : it says what is allowed inside. java copy list < string > names = list . of ( \"ravi\" , \"priya\" ); // a list of texts map < string , integer > stock = new hashmap <> (); // a lookup table: text → number stock . put ( \"pen\" , 10 ); stock . get ( \"pen\" ); // 10 optional < user > maybeuser = repo . findbyid ( 7l ); // a box that may be empty list = ordered items. map = key → value lookup. optional = \"maybe a value, maybe nothing\". 7l just means \"the number 7, as a long\". lambdas and method references: tiny inline functions an arrow -> makes a small function on the spot. read x -> x * 2 as \"take x, give back x times 2\". java copy names . foreach ( n -> system . out . println ( n )); // for each name n, print it names . foreach ( system . out :: println ); // the same thing, shorter (method reference) products . sort ( comparator . comparing ( product :: getprice )); // sort by price list < string > vip = users . stream () // start a pipeline . filter ( u -> u . getage () > 18 ) // keep only adults . map ( user :: getname ) // turn each user into its name . tolist (); // collect into a new list product::getprice means \"call getprice on each product\". () -> dosomething() is a function that takes nothing. a few more words you will meet java copy public record point ( int x , int y ) { } // a small data class, values can't change public enum status { created , paid , shipped } // a fixed list of allowed values private static final int max = 3 ; // one shared constant for the whole class try { risky (); // try this... } catch ( exception e ) { handle ( e ); // ...and if it fails, do this } finally { cleanup (); // always runs at the end } throw new illegalstateexception ( \"not allowed\" ); // raise an error on purpose config files: application.properties and yaml settings live outside the code, so you can change behaviour without changing java. both files below mean the same thing. application.properties copy server.port = 8080 shop.discount = festival application.yml copy server : port : 8080 shop : discount : festival the code reads them with @value(\"${shop.discount}\") , or a library reads them by name (like the resilience4j settings in the resilience topics). how to read any code block in these notes read the comments first. every important line has a plain-english comment after // . find the interface. it tells you what the thing does. the classes tell you how . look at the annotations. they tell you what spring adds on top. tap any you don't know. skip import lines and getters. they are just plumbing. then type it out yourself in a small project from start.spring.io. typing teaches more than reading. quick revision class = blueprint, object = thing built from it, interface = contract. @annotations are sticky notes telling spring what to do. spring creates beans and injects them through constructors. request flow: controller → service → repository → database. list<user> is a labelled box, x -> ... is a tiny function, optional may be empty.","id":"java-basics","n":"Java & Spring Boot basics"},"glossary":{"public":["Java keyword","Anyone, from any class, is allowed to use this."],"private":["Java keyword","Only code inside this same class can use this. It is hidden from everyone else."],"protected":["Java keyword","Usable inside this class, its child classes, and its package."],"static":["Java keyword","Belongs to the class itself, not to one object. There is one shared copy, and you use it without calling new."],"final":["Java keyword","Cannot be changed after it is set. A final field is given a value once and then stays the same."],"class":["Java keyword","A blueprint. It describes the data (fields) and actions (methods) that its objects will have."],"interface":["Java keyword","A contract: a list of methods a class promises to have, without saying how they work. Like a plug socket shape that many plugs can fit."],"implements":["Java keyword","This class keeps the promise of an interface by writing real code for all of its methods."],"extends":["Java keyword","This class is a child of another class and gets all of its code for free, then can add or change things."],"abstract":["Java keyword","Not complete on its own. An abstract class or method must be finished by a child class before it can be used."],"enum":["Java keyword","A fixed list of named values, for example CLOSED, OPEN, HALF_OPEN. Nothing outside the list is allowed."],"record":["Java keyword","A short way to make a simple data class. Java writes the constructor, getters, equals and toString for you, and the values cannot change."],"sealed":["Java keyword","Only the classes listed after permits are allowed to extend or implement this."],"permits":["Java keyword","The exact list of classes allowed to extend a sealed class or interface."],"new":["Java keyword","Creates a fresh object from a class. new User() means: build one User now."],"this":["Java keyword","Means the current object. this.name is the name field of the object we are inside."],"return":["Java keyword","Stop the method here and hand this value back to whoever called it."],"void":["Java keyword","This method does some work but gives nothing back."],"synchronized":["Java keyword","Only one thread may run this code at a time. Others wait their turn, like a single key to a room."],"volatile":["Java keyword","Every thread always sees the latest value of this field, never an old cached copy."],"throw":["Java keyword","Raise an error right now. The normal flow stops and the error travels up until someone catches it."],"throws":["Java keyword","A warning label on a method: this method may raise these kinds of errors."],"try":["Java keyword","Run this code, but be ready: if it fails, jump to the catch block instead of crashing."],"catch":["Java keyword","What to do when the code in try fails with this kind of error."],"finally":["Java keyword","This block always runs at the end, whether the try worked or failed. Good for cleanup."],"null":["Java keyword","Means 'nothing here'. A variable that points to no object."],"var":["Java keyword","Let Java work out the type from the value on the right, so you don't have to write it."],"switch":["Java keyword","Choose one branch based on a value, like a menu: case A do this, case B do that."],"boolean":["Java type","A yes/no value: true or false."],"int":["Java type","A whole number like 5 or -3 (up to about 2 billion)."],"long":["Java type","A whole number that can be much bigger than int. Used for ids and times in milliseconds."],"double":["Java type","A number with a decimal point, like 99.5."],"String":["Java class","Text, for example \"hello\"."],"Object":["Java class","The parent of every class in Java. Object can hold anything."],"List":["Java class","An ordered collection of items, like a numbered shopping list. List<User> means a list of User objects."],"Map":["Java class","A lookup table of key → value pairs, like a dictionary: word → meaning."],"Set":["Java class","A collection with no duplicates."],"HashMap":["Java class","The everyday Map. Fast lookup by key, but not safe for many threads at once."],"ConcurrentHashMap":["Java class","A Map that many threads can read and write at the same time safely."],"CopyOnWriteArrayList":["Java class","A thread-safe list. Every change makes a fresh copy, so loops over it never break."],"Optional":["Java class","A box that may or may not contain a value. It forces you to handle the 'not found' case instead of getting a null surprise."],"UUID":["Java class","A random, practically unique id like 7f9c24e8-3b12-4d0a-..."],"Instant":["Java class","One exact moment in time (UTC)."],"Duration":["Java class","An amount of time, like 2 seconds or 10 minutes."],"LocalDate":["Java class","A calendar date without a time, like 2026-05-12."],"Supplier":["Java interface","A small function that takes nothing and gives back a value. Used to pass 'code to run later'."],"Consumer":["Java interface","A small function that takes a value and returns nothing, for example 'print this'."],"Runnable":["Java interface","A piece of code that can be run later, with no input and no output."],"Comparator":["Java interface","A rule that says which of two items comes first. Used for sorting."],"CompletableFuture":["Java class","A promise of a result that will arrive later, usually computed on another thread."],"ExecutorService":["Java class","A pool of worker threads. You give it tasks and it runs them."],"Executors":["Java class","A helper that creates ready-made thread pools."],"Semaphore":["Java class","A counter of permits. Only N threads can hold a permit at once; the rest are turned away or wait."],"AtomicLong":["Java class","A number that many threads can increase safely without locks."],"ThreadLocal":["Java class","A variable where each thread has its own separate value."],"ThreadLocalRandom":["Java class","A fast random-number generator for the current thread."],"Thread":["Java class","A separate line of work running at the same time as others."],"Collectors":["Java class","Helpers that turn a stream back into a List, Map, etc."],"stream":["Java method","Turns a collection into a pipeline where you can filter, map and collect items step by step."],"Override":["Java annotation","Marks a method that replaces a method from the parent class or interface. Java checks you spelled it right."],"@Override":["Java annotation","Marks a method that replaces a method from the parent class or interface. Java checks you spelled it right."],"@SpringBootApplication":["Spring annotation","The starting point of a Spring Boot app. It turns on auto-configuration and scans your package for beans."],"@Component":["Spring annotation","Tells Spring: create one object of this class and manage it for me (it becomes a 'bean')."],"@Service":["Spring annotation","Same as @Component, but the name says this class holds business logic."],"@Repository":["Spring annotation","Same as @Component, for classes that talk to the database. Spring also converts database errors into friendly Spring errors."],"@RestController":["Spring annotation","This class answers web (HTTP) requests and sends back data, usually JSON."],"@Configuration":["Spring annotation","This class contains setup code. Its @Bean methods create objects for Spring to manage."],"@Bean":["Spring annotation","The object returned by this method is handed to Spring, which keeps it and injects it wherever it is needed."],"@Autowired":["Spring annotation","Asks Spring to fill this in with the right bean. With a single constructor you don't need it."],"@Value":["Spring annotation","Reads a value from application.properties / yml, for example @Value(\"${shop.discount}\")."],"@Primary":["Spring annotation","If there are several beans of the same type, use this one by default."],"@Qualifier":["Spring annotation","Pick a specific bean by its name when there are several of the same type."],"@Scope":["Spring annotation","Controls how many objects Spring makes. Default is one (singleton); \"prototype\" means a new one every time."],"@RequestMapping":["Spring annotation","The base web address for all endpoints in this controller, like /orders."],"@GetMapping":["Spring annotation","This method answers HTTP GET requests (reading data) at this address."],"@PostMapping":["Spring annotation","This method answers HTTP POST requests (creating something) at this address."],"@PathVariable":["Spring annotation","Takes a value from the URL itself. In /orders/{id}, the {id} part."],"@RequestParam":["Spring annotation","Takes a value from the query string, like ?amount=500."],"@RequestBody":["Spring annotation","Turns the JSON sent by the client into a Java object."],"@RequestHeader":["Spring annotation","Reads an HTTP header sent by the client, like Idempotency-Key."],"@Header":["Spring annotation","Reads a header from a Kafka/messaging message."],"@Transactional":["Spring annotation","Run this method as one database transaction: if anything fails, all its database changes are undone together."],"@EventListener":["Spring annotation","Run this method whenever an event of this type is published inside the app."],"@TransactionalEventListener":["Spring annotation","Like @EventListener, but runs only after the database transaction has really committed."],"@Async":["Spring annotation","Run this method on a background thread so the caller doesn't wait."],"@EnableAsync":["Spring annotation","Switches on support for @Async in the app."],"@Order":["Spring annotation","Sets the order when several beans or listeners run for the same thing. Lower number runs first."],"@Cacheable":["Spring annotation","Remember the result. Next time with the same input, return the saved result without running the method."],"@CacheEvict":["Spring annotation","Remove a saved result from the cache, usually after the data changes."],"@EnableCaching":["Spring annotation","Switches on support for @Cacheable and friends."],"@Scheduled":["Spring annotation","Run this method automatically on a timer, like every 5 seconds or every night at 2 AM."],"@EnableScheduling":["Spring annotation","Switches on support for @Scheduled."],"@Aspect":["Spring annotation","This class adds extra behaviour (like logging or timing) around other methods without changing them."],"@Around":["Spring annotation","Run this code before and after the matching methods. pjp.proceed() calls the real method."],"@EnableEurekaServer":["Spring Cloud annotation","Turns this app into a service registry (the phone book other services register in)."],"@LoadBalanced":["Spring Cloud annotation","Lets this HTTP client call a service by name and spread calls over its instances."],"@FeignClient":["Spring Cloud annotation","Write an interface, and Spring creates the HTTP client that calls the other service for you."],"@KafkaListener":["Spring Kafka annotation","Run this method for every message that arrives on these Kafka topics."],"@RetryableTopic":["Spring Kafka annotation","If handling a message fails, retry it later through separate retry topics, then send it to the dead letter topic."],"@DltHandler":["Spring Kafka annotation","Runs for messages that ended up in the dead letter topic."],"@Retryable":["Spring Retry annotation","If this method throws one of these errors, call it again automatically."],"@Backoff":["Spring Retry annotation","How long to wait between retries, and how much longer each time."],"@Recover":["Spring Retry annotation","The backup method that runs when all retries have failed."],"@EnableRetry":["Spring Retry annotation","Switches on support for @Retryable."],"@CircuitBreaker":["Resilience4j annotation","Wraps the method in a circuit breaker: if calls keep failing, stop calling and use the fallback method."],"@Retry":["Resilience4j annotation","Retries the method using the settings with this name in application.yml."],"@Bulkhead":["Resilience4j annotation","Limits how many calls to this method can run at the same time."],"@RateLimiter":["Resilience4j annotation","Limits how many calls to this method are allowed per time period."],"@TimeLimiter":["Resilience4j annotation","Gives up if the method takes longer than the configured time."],"@SchedulerLock":["ShedLock annotation","Makes sure a @Scheduled job runs on only one server, even if you run many copies of the app."],"@Entity":["JPA annotation","This class is stored in a database table. Each object is one row."],"@Table":["JPA annotation","Sets the database table name (and extra rules like unique columns)."],"@Id":["JPA annotation","This field is the primary key: the unique id of each row."],"@GeneratedValue":["JPA annotation","Let the database create the id automatically (1, 2, 3...)."],"@Column":["JPA annotation","Settings for one column, for example unique = true."],"@Version":["JPA annotation","A number that goes up on every update. If two people update the same row at once, the second one gets an error instead of silently overwriting."],"@Lob":["JPA annotation","Store this as a large text/binary column, for long JSON etc."],"@Enumerated":["JPA annotation","Store an enum in the database, usually as its name like \"HELD\"."],"@UniqueConstraint":["JPA annotation","The database will reject two rows with the same values in these columns."],"@Query":["Spring Data annotation","Write your own query for a repository method instead of letting Spring guess from the name."],"@Param":["Spring Data annotation","Connects a method parameter to a :name placeholder in @Query."],"@EntityGraph":["Spring Data annotation","Load related data in the same query, to avoid the N+1 query problem."],"@Getter":["Lombok annotation","Lombok writes all the getX() methods for you."],"@Setter":["Lombok annotation","Lombok writes all the setX() methods for you."],"@Builder":["Lombok annotation","Lombok writes a builder so you can create objects with .builder().name(...).build()."],"@RequiredArgsConstructor":["Lombok annotation","Lombok writes a constructor for all final fields. Spring then uses it to inject dependencies."],"@NoArgsConstructor":["Lombok annotation","Lombok writes an empty constructor (JPA needs one)."],"@AllArgsConstructor":["Lombok annotation","Lombok writes a constructor that takes every field."],"@Slf4j":["Lombok annotation","Lombok adds a ready-to-use logger called log, so you can write log.info(...)."],"@Test":["JUnit annotation","This method is a test. The test runner runs it and reports pass or fail."],"@Mock":["Mockito annotation","Create a fake version of this class for the test. You decide what it returns."],"@ExtendWith":["JUnit annotation","Plug extra powers into the test class, here Mockito support."],"@JsonProperty":["Jackson annotation","The JSON field with this exact name goes into this Java field."],"@JsonIgnoreProperties":["Jackson annotation","Don't fail if the JSON has extra fields we don't know about."],"JpaRepository":["Spring Data","Extend this interface and Spring writes save, findById, findAll, delete and more for you."],"RestClient":["Spring class","A simple tool for calling other services over HTTP."],"WebClient":["Spring class","A non-blocking (reactive) tool for calling other services over HTTP."],"KafkaTemplate":["Spring Kafka","The tool you use to send messages to Kafka topics."],"JdbcTemplate":["Spring class","Run plain SQL easily without the heavy JPA layer."],"TransactionTemplate":["Spring class","Start a database transaction in code, when you can't use @Transactional."],"ApplicationEventPublisher":["Spring class","Sends an event inside the app so that @EventListener methods run."],"ResponseEntity":["Spring class","The full HTTP response: status code, headers and body."],"HttpStatus":["Spring class","Named HTTP status codes like CREATED (201) or CONFLICT (409)."],"DataSource":["Java class","The connection to the database (usually a pool of connections)."],"HikariDataSource":["Library class","A very fast pool of database connections; Spring Boot's default."],"AbstractRoutingDataSource":["Spring class","A DataSource that picks which real database to use for each call."],"ObjectMapper":["Jackson class","Converts Java objects to JSON text and back."],"MeterRegistry":["Micrometer class","Where you record metrics (counters, timers) that dashboards can read."],"Mono":["Reactor class","A reactive value that will arrive later: zero or one result."],"ServerWebExchange":["Spring class","The current request and response inside Spring Cloud Gateway."],"GlobalFilter":["Spring Cloud class","Code that runs for every request passing through the gateway."],"HandlerInterceptor":["Spring class","Code that runs before/after every controller call, like a security guard at the door."],"HttpServletRequest":["Java class","The incoming web request: URL, headers, client IP."],"ProceedingJoinPoint":["Spring AOP class","The method call being wrapped. proceed() runs the real method."],"ConsumerRecord":["Kafka class","One Kafka message with its key, value, topic and offset."]}}</script>
<script>
(function () {
  "use strict";
  var DATA = JSON.parse(document.getElementById("data").textContent);
  var TOPICS = DATA.topics, DAYS = DATA.days, PRIMER = DATA.primer, GLOSS = DATA.glossary;
  var BY = {}; TOPICS.forEach(function (t, i) { t.i = i; BY[t.id] = t; });
  var PRIO = { 1: "Priority 1 · Must understand", 2: "Priority 2 · Distributed", 3: "Priority 3 · Architecture and ops" };
  var STEPS = [
    { k: "u", label: "Understand it", text: function () { return "The problem it solves, when to use it, when not to."; } },
    { k: "b", label: "Build it", text: function (t) { return t.build; } },
    { k: "e", label: "Explain it", text: function (t) { return "Be ready to explain: " + t.trade + "."; } }
  ];
  var LS_KEY = "pattern-sprint-tracker-v1";
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) { return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }

  var ICON = {
    example: '<path d="M9 18h6M10 22h4"/><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V17h6v-.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/>',
    problem: '<path d="M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/><path d="M12 9v4M12 17h.01"/>',
    idea: '<circle cx="6" cy="6" r="2.5"/><circle cx="18" cy="18" r="2.5"/><path d="M8.5 6H15a3 3 0 0 1 0 6H9a3 3 0 0 0 0 6h6.5"/>',
    code: '<path d="M8 6l-6 6 6 6M16 6l6 6-6 6"/>',
    build: '<path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/>',
    when: '<circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.7 2.7L16 9.8"/>',
    compare: '<path d="M12 3v18M5 7l-3 6a4 4 0 0 0 6 0zM19 7l-3 6a4 4 0 0 0 6 0zM5 7h14"/>',
    explain: '<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/><path d="M8 9h8M8 13h5"/>',
    revision: '<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/><path d="M12 7v5l3 2"/>',
    "default": '<path d="M4 19.5V5a2 2 0 0 1 2-2h13v15H6a2 2 0 0 0-2 2z"/><path d="M8 7h7M8 11h5"/>'
  };
  function svg(path, extra) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"' + (extra || "") + '>' + path + '</svg>'; }
  var CHECK = svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>', ' stroke-width="3.2"');
  var ARROW_R = '<path d="M5 12h14M13 6l6 6-6 6"/>', ARROW_L = '<path d="M19 12H5M11 6l-6 6 6 6"/>';

  /* ---------- tracker state (shared with index.html) ---------- */
  function loadState() {
    try { var o = JSON.parse(localStorage.getItem(LS_KEY) || "null"); if (o && typeof o === "object") return { done: o.done || {}, start: o.start }; } catch (e) {}
    return { done: {} };
  }
  var state = loadState();
  function saveState() {
    try {
      var cur = JSON.parse(localStorage.getItem(LS_KEY) || "null") || {};
      cur.done = state.done; if (!cur.start && state.start) cur.start = state.start;
      localStorage.setItem(LS_KEY, JSON.stringify(cur));
    } catch (e) {}
  }
  function ticks(id) { return STEPS.filter(function (s) { return state.done[id + ":" + s.k]; }).length; }
  function ring(id) { var n = ticks(id); return '<span class="ring' + (n === 3 ? " full" : "") + '" style="--v:' + (n / 3) + '" aria-label="' + n + ' of 3 steps done" role="img"></span>'; }

  /* ---------- analogy snippets for cards ---------- */
  function analogy(t) {
    var m = /<section class="sec k-example"[^>]*>[\s\S]*?<div class="sec-body"><p>([\s\S]*?)<\/p>/.exec(t.html);
    if (!m) return "";
    var s = m[1].replace(/<[^>]+>/g, "").replace(/&amp;/g, "&").replace(/&quot;/g, '"').replace(/&#x27;|&#39;/g, "'");
    var cut = s.split(/(?<=[.!?])\s/)[0];
    return cut.length > 150 ? cut.slice(0, 147).replace(/\s\S*$/, "") + "…" : cut;
  }

  /* ---------- search + filter ---------- */
  var query = "", prio = 0;
  function matches(t) {
    if (prio && t.p !== prio) return false;
    if (!query) return true;
    var q = query.toLowerCase();
    return q.split(/\s+/).every(function (w) { return (t.n + " " + t.focus).toLowerCase().indexOf(w) >= 0 || t.text.indexOf(w) >= 0; });
  }

  /* ---------- sidebar ---------- */
  function renderNav() {
    var cur = currentRoute().id;
    var h = '<div class="side-top">';
    h += '<a class="nav-link" href="#/"' + (cur === "" ? ' aria-current="page"' : "") + '>' + svg('<path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>', ' class="nl-ico"') + '<span class="nl-text">All topics</span></a>';
    h += '<a class="nav-link" href="#/java-basics"' + (cur === "java-basics" ? ' aria-current="page"' : "") + '>' + svg('<path d="M12 3l9 5-9 5-9-5z"/><path d="M3 13l9 5 9-5"/>', ' class="nl-ico"') + '<span class="nl-text">New to Java? Start here</span></a>';
    h += '</div>';
    var any = false;
    DAYS.forEach(function (d) {
      var list = d.topics.map(function (id) { return BY[id]; }).filter(matches);
      if (!list.length) return;
      any = true;
      h += '<div class="nav-day"><h4><span>D' + d.n + '</span>' + esc(d.theme) + '</h4>';
      list.forEach(function (t) {
        h += '<a class="nav-link" href="#/' + t.id + '"' + (cur === t.id ? ' aria-current="page"' : "") + '>' + ring(t.id) + '<span class="nl-text">' + esc(t.n) + '</span><span class="pdot p' + t.p + '" title="' + esc(PRIO[t.p]) + '"></span></a>';
      });
      h += '</div>';
    });
    if (!any) h += '<p class="side-empty">No topic matches “' + esc(query) + '”. Try a simpler word like “retry” or “database”.</p>';
    $("nav").innerHTML = h;
  }

  /* ---------- routing ---------- */
  function currentRoute() {
    var h = decodeURIComponent(location.hash.replace(/^#\/?/, ""));
    var parts = h.split("/");
    return { id: parts[0] || "", sec: parts[1] || "" };
  }
  var lastId = null;
  function route() {
    var r = currentRoute();
    closeNav(); hidePop();
    if (r.sec && r.id === lastId) {
      var target = document.getElementById(r.sec);

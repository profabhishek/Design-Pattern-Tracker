ble-wrap\"><table>\n<thead>\n<tr>\n<th>Strategy<\/th>\n<th>State<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Caller/config chooses<\/strong> the algorithm<\/td>\n<td>The object <strong>changes its own state<\/strong> internally<\/td>\n<\/tr>\n<tr>\n<td>Strategies don't know each other<\/td>\n<td>States often move to the next state (e.g. <code>Created → Paid → Shipped<\/code>)<\/td>\n<\/tr>\n<tr>\n<td>Example: discount type<\/td>\n<td>Example: order status, traffic light<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Many versions of one algorithm<\/td>\n<td>Only 2 simple branches that will never grow<\/td>\n<\/tr>\n<tr>\n<td>You want to choose at runtime / from config<\/td>\n<td>The logic is tiny and adding classes is overkill<\/td>\n<\/tr>\n<tr>\n<td>You want to test each rule alone<\/td>\n<td><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Strategy vs if/else chains:<\/strong> Strategy follows Open/Closed – add a class instead of editing old code. Each class is small and testable.<\/li>\n<li><strong>Strategy vs State:<\/strong> see table above.<\/li>\n<li>In Spring, inject <code>Map&lt;String, Strategy&gt;<\/code> or <code>List&lt;Strategy&gt;<\/code> to auto-register all strategies.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>One interface, many implementations, chosen at runtime.<\/li>\n<li>Replaces growing <code>if/else<\/code> blocks.<\/li>\n<li><code>Comparator<\/code> is the classic Java example.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"how-does-it-work","t":"How does it work?","k":"idea"},{"id":"spring-boot-code-discount-chosen-from-config","t":"Spring Boot code – discount chosen from config","k":"code"},{"id":"strategy-vs-state-common-confusion","t":"Strategy vs State (common confusion)","k":"compare"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this going to college: you can go by bus, bike or cab . the goal is the same (reach college), only the way changes. you choose based on time, money or weather. each way is a \"strategy\". what problem does it solve? without strategy you get a long if/else : java copy double discount ( string type , double amount ) { if ( type . equals ( \"festival\" )) return amount * 0.20 ; else if ( type . equals ( \"new_user\" )) return amount * 0.10 ; else if ( type . equals ( \"premium\" )) return amount * 0.15 ; return 0 ; } every new discount means editing this method → risky, hard to test. strategy puts each rule in its own class. how does it work? create an interface, e.g. discountstrategy . write one class per algorithm. the main code (called the context ) holds a strategy and just calls it. spring boot code – discount chosen from config the interface and strategies java copy public interface discountstrategy { double apply ( double amount ); } @component ( \"festival\" ) public class festivaldiscount implements discountstrategy { public double apply ( double amount ) { return amount * 0.80 ; } } @component ( \"new_user\" ) public class newuserdiscount implements discountstrategy { public double apply ( double amount ) { return amount * 0.90 ; } } @component ( \"none\" ) public class nodiscount implements discountstrategy { public double apply ( double amount ) { return amount ; } } pick the strategy spring can inject a map<string, bean> where the key is the bean name . java copy @service public class checkoutservice { private final map < string , discountstrategy > strategies ; private final string defaultstrategy ; public checkoutservice ( map < string , discountstrategy > strategies , @value ( \"${shop.discount:none}\" ) string defaultstrategy ) { this . strategies = strategies ; this . defaultstrategy = defaultstrategy ; } public double finalprice ( double amount , string code ) { string key = ( code == null ) ? defaultstrategy : code ; discountstrategy s = strategies . getordefault ( key , strategies . get ( \"none\" )); return s . apply ( amount ); } } application.properties : application.properties copy shop.discount = festival change the property → behaviour changes, no code change. sorting strategy (plain java) comparator is a strategy you already use: java copy products . sort ( comparator . comparing ( product :: getprice )); // cheapest first products . sort ( comparator . comparing ( product :: getrating ). reversed ()); // best rated first strategy vs state (common confusion) strategy state caller/config chooses the algorithm the object changes its own state internally strategies don't know each other states often move to the next state (e.g. created → paid → shipped ) example: discount type example: order status, traffic light when to use / when not to use use it when avoid it when many versions of one algorithm only 2 simple branches that will never grow you want to choose at runtime / from config the logic is tiny and adding classes is overkill you want to test each rule alone points to explain in an interview strategy vs if/else chains: strategy follows open/closed – add a class instead of editing old code. each class is small and testable. strategy vs state: see table above. in spring, inject map<string, strategy> or list<strategy> to auto-register all strategies. quick revision one interface, many implementations, chosen at runtime. replaces growing if/else blocks. comparator is the classic java example."},{"id":"observer","n":"Observer","p":1,"focus":"Notify subscribers when state changes.","build":"Event emitter with subscribe, unsubscribe and notify.","trade":"memory leaks, ordering, sync vs async notification","day":2,"theme":"Behavioural and structural","title":"Observer","lede":"When something happens in one object, <strong>automatically tell<\/strong> all the objects that are interested.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p><strong>YouTube subscribe button.<\/strong> When a channel uploads a video, all subscribers get a notification. The channel doesn't need to know who each subscriber is personally – it just notifies everyone in the list. You can unsubscribe any time.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>After an order is placed you may need to: send an email, send an SMS, update stock, give reward points.<\/p>\n<p>Bad way:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">placeOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">o<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">emailService<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">smsService<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">inventoryService<\/span><span class=\"p\">.<\/span><span class=\"na\">reduce<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">rewardService<\/span><span class=\"p\">.<\/span><span class=\"na\">add<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span><span class=\"w\">     <\/span><span class=\"c1\">// OrderService knows about EVERYTHING<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Observer way: <code>OrderService<\/code> just says <strong>\"order placed!\"<\/strong> and the listeners react. OrderService doesn't know or care who is listening.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"terms\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Terms<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Subject / Publisher<\/strong> – the one that has news.<\/li>\n<li><strong>Observer / Subscriber / Listener<\/strong> – the ones who want the news.<\/li>\n<li><strong>subscribe, unsubscribe, notify<\/strong> – the three main actions.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-code\" id=\"plain-java-a-tiny-event-emitter\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Plain Java – a tiny event emitter<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">EventEmitter<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Consumer<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">listeners<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">CopyOnWriteArrayList<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Runnable<\/span><span class=\"w\"> <\/span><span class=\"nf\">subscribe<\/span><span class=\"p\">(<\/span><span class=\"n\">Consumer<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">listener<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">listeners<\/span><span class=\"p\">.<\/span><span class=\"na\">add<\/span><span class=\"p\">(<\/span><span class=\"n\">listener<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">listeners<\/span><span class=\"p\">.<\/span><span class=\"na\">remove<\/span><span class=\"p\">(<\/span><span class=\"n\">listener<\/span><span class=\"p\">);<\/span><span class=\"w\">      <\/span><span class=\"c1\">// returns an \"unsubscribe\" handle<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">unsubscribe<\/span><span class=\"p\">(<\/span><span class=\"n\">Consumer<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">listener<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">listeners<\/span><span class=\"p\">.<\/span><span class=\"na\">remove<\/span><span class=\"p\">(<\/span><span class=\"n\">listener<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">notifyAll<\/span><span class=\"p\">(<\/span><span class=\"n\">T<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Consumer<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">l<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">listeners<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">l<\/span><span class=\"p\">.<\/span><span class=\"na\">accept<\/span><span class=\"p\">(<\/span><span class=\"n\">event<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"n\">EventEmitter<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">channel<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">EventEmitter<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n<span class=\"n\">Runnable<\/span><span class=\"w\"> <\/span><span class=\"n\">unsub<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">channel<\/span><span class=\"p\">.<\/span><span class=\"na\">subscribe<\/span><span class=\"p\">(<\/span><span class=\"n\">v<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Ravi got: \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">v<\/span><span class=\"p\">));<\/span>\n<span class=\"n\">channel<\/span><span class=\"p\">.<\/span><span class=\"na\">subscribe<\/span><span class=\"p\">(<\/span><span class=\"n\">v<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Priya got: \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">v<\/span><span class=\"p\">));<\/span>\n\n<span class=\"n\">channel<\/span><span class=\"p\">.<\/span><span class=\"na\">notifyAll<\/span><span class=\"p\">(<\/span><span class=\"s\">\"New video: Java Streams\"<\/span><span class=\"p\">);<\/span>\n<span class=\"n\">unsub<\/span><span class=\"p\">.<\/span><span class=\"na\">run<\/span><span class=\"p\">();<\/span><span class=\"w\">                                     <\/span><span class=\"c1\">// Ravi unsubscribes<\/span>\n<span class=\"n\">channel<\/span><span class=\"p\">.<\/span><span class=\"na\">notifyAll<\/span><span class=\"p\">(<\/span><span class=\"s\">\"New video: Spring Boot\"<\/span><span class=\"p\">);<\/span><span class=\"w\">     <\/span><span class=\"c1\">// only Priya gets it<\/span><\/code><\/pre><\/figure>\n<p><code>CopyOnWriteArrayList<\/code> is used so a listener can unsubscribe while we are looping without errors.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-way-application-events\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot way – Application Events<\/span><\/h2><div class=\"sec-body\"><p>Spring has Observer built in.<\/p>\n<h3>The event<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">OrderPlacedEvent<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">total<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Publisher<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ApplicationEventPublisher<\/span><span class=\"w\"> <\/span><span class=\"n\">publisher<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">ApplicationEventPublisher<\/span><span class=\"w\"> <\/span><span class=\"n\">publisher<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">publisher<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">publisher<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">placeOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">total<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// ... save order<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">publisher<\/span><span class=\"p\">.<\/span><span class=\"na\">publishEvent<\/span><span class=\"p\">(<\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderPlacedEvent<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">total<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Listeners (observers)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">EmailListener<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@EventListener<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">onOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderPlacedEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Email sent to \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">email<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">RewardListener<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Order<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">)<\/span><span class=\"w\">                         <\/span><span class=\"c1\">// controls order between listeners<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@EventListener<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">onOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderPlacedEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Reward points added for order \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Async + only after the DB commit<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@SpringBootApplication<\/span>\n<span class=\"nd\">@EnableAsync<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ShopApplication<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">SmsListener<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Async<\/span><span class=\"w\">                                                     <\/span><span class=\"c1\">// runs in another thread<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@TransactionalEventListener<\/span><span class=\"p\">(<\/span><span class=\"n\">phase<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">TransactionPhase<\/span><span class=\"p\">.<\/span><span class=\"na\">AFTER_COMMIT<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"c1\">// only if order really saved<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">onOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderPlacedEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"SMS sent for order \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>One action should trigger many independent reactions<\/td>\n<td>The steps must happen in a strict order with results passed along<\/td>\n<\/tr>\n<tr>\n<td>You want to add new reactions without touching old code<\/td>\n<td>Debugging must be very simple (events make flow harder to follow)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Memory leaks:<\/strong> if listeners subscribe but never unsubscribe, the subject keeps them alive forever. Always unsubscribe (or use weak references). Spring beans live as long as the app, so this mostly matters in plain Java/UI code.<\/li>\n<li><strong>Ordering:<\/strong> by default listeners have no guaranteed order. Use <code>@Order<\/code> if needed, but better to design listeners so order doesn't matter.<\/li>\n<li><strong>Sync vs async:<\/strong> default Spring events are <strong>synchronous<\/strong> – same thread, and if a listener throws, the publisher sees the error. <code>@Async<\/code> makes it non-blocking but errors are no longer seen by the publisher.<\/li>\n<li>Observer inside one app vs messaging (Kafka/RabbitMQ) across services – same idea, bigger scale.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Subject notifies many observers.<\/li>\n<li>Spring: <code>ApplicationEventPublisher<\/code> + <code>@EventListener<\/code>.<\/li>\n<li>Watch out for leaks, order and sync/async.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"terms","t":"Terms","k":"idea"},{"id":"plain-java-a-tiny-event-emitter","t":"Plain Java – a tiny event emitter","k":"code"},{"id":"spring-boot-way-application-events","t":"Spring Boot way – Application Events","k":"code"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this youtube subscribe button. when a channel uploads a video, all subscribers get a notification. the channel doesn't need to know who each subscriber is personally – it just notifies everyone in the list. you can unsubscribe any time. what problem does it solve? after an order is placed you may need to: send an email, send an sms, update stock, give reward points. bad way: java copy public void placeorder ( order o ) { save ( o ); emailservice . send ( o ); smsservice . send ( o ); inventoryservice . reduce ( o ); rewardservice . add ( o ); // orderservice knows about everything } observer way: orderservice just says \"order placed!\" and the listeners react. orderservice doesn't know or care who is listening. terms subject / publisher – the one that has news. observer / subscriber / listener – the ones who want the news. subscribe, unsubscribe, notify – the three main actions. plain java – a tiny event emitter java copy public class eventemitter < t > { private final list < consumer < t >> listeners = new copyonwritearraylist <> (); public runnable subscribe ( consumer < t > listener ) { listeners . add ( listener ); return () -> listeners . remove ( listener ); // returns an \"unsubscribe\" handle } public void unsubscribe ( consumer < t > listener ) { listeners . remove ( listener ); } public void notifyall ( t event ) { for ( consumer < t > l : listeners ) l . accept ( event ); } } java copy eventemitter < string > channel = new eventemitter <> (); runnable unsub = channel . subscribe ( v -> system . out . println ( \"ravi got: \" + v )); channel . subscribe ( v -> system . out . println ( \"priya got: \" + v )); channel . notifyall ( \"new video: java streams\" ); unsub . run (); // ravi unsubscribes channel . notifyall ( \"new video: spring boot\" ); // only priya gets it copyonwritearraylist is used so a listener can unsubscribe while we are looping without errors. spring boot way – application events spring has observer built in. the event java copy public record orderplacedevent ( long orderid , string email , double total ) { } publisher java copy @service public class orderservice { private final applicationeventpublisher publisher ; public orderservice ( applicationeventpublisher publisher ) { this . publisher = publisher ; } @transactional public void placeorder ( long id , string email , double total ) { // ... save order publisher . publishevent ( new orderplacedevent ( id , email , total )); } } listeners (observers) java copy @component public class emaillistener { @eventlistener public void onorder ( orderplacedevent e ) { system . out . println ( \"email sent to \" + e . email ()); } } @component public class rewardlistener { @order ( 1 ) // controls order between listeners @eventlistener public void onorder ( orderplacedevent e ) { system . out . println ( \"reward points added for order \" + e . orderid ()); } } async + only after the db commit java copy @springbootapplication @enableasync public class shopapplication { } @component public class smslistener { @async // runs in another thread @transactionaleventlistener ( phase = transactionphase . after_commit ) // only if order really saved public void onorder ( orderplacedevent e ) { system . out . println ( \"sms sent for order \" + e . orderid ()); } } when to use / when not to use use it when avoid it when one action should trigger many independent reactions the steps must happen in a strict order with results passed along you want to add new reactions without touching old code debugging must be very simple (events make flow harder to follow) points to explain in an interview memory leaks: if listeners subscribe but never unsubscribe, the subject keeps them alive forever. always unsubscribe (or use weak references). spring beans live as long as the app, so this mostly matters in plain java/ui code. ordering: by default listeners have no guaranteed order. use @order if needed, but better to design listeners so order doesn't matter. sync vs async: default spring events are synchronous – same thread, and if a listener throws, the publisher sees the error. @async makes it non-blocking but errors are no longer seen by the publisher. observer inside one app vs messaging (kafka/rabbitmq) across services – same idea, bigger scale. quick revision subject notifies many observers. spring: applicationeventpublisher + @eventlistener . watch out for leaks, order and sync/async."},{"id":"proxy","n":"Proxy","p":1,"focus":"A stand-in that controls access to the real object.","build":"Caching or logging proxy around a service call.","trade":"proxy vs decorator vs adapter","day":2,"theme":"Behavioural and structural","title":"Proxy","lede":"A <strong>stand-in object<\/strong> that sits in front of the real object and controls access to it (add caching, logging, security, lazy loading...).","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>receptionist<\/strong> in an office. You don't walk directly to the manager. The receptionist checks who you are, notes your visit, maybe answers simple questions herself, and only sends you in when needed.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>You want extra behaviour around a service <strong>without changing the service code<\/strong>:<\/p>\n<ul>\n<li><strong>Caching proxy<\/strong> – return saved answer instead of calling a slow API again.<\/li>\n<li><strong>Logging proxy<\/strong> – log every call and its time.<\/li>\n<li><strong>Security proxy<\/strong> – check permission first.<\/li>\n<li><strong>Lazy (virtual) proxy<\/strong> – create the heavy object only when used.<\/li>\n<li><strong>Remote proxy<\/strong> – a local object that actually talks over the network.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-idea\" id=\"how-does-it-work\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How does it work?<\/span><\/h2><div class=\"sec-body\"><p>The proxy <strong>implements the same interface<\/strong> as the real object, holds a reference to the real object, and decides when/how to call it. The caller can't tell the difference.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"plain-java-caching-proxy\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Plain Java – caching proxy<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">WeatherService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">getWeather<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">city<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">RealWeatherService<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">WeatherService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">getWeather<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">city<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">sleep<\/span><span class=\"p\">(<\/span><span class=\"mi\">2000<\/span><span class=\"p\">);<\/span><span class=\"w\">                     <\/span><span class=\"c1\">// pretend this is a slow API<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">city<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\": 30°C\"<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CachingWeatherProxy<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">WeatherService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">WeatherService<\/span><span class=\"w\"> <\/span><span class=\"n\">real<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">cache<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ConcurrentHashMap<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">CachingWeatherProxy<\/span><span class=\"p\">(<\/span><span class=\"n\">WeatherService<\/span><span class=\"w\"> <\/span><span class=\"n\">real<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">real<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">real<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">getWeather<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">city<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">cache<\/span><span class=\"p\">.<\/span><span class=\"na\">computeIfAbsent<\/span><span class=\"p\">(<\/span><span class=\"n\">city<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">real<\/span><span class=\"p\">::<\/span><span class=\"n\">getWeather<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// call real only first time<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"n\">WeatherService<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">CachingWeatherProxy<\/span><span class=\"p\">(<\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">RealWeatherService<\/span><span class=\"p\">());<\/span>\n<span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">getWeather<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Delhi\"<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// slow (2 sec)<\/span>\n<span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">getWeather<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Delhi\"<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// instant (from cache)<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-spring-is-full-of-proxies\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – Spring is FULL of proxies<\/span><\/h2><div class=\"sec-body\"><p>When you put annotations like <code>@Transactional<\/code>, <code>@Cacheable<\/code>, <code>@Async<\/code>, Spring <strong>wraps your bean in a proxy<\/strong> at startup. The proxy does the extra work, then calls your real method.<\/p>\n<h3>Caching proxy with one annotation<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@SpringBootApplication<\/span>\n<span class=\"nd\">@EnableCaching<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">App<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ProductService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Cacheable<\/span><span class=\"p\">(<\/span><span class=\"s\">\"products\"<\/span><span class=\"p\">)<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// proxy checks cache first<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Product<\/span><span class=\"w\"> <\/span><span class=\"nf\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Hitting DB for \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@CacheEvict<\/span><span class=\"p\">(<\/span><span class=\"n\">value<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"products\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">key<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"#p.id\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Product<\/span><span class=\"w\"> <\/span><span class=\"nf\">update<\/span><span class=\"p\">(<\/span><span class=\"n\">Product<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Logging proxy with AOP<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Aspect<\/span>\n<span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">TimingAspect<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Around<\/span><span class=\"p\">(<\/span><span class=\"s\">\"execution(* com.shop.service..*(..))\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"w\"> <\/span><span class=\"nf\">time<\/span><span class=\"p\">(<\/span><span class=\"n\">ProceedingJoinPoint<\/span><span class=\"w\"> <\/span><span class=\"n\">pjp<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">throws<\/span><span class=\"w\"> <\/span><span class=\"n\">Throwable<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">start<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">currentTimeMillis<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">pjp<\/span><span class=\"p\">.<\/span><span class=\"na\">proceed<\/span><span class=\"p\">();<\/span><span class=\"w\">                         <\/span><span class=\"c1\">// call the real method<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">finally<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"n\">pjp<\/span><span class=\"p\">.<\/span><span class=\"na\">getSignature<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" took \"<\/span>\n<span class=\"w\">                    <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">currentTimeMillis<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"n\">start<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" ms\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>(Add <code>spring-boot-starter-aop<\/code> dependency.)<\/p>\n<h3>⚠️ Famous trap: self-invocation<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">a<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">b<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">          <\/span><span class=\"c1\">// calls b() directly, NOT through the proxy<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">b<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">           <\/span><span class=\"c1\">// transaction will NOT start when called from a()<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Because <code>a()<\/code> calls <code>this.b()<\/code>, the call never goes through the proxy. Fix: move <code>b()<\/code> to another bean, or call it from outside.<\/p>\n<p>Also: Spring proxies only work on <strong>public<\/strong> methods called from <strong>another bean<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-compare\" id=\"proxy-vs-decorator-vs-adapter\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Proxy vs Decorator vs Adapter<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Pattern<\/th>\n<th>Same interface?<\/th>\n<th>Main goal<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Proxy<\/strong><\/td>\n<td>Yes<\/td>\n<td><strong>Control access<\/strong> (cache, security, lazy, remote). Often creates/manages the real object.<\/td>\n<\/tr>\n<tr>\n<td><strong>Decorator<\/strong><\/td>\n<td>Yes<\/td>\n<td><strong>Add new behaviour/features<\/strong>, can stack many (e.g. <code>BufferedInputStream(new FileInputStream())<\/code>).<\/td>\n<\/tr>\n<tr>\n<td><strong>Adapter<\/strong><\/td>\n<td><strong>No<\/strong> – converts one interface to another<\/td>\n<td>Make two incompatible things work together (e.g. old XML API → new JSON interface).<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Honest note: Proxy and Decorator look almost the same in code. The difference is <strong>intent<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>You need cross-cutting things: cache, logs, security, transactions<\/td>\n<td>The extra logic is core business logic (put it in the service)<\/td>\n<\/tr>\n<tr>\n<td>You can't/shouldn't change the real class<\/td>\n<td>Too many layers make debugging hard<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Proxy = same interface, sits in front, controls access.<\/li>\n<li>Spring uses proxies for <code>@Transactional<\/code>, <code>@Cacheable<\/code>, <code>@Async<\/code>, AOP.<\/li>\n<li>Self-invocation skips the proxy!<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"how-does-it-work","t":"How does it work?","k":"idea"},{"id":"plain-java-caching-proxy","t":"Plain Java – caching proxy","k":"code"},{"id":"spring-boot-spring-is-full-of-proxies","t":"Spring Boot – Spring is FULL of proxies","k":"code"},{"id":"proxy-vs-decorator-vs-adapter","t":"Proxy vs Decorator vs Adapter","k":"compare"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a receptionist in an office. you don't walk directly to the manager. the receptionist checks who you are, notes your visit, maybe answers simple questions herself, and only sends you in when needed. what problem does it solve? you want extra behaviour around a service without changing the service code : caching proxy – return saved answer instead of calling a slow api again. logging proxy – log every call and its time. security proxy – check permission first. lazy (virtual) proxy – create the heavy object only when used. remote proxy – a local object that actually talks over the network. how does it work? the proxy implements the same interface as the real object, holds a reference to the real object, and decides when/how to call it. the caller can't tell the difference. plain java – caching proxy java copy public interface weatherservice { string getweather ( string city ); } public class realweatherservice implements weatherservice { public string getweather ( string city ) { sleep ( 2000 ); // pretend this is a slow api return city + \": 30°c\" ; } } public class cachingweatherproxy implements weatherservice { private final weatherservice real ; private final map < string , string > cache = new concurrenthashmap <> (); public cachingweatherproxy ( weatherservice real ) { this . real = real ; } public string getweather ( string city ) { return cache . computeifabsent ( city , real :: getweather ); // call real only first time } } java copy weatherservice service = new cachingweatherproxy ( new realweatherservice ()); service . getweather ( \"delhi\" ); // slow (2 sec) service . getweather ( \"delhi\" ); // instant (from cache) spring boot – spring is full of proxies when you put annotations like @transactional , @cacheable , @async , spring wraps your bean in a proxy at startup. the proxy does the extra work, then calls your real method. caching proxy with one annotation java copy @springbootapplication @enablecaching public class app { } @service public class productservice { @cacheable ( \"products\" ) // proxy checks cache first public product findbyid ( long id ) { system . out . println ( \"hitting db for \" + id ); return repo . findbyid ( id ). orelsethrow (); } @cacheevict ( value = \"products\" , key = \"#p.id\" ) public product update ( product p ) { return repo . save ( p ); } } logging proxy with aop java copy @aspect @component public class timingaspect { @around ( \"execution(* com.shop.service..*(..))\" ) public object time ( proceedingjoinpoint pjp ) throws throwable { long start = system . currenttimemillis (); try { return pjp . proceed (); // call the real method } finally { system . out . println ( pjp . getsignature () + \" took \" + ( system . currenttimemillis () - start ) + \" ms\" ); } } } (add spring-boot-starter-aop dependency.) ⚠️ famous trap: self-invocation java copy @service public class orderservice { public void a () { b (); } // calls b() directly, not through the proxy @transactional public void b () { ... } // transaction will not start when called from a() } because a() calls this.b() , the call never goes through the proxy. fix: move b() to another bean, or call it from outside. also: spring proxies only work on public methods called from another bean . proxy vs decorator vs adapter pattern same interface? main goal proxy yes control access (cache, security, lazy, remote). often creates/manages the real object. decorator yes add new behaviour/features , can stack many (e.g. bufferedinputstream(new fileinputstream()) ). adapter no – converts one interface to another make two incompatible things work together (e.g. old xml api → new json interface). honest note: proxy and decorator look almost the same in code. the difference is intent . when to use / when not to use use it when avoid it when you need cross-cutting things: cache, logs, security, transactions the extra logic is core business logic (put it in the service) you can't/shouldn't change the real class too many layers make debugging hard quick revision proxy = same interface, sits in front, controls access. spring uses proxies for @transactional , @cacheable , @async , aop. self-invocation skips the proxy!"},{"id":"di","n":"Dependency Injection","p":1,"focus":"Pass dependencies in instead of creating them inside.","build":"Refactor one class to constructor injection and test it with a mock.","trade":"constructor vs setter injection, DI vs service locator","day":3,"theme":"Wiring and data access","title":"Dependency Injection (DI)","lede":"Don't create the things your class needs <strong>inside<\/strong> it. <strong>Pass them in from outside<\/strong> (usually through the constructor).","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>mobile phone and its charger<\/strong>. The phone doesn't have a charger built in. You plug in any charger that fits the port (the interface). Tomorrow you can use a fast charger or a power bank – the phone doesn't change.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Without DI:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">EmailSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">GmailSender<\/span><span class=\"p\">();<\/span><span class=\"w\">   <\/span><span class=\"c1\">// tightly glued<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Problems:\n- You can't switch to <code>SmsSender<\/code> without changing <code>OrderService<\/code>.\n- In tests, it will really send emails! You can't put a fake.<\/p>\n<p>With DI:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">   <\/span><span class=\"c1\">// given from outside<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">sender<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Now anyone can give any <code>MessageSender<\/code> – real, fake, or mock.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"key-words\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Key words<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Dependency<\/strong> – something your class needs (a repo, a client, a sender).<\/li>\n<li><strong>Injection<\/strong> – giving it from outside.<\/li>\n<li><strong>IoC (Inversion of Control)<\/strong> – the framework (Spring) creates objects and wires them, not you.<\/li>\n<li><strong>IoC Container<\/strong> – Spring's <code>ApplicationContext<\/code>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">send<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"kd\">to<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">msg<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">EmailSender<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">send<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"kd\">to<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">msg<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Email to \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"kd\">to<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\": \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">msg<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"c1\">// Only one constructor → Spring uses it automatically, @Autowired not needed<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">repo<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">sender<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"nf\">place<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">o<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">sender<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">.<\/span><span class=\"na\">getEmail<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Order \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" placed!\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>With Lombok you can shorten it:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span><span class=\"w\">          <\/span><span class=\"c1\">// creates the constructor for all final fields<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>More than one implementation?<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Primary<\/span><span class=\"w\">          <\/span><span class=\"c1\">// used by default<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">EmailSender<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Component<\/span><span class=\"p\">(<\/span><span class=\"s\">\"sms\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">SmsSender<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">AlertService<\/span><span class=\"p\">(<\/span><span class=\"nd\">@Qualifier<\/span><span class=\"p\">(<\/span><span class=\"s\">\"sms\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">   <\/span><span class=\"c1\">// pick a specific one<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-refactor-and-test-with-a-mock\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – refactor and test with a mock<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@ExtendWith<\/span><span class=\"p\">(<\/span><span class=\"n\">MockitoExtension<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">class<\/span> <span class=\"nc\">OrderServiceTest<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Mock<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Mock<\/span><span class=\"w\"> <\/span><span class=\"n\">MessageSender<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Test<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">sendsMessageAfterSaving<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">o<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Order<\/span><span class=\"p\">(<\/span><span class=\"s\">\"ravi@mail.com\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">when<\/span><span class=\"p\">(<\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">)).<\/span><span class=\"na\">thenReturn<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">.<\/span><span class=\"na\">withId<\/span><span class=\"p\">(<\/span><span class=\"mi\">1L<\/span><span class=\"p\">));<\/span>\n\n<span class=\"w\">        <\/span><span class=\"n\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderService<\/span><span class=\"p\">(<\/span><span class=\"n\">repo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">sender<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// inject fakes<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">place<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"n\">verify<\/span><span class=\"p\">(<\/span><span class=\"n\">sender<\/span><span class=\"p\">).<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"s\">\"ravi@mail.com\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Order 1 placed!\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>No Spring, no database, no real email – the test is fast. This is the biggest benefit of DI.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"types-of-injection\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Types of injection<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>Code<\/th>\n<th>Opinion<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Constructor<\/strong> ✅<\/td>\n<td><code>public A(B b)<\/code><\/td>\n<td><strong>Best.<\/strong> Fields can be <code>final<\/code>, object is never half-ready, easy to test.<\/td>\n<\/tr>\n<tr>\n<td><strong>Setter<\/strong><\/td>\n<td><code>@Autowired void setB(B b)<\/code><\/td>\n<td>OK for <strong>optional<\/strong> dependencies.<\/td>\n<\/tr>\n<tr>\n<td><strong>Field<\/strong> ❌<\/td>\n<td><code>@Autowired private B b;<\/code><\/td>\n<td>Short but hides dependencies; can't make <code>final<\/code>; hard to test without Spring.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-compare\" id=\"di-vs-service-locator\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">DI vs Service Locator<\/span><\/h2><div class=\"sec-body\"><p><strong>Service Locator<\/strong> = your class asks a central registry: <code>Registry.get(MessageSender.class)<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>DI<\/th>\n<th>Service Locator<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Dependencies are visible in the constructor<\/td>\n<td>Dependencies are hidden inside methods<\/td>\n<\/tr>\n<tr>\n<td>Easy to test<\/td>\n<td>Need to set up the registry in tests<\/td>\n<\/tr>\n<tr>\n<td>Class doesn't know about the container<\/td>\n<td>Class depends on the locator<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><code>applicationContext.getBean(...)<\/code> inside your code is a service locator – avoid it in normal code.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Constructor vs setter injection (table above).<\/li>\n<li>Circular dependency: A needs B and B needs A. Constructor injection will fail at startup (good – it shows a design problem). Fix by redesigning, not by switching to field injection.<\/li>\n<li>DI makes code <strong>loosely coupled<\/strong> and <strong>testable<\/strong>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Pass dependencies in, don't <code>new<\/code> them inside.<\/li>\n<li>Prefer constructor injection with <code>final<\/code> fields.<\/li>\n<li>Spring's IoC container does the wiring for you.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"key-words","t":"Key words","k":"idea"},{"id":"spring-boot-code","

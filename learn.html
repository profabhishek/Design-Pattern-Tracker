an><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Leadership lost\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Scheduled<\/span><span class=\"p\">(<\/span><span class=\"n\">fixedDelay<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">5000<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">runOutboxPoller<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"o\">!<\/span><span class=\"n\">leader<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"p\">;<\/span><span class=\"w\">              <\/span><span class=\"c1\">// only the leader does the work<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Publishing outbox events...\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Other options: <code>spring-integration-zookeeper<\/code> (Zookeeper), <strong>Spring Cloud Kubernetes<\/strong> leader election (uses K8s ConfigMaps/Leases), Redis locks (Redisson).<\/p>\n<h3>Option B: just \"run scheduled job once\" – ShedLock<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Scheduled<\/span><span class=\"p\">(<\/span><span class=\"n\">cron<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"0 0 2 * * *\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@SchedulerLock<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"nightlyReport\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">lockAtMostFor<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"30m\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">lockAtLeastFor<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"1m\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">nightlyReport<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><span class=\"w\">      <\/span><span class=\"c1\">// only one instance runs it<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Split brain:<\/strong> two nodes both think they're leader (e.g. after a network split). Prevented by <strong>quorum<\/strong> – only the side with the majority can elect.<\/li>\n<li><strong>Quorum:<\/strong> with N nodes, need N/2 + 1 votes. Use <strong>odd<\/strong> numbers (3, 5) – 4 nodes tolerate the same 1 failure as 3.<\/li>\n<li><strong>Leases:<\/strong> leadership expires unless renewed. But a paused old leader (long GC pause) may still <em>think<\/em> it's leader → use <strong>fencing tokens<\/strong> (the term number): storage rejects writes with an old token.<\/li>\n<li>Raft terms, votes and heartbeats (walkthrough above).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Exactly one leader does special work.<\/li>\n<li>Raft: followers → candidate (term+1) → majority votes → leader → heartbeats.<\/li>\n<li>Avoid split brain: quorum, leases, fencing tokens.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"key-ideas","t":"Key ideas","k":"idea"},{"id":"build-task-walk-through-a-raft-election","t":"Build task – walk through a Raft election","k":"build"},{"id":"spring-boot-leader-election-you-can-actually-use","t":"Spring Boot – leader election you can actually use","k":"code"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a class monitor . only one student is monitor at a time. if the monitor is absent for many days, the class chooses a new one. if two students both think they are monitor, there's chaos – that's \"split brain\". what problem does it solve? you run 5 copies of your spring boot app. some jobs must run only once : - a nightly report / scheduled job ( @scheduled would run on all 5 !) - the outbox poller - writing to the primary database in a replicated system (raft, kafka controller, etc.) key ideas quorum (majority): with 5 nodes, a leader needs at least 3 votes. two groups can't both have a majority → only one leader. heartbeats: the leader keeps sending \"i'm alive\". if followers don't hear it for a while, they start an election. term / epoch: a number that increases with every election. old leaders with an old term are ignored. lease: leadership is valid only for a time (e.g. 10 s) and must be renewed. build task – walk through a raft election raft is a famous, easy-to-understand consensus algorithm (used in etcd, consul, kafka kraft). each node is follower , candidate , or leader . a raft election, step by step everyone is a follower (term 1) leader a sends regular heartbeats a crashes followers stop hearing heartbeats c's random timer fires first c becomes candidate, raises the term to 2, votes for itself and asks everyone: requestvote(term 2) nodes vote each node gives at most one vote per term, and only to a candidate whose log is at least as up to date c gets 3 of 5 votes a majority, so c is leader for term 2 c sends heartbeats the others stay followers old leader a comes back it sees term 2 > its term 1, so it quietly becomes a follower why random timeouts? so that usually only one node starts an election at a time; otherwise votes split and they retry. spring boot – leader election you can actually use you don't write raft yourself. use a shared store to elect a leader. option a: spring integration + database lock dependencies: spring-boot-starter-integration , spring-integration-jdbc . (create the int_lock table from spring integration's schema-*.sql script.) java copy @configuration public class leaderconfig { @bean public defaultlockrepository lockrepository ( datasource ds ) { defaultlockrepository repo = new defaultlockrepository ( ds ); repo . settimetolive ( 10_000 ); // lease 10 seconds return repo ; } @bean public jdbclockregistry lockregistry ( lockrepository repo ) { return new jdbclockregistry ( repo ); } @bean public lockregistryleaderinitiator leaderinitiator ( lockregistry registry ) { return new lockregistryleaderinitiator ( registry ); // keeps trying to become leader } } java copy @component @slf4j public class leaderonlyjobs { private volatile boolean leader = false ; @eventlistener public void ongranted ( ongrantedevent e ) { leader = true ; log . info ( \"i am the leader now\" ); } @eventlistener public void onrevoked ( onrevokedevent e ) { leader = false ; log . info ( \"leadership lost\" ); } @scheduled ( fixeddelay = 5000 ) public void runoutboxpoller () { if ( ! leader ) return ; // only the leader does the work log . info ( \"publishing outbox events...\" ); } } other options: spring-integration-zookeeper (zookeeper), spring cloud kubernetes leader election (uses k8s configmaps/leases), redis locks (redisson). option b: just \"run scheduled job once\" – shedlock java copy @scheduled ( cron = \"0 0 2 * * *\" ) @schedulerlock ( name = \"nightlyreport\" , lockatmostfor = \"30m\" , lockatleastfor = \"1m\" ) public void nightlyreport () { ... } // only one instance runs it points to explain in an interview split brain: two nodes both think they're leader (e.g. after a network split). prevented by quorum – only the side with the majority can elect. quorum: with n nodes, need n/2 + 1 votes. use odd numbers (3, 5) – 4 nodes tolerate the same 1 failure as 3. leases: leadership expires unless renewed. but a paused old leader (long gc pause) may still think it's leader → use fencing tokens (the term number): storage rejects writes with an old token. raft terms, votes and heartbeats (walkthrough above). quick revision exactly one leader does special work. raft: followers → candidate (term+1) → majority votes → leader → heartbeats. avoid split brain: quorum, leases, fencing tokens."},{"id":"eventsourcing","n":"Event Sourcing","p":2,"focus":"Store events, rebuild state by replaying them.","build":"Bank account rebuilt from events, then add a snapshot.","trade":"replay cost, snapshots, schema evolution","day":11,"theme":"Event sourcing and revision","title":"Event Sourcing","lede":"Don't store only the <strong>current state<\/strong>. Store <strong>every change as an event<\/strong>, and get the current state by <strong>replaying<\/strong> the events.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>Your <strong>bank passbook<\/strong>. It doesn't just say \"balance ₹5,000\". It lists every entry: +10,000 salary, −3,000 rent, −2,000 shopping. The balance is the sum of all entries. You can see the full history, and you can check the balance on any past date.<\/p><\/div><\/section>\n<section class=\"sec k-compare\" id=\"normal-way-vs-event-sourcing\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Normal way vs Event Sourcing<\/span><\/h2><div class=\"sec-body\"><p><strong>Normal (state-based):<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>account_id<\/th>\n<th>balance<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>5000<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>You lose <em>how<\/em> you got there.<\/p>\n<p><strong>Event sourcing:<\/strong><\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>seq<\/th>\n<th>account_id<\/th>\n<th>event<\/th>\n<th>amount<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>1<\/td>\n<td>AccountOpened<\/td>\n<td>0<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>1<\/td>\n<td>MoneyDeposited<\/td>\n<td>10000<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>1<\/td>\n<td>MoneyWithdrawn<\/td>\n<td>3000<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>1<\/td>\n<td>MoneyWithdrawn<\/td>\n<td>2000<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Balance = replay → 0 + 10000 − 3000 − 2000 = <strong>5000<\/strong>.<\/p>\n<p>Events are <strong>facts in the past tense<\/strong> and are <strong>never updated or deleted<\/strong> (append-only).<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"benefits\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Benefits<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Full <strong>audit trail<\/strong> (banks, payments, legal).<\/li>\n<li><strong>Time travel<\/strong>: \"what was the balance on 1st March?\"<\/li>\n<li>Fix bugs by replaying events with corrected code.<\/li>\n<li>Easy to publish events to other services; pairs well with <strong>CQRS<\/strong> (build many read models).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-bank-account-rebuilt-from-events\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – bank account rebuilt from events<\/span><\/h2><div class=\"sec-body\"><h3>Events<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">sealed<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">AccountEvent<\/span><span class=\"w\"> <\/span><span class=\"kd\">permits<\/span><span class=\"w\"> <\/span><span class=\"n\">AccountOpened<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">MoneyDeposited<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">MoneyWithdrawn<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">accountId<\/span><span class=\"p\">();<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">AccountOpened<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">accountId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">owner<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">AccountEvent<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">MoneyDeposited<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">accountId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">AccountEvent<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">MoneyWithdrawn<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">accountId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">AccountEvent<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Aggregate – state comes only from events<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">BankAccount<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">balance<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">version<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\">                      <\/span><span class=\"c1\">// how many events applied<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">AccountEvent<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">newEvents<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ArrayList<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n\n<span class=\"w\">    <\/span><span class=\"c1\">// rebuild from history<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"n\">BankAccount<\/span><span class=\"w\"> <\/span><span class=\"nf\">replay<\/span><span class=\"p\">(<\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">AccountEvent<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">history<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">BankAccount<\/span><span class=\"w\"> <\/span><span class=\"n\">acc<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">BankAccount<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">history<\/span><span class=\"p\">.<\/span><span class=\"na\">forEach<\/span><span class=\"p\">(<\/span><span class=\"n\">acc<\/span><span class=\"p\">::<\/span><span class=\"n\">apply<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">acc<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"c1\">// COMMANDS: check rules, then record an event<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">deposit<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;=<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalArgumentException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Amount must be positive\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">record<\/span><span class=\"err\">(<\/span><span class=\"nc\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">MoneyDeposited<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">withdraw<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">amount<\/span><span class=\"w\"> <\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">balance<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalStateException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Insufficient balance\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">record<\/span><span class=\"err\">(<\/span><span class=\"nc\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">MoneyWithdrawn<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><s <\/span><span class=\"p\">.<\/span><span class=\"na\">orElseGet<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">loadFromAllEvents<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">));<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>(<code>fromSnapshot<\/code> and <code>applyHistory<\/code> are small helper methods you add to <code>BankAccount<\/code>.)<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Replay cost:<\/strong> long event streams are slow → use <strong>snapshots<\/strong>.<\/li>\n<li><strong>Snapshots<\/strong> are just a cache; you can always rebuild from events.<\/li>\n<li><strong>Schema evolution:<\/strong> events are stored forever, but your classes change. Strategies: add only optional fields, version events (<code>MoneyDepositedV2<\/code>), and <strong>upcasters<\/strong> that convert old events to the new shape when reading.<\/li>\n<li>Querying (\"all accounts with balance &gt; 1L\") is hard on the event store → build <strong>read models with CQRS<\/strong>.<\/li>\n<li>Deleting personal data (GDPR) is hard in append-only stores → encrypt personal data per user and throw away the key (\"crypto shredding\").<\/li>\n<li>Tools: <strong>Axon Framework<\/strong>, <strong>EventStoreDB<\/strong>, or plain tables + Kafka.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Store events, not just state; state = replay.<\/li>\n<li>Append-only, past-tense facts.<\/li>\n<li>Snapshots for speed, upcasters for schema changes, CQRS for queries.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"normal-way-vs-event-sourcing","t":"Normal way vs Event Sourcing","k":"compare"},{"id":"benefits","t":"Benefits","k":"default"},{"id":"build-task-bank-account-rebuilt-from-events","t":"Build task – bank account rebuilt from events","k":"build"},{"id":"snapshots-add-this-when-events-grow","t":"Snapshots (add this when events grow)","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":6,"text":"think of it like this your bank passbook . it doesn't just say \"balance ₹5,000\". it lists every entry: +10,000 salary, −3,000 rent, −2,000 shopping. the balance is the sum of all entries. you can see the full history, and you can check the balance on any past date. normal way vs event sourcing normal (state-based): account_id balance 1 5000 you lose how you got there. event sourcing: seq account_id event amount 1 1 accountopened 0 2 1 moneydeposited 10000 3 1 moneywithdrawn 3000 4 1 moneywithdrawn 2000 balance = replay → 0 + 10000 − 3000 − 2000 = 5000 . events are facts in the past tense and are never updated or deleted (append-only). benefits full audit trail (banks, payments, legal). time travel : \"what was the balance on 1st march?\" fix bugs by replaying events with corrected code. easy to publish events to other services; pairs well with cqrs (build many read models). build task – bank account rebuilt from events events java copy public sealed interface accountevent permits accountopened , moneydeposited , moneywithdrawn { string accountid (); } public record accountopened ( string accountid , string owner ) implements accountevent { } public record moneydeposited ( string accountid , long amount ) implements accountevent { } public record moneywithdrawn ( string accountid , long amount ) implements accountevent { } aggregate – state comes only from events java copy public class bankaccount { private string id ; private long balance ; private int version = 0 ; // how many events applied private final list < accountevent > newevents = new arraylist <> (); // rebuild from history public static bankaccount replay ( list < accountevent > history ) { bankaccount acc = new bankaccount (); history . foreach ( acc :: apply ); return acc ; } // commands: check rules, then record an event public void deposit ( long amount ) { if ( amount <= 0 ) throw new illegalargumentexception ( \"amount must be positive\" ); record ( new moneydeposited ( id , amount )); } public void withdraw ( long amount ) { if ( amount > balance ) throw new illegalstateexception ( \"insufficient balance\" ); record ( new moneywithdrawn ( id , amount )); } private void record ( accountevent e ) { apply ( e ); newevents . add ( e ); } // apply: only changes state, no rules (so replay never fails) private void apply ( accountevent e ) { switch ( e ) { case accountopened o -> { this . id = o . accountid (); this . balance = 0 ; } case moneydeposited d -> this . balance += d . amount (); case moneywithdrawn w -> this . balance -= w . amount (); } version ++ ; } public long getbalance () { return balance ; } public int getversion () { return version ; } public list < accountevent > getnewevents () { return newevents ; } } event store (jpa table, append-only) java copy @entity @table ( name = \"account_events\" , uniqueconstraints = @uniqueconstraint ( columnnames = { \"accountid\" , \"version\" })) @getter @setter @noargsconstructor public class storedevent { @id @generatedvalue private long seq ; private string accountid ; private int version ; // unique per account → stops two writers at the same time private string type ; @lob private string payload ; // json private instant occurredat = instant . now (); } public interface storedeventrepo extends jparepository < storedevent , long > { list < storedevent > findbyaccountidorderbyversionasc ( string accountid ); list < storedevent > findbyaccountidandversiongreaterthanorderbyversionasc ( string id , int v ); } service java copy @service @requiredargsconstructor public class accountservice { private final storedeventrepo repo ; private final eventserializer serializer ; // json <-> accountevent (small helper with objectmapper) public bankaccount load ( string id ) { list < accountevent > history = repo . findbyaccountidorderbyversionasc ( id ) . stream (). map ( serializer :: fromstored ). tolist (); return bankaccount . replay ( history ); } @transactional public long withdraw ( string id , long amount ) { bankaccount acc = load ( id ); int expected = acc . getversion (); acc . withdraw ( amount ); save ( id , expected , acc . getnewevents ()); // unique (accountid, version) = optimistic lock return acc . getbalance (); } private void save ( string id , int fromversion , list < accountevent > events ) { int v = fromversion ; for ( accountevent e : events ) repo . save ( serializer . tostored ( id , ++ v , e )); } } snapshots (add this when events grow) an account with 100,000 events is slow to replay. every n events (say 100), save a snapshot of the state: java copy @entity @getter @setter public class accountsnapshot { @id private string accountid ; private long balance ; private int version ; // snapshot taken at this version } java copy public bankaccount load ( string id ) { return snapshots . findbyid ( id ) . map ( snap -> { bankaccount acc = bankaccount . fromsnapshot ( snap . getaccountid (), snap . getbalance (), snap . getversion ()); repo . findbyaccountidandversiongreaterthanorderbyversionasc ( id , snap . getversion ()) . foreach ( se -> acc . applyhistory ( serializer . fromstored ( se ))); // only newer events return acc ; }) . orelseget (() -> loadfromallevents ( id )); } ( fromsnapshot and applyhistory are small helper methods you add to bankaccount .) points to explain in an interview replay cost: long event streams are slow → use snapshots . snapshots are just a cache; you can always rebuild from events. schema evolution: events are stored forever, but your classes change. strategies: add only optional fields, version events ( moneydepositedv2 ), and upcasters that convert old events to the new shape when reading. querying (\"all accounts with balance > 1l\") is hard on the event store → build read models with cqrs . deleting personal data (gdpr) is hard in append-only stores → encrypt personal data per user and throw away the key (\"crypto shredding\"). tools: axon framework , eventstoredb , or plain tables + kafka. quick revision store events, not just state; state = replay. append-only, past-tense facts. snapshots for speed, upcasters for schema changes, cqrs for queries."},{"id":"strangler","n":"Strangler Fig","p":3,"focus":"Replace a legacy system one route at a time.","build":"Plan how one legacy endpoint moves behind a routing layer.","trade":"routing layer, data sync, when to cut over","day":12,"theme":"Migration patterns","title":"Strangler Fig","lede":"Replace an old (legacy) system <strong>slowly, one feature/route at a time<\/strong>, by putting a routing layer in front and sending more and more traffic to the new system until the old one can be switched off.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>strangler fig tree<\/strong> grows around an old tree. Slowly it covers it completely, and finally the old tree dies and only the new one stands. Or: renovating your house <strong>one room at a time<\/strong> while still living in it, instead of breaking the whole house.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>A \"big bang rewrite\" (stop everything, rewrite the whole app, switch in one day) is very risky:\n- takes years, business can't wait,\n- the new app misses hidden features of the old one,\n- switching day fails → huge outage.<\/p>\n<p>Strangler Fig gives <strong>small, safe, reversible<\/strong> steps.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"steps\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Steps<\/span><\/h2><div class=\"sec-body\"><ol>\n<li>Put a <strong>routing layer<\/strong> (API gateway / proxy) in front of the old system. At first it sends <strong>100%<\/strong> to legacy.<\/li>\n<li>Pick <strong>one<\/strong> small endpoint, e.g. <code>GET /products/{id}<\/code>. Build it in the new service.<\/li>\n<li>Route that endpoint to the new service (maybe 5% first, then 100%).<\/li>\n<li>Repeat for the next endpoint.<\/li>\n<li>When nothing goes to legacy any more → <strong>turn it off<\/strong>. 🎉<\/li>\n<\/ol>\n<figure class=\"dg\" role=\"img\" aria-label=\"The routing layer during migration: Client unchanged Routing layer API gateway / proxy /products/** NEW product-service already migrated /orders/** LEGACY monolith for now everything else LEGACY monolith Move one route at a time from the legacy box to a new service. When nothing goes to legacy any more, switch it off.\"><figcaption>The routing layer during migration<\/figcaption><div class=\"dg-body\"><div class=\"branch\"><div class=\"src\"><div class=\"node s-muted\"><b>Client<\/b><small>unchanged<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-accent\"><b>Routing layer<\/b><small>API gateway / proxy<\/small><\/div><\/div><div class=\"stub\"><\/div><div class=\"targets\"><div class=\"trow\"><div class=\"edge\"><span class=\"el\">/products/**<\/span><i><\/i><\/div><div class=\"node s-good\"><b>NEW product-service<\/b><small>already migrated<\/small><\/div><\/div><div class=\"trow\"><div class=\"edge\"><span class=\"el\">/orders/**<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>LEGACY monolith<\/b><small>for now<\/small><\/div><\/div><div class=\"trow\"><div class=\"edge\"><span class=\"el\">everything else<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>LEGACY monolith<\/b><\/div><\/div><\/div><\/div><p class=\"dg-note t-plain\">Move one route at a time from the legacy box to a new service. When nothing goes to legacy any more, switch it off.<\/p><\/div><\/figure><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-move-one-legacy-endpoint-behind-a-routing-layer\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – move one legacy endpoint behind a routing layer<\/span><\/h2><div class=\"sec-body\"><h3>Spring Cloud Gateway as the routing layer<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">spring<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">cloud<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">gateway<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">routes<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\"># 1. migrated route → new service (more specific, listed first)<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">products-new<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://product-service:8080<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Path=/products/**<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Method=GET<\/span>\n\n<span class=\"w\">        <\/span><span class=\"c1\"># 2. catch-all → legacy<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">legacy<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://legacy-monolith:9090<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Path=/**<\/span><\/code><\/pre><\/figure>\n<h3>Gradual cut-over with weights<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">products-new<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://product-service:8080<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Path=/products/**<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Weight=products, 10<\/span><span class=\"w\">        <\/span><span class=\"c1\"># 10% to new<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">products-old<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://legacy-monolith:9090<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Path=/products/**<\/span>\n<span class=\"w\">            <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Weight=products, 90<\/span><span class=\"w\">        <\/span><span class=\"c1\"># 90% to legacy<\/span><\/code><\/pre><\/figure>\n<p>Rollback = change 10 back to 0. No deploy of the services needed.<\/p>\n<h3>Feature-flag routing in a Spring app (alternative)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RestController<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ProductFacade<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">NewProductService<\/span><span class=\"w\"> <\/span><span class=\"n\">newService<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">LegacyProductClient<\/span><span class=\"w\"> <\/span><span class=\"n\">legacy<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Value<\/span><span class=\"p\">(<\/span><span class=\"s\">\"${migration.products.use-new:false}\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">boolean<\/span><span class=\"w\"> <\/span><span class=\"n\">useNew<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@GetMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/products/{id}\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">ProductDto<\/span><span class=\"w\"> <\/span><span class=\"nf\">get<\/span><span class=\"p\">(<\/span><span class=\"nd\">@PathVariable<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">useNew<\/span><span class=\"w\"> <\/span><span class=\"o\">?<\/span><span class=\"w\"> <\/span><span class=\"n\">newService<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">legacy<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"data-sync\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Data sync<\/span><\/h2><div class=\"sec-body\"><p>The hardest part. Both systems may need the same data during migration.<\/p>\n<ul>\n<li><strong>Phase 1:<\/strong> new service <strong>reads<\/strong> legacy DB (or a replica) – quick start.<\/li>\n<li><strong>Phase 2:<\/strong> new service has its own DB, kept in sync using <strong>CDC<\/strong> (Debezium) or events from legacy.<\/li>\n<li><strong>Phase 3:<\/strong> new service becomes the <strong>owner<\/strong>; legacy reads from it (or via an Anti-Corruption Layer).<\/li>\n<li>Avoid both systems <strong>writing<\/strong> the same data at the same time (conflicts).<\/li>\n<\/ul>\n<p><strong>Shadow testing / parallel run:<\/strong> send the same request to both, return legacy's answer, compare responses in logs. When they match for weeks → switch.<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-cut-over\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to cut over?<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>New endpoint has the same results (compare/shadow test) ✅<\/li>\n<li>Error rate and latency are fine on 5% → 25% → 100% traffic ✅<\/li>\n<li>Rollback plan tested ✅<\/li>\n<li>Then remove the legacy code for that endpoint, so you don't keep two versions forever.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Routing layer:<\/strong> gateway/proxy decides old vs new per route; keeps clients unchanged.<\/li>\n<li><strong>Data sync:<\/strong> CDC/events, single owner per data, shadow reads.<\/li>\n<li><strong>When to cut over:<\/strong> metrics + comparison + tested rollback.<\/li>\n<li>Risk: migration \"never finishes\" → set clear milestones and delete old paths.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Replace legacy piece by piece behind a router.<\/li>\n<li>Start with 100% legacy, move routes one by one.<\/li>\n<li>Handle data sync carefully; switch off legacy at the end.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"steps","t":"Steps","k":"idea"},{"id":"build-task-move-one-legacy-endpoint-behind-a-routing-layer","t":"Build task – move one legacy endpoint behind a routing layer","k":"build"},{"id":"data-sync","t":"Data sync","k":"default"},{"id":"when-to-cut-over","t":"When to cut over?","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a strangler fig tree grows around an old tree. slowly it covers it completely, and finally the old tree dies and only the new one stands. or: renovating your house one room at a time while still living in it, instead of breaking the whole house. what problem does it solve? a \"big bang rewrite\" (stop everything, rewrite the whole app, switch in one day) is very risky: - takes years, business can't wait, - the new app misses hidden features of the old one, - switching day fails → huge outage. strangler fig gives small, safe, reversible steps. steps put a routing layer (api gateway / proxy) in front of the old system. at first it sends 100% to legacy. pick one small endpoint, e.g. get /products/{id} . build it in the new service. route that endpoint to the new service (maybe 5% first, then 100%). repeat for the next endpoint. when nothing goes to legacy any more → turn it off . 🎉 the routing layer during migration client unchanged routing layer api gateway / proxy /products/** new product-service already migrated /orders/** legacy monolith for now everything else legacy monolith move one route at a time from the legacy box to a new service. when nothing goes to legacy any more, switch it off. build task – move one legacy endpoint behind a routing layer spring cloud gateway as the routing layer application.yml copy spring : cloud : gateway : routes : # 1. migrated route → new service (more specific, listed first) - id : products-new uri : http://product-service:8080 predicates : - path=/products/** - method=get # 2. catch-all → legacy - id : legacy uri : http://legacy-monolith:9090 predicates : - path=/** gradual cut-over with weights application.yml copy - id : products-new uri : http://product-service:8080 predicates : - path=/products/** - weight=products, 10 # 10% to new - id : products-old uri : http://legacy-monolith:9090 predicates : - path=/products/** - weight=products, 90 # 90% to legacy rollback = change 10 back to 0. no deploy of the services needed. feature-flag routing in a spring app (alternative) java copy @restcontroller @requiredargsconstructor public class productfacade { private final newproductservice newservice ; private final legacyproductclient legacy ; @value ( \"${migration.products.use-new:false}\" ) private boolean usenew ; @getmapping ( \"/products/{id}\" ) public productdto get ( @pathvariable long id ) { return usenew ? newservice . get ( id ) : legacy . get ( id ); } } data sync the hardest part. both systems may need the same data during migration. phase 1: new service reads legacy db (or a replica) – quick start. phase 2: new service has its own db, kept in sync using cdc (debezium) or events from legacy. phase 3: new service becomes the owner ; legacy reads from it (or via an anti-corruption layer). avoid both systems writing the same data at the same time (conflicts). shadow testing / parallel run: send the same request to both, return legacy's answer, compare responses in logs. when they match for weeks → switch. when to cut over? new endpoint has the same results (compare/shadow test) ✅ error rate and latency are fine on 5% → 25% → 100% traffic ✅ rollback plan tested ✅ then remove the legacy code for that endpoint, so you don't keep two versions forever. points to explain in an interview routing layer: gateway/proxy decides old vs new per route; keeps clients unchanged. data sync: cdc/events, single owner per data, shadow reads. when to cut over: metrics + comparison + tested rollback. risk: migration \"never finishes\" → set clear milestones and delete old paths. quick revision replace legacy piece by piece behind a router. start with 100% legacy, move routes one by one. handle data sync carefully; switch off legacy at the end."},{"id":"acl","n":"Anti-Corruption Layer","p":3,"focus":"Translate between a legacy model and a clean one.","build":"Adapter that maps a legacy model to your domain model.","trade":"who owns the translation layer, its cost","day":12,"theme":"Migration patterns","title":"Anti-Corruption Layer (ACL)","lede":"A <strong>translator layer<\/strong> between your clean new code and an old/external system, so the old system's messy model doesn't \"corrupt\" your design.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>translator<\/strong> at an international meeting. The Japanese delegate speaks Japanese, you speak English. The translator converts both ways. You don't have to learn Japanese, and your notes stay in English.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Legacy/external systems often have strange models:<\/p>\n<figure class=\"code\" data-lang=\"json\"><figcaption><span class=\"lang\">JSON<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"nt\">\"CUST_NO\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"000042\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nt\">\"NM_FST\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"RAVI\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nt\">\"NM_LST\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"KUMAR\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">\"STS_CD\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"A\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nt\">\"DOB\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"19990512\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nt\">\"ADDR_LN1\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"...\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nt\">\"FLG_VIP\"<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s2\">\"Y\"<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>If your new code uses this directly, your whole codebase fills up with <code>STS_CD == \"A\"<\/code> and date parsing everywhere. Later, changing the legacy system breaks everything.<\/p>\n<p>The ACL keeps <strong>legacy words outside<\/strong>, and your domain uses <strong>your own clean model<\/strong>:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Customer<\/span><span class=\"p\">(<\/span><span class=\"mi\">42L<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Ravi Kumar\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Status<\/span><span class=\"p\">.<\/span><span class=\"na\">ACTIVE<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">LocalDate<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">(<\/span><span class=\"mi\">1999<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">12<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">);<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"structure\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Structure<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"Where the Anti-Corruption Layer sits: Your domain CustomerService · LoanService uses clean Customer asks the port Anti-Corruption Layer CustomerGateway (port) LegacyCustomerAdapter CustomerTranslator old API call Legacy / external system old SOAP/REST API LegacyCustomerDto Legacy words like CUST_NO and STS_CD never cross into your domain. Only the ACL knows them.\"><figcaption>Where the Anti-Corruption Layer sits<\/figcaption><div class=\"dg-body\"><div class=\"flow\"><div class=\"node s-accent\"><b>Your domain<\/b><small>CustomerService · LoanService<\/small><small>uses clean <code>Customer<\/code><\/small><\/div><div class=\"edge\"><span class=\"el\">asks the port<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>Anti-Corruption Layer<\/b><small>CustomerGateway (port)<\/small><small>LegacyCustomerAdapter<\/small><small>CustomerTranslator<\/small><\/div><div class=\"edge\"><span class=\"el\">old API call<\/span><i><\/i><\/div><div class=\"node s-muted\"><b>Legacy / external system<\/b><small>old SOAP/REST API<\/small><small>LegacyCustomerDto<\/small><\/div><\/div><p class=\"dg-note t-plain\">Legacy words like <code>CUST_NO<\/code> and <code>STS_CD<\/code> never cross into your domain. Only the ACL knows them.<\/p><\/div><\/figure>\n<p>It uses <strong>Adapter<\/strong> + <strong>Facade<\/strong> + translation (mapper).<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-adapter-that-maps-a-legacy-model-to-your-domain-model\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – adapter that maps a legacy model to your domain model<\/span><\/h2><div class=\"sec-body\"><h3>Your clean domain<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">enum<\/span><span class=\"w\"> <\/span><span class=\"n\">CustomerStatus<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">ACTIVE<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">BLOCKED<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">CLOSED<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">Customer<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">fullName<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">CustomerStatus<\/span><span class=\"w\"> <\/span><span class=\"n\">status<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">                       <\/span><span class=\"n\">LocalDate<\/span><span class=\"w\"> <\/span><span class=\"n\">birthDate<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">boolean<\/span><span class=\"w\"> <\/span><span class=\"n\">vip<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"c1\">// the \"port\" – your domain only knows this interface<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">CustomerGateway<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Customer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Legacy DTO (lives ONLY inside the ACL package)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@JsonIgnoreProperties<\/span><span class=\"p\">(<\/span><span class=\"n\">ignoreUnknown<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">record<\/span> <span class=\"nc\">LegacyCustomerDto<\/span><span class=\"p\">(<\/span>\n<span class=\"w\">        <\/span><span class=\"nd\">@JsonProperty<\/span><span class=\"p\">(<\/span><span class=\"s\">\"CUST_NO\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">custNo<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">        <\/span><span class=\"nd\">@JsonProperty<\/span><span class=\"p\">(<\/span><span class=\"s\">\"NM_FST\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">firstName<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">        <\/span><span class=\"nd\">@JsonProperty<\/span><span class=\"p\">(<\/span><span class=\"s\">\"NM_LST\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">lastName<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">        <\/span><span class=\"nd\">@JsonProperty<\/span><span class=\"p\">(<\/span><span class=\"s\">\"STS_CD\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">statusCode<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">        <\/span><span class=\"nd\">@JsonProperty<\/span><span class=\"p\">(<\/span><span class=\"s\">\"DOB\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">dob<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">        <\/span><span class=\"nd\">@JsonProperty<\/span><span class=\"p\">(<\/span><span class=\"s\">\"FLG_VIP\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">vipFlag<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Translator<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"kd\">class<\/span> <span class=\"nc\">LegacyCustomerTranslator<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">DateTimeFormatter<\/span><span class=\"w\"> <\/span><span class=\"n\">DOB<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">DateTimeFormatter<\/span><span class=\"p\">.<\/span><span class=\"na\">ofPattern<\/span><span class=\"p\">(<\/span><span class=\"s\">\"yyyyMMdd\"<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">    <\/span><span class=\"n\">Customer<\/span><span class=\"w\"> <\/span><span class=\"nf\">toDomain<\/span><span class=\"p\">(<\/span><span class=\"n\">LegacyCustomerDto<\/span><span class=\"w\"> <\/span><span class=\"n\">d<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Customer<\/span><span class=\ span class=\"w\"> <\/span><span class=\"n\">legacyId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"p\">.<\/span><span class=\"na\">format<\/span><span class=\"p\">(<\/span><span class=\"s\">\"%06d\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span><span class=\"w\">  <\/span><span class=\"c1\">// legacy wants 6-digit, zero-padded ids<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">LegacyCustomerDto<\/span><span class=\"w\"> <\/span><span class=\"n\">dto<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">legacyClient<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">                    <\/span><span class=\"p\">.<\/span><span class=\"na\">uri<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/cust/inq?CUST_NO={id}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">legacyId<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                    <\/span><span class=\"p\">.<\/span><span class=\"na\">retrieve<\/span><span class=\"p\">().<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">LegacyCustomerDto<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">Optional<\/span><span class=\"p\">.<\/span><span class=\"na\">ofNullable<\/span><span class=\"p\">(<\/span><span class=\"n\">dto<\/span><span class=\"p\">).<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">translator<\/span><span class=\"p\">::<\/span><span class=\"n\">toDomain<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">HttpClientErrorException<\/span><span class=\"p\">.<\/span><span class=\"na\">NotFound<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">Optional<\/span><span class=\"p\">.<\/span><span class=\"na\">empty<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Your domain service – no legacy words at all<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">LoanService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">CustomerGateway<\/span><span class=\"w\"> <\/span><span class=\"n\">customers<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">boolean<\/span><span class=\"w\"> <\/span><span class=\"nf\">canApply<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">customerId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Customer<\/span><span class=\"w\"> <\/span><span class=\"n\">c<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">customers<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">customerId<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">c<\/span><span class=\"p\">.<\/span><span class=\"na\">status<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">CustomerStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">ACTIVE<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Tip: keep <code>LegacyCustomerDto<\/code>, translator and adapter <strong>package-private<\/strong> in a package like <code>com.shop.acl.legacycrm<\/code>, so nobody else can use the legacy model.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"who-owns-the-translation-layer-its-cost\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Who owns the translation layer? Its cost?<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Usually the <strong>team building the new system<\/strong> owns the ACL (they care about a clean model).<\/li>\n<li>It can be a package inside your service, or a <strong>separate small service<\/strong> if many teams use the same legacy system.<\/li>\n<li><strong>Cost:<\/strong> extra code, extra mapping tests, small latency; must be updated when legacy changes. But it's <strong>one place<\/strong> to change instead of everywhere.<\/li>\n<li>Often used together with <strong>Strangler Fig<\/strong> during migrations.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>ACL = translator between legacy model and your clean model.<\/li>\n<li>Adapter + translator, legacy classes stay hidden.<\/li>\n<li>Owned by the new team; costs extra code but protects your design.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"structure","t":"Structure","k":"default"},{"id":"build-task-adapter-that-maps-a-legacy-model-to-your-domain-model","t":"Build task – adapter that maps a legacy model to your domain model","k":"build"},{"id":"who-owns-the-translation-layer-its-cost","t":"Who owns the translation layer? Its cost?","k":"default"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this a translator at an international meeting. the japanese delegate speaks japanese, you speak english. the translator converts both ways. you don't have to learn japanese, and your notes stay in english. what problem does it solve? legacy/external systems often have strange models: json copy { \"cust_no\" : \"000042\" , \"nm_fst\" : \"ravi\" , \"nm_lst\" : \"kumar\" , \"sts_cd\" : \"a\" , \"dob\" : \"19990512\" , \"addr_ln1\" : \"...\" , \"flg_vip\" : \"y\" } if your new code uses this directly, your whole codebase fills up with sts_cd == \"a\" and date parsing everywhere. later, changing the legacy system breaks everything. the acl keeps legacy words outside , and your domain uses your own clean model : java copy new customer ( 42l , \"ravi kumar\" , status . active , localdate . of ( 1999 , 5 , 12 ), true ); structure where the anti-corruption layer sits your domain customerservice · loanservice uses clean customer asks the port anti-corruption layer customergateway (port) legacycustomeradapter customertranslator old api call legacy / external system old soap/rest api legacycustomerdto legacy words like cust_no and sts_cd never cross into your domain. only the acl knows them. it uses adapter + facade + translation (mapper). build task – adapter that maps a legacy model to your domain model your clean domain java copy public enum customerstatus { active , blocked , closed } public record customer ( long id , string fullname , customerstatus status , localdate birthdate , boolean vip ) { } // the \"port\" – your domain only knows this interface public interface customergateway { optional < customer > findbyid ( long id ); } legacy dto (lives only inside the acl package) java copy @jsonignoreproperties ( ignoreunknown = true ) record legacycustomerdto ( @jsonproperty ( \"cust_no\" ) string custno , @jsonproperty ( \"nm_fst\" ) string firstname , @jsonproperty ( \"nm_lst\" ) string lastname , @jsonproperty ( \"sts_cd\" ) string statuscode , @jsonproperty ( \"dob\" ) string dob , @jsonproperty ( \"flg_vip\" ) string vipflag ) { } translator java copy @component class legacycustomertranslator { private static final datetimeformatter dob = datetimeformatter . ofpattern ( \"yyyymmdd\" ); customer todomain ( legacycustomerdto d ) { return new customer ( long . parselong ( d . custno ()), // \"000042\" → 42 capitalize ( d . firstname ()) + \" \" + capitalize ( d . lastname ()), switch ( d . statuscode ()) { case \"a\" -> customerstatus . active ; case \"b\" -> customerstatus . blocked ; case \"c\" , \"x\" -> customerstatus . closed ; default -> throw new illegalargumentexception ( \"unknown status \" + d . statuscode ()); }, d . dob () == null || d . dob (). isblank () ? null : localdate . parse ( d . dob (), dob ), \"y\" . equalsignorecase ( d . vipflag ())); } private string capitalize ( string s ) { return s == null || s . isempty () ? \"\" : s . charat ( 0 ) + s . substring ( 1 ). tolowercase (); } } adapter (calls legacy, uses translator) java copy @component @requiredargsconstructor class legacycustomeradapter implements customergateway { private final restclient legacyclient ; // configured with legacy base url + timeouts private final legacycustomertranslator translator ; @override public optional < customer > findbyid ( long id ) { string legacyid = string . format ( \"%06d\" , id ); // legacy wants 6-digit, zero-padded ids try { legacycustomerdto dto = legacyclient . get () . uri ( \"/cust/inq?cust_no={id}\" , legacyid ) . retrieve (). body ( legacycustomerdto . class ); return optional . ofnullable ( dto ). map ( translator :: todomain ); } catch ( httpclienterrorexception . notfound e ) { return optional . empty (); } } } your domain service – no legacy words at all java copy @service @requiredargsconstructor public class loanservice { private final customergateway customers ; public boolean canapply ( long customerid ) { customer c = customers . findbyid ( customerid ). orelsethrow (); return c . status () == customerstatus . active ; } } tip: keep legacycustomerdto , translator and adapter package-private in a package like com.shop.acl.legacycrm , so nobody else can use the legacy model. who owns the translation layer? its cost? usually the team building the new system owns the acl (they care about a clean model). it can be a package inside your service, or a separate small service if many teams use the same legacy system. cost: extra code, extra mapping tests, small latency; must be updated when legacy changes. but it's one place to change instead of everywhere. often used together with strangler fig during migrations. quick revision acl = translator between legacy model and your clean model. adapter + translator, legacy classes stay hidden. owned by the new team; costs extra code but protects your design."},{"id":"sidecar","n":"Sidecar","p":3,"focus":"A helper process deployed beside the app.","build":"Sketch a logging or proxy sidecar next to one service.","trade":"latency overhead, lifecycle coupling, sidecar vs library","day":12,"theme":"Migration patterns","title":"Sidecar","lede":"Run a <strong>helper process next to your app<\/strong> (same machine / same Kubernetes pod) that handles common jobs like logging, proxying, security, so your app code doesn't have to.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>motorcycle with a sidecar<\/strong>. The bike (your app) does the main job – driving. The sidecar is attached, goes everywhere the bike goes, and carries extra stuff. It starts and stops with the bike.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Every service needs the same \"plumbing\":\n- collect and ship logs,\n- TLS / mTLS between services,\n- retries, metrics, tracing,\n- config reload, secrets fetching.<\/p>\n<p>If you write this in each app, in each language (Java, Go, Node), it's duplicated and inconsistent. A sidecar does it <strong>once<\/strong>, <strong>outside<\/strong> the app, for any language.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"picture-kubernetes-pod\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Picture (Kubernetes pod)<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"A sidecar inside one Kubernetes Pod: Spring Boot app :8080 · only business code localhost Sidecar Envoy · Fluent Bit mTLS · retries · logs Other services / log store The app and the sidecar live in the same Pod: they share localhost and folders, and start and stop together.\"><figcaption>A sidecar inside one Kubernetes Pod<\/figcaption><div class=\"dg-body\"><div class=\"flow\"><div class=\"node s-accent\"><b>Spring Boot app<\/b><small>:8080 · only business code<\/small><\/div><div class=\"edge\"><span class=\"el\">localhost<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>Sidecar<\/b><small>Envoy · Fluent Bit<\/small><\/div><div class=\"edge\"><span class=\"el\">mTLS · retries · logs<\/span><i><\/i><\/div><div class=\"node s-muted\"><b>Other services / log store<\/b><\/div><\/div><p class=\"dg-note t-plain\">The app and the sidecar live in the same Pod: they share localhost and folders, and start and stop together.<\/p><\/div><\/figure>\n<p>They share <strong>localhost<\/strong> and can share <strong>files<\/strong> (volumes).<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-a-logging-sidecar-next-to-one-service\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – a logging sidecar next to one service<\/span><\/h2><div class=\"sec-body\"><h3>Spring Boot app writes logs to a file<\/h3>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">logging.file.name<\/span><span class=\"o\">=<\/span><span class=\"s\">/var/log/app/app.log<\/span>\n<span class=\"na\">logging.structured.format.file<\/span><span class=\"o\">=<\/span><span class=\"s\">ecs           # Spring Boot 3.4+: JSON logs<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RestController<\/span>\n<span class=\"nd\">@Slf4j<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">HelloController<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@GetMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/hello\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">hello<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Hello endpoint called\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hello\"<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>The app knows <strong>nothing<\/strong> about Elasticsearch/Loki. It just writes a file.<\/p>\n<h3>Kubernetes pod with a Fluent Bit sidecar<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">apiVersion<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">v1<\/span>\n<span class=\"nt\">kind<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Pod<\/span>\n<span class=\"nt\">metadata<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">order-service<\/span>\n<span class=\"nt\">spec<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><spa

t":"Spring Boot code","k":"code"},{"id":"build-task-refactor-and-test-with-a-mock","t":"Build task – refactor and test with a mock","k":"build"},{"id":"types-of-injection","t":"Types of injection","k":"idea"},{"id":"di-vs-service-locator","t":"DI vs Service Locator","k":"compare"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a mobile phone and its charger . the phone doesn't have a charger built in. you plug in any charger that fits the port (the interface). tomorrow you can use a fast charger or a power bank – the phone doesn't change. what problem does it solve? without di: java copy public class orderservice { private final emailsender sender = new gmailsender (); // tightly glued } problems: - you can't switch to smssender without changing orderservice . - in tests, it will really send emails! you can't put a fake. with di: java copy public class orderservice { private final messagesender sender ; public orderservice ( messagesender sender ) { // given from outside this . sender = sender ; } } now anyone can give any messagesender – real, fake, or mock. key words dependency – something your class needs (a repo, a client, a sender). injection – giving it from outside. ioc (inversion of control) – the framework (spring) creates objects and wires them, not you. ioc container – spring's applicationcontext . spring boot code java copy public interface messagesender { void send ( string to , string msg ); } @component public class emailsender implements messagesender { public void send ( string to , string msg ) { system . out . println ( \"email to \" + to + \": \" + msg ); } } @service public class orderservice { private final orderrepository repo ; private final messagesender sender ; // only one constructor → spring uses it automatically, @autowired not needed public orderservice ( orderrepository repo , messagesender sender ) { this . repo = repo ; this . sender = sender ; } public order place ( order o ) { order saved = repo . save ( o ); sender . send ( o . getemail (), \"order \" + saved . getid () + \" placed!\" ); return saved ; } } with lombok you can shorten it: java copy @service @requiredargsconstructor // creates the constructor for all final fields public class orderservice { private final orderrepository repo ; private final messagesender sender ; } more than one implementation? java copy @component @primary // used by default public class emailsender implements messagesender { ... } @component ( \"sms\" ) public class smssender implements messagesender { ... } public alertservice ( @qualifier ( \"sms\" ) messagesender sender ) { ... } // pick a specific one build task – refactor and test with a mock java copy @extendwith ( mockitoextension . class ) class orderservicetest { @mock orderrepository repo ; @mock messagesender sender ; @test void sendsmessageaftersaving () { order o = new order ( \"ravi@mail.com\" ); when ( repo . save ( o )). thenreturn ( o . withid ( 1l )); orderservice service = new orderservice ( repo , sender ); // inject fakes service . place ( o ); verify ( sender ). send ( \"ravi@mail.com\" , \"order 1 placed!\" ); } } no spring, no database, no real email – the test is fast. this is the biggest benefit of di. types of injection type code opinion constructor ✅ public a(b b) best. fields can be final , object is never half-ready, easy to test. setter @autowired void setb(b b) ok for optional dependencies. field ❌ @autowired private b b; short but hides dependencies; can't make final ; hard to test without spring. di vs service locator service locator = your class asks a central registry: registry.get(messagesender.class) . di service locator dependencies are visible in the constructor dependencies are hidden inside methods easy to test need to set up the registry in tests class doesn't know about the container class depends on the locator applicationcontext.getbean(...) inside your code is a service locator – avoid it in normal code. points to explain in an interview constructor vs setter injection (table above). circular dependency: a needs b and b needs a. constructor injection will fail at startup (good – it shows a design problem). fix by redesigning, not by switching to field injection. di makes code loosely coupled and testable . quick revision pass dependencies in, don't new them inside. prefer constructor injection with final fields. spring's ioc container does the wiring for you."},{"id":"repository","n":"Repository","p":1,"focus":"Data access behind a collection-like interface.","build":"UserRepository with an in-memory and a database version.","trade":"repository vs DAO, leaky abstractions","day":3,"theme":"Wiring and data access","title":"Repository","lede":"Hide all database code behind a simple interface that feels like a <strong>collection of objects<\/strong> – <code>save<\/code>, <code>findById<\/code>, <code>findAll<\/code>, <code>delete<\/code>.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>library desk<\/strong>. You ask \"give me the book with ID 42\". You don't care whether the book is on shelf 3, in the store room, or in another branch. The librarian (repository) finds it.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>If SQL is written inside your service classes:\n- Business logic and database logic get mixed.\n- Changing the database (MySQL → MongoDB) means changing services.\n- Testing services needs a real database.<\/p>\n<p>The repository keeps the service clean: the service says <em>what<\/em> it wants; the repository knows <em>how<\/em> to get it.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-in-memory-version-and-database-version\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – in-memory version AND database version<\/span><\/h2><div class=\"sec-body\"><h3>The interface (the contract)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">UserRepository<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"nf\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"n\">user<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findByEmail<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findAll<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">deleteById<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Version 1: In-memory (great for tests and demos)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">InMemoryUserRepository<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">UserRepository<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Long<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">store<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ConcurrentHashMap<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">AtomicLong<\/span><span class=\"w\"> <\/span><span class=\"n\">ids<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">AtomicLong<\/span><span class=\"p\">();<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"nf\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">setId<\/span><span class=\"p\">(<\/span><span class=\"n\">ids<\/span><span class=\"p\">.<\/span><span class=\"na\">incrementAndGet<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">store<\/span><span class=\"p\">.<\/span><span class=\"na\">put<\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">Optional<\/span><span class=\"p\">.<\/span><span class=\"na\">ofNullable<\/span><span class=\"p\">(<\/span><span class=\"n\">store<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">));<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findByEmail<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">store<\/span><span class=\"p\">.<\/span><span class=\"na\">values<\/span><span class=\"p\">().<\/span><span class=\"na\">stream<\/span><span class=\"p\">().<\/span><span class=\"na\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">getEmail<\/span><span class=\"p\">().<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"n\">email<\/span><span class=\"p\">)).<\/span><span class=\"na\">findFirst<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findAll<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ArrayList<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">(<\/span><span class=\"n\">store<\/span><span class=\"p\">.<\/span><span class=\"na\">values<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">deleteById<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">store<\/span><span class=\"p\">.<\/span><span class=\"na\">remove<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Version 2: Database with Spring Data JPA<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Entity<\/span>\n<span class=\"nd\">@Table<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"users\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@Getter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Setter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@NoArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">User<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Id<\/span><span class=\"w\"> <\/span><span class=\"nd\">@GeneratedValue<\/span><span class=\"p\">(<\/span><span class=\"n\">strategy<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">GenerationType<\/span><span class=\"p\">.<\/span><span class=\"na\">IDENTITY<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Column<\/span><span class=\"p\">(<\/span><span class=\"n\">unique<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">JpaUserRepository<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">JpaRepository<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Optional<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findByEmail<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">);<\/span><span class=\"w\">          <\/span><span class=\"c1\">// Spring writes the SQL from the method name!<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findByNameContainingIgnoreCase<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">part<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Query<\/span><span class=\"p\">(<\/span><span class=\"s\">\"select u from User u where u.email like %:domain\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">User<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findByEmailDomain<\/span><span class=\"p\">(<\/span><span class=\"nd\">@Param<\/span><span class=\"p\">(<\/span><span class=\"s\">\"domain\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">domain<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>You don't write any implementation – Spring Data creates it at startup.<\/p>\n<h3>The service only sees the repository<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">UserService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">JpaUserRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"nf\">register<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">email<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findByEmail<\/span><span class=\"p\">(<\/span><span class=\"n\">email<\/span><span class=\"p\">).<\/span><span class=\"na\">ifPresent<\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalStateException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Email already used\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">});<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"n\">u<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">setName<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">u<\/span><span class=\"p\">.<\/span><span class=\"na\">setEmail<\/span><span class=\"p\">(<\/span><span class=\"n\">email<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">u<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p><code>application.properties<\/code> (H2 in-memory DB for practice):<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">spring.datasource.url<\/span><span class=\"o\">=<\/span><span class=\"s\">jdbc:h2:mem:shop<\/span>\n<span class=\"na\">spring.jpa.hibernate.ddl-auto<\/span><span class=\"o\">=<\/span><span class=\"s\">update<\/span>\n<span class=\"na\">spring.h2.console.enabled<\/span><span class=\"o\">=<\/span><span class=\"s\">true<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-compare\" id=\"repository-vs-dao\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Repository vs DAO<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Repository<\/th>\n<th>DAO (Data Access Object)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Thinks in <strong>domain objects<\/strong> (\"collection of Users\")<\/td>\n<td>Thinks in <strong>tables/rows<\/strong> (\"user table operations\")<\/td>\n<\/tr>\n<tr>\n<td>Part of the domain layer (DDD idea)<\/td>\n<td>Part of the persistence layer<\/td>\n<\/tr>\n<tr>\n<td>Methods like <code>findActiveCustomers()<\/code><\/td>\n<td>Methods like <code>insertUser()<\/code>, <code>updateUserRow()<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>In practice the two words are often used for the same thing. Spring's <code>@Repository<\/code> also turns database exceptions into Spring's <code>DataAccessException<\/code>.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"leaky-abstractions-trade-off\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Leaky abstractions (trade-off)<\/span><\/h2><div class=\"sec-body\"><p>A repository <em>pretends<\/em> to be a simple collection, but the database leaks through:\n- <strong>N+1 query problem:<\/strong> loading 100 orders, then each order's items one by one = 101 queries. Fix with <code>@EntityGraph<\/code> or <code>join fetch<\/code>.\n- <strong>Lazy loading errors:<\/strong> <code>LazyInitializationException<\/code> when you touch a relation after the transaction ends.\n- <strong>Performance:<\/strong> <code>findAll()<\/code> on a table with 10 million rows will kill memory – use paging: <code>findAll(PageRequest.of(0, 20))<\/code>.<\/p>\n<p>So you still need to know what SQL runs. Turn on <code>spring.jpa.show-sql=true<\/code> while learning.<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Use it when<\/th>\n<th>Avoid it when<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Almost every app with a database<\/td>\n<td>Very complex reporting queries – use plain SQL / <code>JdbcTemplate<\/code> / a separate read model<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Repository = collection-like interface for data.<\/li>\n<li>Spring Data JPA generates it from method names.<\/li>\n<li>Know the leaks: N+1, lazy loading, big <code>findAll<\/code>.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"build-task-in-memory-version-and-database-version","t":"Build task – in-memory version AND database version","k":"build"},{"id":"repository-vs-dao","t":"Repository vs DAO","k":"compare"},{"id":"leaky-abstractions-trade-off","t":"Leaky abstractions (trade-off)","k":"explain"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a library desk . you ask \"give me the book with id 42\". you don't care whether the book is on shelf 3, in the store room, or in another branch. the librarian (repository) finds it. what problem does it solve? if sql is written inside your service classes: - business logic and database logic get mixed. - changing the database (mysql → mongodb) means changing services. - testing services needs a real database. the repository keeps the service clean: the service says what it wants; the repository knows how to get it. build task – in-memory version and database version the interface (the contract) java copy public interface userrepository { user save ( user user ); optional < user > findbyid ( long id ); optional < user > findbyemail ( string email ); list < user > findall (); void deletebyid ( long id ); } version 1: in-memory (great for tests and demos) java copy public class inmemoryuserrepository implements userrepository { private final map < long , user > store = new concurrenthashmap <> (); private final atomiclong ids = new atomiclong (); public user save ( user u ) { if ( u . getid () == null ) u . setid ( ids . incrementandget ()); store . put ( u . getid (), u ); return u ; } public optional < user > findbyid ( long id ) { return optional . ofnullable ( store . get ( id )); } public optional < user > findbyemail ( string email ) { return store . values (). stream (). filter ( u -> u . getemail (). equals ( email )). findfirst (); } public list < user > findall () { return new arraylist <> ( store . values ()); } public void deletebyid ( long id ) { store . remove ( id ); } } version 2: database with spring data jpa java copy @entity @table ( name = \"users\" ) @getter @setter @noargsconstructor public class user { @id @generatedvalue ( strategy = generationtype . identity ) private long id ; private string name ; @column ( unique = true ) private string email ; } java copy public interface jpauserrepository extends jparepository < user , long > { optional < user > findbyemail ( string email ); // spring writes the sql from the method name! list < user > findbynamecontainingignorecase ( string part ); @query ( \"select u from user u where u.email like %:domain\" ) list < user > findbyemaildomain ( @param ( \"domain\" ) string domain ); } you don't write any implementation – spring data creates it at startup. the service only sees the repository java copy @service @requiredargsconstructor public class userservice { private final jpauserrepository repo ; public user register ( string name , string email ) { repo . findbyemail ( email ). ifpresent ( u -> { throw new illegalstateexception ( \"email already used\" ); }); user u = new user (); u . setname ( name ); u . setemail ( email ); return repo . save ( u ); } } application.properties (h2 in-memory db for practice): application.properties copy spring.datasource.url = jdbc:h2:mem:shop spring.jpa.hibernate.ddl-auto = update spring.h2.console.enabled = true repository vs dao repository dao (data access object) thinks in domain objects (\"collection of users\") thinks in tables/rows (\"user table operations\") part of the domain layer (ddd idea) part of the persistence layer methods like findactivecustomers() methods like insertuser() , updateuserrow() in practice the two words are often used for the same thing. spring's @repository also turns database exceptions into spring's dataaccessexception . leaky abstractions (trade-off) a repository pretends to be a simple collection, but the database leaks through: - n+1 query problem: loading 100 orders, then each order's items one by one = 101 queries. fix with @entitygraph or join fetch . - lazy loading errors: lazyinitializationexception when you touch a relation after the transaction ends. - performance: findall() on a table with 10 million rows will kill memory – use paging: findall(pagerequest.of(0, 20)) . so you still need to know what sql runs. turn on spring.jpa.show-sql=true while learning. when to use / when not to use use it when avoid it when almost every app with a database very complex reporting queries – use plain sql / jdbctemplate / a separate read model quick revision repository = collection-like interface for data. spring data jpa generates it from method names. know the leaks: n+1, lazy loading, big findall ."},{"id":"retry","n":"Retry","p":1,"focus":"Retry transient failures without causing a storm.","build":"Exponential backoff with jitter and a max attempt cap.","trade":"retry only idempotent calls, retry storms","day":4,"theme":"Resilience basics","title":"Retry","lede":"If a call fails because of a <strong>temporary<\/strong> problem, wait a little and <strong>try again<\/strong> – but carefully, so you don't make things worse.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>You call a friend and the line is busy. You don't call 100 times in one second. You wait 1 minute, then 2 minutes, then 5 minutes. And after a few tries you give up and send a message instead.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>In distributed systems, many failures are <strong>transient<\/strong> (short-lived):\n- network blip\n- service restarting\n- database deadlock\n- HTTP 503 / 429 (too many requests)<\/p>\n<p>Simply retrying often works. But <strong>bad retries cause a \"retry storm\"<\/strong> – thousands of clients retrying together and crushing the server that is trying to recover.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"the-three-rules-of-good-retry\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">The three rules of good retry<\/span><\/h2><div class=\"sec-body\"><ol>\n<li><strong>Exponential backoff<\/strong> – wait longer each time: 100 ms → 200 ms → 400 ms → 800 ms.<\/li>\n<li><strong>Jitter<\/strong> – add randomness, so all clients don't retry at the same moment.<\/li>\n<li><strong>Max attempts cap<\/strong> – stop after N tries (e.g. 3–5) and fail properly.<\/li>\n<\/ol>\n<p>Also: <strong>only retry what is safe to retry<\/strong> (see idempotency below), and only retry <em>transient<\/em> errors (not 400 Bad Request or 404).<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"plain-java-backoff-with-jitter\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Plain Java – backoff with jitter<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">RetryHelper<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">T<\/span><span class=\"w\"> <\/span><span class=\"nf\">retry<\/span><span class=\"p\">(<\/span><span class=\"n\">Supplier<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">T<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">call<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">maxAttempts<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">baseDelayMs<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">RuntimeException<\/span><span class=\"w\"> <\/span><span class=\"n\">last<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">attempt<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">attempt<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;=<\/span><span class=\"w\"> <\/span><span class=\"n\">maxAttempts<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"n\">attempt<\/span><span class=\"o\">++<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">call<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">RuntimeException<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">last<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">attempt<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">maxAttempts<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">                <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">expo<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">baseDelayMs<\/span><span class=\"w\"> <\/span><span class=\"o\">*<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"mi\">1L<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;&lt;<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">attempt<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">));<\/span><span class=\"w\">          <\/span><span class=\"c1\">// 100, 200, 400...<\/span>\n<span class=\"w\">                <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">sleep<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">ThreadLocalRandom<\/span><span class=\"p\">.<\/span><span class=\"na\">current<\/span><span class=\"p\">().<\/span><span class=\"na\">nextLong<\/span><span class=\"p\">(<\/span><span class=\"n\">expo<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"c1\">// \"full jitter\": 0..expo<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">out<\/span><span class=\"p\">.<\/span><span class=\"na\">println<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Attempt \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">attempt<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" failed, waiting \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">sleep<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"s\">\" ms\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/s <\/span><span class=\"p\">.<\/span><span class=\"na\">getStatus<\/span><span class=\"p\">(<\/span><span class=\"s\">\"TX1\"<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"mi\">4<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">100<\/span><span class=\"p\">);<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-way-1-spring-retry\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot way 1 – Spring Retry<\/span><\/h2><div class=\"sec-body\"><p>Dependencies: <code>spring-retry<\/code> + <code>spring-boot-starter-aop<\/code>.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@SpringBootApplication<\/span>\n<span class=\"nd\">@EnableRetry<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">App<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">InventoryClient<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Retryable<\/span><span class=\"p\">(<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">retryFor<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">ResourceAccessException<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">HttpServerErrorException<\/span><span class=\"p\">.<\/span><span class=\"na\">ServiceUnavailable<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"w\"> <\/span><span class=\"p\">},<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">maxAttempts<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">4<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">backoff<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Backoff<\/span><span class=\"p\">(<\/span><span class=\"n\">delay<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">200<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">multiplier<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">2<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">random<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">)<\/span><span class=\"w\">   <\/span><span class=\"c1\">// random = jitter<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">getStock<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">restClient<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">().<\/span><span class=\"na\">uri<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/stock/{sku}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">).<\/span><span class=\"na\">retrieve<\/span><span class=\"p\">().<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">Integer<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Recover<\/span><span class=\"w\">                                     <\/span><span class=\"c1\">// runs when all attempts fail<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">fallback<\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\">                                <\/span><span class=\"c1\">// show \"out of stock\" instead of crashing<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-way-2-resilience4j-most-used-in-microservices\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot way 2 – Resilience4j (most used in microservices)<\/span><\/h2><div class=\"sec-body\"><p>Dependency: <code>resilience4j-spring-boot3<\/code>.<\/p>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">resilience4j<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">retry<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">instances<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">inventory<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">max-attempts<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">4<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">wait-duration<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">200ms<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">enable-exponential-backoff<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">exponential-backoff-multiplier<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">2<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">enable-randomized-wait<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span><span class=\"w\">          <\/span><span class=\"c1\"># jitter<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">randomized-wait-factor<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">0.5<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">retry-exceptions<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">          <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">java.io.IOException<\/span>\n<span class=\"w\">          <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">org.springframework.web.client.ResourceAccessException<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">ignore-exceptions<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">          <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">org.springframework.web.client.HttpClientErrorException<\/span><span class=\"w\">   <\/span><span class=\"c1\"># don't retry 4xx<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">InventoryClient<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Retry<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"inventory\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"stockFallback\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">getStock<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">stockFallback<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Throwable<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not-to-use\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT to use<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Retry these<\/th>\n<th>Don't retry these<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Timeouts, connection reset, 502/503/504, 429 (respect <code>Retry-After<\/code>)<\/td>\n<td>400, 401, 403, 404, validation errors<\/td>\n<\/tr>\n<tr>\n<td><strong>Idempotent<\/strong> calls (GET, PUT, DELETE, or POST with an Idempotency-Key)<\/td>\n<td>Non-idempotent POST like \"charge ₹500\" without a key – you might charge twice!<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Retry only idempotent calls:<\/strong> if the first request actually succeeded but the response got lost, a retry repeats the action. Safe only if doing it twice = doing it once.<\/li>\n<li><strong>Retry storms:<\/strong> many clients × many retries × many layers. If service A retries 3 times calling B, and B retries 3 times calling C, then C gets 9× load. Retry at <strong>one layer<\/strong> only, use backoff + jitter, and combine with a <strong>circuit breaker<\/strong>.<\/li>\n<li>Keep total retry time inside the caller's <strong>timeout budget<\/strong>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Backoff + jitter + max attempts.<\/li>\n<li>Retry only transient errors and idempotent calls.<\/li>\n<li>Combine with timeout and circuit breaker.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"the-three-rules-of-good-retry","t":"The three rules of good retry","k":"idea"},{"id":"plain-java-backoff-with-jitter","t":"Plain Java – backoff with jitter","k":"code"},{"id":"spring-boot-way-1-spring-retry","t":"Spring Boot way 1 – Spring Retry","k":"code"},{"id":"spring-boot-way-2-resilience4j-most-used-in-microservices","t":"Spring Boot way 2 – Resilience4j (most used in microservices)","k":"code"},{"id":"when-to-use-when-not-to-use","t":"When to use / when NOT to use","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this you call a friend and the line is busy. you don't call 100 times in one second. you wait 1 minute, then 2 minutes, then 5 minutes. and after a few tries you give up and send a message instead. what problem does it solve? in distributed systems, many failures are transient (short-lived): - network blip - service restarting - database deadlock - http 503 / 429 (too many requests) simply retrying often works. but bad retries cause a \"retry storm\" – thousands of clients retrying together and crushing the server that is trying to recover. the three rules of good retry exponential backoff – wait longer each time: 100 ms → 200 ms → 400 ms → 800 ms. jitter – add randomness, so all clients don't retry at the same moment. max attempts cap – stop after n tries (e.g. 3–5) and fail properly. also: only retry what is safe to retry (see idempotency below), and only retry transient errors (not 400 bad request or 404). plain java – backoff with jitter java copy public class retryhelper { public static < t > t retry ( supplier < t > call , int maxattempts , long basedelayms ) { runtimeexception last = null ; for ( int attempt = 1 ; attempt <= maxattempts ; attempt ++ ) { try { return call . get (); } catch ( runtimeexception e ) { last = e ; if ( attempt == maxattempts ) break ; long expo = basedelayms * ( 1l << ( attempt - 1 )); // 100, 200, 400... long sleep = threadlocalrandom . current (). nextlong ( expo + 1 ); // \"full jitter\": 0..expo system . out . println ( \"attempt \" + attempt + \" failed, waiting \" + sleep + \" ms\" ); try { thread . sleep ( sleep ); } catch ( interruptedexception ie ) { thread . currentthread (). interrupt (); throw e ; } } } throw last ; } } java copy string result = retryhelper . retry (() -> paymentclient . getstatus ( \"tx1\" ), 4 , 100 ); spring boot way 1 – spring retry dependencies: spring-retry + spring-boot-starter-aop . java copy @springbootapplication @enableretry public class app { } @service public class inventoryclient { @retryable ( retryfor = { resourceaccessexception . class , httpservererrorexception . serviceunavailable . class }, maxattempts = 4 , backoff = @backoff ( delay = 200 , multiplier = 2 , random = true ) // random = jitter ) public int getstock ( string sku ) { return restclient . get (). uri ( \"/stock/{sku}\" , sku ). retrieve (). body ( integer . class ); } @recover // runs when all attempts fail public int fallback ( exception e , string sku ) { return 0 ; // show \"out of stock\" instead of crashing } } spring boot way 2 – resilience4j (most used in microservices) dependency: resilience4j-spring-boot3 . application.yml copy resilience4j : retry : instances : inventory : max-attempts : 4 wait-duration : 200ms enable-exponential-backoff : true exponential-backoff-multiplier : 2 enable-randomized-wait : true # jitter randomized-wait-factor : 0.5 retry-exceptions : - java.io.ioexception - org.springframework.web.client.resourceaccessexception ignore-exceptions : - org.springframework.web.client.httpclienterrorexception # don't retry 4xx java copy @service public class inventoryclient { @retry ( name = \"inventory\" , fallbackmethod = \"stockfallback\" ) public int getstock ( string sku ) { ... } private int stockfallback ( string sku , throwable t ) { return 0 ; } } when to use / when not to use retry these don't retry these timeouts, connection reset, 502/503/504, 429 (respect retry-after ) 400, 401, 403, 404, validation errors idempotent calls (get, put, delete, or post with an idempotency-key) non-idempotent post like \"charge ₹500\" without a key – you might charge twice! points to explain in an interview retry only idempotent calls: if the first request actually succeeded but the response got lost, a retry repeats the action. safe only if doing it twice = doing it once. retry storms: many clients × many retries × many layers. if service a retries 3 times calling b, and b retries 3 times calling c, then c gets 9× load. retry at one layer only, use backoff + jitter, and combine with a circuit breaker . keep total retry time inside the caller's timeout budget . quick revision backoff + jitter + max attempts. retry only transient errors and idempotent calls. combine with timeout and circuit breaker."},{"id":"timeout","n":"Timeout","p":1,"focus":"Never wait forever on a remote call.","build":"Add connect, read and total deadline timeouts to a client.","trade":"timeout budgets across chained calls","day":4,"theme":"Resilience basics","title":"Timeout","lede":"Never wait <strong>forever<\/strong> for another service. Set a maximum time; if no answer comes, give up and handle it.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>You order food and the app says \"delivery in 30 minutes\". If it hasn't come in 60 minutes, you cancel and cook Maggi. You don't wait at the door all night.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>If service B is slow and service A waits forever:\n- A's threads get stuck waiting.\n- New requests to A also get stuck.\n- Soon A runs out of threads and <strong>A also goes down<\/strong>. Then the services calling A go down. This is a <strong>cascading failure<\/strong>.<\/p>\n<p>A timeout frees the thread, so A stays alive even if B is sick.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"kinds-of-timeouts\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Kinds of timeouts<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Timeout<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Connect timeout<\/strong><\/td>\n<td>Max time to open the connection (TCP handshake). Usually small: 1–2 sec.<\/td>\n<\/tr>\n<tr>\n<td><strong>Read (socket) timeout<\/strong><\/td>\n<td>Max time to wait for data after connecting.<\/td>\n<\/tr>\n<tr>\n<td><strong>Total / deadline timeout<\/strong><\/td>\n<td>Max time for the <em>whole<\/em> operation, including retries.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-restclient-with-timeouts\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – RestClient with timeouts<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">HttpClientConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">RestClient<\/span><span class=\"w\"> <\/span><span class=\"nf\">inventoryRestClient<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">factory<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">SimpleClientHttpRequestFactory<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">factory<\/span><span class=\"p\">.<\/span><span class=\"na\">setConnectTimeout<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">));<\/span><span class=\"w\">   <\/span><span class=\"c1\">// connect timeout<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">factory<\/span><span class=\"p\">.<\/span><span class=\"na\">setReadTimeout<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"mi\">2<\/span><span class=\"p\">));<\/span><span class=\"w\">      <\/span><span class=\"c1\">// read timeout<\/span>\n\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">RestClient<\/span><span class=\"p\">.<\/span><span class=\"na\">builder<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">baseUrl<\/span><span class=\"p\">(<\/span><span class=\"s\">\"http://inventory-service\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">requestFactory<\/span><span class=\"p\">(<\/span><span class=\"n\">factory<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">build<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Spring Boot 3.4+ can also do it with properties:<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">spring.http.client.connect-timeout<\/span><span class=\"o\">=<\/span><span class=\"s\">1s<\/span>\n<span class=\"na\">spring.http.client.read-timeout<\/span><span class=\"o\">=<\/span><span class=\"s\">2s<\/span><\/code><\/pre><\/figure>\n<h3>WebClient (reactive) – total deadline<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Mono<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Integer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">getStock<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">webClient<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">().<\/span><span class=\"na\">uri<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/stock/{sku}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">retrieve<\/span><span class=\"p\">()<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">bodyToMono<\/span><span class=\"p\">(<\/span><span class=\"n\">Integer<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">timeout<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofSeconds<\/span><span class=\"p\">(<\/span><span class=\"mi\">3<\/span><span class=\"p\">))<\/span><span class=\"w\">          <\/span><span class=\"c1\">// total deadline<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">onErrorReturn<\/span><span class=\"p\">(<\/span><span class=\"n\">TimeoutException<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Resilience4j TimeLimiter (total deadline for any code)<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">resilience4j<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">timelimiter<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">instances<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">inventory<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">timeout-duration<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">3s<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">cancel-running-future<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">true<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@TimeLimiter<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"inventory\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"fallback\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Integer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">getStock<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"p\">.<\/span><span class=\"na\">supplyAsync<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">client<\/span><span class=\"p\">.<\/span><span class=\"na\">getStock<\/span><span class=\"p\">(<\/span><span class=\"n\">sku<\/span><span class=\"p\">));<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Integer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">fallback<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">sku<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Throwable<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"p\">.<\/span><span class=\"na\">completedFuture<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Database query timeout<\/h3>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">spring.datasource.hikari.connection-timeout<\/span><span class=\"o\">=<\/span><span class=\"s\">2000       # wait max 2s for a free DB connection<\/span>\n<span class=\"na\">spring.jpa.properties.jakarta.persistence.query.timeout<\/span><span class=\"o\">=<\/span><span class=\"s\">3000<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Transactional<\/span><span class=\"p\">(<\/span><span class=\"n\">timeout<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"p\">)<\/span><span class=\"w\">    <\/span><span class=\"c1\">// seconds<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">generateReport<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"timeout-budgets-across-chained-calls\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Timeout budgets across chained calls<\/span><\/h2><div class=\"sec-body\"><p>User → <strong>API (5s total)<\/strong> → Order service → Payment service → Bank<\/p>\n<p>If every service waits 5 s, the user may wait 15 s+ and the outer request already gave up. Rule:<\/p>\n<ul>\n<li><strong>Inner timeouts must be smaller than outer ones.<\/strong><\/li>\n<li>Example budget: API 5 s → Order gets 4 s → Payment gets 3 s → Bank gets 2 s.<\/li>\n<li>With retries: 3 attempts × 1 s each must fit inside the budget.<\/li>\n<li>Advanced: pass the remaining deadline in a header (e.g. <code>X-Deadline<\/code>) so each service knows how much time is left (gRPC does this built-in).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-idea\" id=\"how-to-pick-a-value\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How to pick a value?<\/span><\/h2><div class=\"sec-body\"><p>Look at the dependency's normal latency (p99). If p99 is 300 ms, a read timeout of ~1 s is reasonable. Too small → false failures; too large → stuck threads.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Timeouts prevent <strong>thread exhaustion<\/strong> and cascading failures.<\/li>\n<li>Connect vs read vs total deadline.<\/li>\n<li><strong>Timeout budgets<\/strong> across chained calls (inner &lt; outer).<\/li>\n<li>After a timeout you <strong>don't know<\/strong> if the other side finished the work → the action must be idempotent if you retry.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Always set connect + read timeouts on every HTTP/DB client.<\/li>\n<li>Use a total deadline including retries.<\/li>\n<li>Inner calls get smaller timeouts than outer calls.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"kinds-of-timeouts","t":"Kinds of timeouts","k":"default"},{"id":"spring-boot-code-restclient-with-timeouts","t":"Spring Boot code – RestClient with timeouts","k":"code"},{"id":"timeout-budgets-across-chained-calls","t":"Timeout budgets across chained calls","k":"default"},{"id":"how-to-pick-a-value","t":"How to pick a value?","k":"idea"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this you order food and the app says \"delivery in 30 minutes\". if it hasn't come in 60 minutes, you cancel and cook maggi. you don't wait at the door all night. what problem does it solve? if service b is slow and service a waits forever: - a's threads get stuck waiting. - new requests to a also get stuck. - soon a runs out of threads and a also goes down . then the services calling a go down. this is a cascading failure . a timeout frees the thread, so a stays alive even if b is sick. kinds of timeouts timeout meaning connect timeout max time to open the connection (tcp handshake). usually small: 1–2 sec. read (socket) timeout max time to wait for data after connecting. total / deadline timeout max time for the whole operation, including retries. spring boot code – restclient with timeouts java copy @configuration public class httpclientconfig { @bean public restclient inventoryrestclient () { var factory = new simpleclienthttprequestfactory (); factory . setconnecttimeout ( duration . ofseconds ( 1 )); // connect timeout factory . setreadtimeout ( duration . ofseconds ( 2 )); // read timeout return restclient . builder () . baseurl ( \"http://inventory-service\" ) . requestfactory ( factory ) . build (); } } spring boot 3.4+ can also do it with properties: application.properties copy spring.http.client.connect-timeout = 1s spring.http.client.read-timeout = 2s webclient (reactive) – total deadline java copy public mono < integer > getstock ( string sku ) { return webclient . get (). uri ( \"/stock/{sku}\" , sku ) . retrieve () . bodytomono ( integer . class ) . timeout ( duration . ofseconds ( 3 )) // total deadline . onerrorreturn ( timeoutexception . class , 0 ); } resilience4j timelimiter (total deadline for any code) application.yml copy resilience4j : timelimiter : instances : inventory : timeout-duration : 3s cancel-running-future : true java copy @timelimiter ( name = \"inventory\" , fallbackmethod = \"fallback\" ) public completablefuture < integer > getstock ( string sku ) { return completablefuture . supplyasync (() -> client . getstock ( sku )); } private completablefuture < integer > fallback ( string sku , throwable t ) { return completablefuture . completedfuture ( 0 ); } database query timeout application.properties copy spring.datasource.hikari.connection-timeout = 2000 # wait max 2s for a free db connection spring.jpa.properties.jakarta.persistence.query.timeout = 3000 java copy @transactional ( timeout = 5 ) // seconds public void generatereport () { ... } timeout budgets across chained calls user → api (5s total) → order service → payment service → bank if every service waits 5 s, the user may wait 15 s+ and the outer request already gave up. rule: inner timeouts must be smaller than outer ones. example budget: api 5 s → order gets 4 s → payment gets 3 s → bank gets 2 s. with retries: 3 attempts × 1 s each must fit inside the budget. advanced: pass the remaining deadline in a header (e.g. x-deadline ) so each service knows how much time is left (grpc does this built-in). how to pick a value? look at the dependency's normal latency (p99). if p99 is 300 ms, a read timeout of ~1 s is reasonable. too small → false failures; too large → stuck threads. points to explain in an interview timeouts prevent thread exhaustion and cascading failures. connect vs read vs total deadline. timeout budgets across chained calls (inner < outer). after a timeout you don't know if the other side finished the work → the action must be idempotent if you retry. quick revision always set connect + read timeouts on every http/db client. use a total deadline including retries. inner calls get smaller timeouts than outer calls."},{"id":"circuit","n":"Circuit Breaker","p":1,"focus":"Stop calling a dependency that keeps failing.","build":"Closed, open and half-open state machine around a client.","trade":"thresholds, half-open probing, fallbacks","day":4,"theme":"Resilience basics","title":"Circuit Breaker","lede":"If a service keeps failing, <strong>stop calling it for a while<\/strong> and return a fallback quickly. Try again later.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>The <strong>electric MCB/fuse<\/strong> in your house. When there's a short circuit, it \"trips\" and cuts power to protect the house. After fixing, you switch it on again.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>If the payment service is down and every request still waits 3 seconds and fails:\n- users wait for nothing,\n- your threads are blocked,\n- the sick service gets even more load and can't recover.<\/p>\n<p>A circuit breaker <strong>fails fast<\/strong> while the dependency is sick, and gives it time to recover.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"the-three-states-state-machine\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">The three states (state machine)<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"The three states of a circuit breaker: CLOSED normal · calls go through failures cross the threshold OPEN calls blocked · fallback returned fast wait time is over HALF_OPEN a few test calls allowed What happens in HALF_OPEN HALF_OPEN test calls succeed back to CLOSED test calls fail back to OPEN\"><figcaption>The three states of a circuit breaker<\/figcaption><div class=\"dg-body\"><div class=\"flow\"><div class=\"node s-good\"><b>CLOSED<\/b><small>normal · calls go through<\/small><\/div><div class=\"edge\"><span class=\"el\">failures cross the threshold<\/span><i><\/i><\/div><div class=\"node s-fail\"><b>OPEN<\/b><small>calls blocked · fallback returned fast<\/small><\/div><div c

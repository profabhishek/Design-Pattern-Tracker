/strong> (write side) cooks and changes things; the <strong>menu board<\/strong> (read side) only shows what's available, in a format that's easy to read. You don't read the menu by walking into the kitchen.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"simple-words\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Simple words<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Command<\/strong> = \"do something / change something\" → <code>PlaceOrder<\/code>, <code>CancelOrder<\/code>. Returns nothing or just an id.<\/li>\n<li><strong>Query<\/strong> = \"tell me something\" → <code>GetOrderSummary<\/code>. Never changes data.<\/li>\n<\/ul>\n<p>CQRS says: keep these two in <strong>separate classes<\/strong>, and optionally <strong>separate data models or even separate databases<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>One model trying to do both gets messy:\n- Writes need strict rules, validation, normalized tables.\n- Reads need fast, joined, pre-calculated data (\"order with customer name, item count, total\").\n- Usually <strong>reads are 10–100× more<\/strong> than writes, so you want to scale them separately.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"level-1-split-handlers-in-the-same-database-start-here\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Level 1 – split handlers in the same database (start here)<\/span><\/h2><div class=\"sec-body\"><h3>Commands (write side)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">PlaceOrderCommand<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">customerId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Item<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">items<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">CancelOrderCommand<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderCommandHandler<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">orderRepo<\/span><span class=\"p\">;<\/span><span class=\"w\">        <\/span><span class=\"c1\">// JPA entity with business rules<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ApplicationEventPublisher<\/span><span class=\"w\"> <\/span><span class=\"n\">events<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"nf\">handle<\/span><span class=\"p\">(<\/span><span class=\"n\">PlaceOrderCommand<\/span><span class=\"w\"> <\/span><span class=\"n\">cmd<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">cmd<\/span><span class=\"p\">.<\/span><span class=\"na\">items<\/span><span class=\"p\">().<\/span><span class=\"na\">isEmpty<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalArgumentException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Order needs items\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Order<\/span><span class=\"p\">.<\/span><span class=\"na\">create<\/span><span class=\"p\">(<\/span><span class=\"n\">cmd<\/span><span class=\"p\">.<\/span><span class=\"na\">customerId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">cmd<\/span><span class=\"p\">.<\/span><span class=\"na\">items<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">orderRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">events<\/span><span class=\"p\">.<\/span><span class=\"na\">publishEvent<\/span><span class=\"p\">(<\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderPlacedEvent<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">()));<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">handle<\/span><span class=\"p\">(<\/span><span class=\"n\">CancelOrderCommand<\/span><span class=\"w\"> <\/span><span class=\"n\">cmd<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">orderRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">cmd<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">()).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">cancel<\/span><span class=\"p\">();<\/span><span class=\"w\">                              <\/span><span class=\"c1\">// rule: can't cancel if shipped<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Queries (read side) – simple DTOs, direct SQL, no entities<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">record<\/span> <span class=\"nc\">OrderSummaryView<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">customerName<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">itemCount<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">total<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">status<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderQueryHandler<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">JdbcTemplate<\/span><span class=\"w\"> <\/span><span class=\"n\">jdbc<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">OrderSummaryView<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">ordersOfCustomer<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">customerId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">jdbc<\/span><span class=\"p\">.<\/span><span class=\"na\">query<\/span><span class=\"p\">(<\/span><span class=\"s\">\"\"\"<\/span>\n<span class=\"s\">            select o.id, c.name, count(i.id) as item_count, sum(i.price * i.qty) as total, o.status<\/span>\n<span class=\"s\">            from orders o<\/span>\n<span class=\"s\">            join customers c on c.id = o.customer_id<\/span>\n<span class=\"s\">            join order_items i on i.order_id = o.id<\/span>\n<span class=\"s\">            where o.customer_id = ?<\/span>\n<span class=\"s\">            group by o.id, c.name, o.status<\/span>\n<span class=\"s\">            \"\"\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">(<\/span><span class=\"n\">rs<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">n<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderSummaryView<\/span><span class=\"p\">(<\/span><span class=\"n\">rs<\/span><span class=\"p\">.<\/span><span class=\"na\">getLong<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">rs<\/span><span class=\"p\">.<\/span><span class=\"na\">getString<\/span><span class=\"p\">(<\/span><span class=\"mi\">2<\/span><span class=\"p\">),<\/span>\n<span class=\"w\">                    <\/span><span class=\"n\">rs<\/span><span class=\"p\">.<\/span><span class=\"na\">getInt<\/span><span class=\"p\">(<\/span><span class=\"mi\">3<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">rs<\/span><span class=\"p\">.<\/span><span class=\"na\">getDouble<\/span><span class=\"p\">(<\/span><span class=\"mi\">4<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">rs<\/span><span class=\"p\">.<\/span><span class=\"na\">getString<\/span><span class=\"p\">(<\/span><span class=\"mi\">5<\/span><span class=\"p\">)),<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">customerId<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Controllers<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RestController<\/span>\n<span class=\"nd\">@RequestMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/orders\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderController<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderCommandHandler<\/span><span class=\"w\"> <\/span><span class=\"n\">commands<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderQueryHandler<\/span><span class=\"w\"> <\/span><span class=\"n\">queries<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@PostMapping<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Long<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">place<\/span><span class=\"p\">(<\/span><span class=\"nd\">@RequestBody<\/span><span class=\"w\"> <\/span><span class=\"n\">PlaceOrderCommand<\/span><span class=\"w\"> <\/span><span class=\"n\">cmd<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ResponseEntity<\/span><span class=\"p\">.<\/span><span class=\"na\">status<\/span><span class=\"p\">(<\/span><span class=\"mi\">201<\/span><span class=\"p\">).<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">commands<\/span><span class=\"p\">.<\/span><span class=\"na\">handle<\/span><span class=\"p\">(<\/span><span class=\"n\">cmd<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@GetMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/customer/{id}\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">OrderSummaryView<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">list<\/span><span class=\"p\">(<\/span><span class=\"nd\">@PathVariable<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">queries<\/span><span class=\"p\">.<\/span><span class=\"na\">ordersOfCustomer<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"level-2-separate-read-database-read-model-projection\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Level 2 – separate read database (read model / projection)<\/span><\/h2><div class=\"sec-body\"><p>The write side publishes events. A <strong>projector<\/strong> listens and updates a read-optimized table (or Elasticsearch / MongoDB / Redis).<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderSummaryProjector<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderSummaryRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">readRepo<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// flat table: order_summary<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@TransactionalEventListener<\/span><span class=\"w\">   <\/span><span class=\"c1\">// or a Kafka listener in a separate service<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">on<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderPlacedEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// build a flat row with everything the UI needs<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">readRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderSummaryRow<\/span><span class=\"p\">.<\/span><span class=\"na\">from<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"eventual-consistency-on-the-read-side\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Eventual consistency on the read side<\/span><\/h2><div class=\"sec-body\"><p>With a separate read store, the read model is updated <strong>a little after<\/strong> the write. For a few milliseconds/seconds, the user may not see their new order in the list.<\/p>\n<p>Ways to handle it:\n- Return the created data in the command response, show it directly in the UI.\n- Read from the write side for \"my latest order\" screens.\n- Show \"processing…\" in the UI.<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-it-is-overkill\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When it is overkill<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Simple CRUD apps (create/read/update/delete forms). One model is perfectly fine.<\/li>\n<li>Small team, small traffic.<\/li>\n<li>When you can't accept <em>any<\/em> delay between write and read.<\/li>\n<\/ul>\n<p>Good fit: high read traffic, complex reporting screens, different scaling needs, often together with <strong>Event Sourcing<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Command vs Query, and why separate them.<\/li>\n<li>Level 1 (separate code) vs Level 2 (separate stores).<\/li>\n<li><strong>Eventual consistency<\/strong> on the read side and how to handle it.<\/li>\n<li><strong>When it is overkill<\/strong> – most CRUD apps.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Commands change, queries read – keep them apart.<\/li>\n<li>Start with separate handlers; add a separate read DB only if needed.<\/li>\n<li>Separate read DB → eventual consistency.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"simple-words","t":"Simple words","k":"default"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"level-1-split-handlers-in-the-same-database-start-here","t":"Level 1 – split handlers in the same database (start here)","k":"default"},{"id":"level-2-separate-read-database-read-model-projection","t":"Level 2 – separate read database (read model / projection)","k":"default"},{"id":"eventual-consistency-on-the-read-side","t":"Eventual consistency on the read side","k":"default"},{"id":"when-it-is-overkill","t":"When it is overkill","k":"when"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this a restaurant : the kitchen (write side) cooks and changes things; the menu board (read side) only shows what's available, in a format that's easy to read. you don't read the menu by walking into the kitchen. simple words command = \"do something / change something\" → placeorder , cancelorder . returns nothing or just an id. query = \"tell me something\" → getordersummary . never changes data. cqrs says: keep these two in separate classes , and optionally separate data models or even separate databases . what problem does it solve? one model trying to do both gets messy: - writes need strict rules, validation, normalized tables. - reads need fast, joined, pre-calculated data (\"order with customer name, item count, total\"). - usually reads are 10–100× more than writes, so you want to scale them separately. level 1 – split handlers in the same database (start here) commands (write side) java copy public record placeordercommand ( long customerid , list < item > items ) { } public record cancelordercommand ( long orderid ) { } @service @requiredargsconstructor public class ordercommandhandler { private final orderrepository orderrepo ; // jpa entity with business rules private final applicationeventpublisher events ; @transactional public long handle ( placeordercommand cmd ) { if ( cmd . items (). isempty ()) throw new illegalargumentexception ( \"order needs items\" ); order order = order . create ( cmd . customerid (), cmd . items ()); orderrepo . save ( order ); events . publishevent ( new orderplacedevent ( order . getid ())); return order . getid (); } @transactional public void handle ( cancelordercommand cmd ) { order order = orderrepo . findbyid ( cmd . orderid ()). orelsethrow (); order . cancel (); // rule: can't cancel if shipped } } queries (read side) – simple dtos, direct sql, no entities java copy public record ordersummaryview ( long id , string customername , int itemcount , double total , string status ) { } @service @requiredargsconstructor public class orderqueryhandler { private final jdbctemplate jdbc ; public list < ordersummaryview > ordersofcustomer ( long customerid ) { return jdbc . query ( \"\"\" select o.id, c.name, count(i.id) as item_count, sum(i.price * i.qty) as total, o.status from orders o join customers c on c.id = o.customer_id join order_items i on i.order_id = o.id where o.customer_id = ? group by o.id, c.name, o.status \"\"\" , ( rs , n ) -> new ordersummaryview ( rs . getlong ( 1 ), rs . getstring ( 2 ), rs . getint ( 3 ), rs . getdouble ( 4 ), rs . getstring ( 5 )), customerid ); } } controllers java copy @restcontroller @requestmapping ( \"/orders\" ) @requiredargsconstructor public class ordercontroller { private final ordercommandhandler commands ; private final orderqueryhandler queries ; @postmapping public responseentity < long > place ( @requestbody placeordercommand cmd ) { return responseentity . status ( 201 ). body ( commands . handle ( cmd )); } @getmapping ( \"/customer/{id}\" ) public list < ordersummaryview > list ( @pathvariable long id ) { return queries . ordersofcustomer ( id ); } } level 2 – separate read database (read model / projection) the write side publishes events. a projector listens and updates a read-optimized table (or elasticsearch / mongodb / redis). java copy @component @requiredargsconstructor public class ordersummaryprojector { private final ordersummaryrepository readrepo ; // flat table: order_summary @transactionaleventlistener // or a kafka listener in a separate service public void on ( orderplacedevent e ) { // build a flat row with everything the ui needs readrepo . save ( ordersummaryrow . from ( e )); } } eventual consistency on the read side with a separate read store, the read model is updated a little after the write. for a few milliseconds/seconds, the user may not see their new order in the list. ways to handle it: - return the created data in the command response, show it directly in the ui. - read from the write side for \"my latest order\" screens. - show \"processing…\" in the ui. when it is overkill simple crud apps (create/read/update/delete forms). one model is perfectly fine. small team, small traffic. when you can't accept any delay between write and read. good fit: high read traffic, complex reporting screens, different scaling needs, often together with event sourcing . points to explain in an interview command vs query, and why separate them. level 1 (separate code) vs level 2 (separate stores). eventual consistency on the read side and how to handle it. when it is overkill – most crud apps. quick revision commands change, queries read – keep them apart. start with separate handlers; add a separate read db only if needed. separate read db → eventual consistency."},{"id":"saga","n":"Saga","p":1,"focus":"A distributed transaction as local steps plus compensations.","build":"Draw order, payment and inventory with a compensation for each step.","trade":"orchestration vs choreography, limits of compensation","day":6,"theme":"Distributed transactions","title":"Saga","lede":"A big business transaction across many services, done as <strong>small local steps<\/strong>. If one step fails, run <strong>compensating (undo) steps<\/strong> for the ones already done.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>Planning a <strong>trip<\/strong>: book flight ✅ → book hotel ✅ → book cab ❌ (none available).\nYou can't \"rollback\" the whole world, so you <strong>cancel the hotel<\/strong> and <strong>cancel the flight<\/strong> (maybe with a small fee). These cancellations are <em>compensations<\/em>.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>In a monolith, one database transaction covers everything (<code>@Transactional<\/code>). In microservices, <strong>each service has its own database<\/strong>:<\/p>\n<ul>\n<li>Order service → orders DB<\/li>\n<li>Payment service → payments DB<\/li>\n<li>Inventory service → inventory DB<\/li>\n<\/ul>\n<p>There's no single transaction across all three. Two-phase commit is slow and fragile. Saga is the practical alternative.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-order-payment-inventory\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – order, payment, inventory<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Action<\/th>\n<th>Compensation (undo)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td>Order: create order (status <code>PENDING<\/code>)<\/td>\n<td>Mark order <code>CANCELLED<\/code><\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td>Payment: charge customer<\/td>\n<td>Refund customer<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td>Inventory: reserve stock<\/td>\n<td>Release stock<\/td>\n<\/tr>\n<tr>\n<td>4<\/td>\n<td>Order: mark <code>CONFIRMED<\/code><\/td>\n<td>—<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>If step 3 fails → refund (undo 2) → cancel order (undo 1).<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"two-styles\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Two styles<\/span><\/h2><div class=\"sec-body\"><h3>A) Choreography – services react to each other's events (no boss)<\/h3>\n<figure class=\"dg\" role=\"img\" aria-label=\"Choreography — services react to events: Happy path Order created (PENDING) OrderCreated Payment charges PaymentDone Inventory reserves stock StockReserved Order ✓ CONFIRMED If stock can&#x27;t be reserved Inventory out of stock StockFailed Payment refunds (compensation) PaymentRefunded Order ✕ CANCELLED\"><figcaption>Choreography — services react to events<\/figcaption><div class=\"dg-body\"><div class=\"dg-title\">Happy path<\/div><div class=\"flow\"><div class=\"node s-accent\"><b>Order<\/b><small>created (PENDING)<\/small><\/div><div class=\"edge\"><span class=\"el\">OrderCreated<\/span><i><\/i><\/div><div class=\"node s-plain\"><b>Payment<\/b><small>charges<\/small><\/div><div class=\"edge\"><span class=\"el\">PaymentDone<\/span><i><\/i><\/div><div class=\"node s-plain\"><b>Inventory<\/b><small>reserves stock<\/small><\/div><div class=\"edge\"><span class=\"el\">StockReserved<\/span><i><\/i><\/div><div class=\"node s-good\"><b>Order ✓<\/b><small>CONFIRMED<\/small><\/div><\/div><div class=\"dg-title\">If stock can&#x27;t be reserved<\/div><div class=\"flow\"><div class=\"node s-fail\"><b>Inventory<\/b><small>out of stock<\/small><\/div><div class=\"edge\"><span class=\"el\">StockFailed<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>Payment<\/b><small>refunds (compensation)<\/small><\/div><div class=\"edge\"><span class=\"el\">PaymentRefunded<\/span><i><\/i><\/div><div class=\"node s-fail\"><b>Order ✕<\/b><small>CANCELLED<\/small><\/div><\/div><\/div><\/figure>\n<h3>B) Orchestration – one orchestrator tells each service what to do<\/h3>\n<figure class=\"dg\" role=\"img\" aria-label=\"Orchestration — one boss tells everyone what to do: Order Saga Orchestrator 1. charge · 2. reserve · 3. confirm (or undo in reverse) charge / refund Payment reserve / release Inventory confirm / cancel Order\"><figcaption>Orchestration — one boss tells everyone what to do<\/figcaption><div class=\"dg-body\"><div class=\"fan\" style=\"--n:3\"><div class=\"node s-accent\"><b>Order Saga Orchestrator<\/b><small>1. charge · 2. reserve · 3. confirm (or undo in reverse)<\/small><\/div><div class=\"vedge plain\"><i><\/i><\/div><div class=\"fcols\"><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">charge / refund<\/span><i><\/i><\/div><div class=\"node s-plain\"><b>Payment<\/b><\/div><\/div><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">reserve / release<\/span><i><\/i><\/div><div class=\"node s-plain\"><b>Inventory<\/b><\/div><\/div><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">confirm / cancel<\/span><i><\/i><\/div><div class=\"node s-plain\"><b>Order<\/b><\/div><\/div><\/div><\/div><\/div><\/figure>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Choreography<\/th>\n<th>Orchestration<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Control<\/td>\n<td>Spread across services<\/td>\n<td>Central orchestrator<\/td>\n<\/tr>\n<tr>\n<td>Good for<\/td>\n<td>2–4 simple steps<\/td>\n<td>Many steps, complex rules<\/td>\n<\/tr>\n<tr>\n<td>Pros<\/td>\n<td>Loose coupling, no central point<\/td>\n<td>Easy to see/debug the whole flow<\/td>\n<\/tr>\n<tr>\n<td>Cons<\/td>\n<td>Hard to follow the flow; cyclic dependencies<\/td>\n<td>Orchestrator can become a \"god service\"<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-orchestration-simple-version\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – Orchestration (simple version)<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">PaymentClient<\/span><span class=\"w\">   <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">charge<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">refund<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">paymentId<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"kd\">public<

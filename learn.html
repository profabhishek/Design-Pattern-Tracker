n class=\"nt\">volumes<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">logs<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">emptyDir<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{}<\/span><span class=\"w\">                       <\/span><span class=\"c1\"># shared folder between containers<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">containers<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">app<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">image<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">myrepo/order-service:1.0<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">ports<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">[{<\/span><span class=\"nt\"> containerPort<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">8080<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}]<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">volumeMounts<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">logs<\/span><span class=\"p p-Indicator\">,<\/span><span class=\"nt\"> mountPath<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">/var/log/app<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">log-shipper<\/span><span class=\"w\">                  <\/span><span class=\"c1\"># ← the sidecar<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">image<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">fluent/fluent-bit:3.0<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">volumeMounts<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">logs<\/span><span class=\"p p-Indicator\">,<\/span><span class=\"nt\"> mountPath<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">/var/log/app<\/span><span class=\"p p-Indicator\">,<\/span><span class=\"nt\"> readOnly<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">true<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n<span class=\"w\">      <\/span><span class=\"c1\"># its config reads /var/log/app/*.log and sends to Loki/Elasticsearch<\/span><\/code><\/pre><\/figure>\n<p>Kubernetes 1.29+ also supports \"native sidecars\" (an init container with <code>restartPolicy: Always<\/code>) so the sidecar starts before and stops after the app.<\/p>\n<h3>Proxy sidecar example<\/h3>\n<p>With a <strong>service mesh<\/strong> (Istio/Linkerd), an Envoy sidecar is injected automatically. Your app calls <code>http://payment-service:8080<\/code> in plain HTTP; the sidecar adds <strong>mTLS, retries, timeouts, metrics<\/strong> on the way out. Many retry/timeout settings can then move from Resilience4j to mesh config.<\/p><\/div><\/section>\n<section class=\"sec k-compare\" id=\"sidecar-vs-library\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Sidecar vs Library<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Sidecar<\/th>\n<th>Library (e.g. Resilience4j, Micrometer inside the app)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Works for <strong>any language<\/strong><\/td>\n<td>Must exist for your language<\/td>\n<\/tr>\n<tr>\n<td>Update without changing/redeploying app code<\/td>\n<td>Need to rebuild every app to upgrade<\/td>\n<\/tr>\n<tr>\n<td>Extra <strong>process<\/strong> → more CPU/memory per pod<\/td>\n<td>No extra process<\/td>\n<\/tr>\n<tr>\n<td>Extra <strong>network hop<\/strong> on localhost → small latency<\/td>\n<td>In-process, fastest<\/td>\n<\/tr>\n<tr>\n<td>Less app-level context<\/td>\n<td>Knows business context (e.g. which method failed)<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-explain\" id=\"trade-offs-to-explain\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Trade-offs to explain<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Latency overhead:<\/strong> each call goes app → sidecar → network (usually ~1 ms, but adds up).<\/li>\n<li><strong>Lifecycle coupling:<\/strong> sidecar must start before the app and stop after it; if the sidecar crashes, the app may lose network/logs.<\/li>\n<li><strong>Resource cost:<\/strong> one extra container per pod × hundreds of pods.<\/li>\n<li><strong>Debugging<\/strong> gets harder (is it the app or the sidecar?).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Helper container next to the app, same lifecycle, shares localhost/volumes.<\/li>\n<li>Used for logs, proxies (service mesh), config, secrets.<\/li>\n<li>Sidecar vs library: language-free and independent vs faster and simpler.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"picture-kubernetes-pod","t":"Picture (Kubernetes pod)","k":"idea"},{"id":"build-task-a-logging-sidecar-next-to-one-service","t":"Build task – a logging sidecar next to one service","k":"build"},{"id":"sidecar-vs-library","t":"Sidecar vs Library","k":"compare"},{"id":"trade-offs-to-explain","t":"Trade-offs to explain","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":3,"text":"think of it like this a motorcycle with a sidecar . the bike (your app) does the main job – driving. the sidecar is attached, goes everywhere the bike goes, and carries extra stuff. it starts and stops with the bike. what problem does it solve? every service needs the same \"plumbing\": - collect and ship logs, - tls / mtls between services, - retries, metrics, tracing, - config reload, secrets fetching. if you write this in each app, in each language (java, go, node), it's duplicated and inconsistent. a sidecar does it once , outside the app, for any language. picture (kubernetes pod) a sidecar inside one kubernetes pod spring boot app :8080 · only business code localhost sidecar envoy · fluent bit mtls · retries · logs other services / log store the app and the sidecar live in the same pod: they share localhost and folders, and start and stop together. they share localhost and can share files (volumes). build task – a logging sidecar next to one service spring boot app writes logs to a file application.properties copy logging.file.name = /var/log/app/app.log logging.structured.format.file = ecs # spring boot 3.4+: json logs java copy @restcontroller @slf4j public class hellocontroller { @getmapping ( \"/hello\" ) public string hello () { log . info ( \"hello endpoint called\" ); return \"hello\" ; } } the app knows nothing about elasticsearch/loki. it just writes a file. kubernetes pod with a fluent bit sidecar application.yml copy apiversion : v1 kind : pod metadata : name : order-service spec : volumes : - name : logs emptydir : {} # shared folder between containers containers : - name : app image : myrepo/order-service:1.0 ports : [{ containerport : 8080 }] volumemounts : - { name : logs , mountpath : /var/log/app } - name : log-shipper # ← the sidecar image : fluent/fluent-bit:3.0 volumemounts : - { name : logs , mountpath : /var/log/app , readonly : true } # its config reads /var/log/app/*.log and sends to loki/elasticsearch kubernetes 1.29+ also supports \"native sidecars\" (an init container with restartpolicy: always ) so the sidecar starts before and stops after the app. proxy sidecar example with a service mesh (istio/linkerd), an envoy sidecar is injected automatically. your app calls http://payment-service:8080 in plain http; the sidecar adds mtls, retries, timeouts, metrics on the way out. many retry/timeout settings can then move from resilience4j to mesh config. sidecar vs library sidecar library (e.g. resilience4j, micrometer inside the app) works for any language must exist for your language update without changing/redeploying app code need to rebuild every app to upgrade extra process → more cpu/memory per pod no extra process extra network hop on localhost → small latency in-process, fastest less app-level context knows business context (e.g. which method failed) trade-offs to explain latency overhead: each call goes app → sidecar → network (usually ~1 ms, but adds up). lifecycle coupling: sidecar must start before the app and stop after it; if the sidecar crashes, the app may lose network/logs. resource cost: one extra container per pod × hundreds of pods. debugging gets harder (is it the app or the sidecar?). quick revision helper container next to the app, same lifecycle, shares localhost/volumes. used for logs, proxies (service mesh), config, secrets. sidecar vs library: language-free and independent vs faster and simpler."},{"id":"bluegreen","n":"Blue-Green Deployment","p":3,"focus":"Two environments, switch traffic between them.","build":"Write the cutover and rollback steps, including DB migrations.","trade":"DB migrations, cost of double infrastructure","day":13,"theme":"Release and blast radius","title":"Blue-Green Deployment","lede":"Keep <strong>two identical environments<\/strong> – Blue (live now) and Green (new version). Deploy to Green, test it, then <strong>switch all traffic<\/strong> from Blue to Green in one step. If something breaks, switch back.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>stage show with two stages<\/strong>. While the audience watches Stage Blue, the crew sets up the next act on Stage Green. When it's ready, the lights move to Green. If Green has a problem, lights go back to Blue instantly.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Normal deploy: stop old version → start new version → downtime, and if the new version is broken, rollback is slow (redeploy old).<\/p>\n<p>Blue-Green gives:\n- <strong>Zero downtime<\/strong> (switch is instant).\n- <strong>Instant rollback<\/strong> (switch back to Blue, still running).\n- Test the new version <strong>in the real production environment<\/strong> before users hit it.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"picture\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Picture<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"Blue-Green at a glance: Users → Load balancer / Router one switch decides which colour is live 100% of traffic now BLUE · v1 live now after the switch GREEN · v2 deployed and tested, waiting Same database shared by both versions To release, flip the router to GREEN. To roll back, flip it back to BLUE — it is still running.\"><figcaption>Blue-Green at a glance<\/figcaption><div class=\"dg-body\"><div class=\"fan\" style=\"--n:2\"><div class=\"node s-accent\"><b>Users → Load balancer / Router<\/b><small>one switch decides which colour is live<\/small><\/div><div class=\"vedge plain\"><i><\/i><\/div><div class=\"fcols has-base\"><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">100% of traffic now<\/span><i><\/i><\/div><div class=\"node s-good\"><b>BLUE · v1<\/b><small>live now<\/small><\/div><div class=\"vedge\"><i><\/i><\/div><\/div><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">after the switch<\/span><i><\/i><\/div><div class=\"node s-muted\"><b>GREEN · v2<\/b><small>deployed and tested, waiting<\/small><\/div><div class=\"vedge\"><i><\/i><\/div><\/div><\/div><div class=\"node base s-db\"><b>Same database<\/b><small>shared by both versions<\/small><\/div><\/div><p class=\"dg-note t-plain\">To release, flip the router to GREEN. To roll back, flip it back to BLUE — it is still running.<\/p><\/div><\/figure><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-cutover-and-rollback-steps-with-db-migrations\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – cutover and rollback steps (with DB migrations)<\/span><\/h2><div class=\"sec-body\"><h3>Before<\/h3>\n<ol>\n<li>Blue runs <strong>v1<\/strong> and serves 100% traffic.<\/li>\n<li>Database migration for v2 must be <strong>backward compatible<\/strong> (see below). Run it first.<\/li>\n<\/ol>\n<h3>Deploy &amp; test<\/h3>\n<ol start=\"3\">\n<li>Deploy <strong>v2<\/strong> to Green.<\/li>\n<li>Run smoke tests against Green's internal URL (<code>/actuator/health<\/code>, key APIs).<\/li>\n<\/ol>\n<h3>Cutover<\/h3>\n<ol start=\"5\">\n<li>Switch the router: traffic → Green.<\/li>\n<li>Watch dashboards: error rate, latency, business metrics (orders/min) for 15–30 minutes.<\/li>\n<\/ol>\n<h3>Rollback (if bad)<\/h3>\n<ol start=\"7\">\n<li>Switch router back → Blue. Done in seconds. Because DB changes were backward compatible, v1 still works.<\/li>\n<\/ol>\n<h3>Clean up<\/h3>\n<ol start=\"8\">\n<li>When v2 is stable, Blue becomes the \"next Green\" for the next release.<\/li>\n<\/ol>\n<h3>Kubernetes example (switch by changing a label)<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"c1\"># two deployments: order-blue (v1) and order-green (v2), labels color=blue / color=green<\/span>\n<span class=\"nt\">apiVersion<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">v1<\/span>\n<span class=\"nt\">kind<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Service<\/span>\n<span class=\"nt\">metadata<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">order-service<\/span>\n<span class=\"nt\">spec<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">selector<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">app<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">order<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">color<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">blue<\/span><span class=\"w\">          <\/span><span class=\"c1\"># ← change to \"green\" to switch, back to \"blue\" to roll back<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">ports<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">port<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">80<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">targetPort<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">8080<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"bash\"><figcaption><span class=\"lang\">Terminal<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code>kubectl<span class=\"w\"> <\/span>patch<span class=\"w\"> <\/span>service<span class=\"w\"> <\/span>order-service<span class=\"w\"> <\/span>-p<span class=\"w\"> <\/span><span class=\"s1\">'{\"spec\":{\"selector\":{\"app\":\"order\",\"color\":\"green\"}}}'<\/span><\/code><\/pre><\/figure>\n<h3>Spring Boot readiness<\/h3>\n<p>Make sure Green is truly ready before the switch:<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">management.endpoint.health.probes.enabled<\/span><span class=\"o\">=<\/span><span class=\"s\">true<\/span>\n<span class=\"na\">management.endpoints.web.exposure.include<\/span><span class=\"o\">=<\/span><span class=\"s\">health,info<\/span>\n<span class=\"na\">server.shutdown<\/span><span class=\"o\">=<\/span><span class=\"s\">graceful                       # finish in-flight requests on Blue<\/span>\n<span class=\"na\">spring.lifecycle.timeout-per-shutdown-phase<\/span><span class=\"o\">=<\/span><span class=\"s\">30s<\/span><\/code><\/pre><\/figure>\n<p>Health check URLs: <code>/actuator/health/readiness<\/code> and <code>/actuator/health/liveness<\/code>.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"db-migrations-the-tricky-part-expand-contract\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">DB migrations – the tricky part (expand &amp; contract)<\/span><\/h2><div class=\"sec-body\"><p>Both versions use the <strong>same database<\/strong> at the same time, so a change must work for v1 <strong>and<\/strong> v2.<\/p>\n<p>Example: rename column <code>name<\/code> → <code>full_name<\/code>.<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Step<\/th>\n<th>Release<\/th>\n<th>DB change (Flyway)<\/th>\n<th>Code<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1. Expand<\/td>\n<td>v2<\/td>\n<td><code>ALTER TABLE users ADD full_name<\/code> and copy data<\/td>\n<td>Writes <strong>both<\/strong> columns, reads <code>full_name<\/code><\/td>\n<\/tr>\n<tr>\n<td>2. Migrate<\/td>\n<td>—<\/td>\n<td>backfill old rows<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>3. Contract<\/td>\n<td>v3 (later)<\/td>\n<td><code>ALTER TABLE users DROP COLUMN name<\/code><\/td>\n<td>Uses only <code>full_name<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<figure class=\"code\" data-lang=\"sql\"><figcaption><span class=\"lang\">SQL<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"c1\">-- V7__add_full_name.sql  (safe: v1 ignores the new column)<\/span>\n<span class=\"k\">ALTER<\/span><span class=\"w\"> <\/span><span class=\"k\">TABLE<\/span><span class=\"w\"> <\/span><span class=\"n\">users<\/span><span class=\"w\"> <\/span><span class=\"k\">ADD<\/span><span class=\"w\"> <\/span><span class=\"k\">COLUMN<\/span><span class=\"w\"> <\/span><span class=\"n\">full_name<\/span><span class=\"w\"> <\/span><span class=\"nb\">VARCHAR<\/span><span class=\"p\">(<\/span><span class=\"mi\">200<\/span><span class=\"p\">);<\/span>\n<span class=\"k\">UPDATE<\/span><span class=\"w\"> <\/span><span class=\"n\">users<\/span><span class=\"w\"> <\/span><span class=\"k\">SET<\/span><span class=\"w\"> <\/span><span class=\"n\">full_name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"k\">WHERE<\/span><span class=\"w\"> <\/span><span class=\"n\">full_name<\/span><span class=\"w\"> <\/span><span class=\"k\">IS<\/span><span class=\"w\"> <\/span><span class=\"k\">NULL<\/span><span class=\"p\">;<\/span><\/code><\/pre><\/figure>\n<p><strong>Never<\/strong> drop/rename a column in the same release that stops using it – rollback to Blue would break.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>DB migrations:<\/strong> must be backward compatible (expand → contract).<\/li>\n<li><strong>Cost of double infrastructure:<\/strong> you need 2× servers during the release (cloud makes this cheaper – create Green only during deploys).<\/li>\n<li>Long-running requests/sessions on Blue: use graceful shutdown, sticky sessions or external session store (Redis).<\/li>\n<li>Blue-Green switches <strong>all users at once<\/strong>; Canary moves <strong>gradually<\/strong>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Two environments, switch traffic in one step.<\/li>\n<li>Instant rollback by switching back.<\/li>\n<li>Backward-compatible DB changes; costs double infra.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"picture","t":"Picture","k":"idea"},{"id":"build-task-cutover-and-rollback-steps-with-db-migrations","t":"Build task – cutover and rollback steps (with DB migrations)","k":"build"},{"id":"db-migrations-the-tricky-part-expand-contract","t":"DB migrations – the tricky part (expand & contract)","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":3,"text":"think of it like this a stage show with two stages . while the audience watches stage blue, the crew sets up the next act on stage green. when it's ready, the lights move to green. if green has a problem, lights go back to blue instantly. what problem does it solve? normal deploy: stop old version → start new version → downtime, and if the new version is broken, rollback is slow (redeploy old). blue-green gives: - zero downtime (switch is instant). - instant rollback (switch back to blue, still running). - test the new version in the real production environment before users hit it. picture blue-green at a glance users → load balancer / router one switch decides which colour is live 100% of traffic now blue · v1 live now after the switch green · v2 deployed and tested, waiting same database shared by both versions to release, flip the router to green. to roll back, flip it back to blue — it is still running. build task – cutover and rollback steps (with db migrations) before blue runs v1 and serves 100% traffic. database migration for v2 must be backward compatible (see below). run it first. deploy & test deploy v2 to green. run smoke tests against green's internal url ( /actuator/health , key apis). cutover switch the router: traffic → green. watch dashboards: error rate, latency, business metrics (orders/min) for 15–30 minutes. rollback (if bad) switch router back → blue. done in seconds. because db changes were backward compatible, v1 still works. clean up when v2 is stable, blue becomes the \"next green\" for the next release. kubernetes example (switch by changing a label) application.yml copy # two deployments: order-blue (v1) and order-green (v2), labels color=blue / color=green apiversion : v1 kind : service metadata : name : order-service spec : selector : app : order color : blue # ← change to \"green\" to switch, back to \"blue\" to roll back ports : - port : 80 targetport : 8080 terminal copy kubectl patch service order-service -p '{\"spec\":{\"selector\":{\"app\":\"order\",\"color\":\"green\"}}}' spring boot readiness make sure green is truly ready before the switch: application.properties copy management.endpoint.health.probes.enabled = true management.endpoints.web.exposure.include = health,info server.shutdown = graceful # finish in-flight requests on blue spring.lifecycle.timeout-per-shutdown-phase = 30s health check urls: /actuator/health/readiness and /actuator/health/liveness . db migrations – the tricky part (expand & contract) both versions use the same database at the same time, so a change must work for v1 and v2. example: rename column name → full_name . step release db change (flyway) code 1. expand v2 alter table users add full_name and copy data writes both columns, reads full_name 2. migrate — backfill old rows — 3. contract v3 (later) alter table users drop column name uses only full_name sql copy -- v7__add_full_name.sql (safe: v1 ignores the new column) alter table users add column full_name varchar ( 200 ); update users set full_name = name where full_name is null ; never drop/rename a column in the same release that stops using it – rollback to blue would break. points to explain in an interview db migrations: must be backward compatible (expand → contract). cost of double infrastructure: you need 2× servers during the release (cloud makes this cheaper – create green only during deploys). long-running requests/sessions on blue: use graceful shutdown, sticky sessions or external session store (redis). blue-green switches all users at once ; canary moves gradually . quick revision two environments, switch traffic in one step. instant rollback by switching back. backward-compatible db changes; costs double infra."},{"id":"canary","n":"Canary Release","p":3,"focus":"Send a small share of traffic to the new version first.","build":"Define metrics and rollback thresholds for 5%, 25%, 100%.","trade":"metrics, automatic rollback, sticky users","day":13,"theme":"Release and blast radius","title":"Canary Release","lede":"Release the new version to a <strong>small % of users first<\/strong> (say 5%). Watch the metrics. If it's healthy, increase to 25%, 50%, 100%. If not, roll back – only a few users were affected.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>Old coal miners took a <strong>canary bird<\/strong> into the mine. If there was poison gas, the canary got sick first and the miners escaped in time. The 5% users are your \"canary\" – they show problems before everyone is hit.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Some bugs only appear with <strong>real traffic<\/strong> (real data, real load). Releasing to 100% at once means a bug hits <strong>everyone<\/strong>. Canary limits the <strong>blast radius<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-metrics-and-rollback-thresholds-for-5-25-100\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – metrics and rollback thresholds for 5% → 25% → 100%<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Stage<\/th>\n<th>Traffic to v2<\/th>\n<th>Wait<\/th>\n<th>Move forward only if…<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>1<\/td>\n<td><strong>5%<\/strong><\/td>\n<td>15–30 min<\/td>\n<td>error rate ≤ v1 + 0.5%, p99 latency ≤ v1 × 1.2, no new 5xx types, no crash loops<\/td>\n<\/tr>\n<tr>\n<td>2<\/td>\n<td><strong>25%<\/strong><\/td>\n<td>30–60 min<\/td>\n<td>same checks + business metrics OK (orders/min, payment success rate)<\/td>\n<\/tr>\n<tr>\n<td>3<\/td>\n<td><strong>100%<\/strong><\/td>\n<td>—<\/td>\n<td>keep old version ready for a few hours for quick rollback<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p><strong>Automatic rollback<\/strong> if at any stage:\n- HTTP 5xx rate &gt; 1% (or 2× v1)\n- p99 latency &gt; 800 ms\n- payment success rate drops by &gt; 2%\n- pods restarting<\/p>\n<p>Always <strong>compare canary vs baseline (v1) at the same time<\/strong>, not against yesterday.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-side-expose-good-metrics\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot side – expose good metrics<\/span><\/h2><div class=\"sec-body\"><p>Dependencies: <code>spring-boot-starter-actuator<\/code>, <code>micrometer-registry-prometheus<\/code>.<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">management.endpoints.web.exposure.include<\/span><span class=\"o\">=<\/span><span class=\"s\">health,prometheus<\/span>\n<span class=\"na\">management.metrics.tags.version<\/span><span class=\"o\">=<\/span><span class=\"s\">${APP_VERSION:unknown}   # tag every metric with version<\/span>\n<span class=\"na\">management.metrics.distribution.percentiles-histogram.http.server.requests<\/span><span class=\"o\">=<\/span><span class=\"s\">true<\/span><\/code><\/pre><\/figure>\n<p>Now Prometheus can compare <code>http_server_requests_seconds<\/code> and error counts <strong>by version<\/strong>.<\/p>\n<p>Custom business metric:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">MeterRegistry<\/span><span class=\"w\"> <\/span><span class=\"n\">registry<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">o<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// ... charge<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">registry<\/span><span class=\"p\">.<\/span><span class=\"na\">counter<\/span><span class=\"p\">(<\/span><span class=\"s\">\"payments\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"result\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"success\"<\/span><span class=\"p\">).<\/span><span class=\"na\">increment<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">registry<\/span><span class=\"p\">.<\/span><span class=\"na\">counter<\/span><span class=\"p\">(<\/span><span class=\"s\">\"payments\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"result\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"failure\"<\/span><span class=\"p\">).<\/span><span class=\"na\">increment<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"routing-traffic\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Routing traffic<\/span><\/h2><div class=\"sec-body\"><h3>Spring Cloud Gateway weights<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">spring<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">cloud<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">gateway<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">routes<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">orders-v2-canary<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://order-v2:8080<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">[<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Path=/orders/**\"<\/span><span class=\"p p-Indicator\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Weight=orders,<\/span><span class=\"nv\"> <\/span><span class=\"s\">5\"<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">]<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">id<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">orders-v1<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">uri<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://order-v1:8080<\/span>\n<span class=\"w\">          <\/span><span class=\"nt\">predicates<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">[<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Path=/orders/**\"<\/span><span class=\"p p-Indicator\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Weight=orders,<\/span><span class=\"nv\"> <\/span><span class=\"s\">95\"<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">]<\/span><\/code><\/pre><\/figure>\n<h3>Kubernetes with Argo Rollouts (automatic steps + rollback)<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">apiVersion<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">argoproj.io/v1alpha1<\/span>\n<span class=\"nt\">kind<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">Rollout<\/span>\n<span class=\"nt\">metadata<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">order-service<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n<span class=\"nt\">spec<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">strategy<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">canary<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">steps<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">setWeight<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">5<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">pause<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> duration<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">20m<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">analysis<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> templates<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">[<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> templateName<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">error-rate-check<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">]<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">setWeight<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">25<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">pause<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> duration<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">45m<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">analysis<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> templates<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">[<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">{<\/span><span class=\"nt\"> templateName<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"nv\">error-rate-check<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">]<\/span><span class=\"w\"> <\/span><span class=\"p p-Indicator\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p p-Indicator\">-<\/span><span class=\"w\"> <\/span><span class=\"nt\">setWeight<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">100<\/span><\/code><\/pre><\/figure>\n<p>The <code>AnalysisTemplate<\/code> queries Prometheus (e.g. 5xx rate &lt; 1%) and aborts → rolls back automatically if it fails.<\/p>\n<h3>Canary for chosen users (feature flag style)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CanaryRouter<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Value<\/span><span class=\"p\">(<\/span><span class=\"s\">\"${canary.percent:5}\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">percent<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">boolean<\/span><span class=\"w\"> <\/span><span class=\"nf\">isCanaryUser<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">userId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">Math<\/span><span class=\"p\">.<\/span><span class=\"na\">floorMod<\/span><span class=\"p\">(<\/span><span class=\"n\">userId<\/span><span class=\"p\">.<\/span><span class=\"na\">hashCode<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"mi\">100<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"n\">percent<\/span><span class=\"p\">;<\/span><span class=\"w\">   <\/span><span class=\"c1\">// same user → same group always<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"sticky-users\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Sticky users<\/span><\/h2><div class=\"sec-body\"><p>If a user hits v2 on one request and v1 on the next, they may see a weird mix (new button disappears). So route by <strong>user id / cookie hash<\/strong> (as above), not randomly per request. Also, <strong>v1 and v2 must work with the same database and the same API contracts<\/strong> (backward compatible), because both run at once.<\/p><\/div><\/section>\n<section class=\"sec k-compare\" id=\"canary-vs-blue-green\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Canary vs Blue-Green<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Canary<\/th>\n<th>Blue-Green<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Gradual: 5% → 25% → 100%<\/td>\n<td>All at once<\/td>\n<\/tr>\n<tr>\n<td>Small blast radius<\/td>\n<td>Everyone affected if bad (but instant switch back)<\/td>\n<\/tr>\n<tr>\n<td>Needs good metrics + traffic splitting<\/td>\n<td>Simpler routing, needs 2× infra<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Small % first, watch metrics, then increase.<\/li>\n<li>Define thresholds and automatic rollback up front.<\/li>\n<li>Sticky users; both versions must be compatible.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"build-task-metrics-and-rollback-thresholds-for-5-25-100","t":"Build task – metrics and rollback thresholds for 5% → 25% → 100%","k":"build"},{"id":"spring-boot-side-expose-good-metrics","t":"Spring Boot side – expose good metrics","k":"code"},{"id":"routing-traffic","t":"Routing traffic","k":"default"},{"id":"sticky-users","t":"Sticky users","k":"default"},{"id":"canary-vs-blue-green","t":"Canary vs Blue-Green","k":"compare"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this old coal miners took a canary bird into the mine. if there was poison gas, the canary got sick first and the miners escaped in time. the 5% users are your \"canary\" – they show problems before everyone is hit. what problem does it solve? some bugs only appear with real traffic (real data, real load). releasing to 100% at once means a bug hits everyone . canary limits the blast radius . build task – metrics and rollback thresholds for 5% → 25% → 100% stage traffic to v2 wait move forward only if… 1 5% 15–30 min error rate ≤ v1 + 0.5%, p99 latency ≤ v1 × 1.2, no new 5xx types, no crash loops 2 25% 30–60 min same checks + business metrics ok (orders/min, payment success rate) 3 100% — keep old version ready for a few hours for quick rollback automatic rollback if at any stage: - http 5xx rate > 1% (or 2× v1) - p99 latency > 800 ms - payment success rate drops by > 2% - pods restarting always compare canary vs baseline (v1) at the same time , not against yesterday. spring boot side – expose good metrics dependencies: spring-boot-starter-actuator , micrometer-registry-prometheus . application.properties copy management.endpoints.web.exposure.include = health,prometheus management.metrics.tags.version = ${app_version:unknown} # tag every metric with version management.metrics.distribution.percentiles-histogram.http.server.requests = true now prometheus can compare http_server_requests_seconds and error counts by version . custom business metric: java copy @service @requiredargsconstructor public class paymentservice { private final meterregistry registry ; public void pay ( order o ) { try { // ... charge registry . counter ( \"payments\" , \"result\" , \"success\" ). increment (); } catch ( exception e ) { registry . counter ( \"payments\" , \"result\" , \"failure\" ). increment (); throw e ; } } } routing traffic spring cloud gateway weights application.yml copy spring : cloud : gateway : routes : - id : orders-v2-canary uri : http://order-v2:8080 predicates : [ \"path=/orders/**\" , \"weight=orders, 5\" ] - id : orders-v1 uri : http://order-v1:8080 predicates : [ \"path=/orders/**\" , \"weight=orders, 95\" ] kubernetes with argo rollouts (automatic steps + rollback) application.yml copy apiversion : argoproj.io/v1alpha1 kind : rollout metadata : { name : order-service } spec : strategy : canary : steps : - setweight : 5 - pause : { duration : 20m } - analysis : { templates : [ { templatename : error-rate-check } ] } - setweight : 25 - pause : { duration : 45m } - analysis : { templates : [ { templatename : error-rate-check } ] } - setweight : 100 the analysistemplate queries prometheus (e.g. 5xx rate < 1%) and aborts → rolls back automatically if it fails. canary for chosen users (feature flag style) java copy @component public class canaryrouter { @value ( \"${canary.percent:5}\" ) int percent ; public boolean iscanaryuser ( string userid ) { return math . floormod ( userid . hashcode (), 100 ) < percent ; // same user → same group always } } sticky users if a user hits v2 on one request and v1 on the next, they may see a weird mix (new button disappears). so route by user id / cookie hash (as above), not randomly per request. also, v1 and v2 must work with the same database and the same api contracts (backward compatible), because both run at once. canary vs blue-green canary blue-green gradual: 5% → 25% → 100% all at once small blast radius everyone affected if bad (but instant switch back) needs good metrics + traffic splitting simpler routing, needs 2× infra quick revision small % first, watch metrics, then increase. define thresholds and automatic rollback up front. sticky users; both versions must be compatible."},{"id":"cell","n":"Cell-Based Architecture","p":3,"focus":"Independent full copies of the stack, split by tenant or region.","build":"Draw cells, the cell router and the blast radius of one failure.","trade":"blast radius, cell routing, rebalancing","day":13,"theme":"Release and blast radius","title":"Cell-Based Architecture","lede":"Split your whole system into many <strong>independent, full copies<\/strong> (\"cells\"). Each cell serves only some customers (by tenant or region). If one cell fails, <strong>only its customers<\/strong> are affected.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>big hospital chain<\/strong> with many branches. Each branch has its own doctors, labs and pharmacy. If one branch has a power cut, patients of the other branches are fine. A front desk (call center) tells each patient which branch is theirs.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>In a normal setup, all customers share one big set of services and one database. A bad deploy, a poison message, a noisy customer or a DB overload can take down <strong>everyone<\/strong>.<\/p>\n<p>Cells reduce the <strong>blast radius<\/strong>:\n- 10 cells → one failure hits ~10% of customers, not 100%.\n- Deploy new versions <strong>cell by cell<\/strong> (like canary at the infrastructure level).\n- A noisy big customer can be moved to its own cell.<\/p>\n<p>Used by AWS, Slack, DoorDash, Salesforce, etc.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-draw-cells-the-router-and-blast-radius\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – draw cells, the router and blast radius<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"Cells and their blast radius: Cell Router thin and global · tenant → cell lookup tenants A, B, C Cell 1 API · Orders · Payment own DB + queue tenants D, E, F Cell 2 ✕ down API · Orders · Payment own DB + queue tenants G, H, I Cell 3 API · Orders · Payment own DB + queue Cell 2 fails → only tenants D, E, F are affected. Blast radius = 1/3 of customers.\"><figcaption>Cells and their blast radius<\/figcaption><div class=\"dg-body\"><div class=\"fan\" style=\"--n:3\"><div class=\"node s-accent\"><b>Cell Router<\/b><small>thin and global · tenant → cell lookup<\/small><\/div><div class=\"vedge plain\"><i><\/i><\/div><div class=\"fcols\"><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">tenants A, B, C<\/span><i><\/i><\/div><div class=\"node s-good\"><b>Cell 1<\/b><small>API · Orders · Payment<\/small><small>own DB + queue<\/small><\/div><\/div><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">tenants D, E, F<\/span><i><\/i><\/div><div class=\"node s-fail\"><b>Cell 2 ✕ down<\/b><small>API · Orders · Payment<\/small><small>own DB + queue<\/small><\/div><\/div><div class=\"fcol\"><div class=\"vedge\"><span class=\"el\">tenants G, H, I<\/span><i><\/i><\/div><div class=\"node s-good\"><b>Cell 3<\/b><small>API · Orders · Payment<\/small><small>own DB + queue<\/small><\/div><\/div><\/div><\/div><p class=\"dg-note t-warn\">Cell 2 fails → only tenants D, E, F are affected. Blast radius = 1/3 of customers.<\/p><\/div><\/figure>\n<p>Rules:\n- A cell has <strong>everything<\/strong> it needs (services + DB + cache + queues).\n- Cells <strong>don't call each other<\/strong> in the normal request path.\n- The <strong>router<\/strong> is the only shared part, so it must be <strong>very simple and very reliable<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-a-simple-cell-router\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – a simple cell router<\/span><\/h2><div class=\"sec-body\"><h3>Mapping tenant → cell<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Entity<\/span>\n<span class=\"nd\">@Table<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"tenant_cell\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@Getter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Setter<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">TenantCell<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Id<\/span><span class=\"w\"> <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">tenantId<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">cellId<\/span><span class=\"p\">;<\/span><span class=\"w\">              <\/span><span class=\"c1\">// \"cell-1\"<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CellDirectory<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">TenantCellRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">cellUrls<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Map<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">(<\/span>\n<span class=\"w\">            <\/span><span class=\"s\">\"cell-1\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"http://cell-1.internal\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">            <\/span><span class=\"s\">\"cell-2\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"http://cell-2.internal\"<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">            <\/span><span class=\"s\">\"cell-3\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"http://cell-3.internal\"<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Cacheable<\/span><span class=\"p\">(<\/span><span class=\"s\">\"tenantCell\"<\/span><span class=\"p\">)<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// router reads are cached – must be fast<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">urlFor<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">tenantId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">cell<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">tenantId<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">map<\/span><span class=\"p\">(<\/span><span class=\"n\">TenantCell<\/span><span class=\"p\">::<\/span><span class=\"n\">getCellId<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">orElseGet<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"s\">\"cell-\"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Math<\/span><span class=\"p\">.<\/span><span class=\"na\">floorMod<\/span><span class=\"p\">(<\/span><span class=\"n\">tenantId<\/span><span class=\"p\">.<\/span><span class=\"na\">hashCode<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">));<\/span><span class=\"w\"> <\/span><span class=\"c1\">// default placement<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">cellUrls<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">cell<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Gateway filter that sends the request to the right cell<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">CellRoutingFilter<\/span><span class=\"w\"> <\/span><span class=\"kd\">implements<\/span><span class=\"w\"> <\/span><span class=\"n\">GlobalFilter<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Ordered<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">CellDirectory<\/span><span class=\"w\"> <\/span><span class=\"n\">directory<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Mono<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Void<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">ServerWebExchange<\/span><span class=\"w\"> <\/span><span class=\"n\">ex<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">GatewayFilterChain<\/span><span class=\"w\"> <\/span><span class=\"n\">chain<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">tenant<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">ex<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequest<\/span><span class=\"p\">().<\/span><span class=\"na\">getHeaders<\/span><span class=\"p\">().<\/span><span class=\"na\">getFirst<\/span><span class=\"p\">(<\/span><span class=\"s\">\"X-Tenant-Id\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">tenant<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">ex<\/span><span class=\"p\">.<\/span><span class=\"na\">getResponse<\/span><span class=\"p\">().<\/span><span class=\"na\">setStatusCode<\/span><span class=\"p\">(<\/span><span class=\"n\">HttpStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">BAD_REQUEST<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ex<\/span><span class=\"p\">.<\/span><span class=\"na\">getResponse<\/span><span class=\"p\">().<\/span><span class=\"na\">setComplete<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// a blocking lookup on a reactive thread is NOT ok in production:<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// keep the map in memory (refreshed periodically) or use a reactive repository<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">URI<\/span><span class=\"w\"> <\/span><span class=\"n\">cellUri<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">URI<\/span><span class=\"p\">.<\/span><span class=\"na\">create<\/span><span class=\"p\">(<\/span><span class=\"n\">directory<\/span><span class=\"p\">.<\/span><span class=\"na\">urlFor<\/span><span class=\"p\">(<\/span><span class=\"n\">tenant<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">URI<\/span><span class=\"w\"> <\/span><span class=\"n\">target<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">UriComponentsBuilder<\/span><span class=\"p\">.<\/span><span class=\"na\">fromUri<\/span><span class=\"p\">(<\/span><span class=\"n\">ex<\/span><span class=\"p\">.<\/span><span class=\"na\">getRequest<\/span><span class=\"p\">().<\/span><span class=\"na\">getURI<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">scheme<\/span><span class=\"p\">(<\/span><span class=\"n\">cellUri<\/span><span class=\"p\">.<\/span><span class=\"na\">getScheme<\/span><span class=\"p\">()).<\/span><span class=\"na\">host<\/span><span class=\"p\">(<\/span><span class=\"n\">cellUri<\/span><span class=\"p\">.<\/span><span class=\"na\">getHost<\/span><span class=\"p\">()).<\/span><span class=\"na\">port<\/span><span class=\"p\">(<\/span><span class=\"n\">cellUri<\/span><span class=\"p\">.<\/span><span class=\"na\">getPort<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">build<\/span><span class=\"p\">(<\/span><span class=\"kc\">true<\/span><span class=\"p\">).<\/span><span class=\"na\">toUri<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ex<\/span><span class=\"p\">.<\/span><span class=\"na\">getAttributes<\/span><span class=\"p\">().<\/span><span class=\"na\">put<\/span><span class=\"p\">(<\/span><span class=\"n\">ServerWebExchangeUtils<\/span><span class=\"p\">.<\/span><span class=\"na\">GATEWAY_REQUEST_URL_ATTR<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">target<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">chain<\/span><span class=\"p\">.<\/span><span class=\"na\">filter<\/span><span class=\"p\">(<\/span><span class=\"n\">ex<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">getOrder<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">RouteToRequestUrlFilter<\/span><span class=\"p\">.<\/span><span class=\"na\">ROUTE_TO_URL_FILTER_ORDER<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">1<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>(Simpler options: DNS per tenant like <code>tenant-a.app.com → cell-1<\/code>, or a route per cell in the load balancer.)<\/p>\n<p>Each cell runs the <strong>same<\/strong> Spring Boot services with its own config:<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"c1\"># cell-2 application.properties<\/span>\n<span class=\"na\">cell.id<\/span><span class=\"o\">=<\/span><span class=\"s\">cell-2<\/span>\n<span class=\"na\">spring.datasource.url<\/span><span class=\"o\">=<\/span><span class=\"s\">jdbc:postgresql://db.cell-2.internal/app<\/span>\n<span class=\"na\">spring.kafka.bootstrap-servers<\/span><span class=\"o\">=<\/span><span class=\"s\">kafka.cell-2.internal:9092<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Blast radius:<\/strong> failure/bad deploy limited to one cell. Deploy cell by cell.<\/li>\n<li><strong>Cell routing:<\/strong> router must be thin, cached, highly available; mapping stored in a highly-available store. If the router fails, everything fails – so keep it dumb.<\/li>\n<li><strong>Rebalancing:<\/strong> moving a tenant from cell 2 to cell 4 = copy data, short write freeze or dual-write, flip the mapping, clean up. Needs tooling.<\/li>\n<li><strong>Cell size:<\/strong> fixed max size (e.g. 1000 tenants); when full, add a new cell instead of growing it → predictable, tested capacity.<\/li>\n<li><strong>Cost/complexity:<\/strong> many copies of everything; global features (e.g. \"search across all tenants\", global reports) need a separate aggregated system.<\/li>\n<li>Cells vs shards: sharding splits <strong>one database<\/strong>; cells split the <strong>whole stack<\/strong>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Many full independent copies of the stack; customers pinned to a cell.<\/li>\n<li>Thin router maps tenant → cell.<\/li>\n<li>Small blast radius; harder rebalancing and global features.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"build-task-draw-cells-the-router-and-blast-radius","t":"Build task – draw cells, the router and blast radius","k":"build"},{"id":"spring-boot-code-a-simple-cell-router","t":"Spring Boot code – a simple cell router","k":"code"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this a big hospital chain with many branches. each branch has its own doctors, labs and pharmacy. if one branch has a power cut, patients of the other branches are fine. a front desk (call center) tells each patient which branch is theirs. what problem does it solve? in a normal setup, all customers share one big set of services and one database. a bad deploy, a poison message, a noisy customer or a db overload can take down everyone . cells reduce the blast radius : - 10 cells → one failure hits ~10% of customers, not 100%. - deploy new versions cell by cell (like canary at the infrastructure level). - a noisy big customer can be moved to its own cell. used by aws, slack, doordash, salesforce, etc. build task – draw cells, the router and blast radius cells and their blast radius cell router thin and global · tenant → cell lookup tenants a, b, c cell 1 api · orders · payment own db + queue tenants d, e, f cell 2 ✕ down api · orders · payment own db + queue tenants g, h, i cell 3 api · orders · payment own db + queue cell 2 fails → only tenants d, e, f are affected. blast radius = 1/3 of customers. rules: - a cell has everything it needs (services + db + cache + queues). - cells don't call each other in the normal request path. - the router is the only shared part, so it must be very simple and very reliable . spring boot code – a simple cell router mapping tenant → cell java copy @entity @table ( name = \"tenant_cell\" ) @getter @setter public class tenantcell { @id private string tenantid ; private string cellid ; // \"cell-1\" } @service @requiredargsconstructor public class celldirectory { private final tenantcellrepository repo ; private final map < string , string > cellurls = map . of ( \"cell-1\" , \"http://cell-1.internal\" , \"cell-2\" , \"http://cell-2.internal\" , \"cell-3\" , \"http://cell-3.internal\" ); @cacheable ( \"tenantcell\" ) // router reads are cached – must be fast public string urlfor ( string tenantid ) { string cell = repo . findbyid ( tenantid ) . map ( tenantcell :: getcellid ) . orelseget (() -> \"cell-\" + ( math . floormod ( tenantid . hashcode (), 3 ) + 1 )); // default placement return cellurls . get ( cell ); } } gateway filter that sends the request to the right cell java copy @component @requiredargsconstructor public class cellroutingfilter implements globalfilter , ordered { private final celldirectory directory ; @override public mono < void > filter ( serverwebexchange ex , gatewayfilterchain chain ) { string tenant = ex . getrequest (). getheaders (). getfirst ( \"x-tenant-id\" ); if ( tenant == null ) { ex . getresponse (). setstatuscode ( httpstatus . bad_request ); return ex . getresponse (). setcomplete (); } // a blocking lookup on a reactive thread is not ok in production: // keep the map in memory (refreshed periodically) or use a reactive repository uri celluri = uri . create ( directory . urlfor ( tenant )); uri target = uricomponentsbuilder . fromuri ( ex . getrequest (). geturi ()) . scheme ( celluri . getscheme ()). host ( celluri . gethost ()). port ( celluri . getport ()) . build ( true ). touri (); ex . getattributes (). put ( serverwebexchangeutils . gateway_request_url_attr , target ); return chain . filter ( ex ); } @override public int getorder () { return routetorequesturlfilter . route_to_url_filter_order + 1 ; } } (simpler options: dns per tenant like tenant-a.app.com → cell-1 , or a route per cell in the load balancer.) each cell runs the same spring boot services with its own config: application.properties copy # cell-2 application.properties cell.id = cell-2 spring.datasource.url = jdbc:postgresql://db.cell-2.internal/app spring.kafka.bootstrap-servers = kafka.cell-2.internal:9092 points to explain in an interview blast radius: failure/bad deploy limited to one cell. deploy cell by cell. cell routing: router must be thin, cached, highly available; mapping stored in a highly-available store. if the router fails, everything fails – so keep it dumb. rebalancing: moving a tenant from cell 2 to cell 4 = copy data, short write freeze or dual-write, flip the mapping, clean up. needs tooling. cell size: fixed max size (e.g. 1000 tenants); when full, add a new cell instead of growing it → predictable, tested capacity. cost/complexity: many copies of everything; global features (e.g. \"search across all tenants\", global reports) need a separate aggregated system. cells vs shards: sharding splits one database ; cells split the whole stack . quick revision many full independent copies of the stack; customers pinned to a cell. thin router maps tenant → cell. small blast radius; harder rebalancing and global features."}],"days":[{"n":1,"theme":"Creational patterns","topics":["singleton","factory","builder"]},{"n":2,"theme":"Behavioural and structural","topics":["strategy","observer","proxy"]},{"n":3,"theme":"Wiring and data access","topics":["di","repository"]},{"n":4,"theme":"Resilience basics","topics":["retry","timeout","circuit"]},{"n":5,"theme":"Safe APIs and read/write split","topics":["idempotency","gateway","cqrs"]},{"n":6,"theme":"Distributed transactions","topics":["saga","outbox"]},{"n":7,"theme":"Priority 1 revision","topics":[]},{"n":8,"theme":"Protecting services","topics":["ratelimit","bulkhead","discovery"]},{"n":9,"theme":"Data and messaging","topics":["eventual","dlq","sharding"]},{"n":10,"theme":"Coordination","topics":["twopc","tcc","leader"]},{"n":11,"theme":"Event sourcing and revision","topics":["eventsourcing"]},{"n":12,"theme":"Migration patterns","topics":["strangler","acl","sidecar"]},{"n":13,"theme":"Release and blast radius","topics":["bluegreen","canary","cell"]},{"n":14,"theme":"Final revision","topics":[]}],"primer":{"title":"Java & Spring Boot in plain English","lede":"Everything you need to <em>read<\/em> the code in these notes, even if you have never written Java before.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>Think of <strong>Java<\/strong> as a language, like English. <strong>Spring Boot<\/strong> is a fully equipped kitchen built for that language: the stove, fridge and gas connection are already there, so you can start cooking (writing your app) straight away instead of building the kitchen first.<\/p>\n<p>You don't need to know every word of Java to follow these notes. You only need to recognise about ten ideas. They are all on this page.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"class-and-object-a-blueprint-and-a-house\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Class and object: a blueprint and a house<\/span><\/h2><div class=\"sec-body\"><p>A <strong>class<\/strong> is a blueprint. An <strong>object<\/strong> is a real thing built from that blueprint. One blueprint, many houses.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">User<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// the blueprint<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">;<\/span><span class=\"w\">            <\/span><span class=\"c1\">// a field: data each User has<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">age<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">User<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">age<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">   <\/span><span class=\"c1\">// constructor: how to build a User<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">age<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">age<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">greet<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">         <\/span><span class=\"c1\">// a method: something a User can do<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"s\">\"Hi, I am \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"n\">User<\/span><span class=\"w\"> <\/span><span class=\"n\">ravi<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">User<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Ravi\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"mi\">25<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// build one object from the blueprint<\/span>\n<span class=\"n\">ravi<\/span><span class=\"p\">.<\/span><span class=\"na\">greet<\/span><span class=\"p\">();<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// \"Hi, I am Ravi\"<\/span><\/code><\/pre><\/figure>\n<ul>\n<li><code>private<\/code> = hidden inside the class. <code>public<\/code> = anyone can use it.<\/li>\n<li><code>String<\/code> is text, <code>int<\/code> is a whole number, <code>double<\/code> is a decimal number, <code>boolean<\/code> is true/false.<\/li>\n<li><code>return<\/code> hands a value back to whoever called the method. <code>void<\/code> means the method gives nothing back.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-default\" id=\"interface-a-contract-a-plug-socket\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Interface: a contract (a plug socket)<\/span><\/h2><div class=\"sec-body\"><p>An <strong>interface<\/strong> lists what something must be able to do, without saying how. Any class that <code>implements<\/code> it must fill in the details. Like a plug socket: any charger with the right plug shape fits.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\

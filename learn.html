span class=\"n\">Object<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">shards<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">HashMap<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">shards<\/span><span class=\"p\">.<\/span><span class=\"na\">put<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">build<\/span><span class=\"p\">(<\/span><span class=\"s\">\"jdbc:postgresql://db0/orders\"<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">shards<\/span><span class=\"p\">.<\/span><span class=\"na\">put<\/span><span class=\"p\">(<\/span><span class=\"mi\">1<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">build<\/span><span class=\"p\">(<\/span><span class=\"s\">\"jdbc:postgresql://db1/orders\"<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">shards<\/span><span class=\"p\">.<\/span><span class=\"na\">put<\/span><span class=\"p\">(<\/span><span class=\"mi\">2<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">build<\/span><span class=\"p\">(<\/span><span class=\"s\">\"jdbc:postgresql://db2/orders\"<\/span><span class=\"p\">));<\/span>\n\n<span class=\"w\">        <\/span><span class=\"n\">ShardRoutingDataSource<\/span><span class=\"w\"> <\/span><span class=\"n\">ds<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ShardRoutingDataSource<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ds<\/span><span class=\"p\">.<\/span><span class=\"na\">setTargetDataSources<\/span><span class=\"p\">(<\/span><span class=\"n\">shards<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ds<\/span><span class=\"p\">.<\/span><span class=\"na\">setDefaultTargetDataSource<\/span><span class=\"p\">(<\/span><span class=\"n\">shards<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ds<\/span><span class=\"p\">.<\/span><span class=\"na\">afterPropertiesSet<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ds<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">DataSource<\/span><span class=\"w\"> <\/span><span class=\"nf\">build<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">url<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">HikariDataSource<\/span><span class=\"w\"> <\/span><span class=\"n\">h<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">HikariDataSource<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">h<\/span><span class=\"p\">.<\/span><span class=\"na\">setJdbcUrl<\/span><span class=\"p\">(<\/span><span class=\"n\">url<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">h<\/span><span class=\"p\">.<\/span><span class=\"na\">setUsername<\/span><span class=\"p\">(<\/span><span class=\"s\">\"app\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">h<\/span><span class=\"p\">.<\/span><span class=\"na\">setPassword<\/span><span class=\"p\">(<\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">getenv<\/span><span class=\"p\">(<\/span><span class=\"s\">\"DB_PASSWORD\"<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">h<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderShardService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">SHARDS<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">3<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">TransactionTemplate<\/span><span class=\"w\"> <\/span><span class=\"n\">tx<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"nf\">shardFor<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">customerId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">Math<\/span><span class=\"p\">.<\/span><span class=\"na\">floorMod<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"p\">.<\/span><span class=\"na\">hashCode<\/span><span class=\"p\">(<\/span><span class=\"n\">customerId<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">SHARDS<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Order<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">ordersOf<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">customerId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ShardContext<\/span><span class=\"p\">.<\/span><span class=\"na\">set<\/span><span class=\"p\">(<\/span><span class=\"n\">shardFor<\/span><span class=\"p\">(<\/span><span class=\"n\">customerId<\/span><span class=\"p\">));<\/span><span class=\"w\">      <\/span><span class=\"c1\">// must be set BEFORE the transaction starts<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">tx<\/span><span class=\"p\">.<\/span><span class=\"na\">execute<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findByCustomerId<\/span><span class=\"p\">(<\/span><span class=\"n\">customerId<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">finally<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">ShardContext<\/span><span class=\"p\">.<\/span><span class=\"na\">clear<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>In real projects, use tools like <strong>Apache ShardingSphere<\/strong>, <strong>Vitess<\/strong> (MySQL), <strong>Citus<\/strong> (Postgres), or databases that shard by themselves (<strong>MongoDB<\/strong>, <strong>Cassandra<\/strong>, <strong>DynamoDB<\/strong>, CockroachDB).<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"problems-to-know-trade-offs\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Problems to know (trade-offs)<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Hot shards:<\/strong> one shard gets much more traffic (a celebrity user, today's date range). Fix: better key, add randomness (\"salting\"), split the hot shard.<\/li>\n<li><strong>Resharding:<\/strong> adding shard #4 with <code>hash % N<\/code> means almost <strong>all<\/strong> keys move. Use <strong>consistent hashing<\/strong> or many <strong>virtual shards<\/strong> (e.g. 256 logical shards mapped to 4 servers; later just move some logical shards).<\/li>\n<li><strong>Cross-shard queries:<\/strong> joins, <code>count(*)<\/code>, sorting across shards are slow (scatter-gather). Design so most queries hit one shard.<\/li>\n<li><strong>Cross-shard transactions:<\/strong> no simple <code>@Transactional<\/code> across shards → use Saga/2PC.<\/li>\n<li>Unique ids across shards: use UUID/ Snowflake ids, not auto-increment.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-to-use-when-not\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When to use / when NOT<\/span><\/h2><div class=\"sec-body\"><p>Do sharding <strong>late<\/strong>. First try: indexes, caching, read replicas, bigger machine, archiving old data. Shard only when one primary truly can't handle the writes/data.<\/p><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Split data across servers by a shard key.<\/li>\n<li>Pick a key that matches your main query and spreads evenly.<\/li>\n<li>Watch out: hot shards, resharding, cross-shard queries.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"ways-to-split","t":"Ways to split","k":"idea"},{"id":"build-task-pick-a-shard-key-for-an-orders-table","t":"Build task – pick a shard key for an orders table","k":"build"},{"id":"spring-boot-simple-application-level-sharding","t":"Spring Boot – simple application-level sharding","k":"code"},{"id":"problems-to-know-trade-offs","t":"Problems to know (trade-offs)","k":"explain"},{"id":"when-to-use-when-not","t":"When to use / when NOT","k":"when"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this a school with 3000 students keeps attendance registers by section: a–f names in register 1, g–m in register 2, and so on. each teacher handles one register. faster than one giant register. what problem does it solve? one database server has limits: disk, cpu, memory, writes per second. read replicas help with reads , but all writes still go to one primary. sharding spreads both data and writes across many servers. words: - shard = one piece of the data (one db server/cluster). - shard key = the column used to decide which shard a row goes to. ways to split method how good bad hash sharding shard = hash(customerid) % n even spread range queries hit all shards; changing n moves most data range sharding ids 1–1m → shard 1, 1m–2m → shard 2 (or by date) range queries easy hot shard – newest range gets all the writes directory / lookup a table says \"customer 42 → shard 3\" very flexible lookup table is extra work and must be highly available geo sharding india users → shard in, eu → shard eu low latency, data laws uneven sizes build task – pick a shard key for an orders table common queries: 1. \"show my orders\" → where customer_id = ? (very common) 2. \"get order by id\" → where order_id = ? 3. \"daily sales report\" → across all orders (rare, analytics) shard key result order_id (hash) even spread, but \"my orders\" must ask all shards ❌ created_at (range) today's shard gets all the writes → hot shard ❌ customer_id (hash) ✅ all orders of a customer on one shard → \"my orders\" hits one shard. even spread because many customers. to make \"get order by id\" fast too: put the shard number inside the order id (e.g. orderid = shardid + sequence ), or keep a small lookup. for reports: copy data to a data warehouse instead of querying all shards. spring boot – simple application-level sharding java copy public class shardcontext { private static final threadlocal < integer > current = new threadlocal <> (); public static void set ( int shard ) { current . set ( shard ); } public static integer get () { return current . get (); } public static void clear () { current . remove (); } } public class shardroutingdatasource extends abstractroutingdatasource { @override protected object determinecurrentlookupkey () { return shardcontext . get (); // which datasource to use } } java copy @configuration public class shardconfig { @bean public datasource datasource () { map < object , object > shards = new hashmap <> (); shards . put ( 0 , build ( \"jdbc:postgresql://db0/orders\" )); shards . put ( 1 , build ( \"jdbc:postgresql://db1/orders\" )); shards . put ( 2 , build ( \"jdbc:postgresql://db2/orders\" )); shardroutingdatasource ds = new shardroutingdatasource (); ds . settargetdatasources ( shards ); ds . setdefaulttargetdatasource ( shards . get ( 0 )); ds . afterpropertiesset (); return ds ; } private datasource build ( string url ) { hikaridatasource h = new hikaridatasource (); h . setjdbcurl ( url ); h . setusername ( \"app\" ); h . setpassword ( system . getenv ( \"db_password\" )); return h ; } } java copy @service @requiredargsconstructor public class ordershardservice { private static final int shards = 3 ; private final orderrepository repo ; private final transactiontemplate tx ; private int shardfor ( long customerid ) { return ( int ) math . floormod ( long . hashcode ( customerid ), shards ); } public list < order > ordersof ( long customerid ) { shardcontext . set ( shardfor ( customerid )); // must be set before the transaction starts try { return tx . execute ( s -> repo . findbycustomerid ( customerid )); } finally { shardcontext . clear (); } } } in real projects, use tools like apache shardingsphere , vitess (mysql), citus (postgres), or databases that shard by themselves ( mongodb , cassandra , dynamodb , cockroachdb). problems to know (trade-offs) hot shards: one shard gets much more traffic (a celebrity user, today's date range). fix: better key, add randomness (\"salting\"), split the hot shard. resharding: adding shard #4 with hash % n means almost all keys move. use consistent hashing or many virtual shards (e.g. 256 logical shards mapped to 4 servers; later just move some logical shards). cross-shard queries: joins, count(*) , sorting across shards are slow (scatter-gather). design so most queries hit one shard. cross-shard transactions: no simple @transactional across shards → use saga/2pc. unique ids across shards: use uuid/ snowflake ids, not auto-increment. when to use / when not do sharding late . first try: indexes, caching, read replicas, bigger machine, archiving old data. shard only when one primary truly can't handle the writes/data. quick revision split data across servers by a shard key. pick a key that matches your main query and spreads evenly. watch out: hot shards, resharding, cross-shard queries."},{"id":"twopc","n":"Two-Phase Commit","p":2,"focus":"Prepare, then commit, across participants.","build":"Draw both phases and the coordinator-crash failure case.","trade":"blocking on coordinator failure, why microservices avoid it","day":10,"theme":"Coordination","title":"Two-Phase Commit (2PC)","lede":"A <strong>coordinator<\/strong> asks all participants \"can you commit?\" (phase 1). If <strong>everyone says yes<\/strong>, it tells all of them \"commit\" (phase 2); otherwise \"rollback\".","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>wedding ceremony<\/strong>. The priest (coordinator) asks the bride: \"Do you agree?\" – \"Yes\". The groom: \"Do you agree?\" – \"Yes\". Only when <strong>both<\/strong> say yes does the priest declare them married. If anyone says no, the wedding is off for both.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>You want <strong>one atomic transaction<\/strong> across <strong>two or more databases/resources<\/strong> – either all commit or none. Example: move money from a bank account in DB-1 to DB-2.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"the-two-phases-build-task-draw-both\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">The two phases (build task – draw both)<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"Two-phase commit: Phase 1 — PREPARE (voting) Coordinator prepare? DB-A writes to log, locks rows → YES prepare? DB-B writes to log, locks rows → YES Phase 2 — COMMIT (decision) Coordinator all said YES → commit DB-A, DB-B commit and release locks anyone said NO → rollback DB-A, DB-B undo and release locks\"><figcaption>Two-phase commit<\/figcaption><div class=\"dg-body\"><div class=\"dg-title\">Phase 1 — PREPARE (voting)<\/div><div class=\"branch\"><div class=\"node s-accent\"><b>Coordinator<\/b><\/div><div class=\"stub\"><\/div><div class=\"targets\"><div class=\"trow\"><div class=\"edge\"><span class=\"el\">prepare?<\/span><i><\/i><\/div><div class=\"node s-good\"><b>DB-A<\/b><small>writes to log, locks rows → YES<\/small><\/div><\/div><div class=\"trow\"><div class=\"edge\"><span class=\"el\">prepare?<\/span><i><\/i><\/div><div class=\"node s-good\"><b>DB-B<\/b><small>writes to log, locks rows → YES<\/small><\/div><\/div><\/div><\/div><div class=\"dg-title\">Phase 2 — COMMIT (decision)<\/div><div class=\"branch\"><div class=\"node s-accent\"><b>Coordinator<\/b><\/div><div class=\"stub\"><\/div><div class=\"targets\"><div class=\"trow\"><div class=\"edge\"><span class=\"el\">all said YES → commit<\/span><i><\/i><\/div><div class=\"node s-good\"><b>DB-A, DB-B<\/b><small>commit and release locks<\/small><\/div><\/div><div class=\"trow\"><div class=\"edge\"><span class=\"el\">anyone said NO → rollback<\/span><i><\/i><\/div><div class=\"node s-fail\"><b>DB-A, DB-B<\/b><small>undo and release locks<\/small><\/div><\/div><\/div><\/div><\/div><\/figure>\n<p>Important: after saying <strong>YES<\/strong>, a participant <strong>promises<\/strong> it can commit, and must <strong>wait<\/strong> for the coordinator's decision while holding locks.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"the-coordinator-crash-failure-case\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">The coordinator-crash failure case<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"The coordinator-crash problem: Coordinator sends PREPARE A says YES, B says YES Coordinator crashes before it sends COMMIT or ROLLBACK A and B are stuck in &quot;prepared&quot; they can&#x27;t commit (maybe the other said NO?) and can&#x27;t roll back (maybe the decision was COMMIT?) Their rows stay LOCKED other transactions have to wait until the coordinator comes back\"><figcaption>The coordinator-crash problem<\/figcaption><div class=\"dg-body\"><ol class=\"tl\"><li class=\"\"><b>Coordinator sends PREPARE<\/b><span>A says YES, B says YES<\/span><\/li><li class=\"t-fail\"><b>Coordinator crashes<\/b><span>before it sends COMMIT or ROLLBACK<\/span><\/li><li class=\"t-warn\"><b>A and B are stuck in &quot;prepared&quot;<\/b><span>they can&#x27;t commit (maybe the other said NO?) and can&#x27;t roll back (maybe the decision was COMMIT?)<\/span><\/li><li class=\"t-warn\"><b>Their rows stay LOCKED<\/b><span>other transactions have to wait until the coordinator comes back<\/span><\/li><\/ol><\/div><\/figure>\n<p>This is why 2PC is called a <strong>blocking protocol<\/strong>. They stay blocked until the coordinator recovers and reads its decision log. (3PC and consensus-based commit try to fix this but are complex.)<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"java-spring-boot-code-jta-xa-transactions\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Java / Spring Boot code – JTA (XA transactions)<\/span><\/h2><div class=\"sec-body\"><p>Java supports 2PC with <strong>JTA<\/strong> and <strong>XA<\/strong> drivers. Spring Boot can use <strong>Atomikos<\/strong> or <strong>Narayana<\/strong> as the transaction manager.<\/p>\n<figure class=\"code\" data-lang=\"xml\"><figcaption><span class=\"lang\">pom.xml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"cm\">&lt;!-- Spring Boot 3: Narayana starter --&gt;<\/span>\n<span class=\"nt\">&lt;dependency&gt;<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&lt;groupId&gt;<\/span>dev.snowdrop<span class=\"nt\">&lt;/groupId&gt;<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&lt;artifactId&gt;<\/span>narayana-spring-boot-starter<span class=\"nt\">&lt;/artifactId&gt;<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">&lt;version&gt;<\/span>3.2.0<span class=\"nt\">&lt;/version&gt;<\/span>\n<span class=\"nt\">&lt;/dependency&gt;<\/span><\/code><\/pre><\/figure>\n<p>Configure two XA DataSources (simplified):<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">XaConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Primary<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">DataSource<\/span><span class=\"w\"> <\/span><span class=\"nf\">accountsDb<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">xa<\/span><span class=\"p\">(<\/span><span class=\"s\">\"jdbc:postgresql://db-a/accounts\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">DataSource<\/span><span class=\"w\"> <\/span><span class=\"nf\">ledgerDb<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">xa<\/span><span class=\"p\">(<\/span><span class=\"s\">\"jdbc:postgresql://db-b/ledger\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">DataSource<\/span><span class=\"w\"> <\/span><span class=\"nf\">xa<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">url<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">PGXADataSource<\/span><span class=\"w\"> <\/span><span class=\"n\">ds<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">PGXADataSource<\/span><span class=\"p\">();<\/span><span class=\"w\">   <\/span><span class=\"c1\">// XA-capable driver<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ds<\/span><span class=\"p\">.<\/span><span class=\"na\">setUrl<\/span><span class=\"p\">(<\/span><span class=\"n\">url<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ds<\/span><span class=\"p\">.<\/span><span class=\"na\">setUser<\/span><span class=\"p\">(<\/span><span class=\"s\">\"app\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ds<\/span><span class=\"p\">.<\/span><span class=\"na\">setPassword<\/span><span class=\"p\">(<\/span><span class=\"n\">System<\/span><span class=\"p\">.<\/span><span class=\"na\">getenv<\/span><span class=\"p\">(<\/span><span class=\"s\">\"DB_PASSWORD\"<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ds<\/span><span class=\"p\">;<\/span><span class=\"w\">                                  <\/span><span class=\"c1\">// the starter wraps it in a pooled, JTA-aware DataSource<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">TransferService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">JdbcTemplate<\/span><span class=\"w\"> <\/span><span class=\"n\">accountsJdbc<\/span><span class=\"p\">;<\/span><span class=\"w\">     <\/span><span class=\"c1\">// on accountsDb<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">JdbcTemplate<\/span><span class=\"w\"> <\/span><span class=\"n\">ledgerJdbc<\/span><span class=\"p\">;<\/span><span class=\"w\">       <\/span><span class=\"c1\">// on ledgerDb<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span><span class=\"w\">     <\/span><span class=\"c1\">// JtaTransactionManager → 2PC across both DBs<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">transfer<\/span><span class=\"p\">(<\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">from<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">accountsJdbc<\/span><span class=\"p\">.<\/span><span class=\"na\">update<\/span><span class=\"p\">(<\/span><span class=\"s\">\"update accounts set balance = balance - ? where id = ?\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">amount<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">from<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">ledgerJdbc<\/span><span class=\"p\">.<\/span><span class=\"na\">update<\/span><span class=\"p\">(<\/span><span class=\"s\">\"insert into ledger(account_id, amount) values (?, ?)\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">from<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"o\">-<\/span><span class=\"n\">amount<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// if anything throws, BOTH are rolled back<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>(Postgres needs <code>max_prepared_transactions &gt; 0<\/code> for XA.)<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"why-microservices-avoid-2pc\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Why microservices avoid 2PC<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Blocking:<\/strong> locks held while waiting; coordinator crash = stuck rows.<\/li>\n<li><strong>Slow:<\/strong> extra network round trips; all participants must be up at once → lower availability.<\/li>\n<li><strong>Tight coupling:<\/strong> every service must support XA and share one coordinator.<\/li>\n<li><strong>Not supported<\/strong> by many modern tools: Kafka (outside its own transactions), most REST APIs, many NoSQL DBs.<\/li>\n<li>It does not scale well across many services.<\/li>\n<\/ul>\n<p>Microservices instead use <strong>Saga<\/strong>, <strong>Transactional Outbox<\/strong>, <strong>TCC<\/strong>, and <strong>idempotent<\/strong> operations → accept eventual consistency.<\/p><\/div><\/section>\n<section class=\"sec k-when\" id=\"when-is-2pc-ok\" data-kind=\"when\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">When is 2PC OK?<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Inside one company's database cluster (some databases use it internally, e.g. distributed SQL like CockroachDB/Spanner with consensus).<\/li>\n<li>Legacy enterprise systems: one app writing to DB + JMS queue with XA.<\/li>\n<li>Small number of reliable resources, low traffic.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Phase 1 prepare/vote, phase 2 commit/rollback.<\/li>\n<li>Coordinator crash after YES → participants blocked with locks.<\/li>\n<li>Microservices prefer Saga/Outbox over 2PC.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"the-two-phases-build-task-draw-both","t":"The two phases (build task – draw both)","k":"build"},{"id":"the-coordinator-crash-failure-case","t":"The coordinator-crash failure case","k":"default"},{"id":"java-spring-boot-code-jta-xa-transactions","t":"Java / Spring Boot code – JTA (XA transactions)","k":"code"},{"id":"why-microservices-avoid-2pc","t":"Why microservices avoid 2PC","k":"default"},{"id":"when-is-2pc-ok","t":"When is 2PC OK?","k":"when"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a wedding ceremony . the priest (coordinator) asks the bride: \"do you agree?\" – \"yes\". the groom: \"do you agree?\" – \"yes\". only when both say yes does the priest declare them married. if anyone says no, the wedding is off for both. what problem does it solve? you want one atomic transaction across two or more databases/resources – either all commit or none. example: move money from a bank account in db-1 to db-2. the two phases (build task – draw both) two-phase commit phase 1 — prepare (voting) coordinator prepare? db-a writes to log, locks rows → yes prepare? db-b writes to log, locks rows → yes phase 2 — commit (decision) coordinator all said yes → commit db-a, db-b commit and release locks anyone said no → rollback db-a, db-b undo and release locks important: after saying yes , a participant promises it can commit, and must wait for the coordinator's decision while holding locks. the coordinator-crash failure case the coordinator-crash problem coordinator sends prepare a says yes, b says yes coordinator crashes before it sends commit or rollback a and b are stuck in \"prepared\" they can't commit (maybe the other said no?) and can't roll back (maybe the decision was commit?) their rows stay locked other transactions have to wait until the coordinator comes back this is why 2pc is called a blocking protocol . they stay blocked until the coordinator recovers and reads its decision log. (3pc and consensus-based commit try to fix this but are complex.) java / spring boot code – jta (xa transactions) java supports 2pc with jta and xa drivers. spring boot can use atomikos or narayana as the transaction manager. pom.xml copy <!-- spring boot 3: narayana starter --> <dependency> <groupid> dev.snowdrop <\/groupid> <artifactid> narayana-spring-boot-starter <\/artifactid> <version> 3.2.0 <\/version> <\/dependency> configure two xa datasources (simplified): java copy @configuration public class xaconfig { @bean @primary public datasource accountsdb () { return xa ( \"jdbc:postgresql://db-a/accounts\" ); } @bean public datasource ledgerdb () { return xa ( \"jdbc:postgresql://db-b/ledger\" ); } private datasource xa ( string url ) { pgxadatasource ds = new pgxadatasource (); // xa-capable driver ds . seturl ( url ); ds . setuser ( \"app\" ); ds . setpassword ( system . getenv ( \"db_password\" )); return ds ; // the starter wraps it in a pooled, jta-aware datasource } } java copy @service @requiredargsconstructor public class transferservice { private final jdbctemplate accountsjdbc ; // on accountsdb private final jdbctemplate ledgerjdbc ; // on ledgerdb @transactional // jtatransactionmanager → 2pc across both dbs public void transfer ( long from , double amount ) { accountsjdbc . update ( \"update accounts set balance = balance - ? where id = ?\" , amount , from ); ledgerjdbc . update ( \"insert into ledger(account_id, amount) values (?, ?)\" , from , - amount ); // if anything throws, both are rolled back } } (postgres needs max_prepared_transactions > 0 for xa.) why microservices avoid 2pc blocking: locks held while waiting; coordinator crash = stuck rows. slow: extra network round trips; all participants must be up at once → lower availability. tight coupling: every service must support xa and share one coordinator. not supported by many modern tools: kafka (outside its own transactions), most rest apis, many nosql dbs. it does not scale well across many services. microservices instead use saga , transactional outbox , tcc , and idempotent operations → accept eventual consistency. when is 2pc ok? inside one company's database cluster (some databases use it internally, e.g. distributed sql like cockroachdb/spanner with consensus). legacy enterprise systems: one app writing to db + jms queue with xa. small number of reliable resources, low traffic. quick revision phase 1 prepare/vote, phase 2 commit/rollback. coordinator crash after yes → participants blocked with locks. microservices prefer saga/outbox over 2pc."},{"id":"tcc","n":"TCC (Try-Confirm-Cancel)","p":2,"focus":"Reserve first, then confirm or cancel.","build":"Seat booking flow with try, confirm and cancel steps.","trade":"no isolation, cancel must be idempotent","day":10,"theme":"Coordination","title":"TCC (Try – Confirm – Cancel)","lede":"First <strong>reserve<\/strong> the resource (Try). If every service reserved OK, <strong>Confirm<\/strong> all of them. If any fails, <strong>Cancel<\/strong> all reservations.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p><strong>Booking a movie seat<\/strong> on an app: when you select a seat, it's <strong>held for 10 minutes<\/strong> (Try). If you pay, the seat is <strong>booked<\/strong> (Confirm). If you don't pay or payment fails, the hold is <strong>released<\/strong> (Cancel) and others can book it.<\/p><\/div><\/section>\n<section class=\"sec k-compare\" id=\"how-is-it-different-from-saga\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How is it different from Saga?<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Saga<\/th>\n<th>TCC<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Each step <strong>really does<\/strong> the work, then <strong>undoes<\/strong> on failure (refund)<\/td>\n<td>First only <strong>reserves<\/strong>, nothing final happens until Confirm<\/td>\n<\/tr>\n<tr>\n<td>Others may see the real effect before undo<\/td>\n<td>Others see only a \"reserved/held\" state<\/td>\n<\/tr>\n<tr>\n<td>Compensation can be messy (refund fees, emails sent)<\/td>\n<td>Cancel is just \"release the hold\" – cleaner<\/td>\n<\/tr>\n<tr>\n<td>Easier to add to existing services<\/td>\n<td>Every service must support 3 operations<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>TCC is like 2PC done at the <strong>business level<\/strong> (no DB locks held across services).<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"the-three-steps\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">The three steps<\/span><\/h2><div class=\"sec-body\"><ol>\n<li><strong>Try<\/strong> – check rules and <strong>reserve<\/strong> (seat → HELD, money → frozen). Must be fast.<\/li>\n<li><strong>Confirm<\/strong> – make the reservation final (seat → BOOKED). Must succeed if Try succeeded.<\/li>\n<li><strong>Cancel<\/strong> – release the reservation (seat → AVAILABLE).<\/li>\n<\/ol><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-seat-booking-flow-in-spring-boot\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – seat booking flow in Spring Boot<\/span><\/h2><div class=\"sec-body\"><h3>Seat entity<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Entity<\/span>\n<span class=\"nd\">@Getter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Setter<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">Seat<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Id<\/span><span class=\"w\"> <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">seatNo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Enumerated<\/span><span class=\"p\">(<\/span><span class=\"n\">EnumType<\/span><span class=\"p\">.<\/span><span class=\"na\">STRING<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatStatus<\/span><span class=\"w\"> <\/span><span class=\"n\">status<\/span><span class=\"p\">;<\/span><span class=\"w\">          <\/span><span class=\"c1\">// AVAILABLE, HELD, BOOKED<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">holdId<\/span><span class=\"p\">;<\/span><span class=\"w\">              <\/span><span class=\"c1\">// which booking holds it<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">Instant<\/span><span class=\"w\"> <\/span><span class=\"n\">holdExpiresAt<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Version<\/span><span class=\"w\"> <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">version<\/span><span class=\"p\">;<\/span><span class=\"w\">      <\/span><span class=\"c1\">// stops two people holding at once<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Seat service with Try / Confirm / Cancel<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">SeatTccService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">seats<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">tryHold<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Seat<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">seats<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">seatNo<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">bookingId<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getHoldId<\/span><span class=\"p\">()))<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"p\">;<\/span><span class=\"w\">                 <\/span><span class=\"c1\">// idempotent: already held by us<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getStatus<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">!=<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">AVAILABLE<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalStateException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Seat not available\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">HELD<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setHoldId<\/span><span class=\"p\">(<\/span><span class=\"n\">bookingId<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setHoldExpiresAt<\/span><span class=\"p\">(<\/span><span class=\"n\">Instant<\/span><span class=\"p\">.<\/span><span class=\"na\">now<\/span><span class=\"p\">().<\/span><span class=\"na\">plus<\/span><span class=\"p\">(<\/span><span class=\"n\">Duration<\/span><span class=\"p\">.<\/span><span class=\"na\">ofMinutes<\/span><span class=\"p\">(<\/span><span class=\"mi\">10<\/span><span class=\"p\">)));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">confirm<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Seat<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">seats<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">seatNo<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getStatus<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">BOOKED<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getHoldId<\/span><span class=\"p\">()))<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"p\">;<\/span><span class=\"w\"> <\/span><span class=\"c1\">// idempotent<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getStatus<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">!=<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">HELD<\/span><span class=\"w\"> <\/span><span class=\"o\">||<\/span><span class=\"w\"> <\/span><span class=\"o\">!<\/span><span class=\"n\">bookingId<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getHoldId<\/span><span class=\"p\">()))<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalStateException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"No valid hold\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">BOOKED<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setHoldExpiresAt<\/span><span class=\"p\">(<\/span><span class=\"kc\">null<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">cancel<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Seat<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">seats<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">seatNo<\/span><span class=\"p\">).<\/span><span class=\"na\">orElse<\/span><span class=\"p\">(<\/span><span class=\"kc\">null<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getStatus<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">==<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">HELD<\/span><span class=\"w\"> <\/span><span class=\"o\">&amp;&amp;<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">.<\/span><span class=\"na\">equals<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">getHoldId<\/span><span class=\"p\">()))<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\">   <\/span><span class=\"c1\">// only release OUR hold<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">AVAILABLE<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setHoldId<\/span><span class=\"p\">(<\/span><span class=\"kc\">null<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setHoldExpiresAt<\/span><span class=\"p\">(<\/span><span class=\"kc\">null<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// already cancelled / never held → do nothing (idempotent)<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"c1\">// safety net: release expired holds if the coordinator never called confirm/cancel<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Scheduled<\/span><span class=\"p\">(<\/span><span class=\"n\">fixedDelay<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">60_000<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">releaseExpired<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">seats<\/span><span class=\"p\">.<\/span><span class=\"na\">findByStatusAndHoldExpiresAtBefore<\/span><span class=\"p\">(<\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">HELD<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Instant<\/span><span class=\"p\">.<\/span><span class=\"na\">now<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">             <\/span><span class=\"p\">.<\/span><span class=\"na\">forEach<\/span><span class=\"p\">(<\/span><span class=\"n\">s<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"n\">SeatStatus<\/span><span class=\"p\">.<\/span><span class=\"na\">AVAILABLE<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"n\">s<\/span><span class=\"p\">.<\/span><span class=\"na\">setHoldId<\/span><span class=\"p\">(<\/span><span class=\"kc\">null<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">});<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>The <strong>wallet/payment service<\/strong> has the same three: <code>tryFreeze(amount)<\/code>, <code>confirm()<\/code> (deduct), <code>cancel()<\/code> (unfreeze).<\/p>\n<h3>Coordinator<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">BookingCoordinator<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">SeatTccService<\/span><span class=\"w\"> <\/span><span class=\"n\">seat<\/span><span class=\"p\">;<\/span><span class=\"w\">       <\/span><span class=\"c1\">// in real life: remote clients<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">WalletTccClient<\/span><span class=\"w\"> <\/span><span class=\"n\">wallet<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">book<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">userId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">double<\/span><span class=\"w\"> <\/span><span class=\"n\">price<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">UUID<\/span><span class=\"p\">.<\/span><span class=\"na\">randomUUID<\/span><span class=\"p\">().<\/span><span class=\"na\">toString<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// TRY phase<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">seat<\/span><span class=\"p\">.<\/span><span class=\"na\">tryHold<\/span><span class=\"p\">(<\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">wallet<\/span><span class=\"p\">.<\/span><span class=\"na\">tryFreeze<\/span><span class=\"p\">(<\/span><span class=\"n\">userId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">price<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// CANCEL phase – call on all, even ones that may not have run<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">safe<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">seat<\/span><span class=\"p\">.<\/span><span class=\"na\">cancel<\/span><span class=\"p\">(<\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">safe<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">wallet<\/span><span class=\"p\">.<\/span><span class=\"na\">cancel<\/span><span class=\"p\">(<\/span><span class=\"n\">userId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalStateException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Booking failed: \"<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">getMessage<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// CONFIRM phase – retry until success (confirm must not fail logically)<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">retryForever<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">seat<\/span><span class=\"p\">.<\/span><span class=\"na\">confirm<\/span><span class=\"p\">(<\/span><span class=\"n\">seatNo<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">retryForever<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">wallet<\/span><span class=\"p\">.<\/span><span class=\"na\">confirm<\/span><span class=\"p\">(<\/span><span class=\"n\">userId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">bookingId<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>No isolation:<\/strong> between Try and Confirm, other users see \"HELD\" / frozen money. That's fine for seats, but you must design these in-between states.<\/li>\n<li><strong>Cancel must be idempotent:<\/strong> the coordinator may call Cancel twice (retry after timeout). Calling it again must do nothing harmful.<\/li>\n<li><strong>Empty cancel (null compensation):<\/strong> Cancel may arrive for a Try that never ran (Try request got lost). Cancel must handle \"nothing to cancel\".<\/li>\n<li><strong>Hanging Try:<\/strong> a delayed Try arrives <em>after<\/em> Cancel → it must be rejected, otherwise the seat stays held forever. Keep a record of cancelled booking ids.<\/li>\n<li>Confirm/Cancel are retried until they succeed; holds have <strong>expiry<\/strong> as a safety net.<\/li>\n<li>Frameworks: <strong>Seata<\/strong> (TCC mode) in Java.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Try = reserve, Confirm = finalize, Cancel = release.<\/li>\n<li>Cleaner than Saga compensation, but every service needs 3 APIs.<\/li>\n<li>Idempotent Cancel, handle empty cancel and hanging try, use hold expiry.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"how-is-it-different-from-saga","t":"How is it different from Saga?","k":"compare"},{"id":"the-three-steps","t":"The three steps","k":"idea"},{"id":"build-task-seat-booking-flow-in-spring-boot","t":"Build task – seat booking flow in Spring Boot","k":"build"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this booking a movie seat on an app: when you select a seat, it's held for 10 minutes (try). if you pay, the seat is booked (confirm). if you don't pay or payment fails, the hold is released (cancel) and others can book it. how is it different from saga? saga tcc each step really does the work, then undoes on failure (refund) first only reserves , nothing final happens until confirm others may see the real effect before undo others see only a \"reserved/held\" state compensation can be messy (refund fees, emails sent) cancel is just \"release the hold\" – cleaner easier to add to existing services every service must support 3 operations tcc is like 2pc done at the business level (no db locks held across services). the three steps try – check rules and reserve (seat → held, money → frozen). must be fast. confirm – make the reservation final (seat → booked). must succeed if try succeeded. cancel – release the reservation (seat → available). build task – seat booking flow in spring boot seat entity java copy @entity @getter @setter public class seat { @id private string seatno ; @enumerated ( enumtype . string ) private seatstatus status ; // available, held, booked private string holdid ; // which booking holds it private instant holdexpiresat ; @version private long version ; // stops two people holding at once } seat service with try / confirm / cancel java copy @service @requiredargsconstructor public class seattccservice { private final seatrepository seats ; @transactional public void tryhold ( string seatno , string bookingid ) { seat s = seats . findbyid ( seatno ). orelsethrow (); if ( bookingid . equals ( s . getholdid ())) return ; // idempotent: already held by us if ( s . getstatus () != seatstatus . available ) throw new illegalstateexception ( \"seat not available\" ); s . setstatus ( seatstatus . held ); s . setholdid ( bookingid ); s . setholdexpiresat ( instant . now (). plus ( duration . ofminutes ( 10 ))); } @transactional public void confirm ( string seatno , string bookingid ) { seat s = seats . findbyid ( seatno ). orelsethrow (); if ( s . getstatus () == seatstatus . booked && bookingid . equals ( s . getholdid ())) return ; // idempotent if ( s . getstatus () != seatstatus . held || ! bookingid . equals ( s . getholdid ())) throw new illegalstateexception ( \"no valid hold\" ); s . setstatus ( seatstatus . booked ); s . setholdexpiresat ( null ); } @transactional public void cancel ( string seatno , string bookingid ) { seat s = seats . findbyid ( seatno ). orelse ( null ); if ( s == null ) return ; if ( s . getstatus () == seatstatus . held && bookingid . equals ( s . getholdid ())) { // only release our hold s . setstatus ( seatstatus . available ); s . setholdid ( null ); s . setholdexpiresat ( null ); } // already cancelled / never held → do nothing (idempotent) } // safety net: release expired holds if the coordinator never called confirm/cancel @scheduled ( fixeddelay = 60_000 ) @transactional public void releaseexpired () { seats . findbystatusandholdexpiresatbefore ( seatstatus . held , instant . now ()) . foreach ( s -> { s . setstatus ( seatstatus . available ); s . setholdid ( null ); }); } } the wallet/payment service has the same three: tryfreeze(amount) , confirm() (deduct), cancel() (unfreeze). coordinator java copy @service @requiredargsconstructor public class bookingcoordinator { private final seattccservice seat ; // in real life: remote clients private final wallettccclient wallet ; public string book ( string seatno , string userid , double price ) { string bookingid = uuid . randomuuid (). tostring (); try { // try phase seat . tryhold ( seatno , bookingid ); wallet . tryfreeze ( userid , price , bookingid ); } catch ( exception e ) { // cancel phase – call on all, even ones that may not have run safe (() -> seat . cancel ( seatno , bookingid )); safe (() -> wallet . cancel ( userid , bookingid )); throw new illegalstateexception ( \"booking failed: \" + e . getmessage ()); } // confirm phase – retry until success (confirm must not fail logically) retryforever (() -> seat . confirm ( seatno , bookingid )); retryforever (() -> wallet . confirm ( userid , bookingid )); return bookingid ; } } points to explain in an interview no isolation: between try and confirm, other users see \"held\" / frozen money. that's fine for seats, but you must design these in-between states. cancel must be idempotent: the coordinator may call cancel twice (retry after timeout). calling it again must do nothing harmful. empty cancel (null compensation): cancel may arrive for a try that never ran (try request got lost). cancel must handle \"nothing to cancel\". hanging try: a delayed try arrives after cancel → it must be rejected, otherwise the seat stays held forever. keep a record of cancelled booking ids. confirm/cancel are retried until they succeed; holds have expiry as a safety net. frameworks: seata (tcc mode) in java. quick revision try = reserve, confirm = finalize, cancel = release. cleaner than saga compensation, but every service needs 3 apis. idempotent cancel, handle empty cancel and hanging try, use hold expiry."},{"id":"leader","n":"Leader Election","p":2,"focus":"Exactly one node acts as leader.","build":"Walk through a Raft election: terms, votes, heartbeats.","trade":"split brain, quorum, leases","day":10,"theme":"Coordination","title":"Leader Election","lede":"Out of many servers running the same app, <strong>pick exactly one as the leader<\/strong> to do a special job. If the leader dies, the others <strong>elect a new one<\/strong>.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>class monitor<\/strong>. Only one student is monitor at a time. If the monitor is absent for many days, the class chooses a new one. If two students both think they are monitor, there's chaos – that's \"split brain\".<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>You run 5 copies of your Spring Boot app. Some jobs must run <strong>only once<\/strong>:\n- A nightly report / scheduled job (<code>@Scheduled<\/code> would run on <strong>all 5<\/strong>!)\n- The outbox poller\n- Writing to the primary database in a replicated system (Raft, Kafka controller, etc.)<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"key-ideas\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Key ideas<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Quorum (majority):<\/strong> with 5 nodes, a leader needs at least 3 votes. Two groups can't both have a majority → only one leader.<\/li>\n<li><strong>Heartbeats:<\/strong> the leader keeps sending \"I'm alive\". If followers don't hear it for a while, they start an election.<\/li>\n<li><strong>Term / epoch:<\/strong> a number that increases with every election. Old leaders with an old term are ignored.<\/li>\n<li><strong>Lease:<\/strong> leadership is valid only for a time (e.g. 10 s) and must be renewed.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-walk-through-a-raft-election\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – walk through a Raft election<\/span><\/h2><div class=\"sec-body\"><p>Raft is a famous, easy-to-understand consensus algorithm (used in etcd, Consul, Kafka KRaft).<\/p>\n<p>Each node is <strong>Follower<\/strong>, <strong>Candidate<\/strong>, or <strong>Leader<\/strong>.<\/p>\n<figure class=\"dg\" role=\"img\" aria-label=\"A Raft election, step by step: Everyone is a FOLLOWER (term 1) leader A sends regular heartbeats A crashes followers stop hearing heartbeats C&#x27;s random timer fires first C becomes CANDIDATE, raises the term to 2, votes for itself and asks everyone: RequestVote(term 2) Nodes vote each node gives at most ONE vote per term, and only to a candidate whose log is at least as up to date C gets 3 of 5 votes a majority, so C is LEADER for term 2 C sends heartbeats the others stay followers Old leader A comes back it sees term 2 &gt; its term 1, so it quietly becomes a follower\"><figcaption>A Raft election, step by step<\/figcaption><div class=\"dg-body\"><ol class=\"tl\"><li class=\"\"><b>Everyone is a FOLLOWER (term 1)<\/b><span>leader A sends regular heartbeats<\/span><\/li><li class=\"t-fail\"><b>A crashes<\/b><span>followers stop hearing heartbeats<\/span><\/li><li class=\"\"><b>C&#x27;s random timer fires first<\/b><span>C becomes CANDIDATE, raises the term to 2, votes for itself and asks everyone: RequestVote(term 2)<\/span><\/li><li class=\"\"><b>Nodes vote<\/b><span>each node gives at most ONE vote per term, and only to a candidate whose log is at least as up to date<\/span><\/li><li class=\"t-good\"><b>C gets 3 of 5 votes<\/b><span>a majority, so C is LEADER for term 2<\/span><\/li><li class=\"\"><b>C sends heartbeats<\/b><span>the others stay followers<\/span><\/li><li class=\"\"><b>Old leader A comes back<\/b><span>it sees term 2 &gt; its term 1, so it quietly becomes a follower<\/span><\/li><\/ol><\/div><\/figure>\n<p>Why random timeouts? So that usually only one node starts an election at a time; otherwise votes split and they retry.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-leader-election-you-can-actually-use\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – leader election you can actually use<\/span><\/h2><div class=\"sec-body\"><p>You don't write Raft yourself. Use a shared store to elect a leader.<\/p>\n<h3>Option A: Spring Integration + database lock<\/h3>\n<p>Dependencies: <code>spring-boot-starter-integration<\/code>, <code>spring-integration-jdbc<\/code>.\n(Create the <code>INT_LOCK<\/code> table from Spring Integration's <code>schema-*.sql<\/code> script.)<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">LeaderConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">DefaultLockRepository<\/span><span class=\"w\"> <\/span><span class=\"nf\">lockRepository<\/span><span class=\"p\">(<\/span><span class=\"n\">DataSource<\/span><span class=\"w\"> <\/span><span class=\"n\">ds<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">DefaultLockRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">DefaultLockRepository<\/span><span class=\"p\">(<\/span><span class=\"n\">ds<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">setTimeToLive<\/span><span class=\"p\">(<\/span><span class=\"mi\">10_000<\/span><span class=\"p\">);<\/span><span class=\"w\">            <\/span><span class=\"c1\">// lease 10 seconds<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">JdbcLockRegistry<\/span><span class=\"w\"> <\/span><span class=\"nf\">lockRegistry<\/span><span class=\"p\">(<\/span><span class=\"n\">LockRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">JdbcLockRegistry<\/span><span class=\"p\">(<\/span><span class=\"n\">repo<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">LockRegistryLeaderInitiator<\/span><span class=\"w\"> <\/span><span class=\"nf\">leaderInitiator<\/span><span class=\"p\">(<\/span><span class=\"n\">LockRegistry<\/span><span class=\"w\"> <\/span><span class=\"n\">registry<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">LockRegistryLeaderInitiator<\/span><span class=\"p\">(<\/span><span class=\"n\">registry<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// keeps trying to become leader<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@Slf4j<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">LeaderOnlyJobs<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">volatile<\/span><span class=\"w\"> <\/span><span class=\"kt\">boolean<\/span><span class=\"w\"> <\/span><span class=\"n\">leader<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">false<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@EventListener<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">onGranted<\/span><span class=\"p\">(<\/span><span class=\"n\">OnGrantedEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">leader<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">;<\/span><span class=\"w\">  <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"I am the LEADER now\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@EventListener<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">onRevoked<\/span><span class=\"p\">(<\/span><span class=\"n\">OnRevokedEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">leader<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">false<\/sp

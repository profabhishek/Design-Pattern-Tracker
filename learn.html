al traffic.<\/li>\n<li>Too big → doesn't protect anything and wastes memory.<\/li>\n<li>Measure with metrics (Actuator + Micrometer: <code>resilience4j.bulkhead.available.concurrent.calls<\/code>).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-compare\" id=\"bulkhead-vs-circuit-breaker\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Bulkhead vs Circuit Breaker<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Bulkhead<\/th>\n<th>Circuit Breaker<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Limits <strong>how many<\/strong> calls run <strong>at the same time<\/strong><\/td>\n<td>Stops calls <strong>completely<\/strong> when failure rate is high<\/td>\n<\/tr>\n<tr>\n<td>Protects <em>your<\/em> resources from one slow dependency<\/td>\n<td>Protects the <em>failing<\/em> dependency and gives fast failure<\/td>\n<\/tr>\n<tr>\n<td>Works even when calls are slow but not failing<\/td>\n<td>Reacts to errors/slow calls over a window<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Use both together, plus timeouts.<\/p><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Separate compartments → one failure doesn't sink everything.<\/li>\n<li>Semaphore vs thread-pool bulkhead.<\/li>\n<li>Size pools with Little's Law and metrics.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"two-types","t":"Two types","k":"idea"},{"id":"plain-java-separate-thread-pools-build-task","t":"Plain Java – separate thread pools (build task)","k":"build"},{"id":"spring-boot-resilience4j-bulkhead","t":"Spring Boot – Resilience4j Bulkhead","k":"code"},{"id":"pool-sizing","t":"Pool sizing","k":"default"},{"id":"bulkhead-vs-circuit-breaker","t":"Bulkhead vs Circuit Breaker","k":"compare"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this a ship is divided into watertight compartments called bulkheads. if one part gets a hole, only that compartment fills with water – the ship doesn't sink. what problem does it solve? your app calls two services: payment (important) and recommendations (nice-to-have). both share one pool of 200 threads. recommendations becomes very slow → all 200 threads get stuck waiting for it → payment requests have no thread left → checkout is down because of recommendations! bulkhead: give recommendations its own small pool (e.g. 20 threads). if it gets stuck, only those 20 are stuck. payment still has its own threads. two types type how semaphore bulkhead limit the number of concurrent calls (e.g. max 10 at a time) on the caller's thread. thread-pool bulkhead each dependency gets its own thread pool + queue . bigger scale bulkheads: separate connection pools, separate service instances for important customers, separate kubernetes node pools. plain java – separate thread pools (build task) java copy public class clients { private final executorservice paymentpool = executors . newfixedthreadpool ( 30 ); private final executorservice recopool = executors . newfixedthreadpool ( 10 ); public completablefuture < string > pay ( string id ) { return completablefuture . supplyasync (() -> callpayment ( id ), paymentpool ); } public completablefuture < list < string >> recommendations ( string user ) { return completablefuture . supplyasync (() -> callreco ( user ), recopool ) . completeontimeout ( list . of (), 500 , timeunit . milliseconds ); // fallback } } a semaphore version: java copy private final semaphore recoslots = new semaphore ( 10 ); public list < string > recommendations ( string user ) { if ( ! recoslots . tryacquire ()) return list . of (); // compartment full → fallback try { return callreco ( user ); } finally { recoslots . release (); } } spring boot – resilience4j bulkhead application.yml copy resilience4j : bulkhead : # semaphore type instances : recommendations : max-concurrent-calls : 10 max-wait-duration : 0 # don't wait, reject immediately thread-pool-bulkhead : # thread-pool type instances : payment : core-thread-pool-size : 20 max-thread-pool-size : 30 queue-capacity : 50 java copy @service public class shopclients { @bulkhead ( name = \"recommendations\" , fallbackmethod = \"norecos\" ) public list < string > recommendations ( string userid ) { return recoclient . get ( userid ); } private list < string > norecos ( string userid , throwable t ) { return list . of (); } @bulkhead ( name = \"payment\" , type = bulkhead . type . threadpool , fallbackmethod = \"paylater\" ) public completablefuture < string > pay ( string orderid ) { return completablefuture . completedfuture ( paymentclient . pay ( orderid )); } private completablefuture < string > paylater ( string orderid , throwable t ) { return completablefuture . completedfuture ( \"pending\" ); } } pool sizing rough formula (little's law): threads needed ≈ requests per second × average time per call (in seconds) . example: 50 req/s × 0.2 s = 10 threads. add some headroom. too small → rejects normal traffic. too big → doesn't protect anything and wastes memory. measure with metrics (actuator + micrometer: resilience4j.bulkhead.available.concurrent.calls ). bulkhead vs circuit breaker bulkhead circuit breaker limits how many calls run at the same time stops calls completely when failure rate is high protects your resources from one slow dependency protects the failing dependency and gives fast failure works even when calls are slow but not failing reacts to errors/slow calls over a window use both together, plus timeouts. quick revision separate compartments → one failure doesn't sink everything. semaphore vs thread-pool bulkhead. size pools with little's law and metrics."},{"id":"discovery","n":"Service Discovery","p":2,"focus":"Find service instances that come and go.","build":"Draw the registry flow for client-side and server-side discovery.","trade":"client-side vs server-side, health checks","day":8,"theme":"Protecting services","title":"Service Discovery","lede":"Services keep starting, stopping and moving. Service discovery is a <strong>phone book<\/strong> that tells you the <strong>current address<\/strong> of a service by its name.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>You want to call a pizza shop. You don't remember the number – you search the name on <strong>Google/JustDial<\/strong> and get today's number. If the shop changes its number, the directory is updated.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>In the cloud/Kubernetes:\n- A service may have 5 instances today, 12 tomorrow (auto-scaling).\n- IPs change every time an instance restarts.\n- Hard-coding <code>http://10.0.3.17:8081<\/code> breaks immediately.<\/p>\n<p>So: services <strong>register<\/strong> themselves in a <strong>registry<\/strong>, and others <strong>look up<\/strong> by name (<code>order-service<\/code>).<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"main-pieces\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Main pieces<\/span><\/h2><div class=\"sec-body\"><ol>\n<li><strong>Service Registry<\/strong> – the phone book (Eureka, Consul, Zookeeper, Kubernetes DNS/etcd).<\/li>\n<li><strong>Registration<\/strong> – on startup, an instance says \"I'm <code>order-service<\/code> at 10.0.3.17:8081\".<\/li>\n<li><strong>Health checks / heartbeats<\/strong> – instance keeps saying \"I'm alive\". Silent ones get removed.<\/li>\n<li><strong>Lookup<\/strong> – callers ask for healthy instances and pick one (load balancing).<\/li>\n<\/ol><\/div><\/section>\n<section class=\"sec k-build\" id=\"client-side-vs-server-side-discovery-build-task-draw-the-flow\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Client-side vs Server-side discovery (build task – draw the flow)<\/span><\/h2><div class=\"sec-body\"><h3>Client-side discovery<\/h3>\n<figure class=\"dg\" role=\"img\" aria-label=\"Client-side discovery: order-service the caller 1. where is payment-service? Registry (Eureka) phone book of live instances order-service 2. here: 10.0.1.5, 10.0.1.6 Registry (Eureka) order-service 3. picks one itself (client-side load balancing) calls directly payment-service 10.0.1.6\"><figcaption>Client-side discovery<\/figcaption><div class=\"dg-body\"><div class=\"flow\"><div class=\"node s-accent\"><b>order-service<\/b><small>the caller<\/small><\/div><div class=\"edge\"><span class=\"el\">1. where is payment-service?<\/span><i><\/i><\/div><div class=\"node s-muted\"><b>Registry (Eureka)<\/b><small>phone book of live instances<\/small><\/div><\/div><div class=\"flow\"><div class=\"node s-accent\"><b>order-service<\/b><\/div><div class=\"edge back\"><span class=\"el\">2. here: 10.0.1.5, 10.0.1.6<\/span><i><\/i><\/div><div class=\"node s-muted\"><b>Registry (Eureka)<\/b><\/div><\/div><div class=\"flow\"><div class=\"node s-accent\"><b>order-service<\/b><small>3. picks one itself (client-side load balancing)<\/small><\/div><div class=\"edge\"><span class=\"el\">calls directly<\/span><i><\/i><\/div><div class=\"node s-good\"><b>payment-service<\/b><small>10.0.1.6<\/small><\/div><\/div><\/div><\/figure>\n<h3>Server-side discovery<\/h3>\n<figure class=\"dg\" role=\"img\" aria-label=\"Server-side discovery: order-service just calls one name Load balancer / Router K8s Service · AWS ALB looks up the registry itself forwards payment-service one healthy instance\"><figcaption>Server-side discovery<\/figcaption><div class=\"dg-body\"><div class=\"flow\"><div class=\"node s-accent\"><b>order-service<\/b><small>just calls one name<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-warn\"><b>Load balancer / Router<\/b><small>K8s Service · AWS ALB<\/small><small>looks up the registry itself<\/small><\/div><div class=\"edge\"><span class=\"el\">forwards<\/span><i><\/i><\/div><div class=\"node s-good\"><b>payment-service<\/b><small>one healthy instance<\/small><\/div><\/div><\/div><\/figure>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th><\/th>\n<th>Client-side<\/th>\n<th>Server-side<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Who chooses the instance<\/td>\n<td>The calling service<\/td>\n<td>A load balancer/router<\/td>\n<\/tr>\n<tr>\n<td>Example<\/td>\n<td>Eureka + Spring Cloud LoadBalancer<\/td>\n<td>Kubernetes Service, AWS ALB<\/td>\n<\/tr>\n<tr>\n<td>Pros<\/td>\n<td>No extra hop, smart client-side balancing<\/td>\n<td>Clients stay simple, any language works<\/td>\n<\/tr>\n<tr>\n<td>Cons<\/td>\n<td>Each client needs the discovery library<\/td>\n<td>Extra hop; LB must be highly available<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-eureka-client-side\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – Eureka (client-side)<\/span><\/h2><div class=\"sec-body\"><h3>Registry server<\/h3>\n<p>Dependency: <code>spring-cloud-starter-netflix-eureka-server<\/code><\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@SpringBootApplication<\/span>\n<span class=\"nd\">@EnableEurekaServer<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">RegistryApplication<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">main<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"o\">[]<\/span><span class=\"w\"> <\/span><span class=\"n\">args<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">SpringApplication<\/span><span class=\"p\">.<\/span><span class=\"na\">run<\/span><span class=\"p\">(<\/span><span class=\"n\">RegistryApplication<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">args<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">server.port<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">8761<\/span>\n<span class=\"nt\">eureka<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">client<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">register-with-eureka<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">false<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">fetch-registry<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">false<\/span><\/code><\/pre><\/figure>\n<h3>A service registers itself<\/h3>\n<p>Dependency: <code>spring-cloud-starter-netflix-eureka-client<\/code><\/p>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">spring.application.name<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">payment-service<\/span>\n<span class=\"nt\">server.port<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">0<\/span><span class=\"w\">                         <\/span><span class=\"c1\"># random port – discovery makes it OK<\/span>\n<span class=\"nt\">eureka<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">client.service-url.defaultZone<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">http://localhost:8761/eureka<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">instance<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">lease-renewal-interval-in-seconds<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">10<\/span><span class=\"w\">     <\/span><span class=\"c1\"># heartbeat every 10s<\/span><\/code><\/pre><\/figure>\n<h3>Calling by name<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ClientConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@LoadBalanced<\/span><span class=\"w\">                       <\/span><span class=\"c1\">// resolves \"payment-service\" via the registry<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">RestClient<\/span><span class=\"p\">.<\/span><span class=\"na\">Builder<\/span><span class=\"w\"> <\/span><span class=\"nf\">lbRestClientBuilder<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">RestClient<\/span><span class=\"p\">.<\/span><span class=\"na\">builder<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentCaller<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">RestClient<\/span><span class=\"w\"> <\/span><span class=\"n\">client<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"nf\">PaymentCaller<\/span><span class=\"p\">(<\/span><span class=\"n\">RestClient<\/span><span class=\"p\">.<\/span><span class=\"na\">Builder<\/span><span class=\"w\"> <\/span><span class=\"n\">builder<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">this<\/span><span class=\"p\">.<\/span><span class=\"na\">client<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">builder<\/span><span class=\"p\">.<\/span><span class=\"na\">baseUrl<\/span><span class=\"p\">(<\/span><span class=\"s\">\"http://payment-service\"<\/span><span class=\"p\">).<\/span><span class=\"na\">build<\/span><span class=\"p\">();<\/span><span class=\"w\">   <\/span><span class=\"c1\">// name, not IP!<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">client<\/span><span class=\"p\">.<\/span><span class=\"na\">post<\/span><span class=\"p\">().<\/span><span class=\"na\">uri<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/pay/{id}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">).<\/span><span class=\"na\">retrieve<\/span><span class=\"p\">().<\/span><span class=\"na\">body<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Or with OpenFeign:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@FeignClient<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payment-service\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">PaymentFeign<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@PostMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/pay/{id}\"<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"nd\">@PathVariable<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>In Kubernetes (server-side)<\/h3>\n<p>No Eureka needed – K8s gives each Service a DNS name:<\/p>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">payment.base-url<\/span><span class=\"o\">=<\/span><span class=\"s\">http://payment-service.default.svc.cluster.local:8080<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"health-checks\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Health checks<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Spring Boot Actuator gives <code>/actuator/health<\/code>. The registry/K8s uses it.<\/li>\n<li>K8s: <strong>liveness<\/strong> probe (restart if dead) and <strong>readiness<\/strong> probe (don't send traffic until ready).<\/li>\n<li>Remove unhealthy instances fast, or callers get errors. Use retries + timeouts as a safety net.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Registry = phone book of live instances.<\/li>\n<li>Client-side (Eureka) vs server-side (K8s Service / LB).<\/li>\n<li>Heartbeats + health checks keep the list fresh.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"main-pieces","t":"Main pieces","k":"default"},{"id":"client-side-vs-server-side-discovery-build-task-draw-the-flow","t":"Client-side vs Server-side discovery (build task – draw the flow)","k":"build"},{"id":"spring-boot-code-eureka-client-side","t":"Spring Boot code – Eureka (client-side)","k":"code"},{"id":"health-checks","t":"Health checks","k":"default"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":3,"text":"think of it like this you want to call a pizza shop. you don't remember the number – you search the name on google/justdial and get today's number. if the shop changes its number, the directory is updated. what problem does it solve? in the cloud/kubernetes: - a service may have 5 instances today, 12 tomorrow (auto-scaling). - ips change every time an instance restarts. - hard-coding http://10.0.3.17:8081 breaks immediately. so: services register themselves in a registry , and others look up by name ( order-service ). main pieces service registry – the phone book (eureka, consul, zookeeper, kubernetes dns/etcd). registration – on startup, an instance says \"i'm order-service at 10.0.3.17:8081\". health checks / heartbeats – instance keeps saying \"i'm alive\". silent ones get removed. lookup – callers ask for healthy instances and pick one (load balancing). client-side vs server-side discovery (build task – draw the flow) client-side discovery client-side discovery order-service the caller 1. where is payment-service? registry (eureka) phone book of live instances order-service 2. here: 10.0.1.5, 10.0.1.6 registry (eureka) order-service 3. picks one itself (client-side load balancing) calls directly payment-service 10.0.1.6 server-side discovery server-side discovery order-service just calls one name load balancer / router k8s service · aws alb looks up the registry itself forwards payment-service one healthy instance client-side server-side who chooses the instance the calling service a load balancer/router example eureka + spring cloud loadbalancer kubernetes service, aws alb pros no extra hop, smart client-side balancing clients stay simple, any language works cons each client needs the discovery library extra hop; lb must be highly available spring boot code – eureka (client-side) registry server dependency: spring-cloud-starter-netflix-eureka-server java copy @springbootapplication @enableeurekaserver public class registryapplication { public static void main ( string [] args ) { springapplication . run ( registryapplication . class , args ); } } application.yml copy server.port : 8761 eureka : client : register-with-eureka : false fetch-registry : false a service registers itself dependency: spring-cloud-starter-netflix-eureka-client application.yml copy spring.application.name : payment-service server.port : 0 # random port – discovery makes it ok eureka : client.service-url.defaultzone : http://localhost:8761/eureka instance : lease-renewal-interval-in-seconds : 10 # heartbeat every 10s calling by name java copy @configuration public class clientconfig { @bean @loadbalanced // resolves \"payment-service\" via the registry public restclient . builder lbrestclientbuilder () { return restclient . builder (); } } @service public class paymentcaller { private final restclient client ; public paymentcaller ( restclient . builder builder ) { this . client = builder . baseurl ( \"http://payment-service\" ). build (); // name, not ip! } public string pay ( long orderid ) { return client . post (). uri ( \"/pay/{id}\" , orderid ). retrieve (). body ( string . class ); } } or with openfeign: java copy @feignclient ( name = \"payment-service\" ) public interface paymentfeign { @postmapping ( \"/pay/{id}\" ) string pay ( @pathvariable long id ); } in kubernetes (server-side) no eureka needed – k8s gives each service a dns name: application.properties copy payment.base-url = http://payment-service.default.svc.cluster.local:8080 health checks spring boot actuator gives /actuator/health . the registry/k8s uses it. k8s: liveness probe (restart if dead) and readiness probe (don't send traffic until ready). remove unhealthy instances fast, or callers get errors. use retries + timeouts as a safety net. quick revision registry = phone book of live instances. client-side (eureka) vs server-side (k8s service / lb). heartbeats + health checks keep the list fresh."},{"id":"eventual","n":"Eventual Consistency","p":2,"focus":"Replicas converge over time, not instantly.","build":"Sketch a read-your-writes bug and two ways to fix it.","trade":"CAP theorem, conflict resolution","day":9,"theme":"Data and messaging","title":"Eventual Consistency","lede":"After a change, different copies of data may <strong>disagree for a short time<\/strong>, but if no new changes come, they will <strong>all become the same eventually<\/strong>.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>You change your <strong>WhatsApp profile photo<\/strong>. Your friend in another city may still see the old photo for a few seconds. Eventually everybody sees the new one.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"why-do-systems-choose-it\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Why do systems choose it?<\/span><\/h2><div class=\"sec-body\"><p>When data is copied to many servers (replicas) or many services keep their own copy:\n- Updating <strong>all<\/strong> copies instantly before replying is slow and fails if one copy is unreachable.\n- So the system replies quickly and updates the other copies <strong>in the background<\/strong>.<\/p>\n<p>Benefit: <strong>fast and always available<\/strong>. Cost: <strong>sometimes stale data<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"cap-theorem-simple\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">CAP theorem (simple)<\/span><\/h2><div class=\"sec-body\"><p>In a distributed system, when there is a <strong>network Partition<\/strong> (servers can't talk), you must choose:<\/p>\n<ul>\n<li><strong>C – Consistency<\/strong>: everyone sees the latest data, or you get an error.<\/li>\n<li><strong>A – Availability<\/strong>: everyone gets an answer, maybe old data.<\/li>\n<\/ul>\n<p>You can't have both during a partition. <strong>P is not optional<\/strong> in real networks.<\/p>\n<ul>\n<li>Bank balance transfer → choose <strong>C<\/strong> (better to fail than show wrong money).<\/li>\n<li>Likes count, product reviews, feeds → choose <strong>A<\/strong> (slightly old is fine).<\/li>\n<\/ul>\n<p>Eventual consistency = the <strong>A<\/strong> choice.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"the-read-your-writes-bug-build-task\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">The read-your-writes bug (build task)<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"The read-your-writes bug: User saves name &quot;Ravi&quot; the write goes to the PRIMARY database Page reloads and reads the profile the read goes to a REPLICA that isn&#x27;t updated yet User sees the old name &quot;Ravee&quot; &quot;My save didn&#x27;t work!&quot; — confusing, even though the data is fine\"><figcaption>The read-your-writes bug<\/figcaption><div class=\"dg-body\"><ol class=\"tl\"><li class=\"\"><b>User saves name &quot;Ravi&quot;<\/b><span>the write goes to the PRIMARY database<\/span><\/li><li class=\"\"><b>Page reloads and reads the profile<\/b><span>the read goes to a REPLICA that isn&#x27;t updated yet<\/span><\/li><li class=\"t-fail\"><b>User sees the old name &quot;Ravee&quot;<\/b><span>&quot;My save didn&#x27;t work!&quot; — confusing, even though the data is fine<\/span><\/li><\/ol><\/div><\/figure>\n<h3>Fix 1: Read from primary right after a write<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ProfileService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ProfileRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// read-write → primary<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Profile<\/span><span class=\"w\"> <\/span><span class=\"nf\">updateName<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">name<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Profile<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">p<\/span><span class=\"p\">.<\/span><span class=\"na\">setName<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"p\">;<\/span><span class=\"w\">                           <\/span><span class=\"c1\">// return fresh data to the UI directly<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span><span class=\"p\">(<\/span><span class=\"n\">readOnly<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">true<\/span><span class=\"p\">)<\/span><span class=\"w\">         <\/span><span class=\"c1\">// can be routed to a replica<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Profile<\/span><span class=\"w\"> <\/span><span class=\"nf\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">repo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Route by transaction type with <code>AbstractRoutingDataSource<\/code>:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ReadWriteRoutingDataSource<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">AbstractRoutingDataSource<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">protected<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"w\"> <\/span><span class=\"nf\">determineCurrentLookupKey<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">TransactionSynchronizationManager<\/span><span class=\"p\">.<\/span><span class=\"na\">isCurrentTransactionReadOnly<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">?<\/span><span class=\"w\"> <\/span><span class=\"s\">\"replica\"<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"s\">\"primary\"<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Then, for a short time after a user writes (e.g. 5 seconds, tracked in session/cookie), send <em>that user's<\/em> reads to the primary too.<\/p>\n<h3>Fix 2: Version / timestamp check<\/h3>\n<p>Return a version number after a write. The client sends it on the next read. If the replica's version is older, read from primary (or wait a bit).<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Profile<\/span><span class=\"w\"> <\/span><span class=\"nf\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">minVersion<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">Profile<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">replicaRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">.<\/span><span class=\"na\">getVersion<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"n\">minVersion<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">primaryRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">findById<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">).<\/span><span class=\"na\">orElseThrow<\/span><span class=\"p\">();<\/span><span class=\"w\">   <\/span><span class=\"c1\">// replica is behind<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">p<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Other simple UI trick: show the updated value from the write response (<strong>optimistic UI<\/strong>).<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"conflict-resolution\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Conflict resolution<\/span><\/h2><div class=\"sec-body\"><p>When two copies are changed at the same time, which wins?<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>Meaning<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Last Write Wins (LWW)<\/strong><\/td>\n<td>Keep the one with the latest timestamp. Simple, but can lose data.<\/td>\n<\/tr>\n<tr>\n<td><strong>Version numbers / optimistic locking<\/strong><\/td>\n<td>Reject the update if the version changed. JPA <code>@Version<\/code> does this.<\/td>\n<\/tr>\n<tr>\n<td><strong>Merge<\/strong><\/td>\n<td>Combine both (e.g. shopping cart = union of items). CRDTs do this automatically.<\/td>\n<\/tr>\n<tr>\n<td><strong>Ask the user<\/strong><\/td>\n<td>Like Git merge conflicts.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Entity<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">Product<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Id<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">stock<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Version<\/span><span class=\"w\"> <\/span><span class=\"n\">Long<\/span><span class=\"w\"> <\/span><span class=\"n\">version<\/span><span class=\"p\">;<\/span><span class=\"w\">    <\/span><span class=\"c1\">// second concurrent update gets OptimisticLockException<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Eventual consistency trades freshness for availability and speed.<\/li>\n<li><strong>CAP<\/strong>: during a partition choose C or A.<\/li>\n<li><strong>Read-your-writes<\/strong> bug and fixes (primary after write, version checks).<\/li>\n<li><strong>Conflict resolution<\/strong>: LWW, versions, merge.<\/li>\n<li>Where it appears: DB replicas, caches, CQRS read models, microservice events.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Copies become equal \"eventually\".<\/li>\n<li>CAP: consistency vs availability during partition.<\/li>\n<li>Fix read-your-writes: read primary after writes, or check versions.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"why-do-systems-choose-it","t":"Why do systems choose it?","k":"default"},{"id":"cap-theorem-simple","t":"CAP theorem (simple)","k":"default"},{"id":"the-read-your-writes-bug-build-task","t":"The read-your-writes bug (build task)","k":"build"},{"id":"conflict-resolution","t":"Conflict resolution","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this you change your whatsapp profile photo . your friend in another city may still see the old photo for a few seconds. eventually everybody sees the new one. why do systems choose it? when data is copied to many servers (replicas) or many services keep their own copy: - updating all copies instantly before replying is slow and fails if one copy is unreachable. - so the system replies quickly and updates the other copies in the background . benefit: fast and always available . cost: sometimes stale data . cap theorem (simple) in a distributed system, when there is a network partition (servers can't talk), you must choose: c – consistency : everyone sees the latest data, or you get an error. a – availability : everyone gets an answer, maybe old data. you can't have both during a partition. p is not optional in real networks. bank balance transfer → choose c (better to fail than show wrong money). likes count, product reviews, feeds → choose a (slightly old is fine). eventual consistency = the a choice. the read-your-writes bug (build task) the read-your-writes bug user saves name \"ravi\" the write goes to the primary database page reloads and reads the profile the read goes to a replica that isn't updated yet user sees the old name \"ravee\" \"my save didn't work!\" — confusing, even though the data is fine fix 1: read from primary right after a write java copy @service @requiredargsconstructor public class profileservice { private final profilerepository repo ; @transactional // read-write → primary public profile updatename ( long id , string name ) { profile p = repo . findbyid ( id ). orelsethrow (); p . setname ( name ); return p ; // return fresh data to the ui directly } @transactional ( readonly = true ) // can be routed to a replica public profile get ( long id ) { return repo . findbyid ( id ). orelsethrow (); } } route by transaction type with abstractroutingdatasource : java copy public class readwriteroutingdatasource extends abstractroutingdatasource { @override protected object determinecurrentlookupkey () { return transactionsynchronizationmanager . iscurrenttransactionreadonly () ? \"replica\" : \"primary\" ; } } then, for a short time after a user writes (e.g. 5 seconds, tracked in session/cookie), send that user's reads to the primary too. fix 2: version / timestamp check return a version number after a write. the client sends it on the next read. if the replica's version is older, read from primary (or wait a bit). java copy public profile get ( long id , long minversion ) { profile p = replicarepo . findbyid ( id ). orelsethrow (); if ( p . getversion () < minversion ) { return primaryrepo . findbyid ( id ). orelsethrow (); // replica is behind } return p ; } other simple ui trick: show the updated value from the write response ( optimistic ui ). conflict resolution when two copies are changed at the same time, which wins? method meaning last write wins (lww) keep the one with the latest timestamp. simple, but can lose data. version numbers / optimistic locking reject the update if the version changed. jpa @version does this. merge combine both (e.g. shopping cart = union of items). crdts do this automatically. ask the user like git merge conflicts. java copy @entity public class product { @id long id ; int stock ; @version long version ; // second concurrent update gets optimisticlockexception } points to explain in an interview eventual consistency trades freshness for availability and speed. cap : during a partition choose c or a. read-your-writes bug and fixes (primary after write, version checks). conflict resolution : lww, versions, merge. where it appears: db replicas, caches, cqrs read models, microservice events. quick revision copies become equal \"eventually\". cap: consistency vs availability during partition. fix read-your-writes: read primary after writes, or check versions."},{"id":"dlq","n":"Dead Letter Queue","p":2,"focus":"Park messages that keep failing.","build":"Consumer that moves a message to a DLQ after N retries.","trade":"poison messages, replay, alerting","day":9,"theme":"Data and messaging","title":"Dead Letter Queue (DLQ)","lede":"If a message keeps failing after several retries, <strong>move it to a separate \"dead letter\" queue<\/strong> so it doesn't block the others. Someone can check and replay it later.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>The <strong>post office<\/strong> gets a letter with a wrong address. They try delivering a few times. Then they put it in the \"<strong>undeliverable letters<\/strong>\" box instead of trying forever. Someone checks that box later.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>A <strong>poison message<\/strong> is a message that will <strong>always<\/strong> fail (bad JSON, missing field, bug in code).<\/p>\n<p>Without a DLQ:\n- The consumer retries it forever → the queue is <strong>stuck<\/strong>, good messages behind it wait.\n- Or the consumer skips it → <strong>data is lost<\/strong> silently.<\/p>\n<p>With a DLQ: retry a few times, then park it safely, alert the team, keep processing others.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"flow\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Flow<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"How a message ends up in the DLQ: Main topic orders Consumer fails Retry 1, 2, 3 with backoff still failing Dead letter topic orders.DLT Alert and fix then replay it\"><figcaption>How a message ends up in the DLQ<\/figcaption><div class=\"dg-body\"><div class=\"flow long\"><div class=\"node s-accent\"><b>Main topic<\/b><small>orders<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-plain\"><b>Consumer<\/b><\/div><div class=\"edge\"><span class=\"el\">fails<\/span><i><\/i><\/div><div class=\"node s-warn\"><b>Retry 1, 2, 3<\/b><small>with backoff<\/small><\/div><div class=\"edge\"><span class=\"el\">still failing<\/span><i><\/i><\/div><div class=\"node s-fail\"><b>Dead letter topic<\/b><small>orders.DLT<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-good\"><b>Alert and fix<\/b><small>then replay it<\/small><\/div><\/div><\/div><\/figure><\/div><\/section>\n<section class=\"sec k-build\" id=\"spring-boot-kafka-build-task-move-to-dlq-after-n-retries\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – Kafka (build task: move to DLQ after N retries)<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">KafkaErrorConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">DefaultErrorHandler<\/span><span class=\"w\"> <\/span><span class=\"nf\">errorHandler<\/span><span class=\"p\">(<\/span><span class=\"n\">KafkaTemplate<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Object<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">template<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// send failed record to \"&lt;topic&gt;.DLT\", same partition<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">recoverer<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">DeadLetterPublishingRecoverer<\/span><span class=\"p\">(<\/span><span class=\"n\">template<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"c1\">// 3 retries: wait 1s, 2s, 4s<\/span>\n<span class=\"w\">        <\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">backoff<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ExponentialBackOffWithMaxRetries<\/span><span class=\"p\">(<\/span><span class=\"mi\">3<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">backoff<\/span><span class=\"p\">.<\/span><span class=\"na\">setInitialInterval<\/span><span class=\"p\">(<\/span><span class=\"mi\">1000<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">backoff<\/span><span class=\"p\">.<\/span><span class=\"na\">setMultiplier<\/span><span class=\"p\">(<\/span><span class=\"mi\">2<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"kd\">var<\/span><span class=\"w\"> <\/span><span class=\"n\">handler<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">DefaultErrorHandler<\/span><span class=\"p\">(<\/span><span class=\"n\">recoverer<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">backoff<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// these will never succeed → go to DLT immediately, no retries<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">handler<\/span><span class=\"p\">.<\/span><span class=\"na\">addNotRetryableExceptions<\/span><span class=\"p\">(<\/span><span class=\"n\">JsonProcessingException<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalArgumentException<\/span><span class=\"p\">.<\/span><span class=\"na\">class<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">handler<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Spring Boot auto-wires a <code>DefaultErrorHandler<\/code> bean into the listener container.<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@Slf4j<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderConsumer<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"orders\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">groupId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"billing\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">consume<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">event<\/span><span class=\"p\">.<\/span><span class=\"na\">amount<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"o\">&lt;<\/span><span class=\"w\"> <\/span><span class=\"mi\">0<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"k\">throw<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">IllegalArgumentException<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Negative amount\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">info<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Billing order {}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"orders.DLT\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">groupId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"billing-dlt\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">dlt<\/span><span class=\"p\">(<\/span><span class=\"n\">ConsumerRecord<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderEvent<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">rec<\/span><span class=\"p\">,<\/span>\n<span class=\"w\">                    <\/span><span class=\"nd\">@Header<\/span><span class=\"p\">(<\/span><span class=\"n\">KafkaHeaders<\/span><span class=\"p\">.<\/span><span class=\"na\">DLT_EXCEPTION_MESSAGE<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">error<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">error<\/span><span class=\"p\">(<\/span><span class=\"s\">\"DEAD LETTER: key={} error={}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">rec<\/span><span class=\"p\">.<\/span><span class=\"na\">key<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">error<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// save to a table, send Slack/email alert, etc.<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Even simpler: <code>@RetryableTopic<\/code> (non-blocking retries)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RetryableTopic<\/span><span class=\"p\">(<\/span><span class=\"n\">attempts<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"4\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">backoff<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Backoff<\/span><span class=\"p\">(<\/span><span class=\"n\">delay<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1000<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">multiplier<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n<span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"orders\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">groupId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"billing\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">consume<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@DltHandler<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">handleDlt<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Header<\/span><span class=\"p\">(<\/span><span class=\"n\">KafkaHeaders<\/span><span class=\"p\">.<\/span><span class=\"na\">RECEIVED_TOPIC<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">topic<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">error<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Moved to DLT from {}: {}\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">topic<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">);<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>This creates retry topics (<code>orders-retry-0<\/code>, ...) so the main topic keeps flowing while failed messages wait.<\/p>\n<h3>RabbitMQ version (short)<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Bean<\/span>\n<span class=\"n\">Queue<\/span><span class=\"w\"> <\/span><span class=\"nf\">ordersQueue<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">QueueBuilder<\/span><span class=\"p\">.<\/span><span class=\"na\">durable<\/span><span class=\"p\">(<\/span><span class=\"s\">\"orders\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">withArgument<\/span><span class=\"p\">(<\/span><span class=\"s\">\"x-dead-letter-exchange\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">withArgument<\/span><span class=\"p\">(<\/span><span class=\"s\">\"x-dead-letter-routing-key\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"orders.dlq\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">.<\/span><span class=\"na\">build<\/span><span class=\"p\">();<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"nd\">@Bean<\/span><span class=\"w\"> <\/span><span class=\"n\">Queue<\/span><span class=\"w\"> <\/span><span class=\"nf\">ordersDlq<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">QueueBuilder<\/span><span class=\"p\">.<\/span><span class=\"na\">durable<\/span><span class=\"p\">(<\/span><span class=\"s\">\"orders.dlq\"<\/span><span class=\"p\">).<\/span><span class=\"na\">build<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"properties\"><figcaption><span class=\"lang\">application.properties<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"na\">spring.rabbitmq.listener.simple.retry.enabled<\/span><span class=\"o\">=<\/span><span class=\"s\">true<\/span>\n<span class=\"na\">spring.rabbitmq.listener.simple.retry.max-attempts<\/span><span class=\"o\">=<\/span><span class=\"s\">3<\/span>\n<span class=\"na\">spring.rabbitmq.listener.simple.default-requeue-rejected<\/span><span class=\"o\">=<\/span><span class=\"s\">false<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"replay\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Replay<\/span><\/h2><div class=\"sec-body\"><p>After fixing the bug, send DLQ messages back to the main topic:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@PostMapping<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/admin/dlt/replay\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">replay<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"c1\">// read records from orders.DLT (e.g. with a KafkaConsumer) and:<\/span>\n<span class=\"w\">    <\/span><span class=\"c1\">// kafkaTemplate.send(\"orders\", record.key(), record.value());<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Consumers must be <strong>idempotent<\/strong>, because replayed messages may have been partly processed before.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Poison messages:<\/strong> messages that can never succeed; don't retry those (non-retryable exceptions).<\/li>\n<li><strong>Replay:<\/strong> after a fix, move messages back; needs idempotent consumers.<\/li>\n<li><strong>Alerting:<\/strong> a DLQ nobody watches = silent data loss. Add metrics/alerts on DLQ size.<\/li>\n<li>Keep error details in headers (exception, original topic, offset) to debug.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Retry N times with backoff → then DLQ.<\/li>\n<li>Don't block the main queue; don't lose data.<\/li>\n<li>Monitor, alert, fix, replay.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"flow","t":"Flow","k":"idea"},{"id":"spring-boot-kafka-build-task-move-to-dlq-after-n-retries","t":"Spring Boot – Kafka (build task: move to DLQ after N retries)","k":"build"},{"id":"replay","t":"Replay","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this the post office gets a letter with a wrong address. they try delivering a few times. then they put it in the \" undeliverable letters \" box instead of trying forever. someone checks that box later. what problem does it solve? a poison message is a message that will always fail (bad json, missing field, bug in code). without a dlq: - the consumer retries it forever → the queue is stuck , good messages behind it wait. - or the consumer skips it → data is lost silently. with a dlq: retry a few times, then park it safely, alert the team, keep processing others. flow how a message ends up in the dlq main topic orders consumer fails retry 1, 2, 3 with backoff still failing dead letter topic orders.dlt alert and fix then replay it spring boot – kafka (build task: move to dlq after n retries) java copy @configuration public class kafkaerrorconfig { @bean public defaulterrorhandler errorhandler ( kafkatemplate < object , object > template ) { // send failed record to \"<topic>.dlt\", same partition var recoverer = new deadletterpublishingrecoverer ( template ); // 3 retries: wait 1s, 2s, 4s var backoff = new exponentialbackoffwithmaxretries ( 3 ); backoff . setinitialinterval ( 1000 ); backoff . setmultiplier ( 2 ); var handler = new defaulterrorhandler ( recoverer , backoff ); // these will never succeed → go to dlt immediately, no retries handler . addnotretryableexceptions ( jsonprocessingexception . class , illegalargumentexception . class ); return handler ; } } spring boot auto-wires a defaulterrorhandler bean into the listener container. java copy @component @slf4j public class orderconsumer { @kafkalistener ( topics = \"orders\" , groupid = \"billing\" ) public void consume ( orderevent event ) { if ( event . amount () < 0 ) throw new illegalargumentexception ( \"negative amount\" ); log . info ( \"billing order {}\" , event . orderid ()); } @kafkalistener ( topics = \"orders.dlt\" , groupid = \"billing-dlt\" ) public void dlt ( consumerrecord < string , orderevent > rec , @header ( kafkaheaders . dlt_exception_message ) string error ) { log . error ( \"dead letter: key={} error={}\" , rec . key (), error ); // save to a table, send slack/email alert, etc. } } even simpler: @retryabletopic (non-blocking retries) java copy @retryabletopic ( attempts = \"4\" , backoff = @backoff ( delay = 1000 , multiplier = 2 )) @kafkalistener ( topics = \"orders\" , groupid = \"billing\" ) public void consume ( orderevent event ) { ... } @dlthandler public void handledlt ( orderevent event , @header ( kafkaheaders . received_topic ) string topic ) { log . error ( \"moved to dlt from {}: {}\" , topic , event ); } this creates retry topics ( orders-retry-0 , ...) so the main topic keeps flowing while failed messages wait. rabbitmq version (short) java copy @bean queue ordersqueue () { return queuebuilder . durable ( \"orders\" ) . withargument ( \"x-dead-letter-exchange\" , \"\" ) . withargument ( \"x-dead-letter-routing-key\" , \"orders.dlq\" ) . build (); } @bean queue ordersdlq () { return queuebuilder . durable ( \"orders.dlq\" ). build (); } application.properties copy spring.rabbitmq.listener.simple.retry.enabled = true spring.rabbitmq.listener.simple.retry.max-attempts = 3 spring.rabbitmq.listener.simple.default-requeue-rejected = false replay after fixing the bug, send dlq messages back to the main topic: java copy @postmapping ( \"/admin/dlt/replay\" ) public void replay () { // read records from orders.dlt (e.g. with a kafkaconsumer) and: // kafkatemplate.send(\"orders\", record.key(), record.value()); } consumers must be idempotent , because replayed messages may have been partly processed before. points to explain in an interview poison messages: messages that can never succeed; don't retry those (non-retryable exceptions). replay: after a fix, move messages back; needs idempotent consumers. alerting: a dlq nobody watches = silent data loss. add metrics/alerts on dlq size. keep error details in headers (exception, original topic, offset) to debug. quick revision retry n times with backoff → then dlq. don't block the main queue; don't lose data. monitor, alert, fix, replay."},{"id":"sharding","n":"Sharding","p":2,"focus":"Split data across nodes.","build":"Pick a shard key for an orders table; compare hash and range.","trade":"hot shards, resharding, cross-shard queries","day":9,"theme":"Data and messaging","title":"Sharding","lede":"When one database gets too big, <strong>split the data into pieces (shards)<\/strong> and keep each piece on a different server.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>school with 3000 students<\/strong> keeps attendance registers by section: A–F names in register 1, G–M in register 2, and so on. Each teacher handles one register. Faster than one giant register.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>One database server has limits: disk, CPU, memory, writes per second. Read replicas help with <strong>reads<\/strong>, but all <strong>writes<\/strong> still go to one primary. Sharding spreads <strong>both data and writes<\/strong> across many servers.<\/p>\n<p>Words:\n- <strong>Shard<\/strong> = one piece of the data (one DB server/cluster).\n- <strong>Shard key<\/strong> = the column used to decide which shard a row goes to.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"ways-to-split\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Ways to split<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Method<\/th>\n<th>How<\/th>\n<th>Good<\/th>\n<th>Bad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Hash sharding<\/strong><\/td>\n<td><code>shard = hash(customerId) % N<\/code><\/td>\n<td>Even spread<\/td>\n<td>Range queries hit all shards; changing N moves most data<\/td>\n<\/tr>\n<tr>\n<td><strong>Range sharding<\/strong><\/td>\n<td>ids 1–1M → shard 1, 1M–2M → shard 2 (or by date)<\/td>\n<td>Range queries easy<\/td>\n<td><strong>Hot shard<\/strong> – newest range gets all the writes<\/td>\n<\/tr>\n<tr>\n<td><strong>Directory / lookup<\/strong><\/td>\n<td>A table says \"customer 42 → shard 3\"<\/td>\n<td>Very flexible<\/td>\n<td>Lookup table is extra work and must be highly available<\/td>\n<\/tr>\n<tr>\n<td><strong>Geo sharding<\/strong><\/td>\n<td>India users → shard IN, EU → shard EU<\/td>\n<td>Low latency, data laws<\/td>\n<td>Uneven sizes<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-build\" id=\"build-task-pick-a-shard-key-for-an-orders-table\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Build task – pick a shard key for an <code>orders<\/code> table<\/span><\/h2><div class=\"sec-body\"><p>Common queries:\n1. \"Show my orders\" → <code>where customer_id = ?<\/code> (very common)\n2. \"Get order by id\" → <code>where order_id = ?<\/code>\n3. \"Daily sales report\" → across all orders (rare, analytics)<\/p>\n<div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Shard key<\/th>\n<th>Result<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>order_id<\/code> (hash)<\/td>\n<td>Even spread, but \"my orders\" must ask <strong>all<\/strong> shards ❌<\/td>\n<\/tr>\n<tr>\n<td><code>created_at<\/code> (range)<\/td>\n<td>Today's shard gets all the writes → <strong>hot shard<\/strong> ❌<\/td>\n<\/tr>\n<tr>\n<td><strong><code>customer_id<\/code> (hash)<\/strong> ✅<\/td>\n<td>All orders of a customer on one shard → \"my orders\" hits one shard. Even spread because many customers.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>To make \"get order by id\" fast too: put the shard number inside the order id (e.g. <code>orderId = shardId + sequence<\/code>), or keep a small lookup.\nFor reports: copy data to a data warehouse instead of querying all shards.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-simple-application-level-sharding\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – simple application-level sharding<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ShardContext<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ThreadLocal<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">Integer<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">CURRENT<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">ThreadLocal<\/span><span class=\"o\">&lt;&gt;<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">set<\/span><span class=\"p\">(<\/span><span class=\"kt\">int<\/span><span class=\"w\"> <\/span><span class=\"n\">shard<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">CURRENT<\/span><span class=\"p\">.<\/span><span class=\"na\">set<\/span><span class=\"p\">(<\/span><span class=\"n\">shard<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"n\">Integer<\/span><span class=\"w\"> <\/span><span class=\"nf\">get<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CURRENT<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">static<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">clear<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">CURRENT<\/span><span class=\"p\">.<\/span><span class=\"na\">remove<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ShardRoutingDataSource<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">AbstractRoutingDataSource<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">protected<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"w\"> <\/span><span class=\"nf\">determineCurrentLookupKey<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">ShardContext<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">();<\/span><span class=\"w\">             <\/span><span class=\"c1\">// which DataSource to use<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Configuration<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ShardConfig<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bean<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">DataSource<\/span><span class=\"w\"> <\/span><span class=\"nf\">dataSource<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Map<\/span><span class=\"o\">&lt;<\/span><

s=\"w\"> <\/span><span class=\"n\">payment<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">InventoryClient<\/span><span class=\"w\"> <\/span><span class=\"n\">inventory<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">placeOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"c1\">// Step 1: local transaction<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"s\">\"PENDING\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">orders<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">paymentId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// Step 2<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">paymentId<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">payment<\/span><span class=\"p\">.<\/span><span class=\"na\">charge<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getTotal<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// Step 3<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">inventory<\/span><span class=\"p\">.<\/span><span class=\"na\">reserve<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getItems<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// Step 4<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"s\">\"CONFIRMED\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">orders<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">warn<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Saga failed for order {}, compensating\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"c1\">// undo in REVERSE order<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">paymentId<\/span><span class=\"w\"> <\/span><span class=\"o\">!=<\/span><span class=\"w\"> <\/span><span class=\"kc\">null<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"n\">payment<\/span><span class=\"p\">.<\/span><span class=\"na\">refund<\/span><span class=\"p\">(<\/span><span class=\"n\">paymentId<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">order<\/span><span class=\"p\">.<\/span><span class=\"na\">setStatus<\/span><span class=\"p\">(<\/span><span class=\"s\">\"CANCELLED\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">orders<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>In real life the orchestrator also <strong>saves saga state<\/strong> (which step it reached) in a table, so it can continue after a crash. Tools: <strong>Temporal<\/strong>, <strong>Camunda<\/strong>, <strong>Axon<\/strong>, or Spring State Machine.<\/p><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code-choreography-with-kafka\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code – Choreography with Kafka<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"c1\">// Payment service<\/span>\n<span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">PaymentListener<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">KafkaTemplate<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Object<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">kafka<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentService<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"order-created\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">on<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderCreated<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">pid<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">charge<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">amount<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">kafka<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"s\">\"payment-done\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentDone<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">pid<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">ex<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"n\">kafka<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"s\">\"payment-failed\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentFailed<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">()));<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"stock-failed\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">onStockFailed<\/span><span class=\"p\">(<\/span><span class=\"n\">StockFailed<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">service<\/span><span class=\"p\">.<\/span><span class=\"na\">refundForOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">());<\/span><span class=\"w\">          <\/span><span class=\"c1\">// compensation<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">kafka<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"s\">\"payment-refunded\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">PaymentRefunded<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">()));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"c1\">// Order service<\/span>\n<span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"s\">\"payment-failed\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payment-refunded\"<\/span><span class=\"p\">})<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">cancel<\/span><span class=\"p\">(<\/span><span class=\"n\">OrderEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">orderService<\/span><span class=\"p\">.<\/span><span class=\"na\">markCancelled<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"nd\">@KafkaListener<\/span><span class=\"p\">(<\/span><span class=\"n\">topics<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"stock-reserved\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">confirm<\/span><span class=\"p\">(<\/span><span class=\"n\">StockReserved<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">orderService<\/span><span class=\"p\">.<\/span><span class=\"na\">markConfirmed<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">orderId<\/span><span class=\"p\">());<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>Use the <strong>Transactional Outbox<\/strong> to publish these events reliably, and make every handler <strong>idempotent<\/strong> (events can arrive twice).<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"limits-of-compensation-important\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Limits of compensation (important!)<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Not a real rollback.<\/strong> Some things can't be undone: an email already sent, an SMS, goods already shipped. You send a \"sorry\" email instead.<\/li>\n<li><strong>No isolation.<\/strong> Other users can see in-between states (order <code>PENDING<\/code>, stock reserved then released). Handle with clear statuses and \"semantic locks\" (e.g. a <code>PENDING<\/code> order can't be edited).<\/li>\n<li><strong>Compensation can fail too<\/strong> → it must be <strong>retried<\/strong> and be <strong>idempotent<\/strong>.<\/li>\n<li>Put risky steps that are hard to undo <strong>last<\/strong> (e.g. ship after payment + stock succeed).<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Saga = local steps + compensations.<\/li>\n<li>Orchestration (central boss) vs choreography (events).<\/li>\n<li>Compensations are not true rollbacks; no isolation; must be idempotent.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"build-task-order-payment-inventory","t":"Build task – order, payment, inventory","k":"build"},{"id":"two-styles","t":"Two styles","k":"default"},{"id":"spring-boot-code-orchestration-simple-version","t":"Spring Boot code – Orchestration (simple version)","k":"code"},{"id":"spring-boot-code-choreography-with-kafka","t":"Spring Boot code – Choreography with Kafka","k":"code"},{"id":"limits-of-compensation-important","t":"Limits of compensation (important!)","k":"default"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this planning a trip : book flight ✅ → book hotel ✅ → book cab ❌ (none available). you can't \"rollback\" the whole world, so you cancel the hotel and cancel the flight (maybe with a small fee). these cancellations are compensations . what problem does it solve? in a monolith, one database transaction covers everything ( @transactional ). in microservices, each service has its own database : order service → orders db payment service → payments db inventory service → inventory db there's no single transaction across all three. two-phase commit is slow and fragile. saga is the practical alternative. build task – order, payment, inventory step action compensation (undo) 1 order: create order (status pending ) mark order cancelled 2 payment: charge customer refund customer 3 inventory: reserve stock release stock 4 order: mark confirmed — if step 3 fails → refund (undo 2) → cancel order (undo 1). two styles a) choreography – services react to each other's events (no boss) choreography — services react to events happy path order created (pending) ordercreated payment charges paymentdone inventory reserves stock stockreserved order ✓ confirmed if stock can't be reserved inventory out of stock stockfailed payment refunds (compensation) paymentrefunded order ✕ cancelled b) orchestration – one orchestrator tells each service what to do orchestration — one boss tells everyone what to do order saga orchestrator 1. charge · 2. reserve · 3. confirm (or undo in reverse) charge / refund payment reserve / release inventory confirm / cancel order choreography orchestration control spread across services central orchestrator good for 2–4 simple steps many steps, complex rules pros loose coupling, no central point easy to see/debug the whole flow cons hard to follow the flow; cyclic dependencies orchestrator can become a \"god service\" spring boot code – orchestration (simple version) java copy public interface paymentclient { string charge ( long orderid , double amount ); void refund ( string paymentid ); } public interface inventoryclient { void reserve ( long orderid , list < item > items ); void release ( long orderid ); } java copy @service @requiredargsconstructor @slf4j public class ordersagaorchestrator { private final orderrepository orders ; private final paymentclient payment ; private final inventoryclient inventory ; public void placeorder ( order order ) { // step 1: local transaction order . setstatus ( \"pending\" ); orders . save ( order ); string paymentid = null ; try { // step 2 paymentid = payment . charge ( order . getid (), order . gettotal ()); // step 3 inventory . reserve ( order . getid (), order . getitems ()); // step 4 order . setstatus ( \"confirmed\" ); orders . save ( order ); } catch ( exception e ) { log . warn ( \"saga failed for order {}, compensating\" , order . getid (), e ); // undo in reverse order if ( paymentid != null ) payment . refund ( paymentid ); order . setstatus ( \"cancelled\" ); orders . save ( order ); } } } in real life the orchestrator also saves saga state (which step it reached) in a table, so it can continue after a crash. tools: temporal , camunda , axon , or spring state machine. spring boot code – choreography with kafka java copy // payment service @component @requiredargsconstructor public class paymentlistener { private final kafkatemplate < string , object > kafka ; private final paymentservice service ; @kafkalistener ( topics = \"order-created\" ) public void on ( ordercreated e ) { try { string pid = service . charge ( e . orderid (), e . amount ()); kafka . send ( \"payment-done\" , new paymentdone ( e . orderid (), pid )); } catch ( exception ex ) { kafka . send ( \"payment-failed\" , new paymentfailed ( e . orderid ())); } } @kafkalistener ( topics = \"stock-failed\" ) public void onstockfailed ( stockfailed e ) { service . refundfororder ( e . orderid ()); // compensation kafka . send ( \"payment-refunded\" , new paymentrefunded ( e . orderid ())); } } // order service @kafkalistener ( topics = { \"payment-failed\" , \"payment-refunded\" }) public void cancel ( orderevent e ) { orderservice . markcancelled ( e . orderid ()); } @kafkalistener ( topics = \"stock-reserved\" ) public void confirm ( stockreserved e ) { orderservice . markconfirmed ( e . orderid ()); } use the transactional outbox to publish these events reliably, and make every handler idempotent (events can arrive twice). limits of compensation (important!) not a real rollback. some things can't be undone: an email already sent, an sms, goods already shipped. you send a \"sorry\" email instead. no isolation. other users can see in-between states (order pending , stock reserved then released). handle with clear statuses and \"semantic locks\" (e.g. a pending order can't be edited). compensation can fail too → it must be retried and be idempotent . put risky steps that are hard to undo last (e.g. ship after payment + stock succeed). quick revision saga = local steps + compensations. orchestration (central boss) vs choreography (events). compensations are not true rollbacks; no isolation; must be idempotent."},{"id":"outbox","n":"Transactional Outbox","p":1,"focus":"Write the event in the same DB transaction as the data.","build":"Outbox table plus a poller that publishes to a queue.","trade":"at-least-once delivery, polling vs CDC","day":6,"theme":"Distributed transactions","title":"Transactional Outbox","lede":"Save the <strong>event<\/strong> in the <strong>same database transaction<\/strong> as your data (in an \"outbox\" table). A separate process later reads the outbox and publishes the events to Kafka/RabbitMQ.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>At a post office counter, the clerk writes your parcel in the <strong>register<\/strong> at the same time as accepting it. Later, the delivery team picks up every parcel listed in the register. Even if the delivery truck was late, nothing is forgotten because it's <strong>written in the register<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve-the-dual-write-problem\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve? (the \"dual write\" problem)<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Transactional<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">placeOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">o<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">orderRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">o<\/span><span class=\"p\">);<\/span><span class=\"w\">                          <\/span><span class=\"c1\">// 1. DB write<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">kafka<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"s\">\"order-created\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">event<\/span><span class=\"p\">);<\/span><span class=\"w\">         <\/span><span class=\"c1\">// 2. Kafka write<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>What can go wrong:\n- DB saves, then app crashes before Kafka send → <strong>event lost<\/strong>, other services never know.\n- Kafka sends, then DB commit fails → <strong>event for an order that doesn't exist<\/strong>.<\/p>\n<p>You can't have one transaction across DB and Kafka. The outbox fixes this: <strong>both writes go into the same DB<\/strong> in one transaction.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"how-it-works\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">How it works<\/span><\/h2><div class=\"sec-body\"><figure class=\"dg\" role=\"img\" aria-label=\"How the outbox works: Your service placeOrder() ONE transaction Database orders row + outbox row poller / CDC reads outbox Kafka topic order-events Other services react to the event\"><figcaption>How the outbox works<\/figcaption><div class=\"dg-body\"><div class=\"flow\"><div class=\"node s-accent\"><b>Your service<\/b><small>placeOrder()<\/small><\/div><div class=\"edge\"><span class=\"el\">ONE transaction<\/span><i><\/i><\/div><div class=\"node s-db\"><b>Database<\/b><small>orders row + outbox row<\/small><\/div><div class=\"edge\"><span class=\"el\">poller / CDC reads outbox<\/span><i><\/i><\/div><div class=\"node s-plain\"><b>Kafka<\/b><small>topic order-events<\/small><\/div><div class=\"edge\"><i><\/i><\/div><div class=\"node s-good\"><b>Other services<\/b><small>react to the event<\/small><\/div><\/div><\/div><\/figure><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-code\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot code<\/span><\/h2><div class=\"sec-body\"><h3>Outbox table<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Entity<\/span>\n<span class=\"nd\">@Table<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"outbox\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nd\">@Getter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@Setter<\/span><span class=\"w\"> <\/span><span class=\"nd\">@NoArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OutboxEvent<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Id<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">UUID<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">UUID<\/span><span class=\"p\">.<\/span><span class=\"na\">randomUUID<\/span><span class=\"p\">();<\/span><span class=\"w\">     <\/span><span class=\"c1\">// also used as message id for dedup<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">aggregateType<\/span><span class=\"p\">;<\/span><span class=\"w\">            <\/span><span class=\"c1\">// \"Order\"<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">aggregateId<\/span><span class=\"p\">;<\/span><span class=\"w\">              <\/span><span class=\"c1\">// \"42\"<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">eventType<\/span><span class=\"p\">;<\/span><span class=\"w\">                <\/span><span class=\"c1\">// \"OrderCreated\"<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Lob<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">payload<\/span><span class=\"p\">;<\/span><span class=\"w\">                  <\/span><span class=\"c1\">// JSON<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">Instant<\/span><span class=\"w\"> <\/span><span class=\"n\">createdAt<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Instant<\/span><span class=\"p\">.<\/span><span class=\"na\">now<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kt\">boolean<\/span><span class=\"w\"> <\/span><span class=\"n\">published<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"kc\">false<\/span><span class=\"p\">;<\/span>\n<span class=\"p\">}<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">interface<\/span> <span class=\"nc\">OutboxRepository<\/span><span class=\"w\"> <\/span><span class=\"kd\">extends<\/span><span class=\"w\"> <\/span><span class=\"n\">JpaRepository<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">OutboxEvent<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">UUID<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">OutboxEvent<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">findTop100ByPublishedFalseOrderByCreatedAtAsc<\/span><span class=\"p\">();<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Write data + event together<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OrderService<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OrderRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">orderRepo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OutboxRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">outboxRepo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ObjectMapper<\/span><span class=\"w\"> <\/span><span class=\"n\">mapper<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span><span class=\"w\">                                  <\/span><span class=\"c1\">// ONE transaction for both<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"nf\">placeOrder<\/span><span class=\"p\">(<\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">order<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"kd\">throws<\/span><span class=\"w\"> <\/span><span class=\"n\">JsonProcessingException<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">Order<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">orderRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">order<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"n\">OutboxEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">OutboxEvent<\/span><span class=\"p\">();<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">setAggregateType<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Order\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">setAggregateId<\/span><span class=\"p\">(<\/span><span class=\"n\">saved<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">().<\/span><span class=\"na\">toString<\/span><span class=\"p\">());<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">setEventType<\/span><span class=\"p\">(<\/span><span class=\"s\">\"OrderCreated\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">setPayload<\/span><span class=\"p\">(<\/span><span class=\"n\">mapper<\/span><span class=\"p\">.<\/span><span class=\"na\">writeValueAsString<\/span><span class=\"p\">(<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">Map<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">(<\/span><span class=\"s\">\"orderId\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"s\">\"total\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"p\">.<\/span><span class=\"na\">getTotal<\/span><span class=\"p\">())));<\/span>\n<span class=\"w\">        <\/span><span class=\"n\">outboxRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">save<\/span><span class=\"p\">(<\/span><span class=\"n\">e<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">saved<\/span><span class=\"p\">;<\/span><span class=\"w\">            <\/span><span class=\"c1\">// if anything fails, BOTH are rolled back<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<h3>Poller that publishes<\/h3>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Component<\/span>\n<span class=\"nd\">@RequiredArgsConstructor<\/span>\n<span class=\"nd\">@Slf4j<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">OutboxPublisher<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">OutboxRepository<\/span><span class=\"w\"> <\/span><span class=\"n\">outboxRepo<\/span><span class=\"p\">;<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">KafkaTemplate<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">kafka<\/span><span class=\"p\">;<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Scheduled<\/span><span class=\"p\">(<\/span><span class=\"n\">fixedDelay<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"mi\">1000<\/span><span class=\"p\">)<\/span><span class=\"w\">          <\/span><span class=\"c1\">// every 1 second (needs @EnableScheduling)<\/span>\n<span class=\"w\">    <\/span><span class=\"nd\">@Transactional<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">publish<\/span><span class=\"p\">()<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">for<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">OutboxEvent<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"w\"> <\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"n\">outboxRepo<\/span><span class=\"p\">.<\/span><span class=\"na\">findTop100ByPublishedFalseOrderByCreatedAtAsc<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">            <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">kafka<\/span><span class=\"p\">.<\/span><span class=\"na\">send<\/span><span class=\"p\">(<\/span><span class=\"s\">\"order-events\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">getAggregateId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">getPayload<\/span><span class=\"p\">())<\/span>\n<span class=\"w\">                     <\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"mi\">5<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">TimeUnit<\/span><span class=\"p\">.<\/span><span class=\"na\">SECONDS<\/span><span class=\"p\">);<\/span><span class=\"w\">       <\/span><span class=\"c1\">// wait for Kafka ack<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">setPublished<\/span><span class=\"p\">(<\/span><span class=\"kc\">true<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span><span class=\"w\"> <\/span><span class=\"k\">catch<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"n\">Exception<\/span><span class=\"w\"> <\/span><span class=\"n\">ex<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">                <\/span><span class=\"n\">log<\/span><span class=\"p\">.<\/span><span class=\"na\">warn<\/span><span class=\"p\">(<\/span><span class=\"s\">\"Publish failed for {}, will retry\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">e<\/span><span class=\"p\">.<\/span><span class=\"na\">getId<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"n\">ex<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">                <\/span><span class=\"k\">break<\/span><span class=\"p\">;<\/span><span class=\"w\">                                <\/span><span class=\"c1\">// keep order; try next round<\/span>\n<span class=\"w\">            <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">        <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>With many app instances, avoid two pollers taking the same rows: use <code>SELECT ... FOR UPDATE SKIP LOCKED<\/code> or a lock tool like <strong>ShedLock<\/strong>.<\/p><\/div><\/section>\n<section class=\"sec k-default\" id=\"at-least-once-delivery\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">At-least-once delivery<\/span><\/h2><div class=\"sec-body\"><p>If Kafka send succeeds but the app crashes <strong>before<\/strong> <code>published = true<\/code> is saved, the poller sends the same event again next time. So:<\/p>\n<ul>\n<li>Delivery is <strong>at-least-once<\/strong> (maybe duplicates, never lost).<\/li>\n<li>Consumers <strong>must be idempotent<\/strong> – e.g. store the event <code>id<\/code> in a <code>processed_events<\/code> table and skip duplicates.<\/li>\n<li>Using <code>aggregateId<\/code> as Kafka key keeps events of the same order <strong>in order<\/strong>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-compare\" id=\"polling-vs-cdc-change-data-capture\" data-kind=\"compare\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Polling vs CDC (Change Data Capture)<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Polling<\/th>\n<th>CDC (e.g. Debezium)<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Simple: a <code>@Scheduled<\/code> query<\/td>\n<td>Reads the DB's transaction log (binlog / WAL)<\/td>\n<\/tr>\n<tr>\n<td>Adds load to DB with frequent queries<\/td>\n<td>Very low latency, no polling queries<\/td>\n<\/tr>\n<tr>\n<td>Small delay (poll interval)<\/td>\n<td>More infrastructure to run (Kafka Connect + Debezium)<\/td>\n<\/tr>\n<tr>\n<td>Great to start<\/td>\n<td>Great at scale<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-default\" id=\"clean-up\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Clean up<\/span><\/h2><div class=\"sec-body\"><p>Delete published rows older than N days with another scheduled job, or the table keeps growing.<\/p><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>The <strong>dual-write problem<\/strong> and why outbox fixes it.<\/li>\n<li><strong>At-least-once delivery<\/strong> → consumers must be idempotent.<\/li>\n<li><strong>Polling vs CDC<\/strong>.<\/li>\n<li>Works hand-in-hand with <strong>Saga<\/strong> and <strong>Event Sourcing<\/strong>.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Save data + event in one DB transaction.<\/li>\n<li>A poller/CDC publishes the outbox to the broker.<\/li>\n<li>Duplicates possible → idempotent consumers.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve-the-dual-write-problem","t":"What problem does it solve? (the \"dual write\" problem)","k":"problem"},{"id":"how-it-works","t":"How it works","k":"idea"},{"id":"spring-boot-code","t":"Spring Boot code","k":"code"},{"id":"at-least-once-delivery","t":"At-least-once delivery","k":"default"},{"id":"polling-vs-cdc-change-data-capture","t":"Polling vs CDC (Change Data Capture)","k":"compare"},{"id":"clean-up","t":"Clean up","k":"default"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":4,"text":"think of it like this at a post office counter, the clerk writes your parcel in the register at the same time as accepting it. later, the delivery team picks up every parcel listed in the register. even if the delivery truck was late, nothing is forgotten because it's written in the register . what problem does it solve? (the \"dual write\" problem) java copy @transactional public void placeorder ( order o ) { orderrepo . save ( o ); // 1. db write kafka . send ( \"order-created\" , event ); // 2. kafka write } what can go wrong: - db saves, then app crashes before kafka send → event lost , other services never know. - kafka sends, then db commit fails → event for an order that doesn't exist . you can't have one transaction across db and kafka. the outbox fixes this: both writes go into the same db in one transaction. how it works how the outbox works your service placeorder() one transaction database orders row + outbox row poller / cdc reads outbox kafka topic order-events other services react to the event spring boot code outbox table java copy @entity @table ( name = \"outbox\" ) @getter @setter @noargsconstructor public class outboxevent { @id private uuid id = uuid . randomuuid (); // also used as message id for dedup private string aggregatetype ; // \"order\" private string aggregateid ; // \"42\" private string eventtype ; // \"ordercreated\" @lob private string payload ; // json private instant createdat = instant . now (); private boolean published = false ; } public interface outboxrepository extends jparepository < outboxevent , uuid > { list < outboxevent > findtop100bypublishedfalseorderbycreatedatasc (); } write data + event together java copy @service @requiredargsconstructor public class orderservice { private final orderrepository orderrepo ; private final outboxrepository outboxrepo ; private final objectmapper mapper ; @transactional // one transaction for both public order placeorder ( order order ) throws jsonprocessingexception { order saved = orderrepo . save ( order ); outboxevent e = new outboxevent (); e . setaggregatetype ( \"order\" ); e . setaggregateid ( saved . getid (). tostring ()); e . seteventtype ( \"ordercreated\" ); e . setpayload ( mapper . writevalueasstring ( map . of ( \"orderid\" , saved . getid (), \"total\" , saved . gettotal ()))); outboxrepo . save ( e ); return saved ; // if anything fails, both are rolled back } } poller that publishes java copy @component @requiredargsconstructor @slf4j public class outboxpublisher { private final outboxrepository outboxrepo ; private final kafkatemplate < string , string > kafka ; @scheduled ( fixeddelay = 1000 ) // every 1 second (needs @enablescheduling) @transactional public void publish () { for ( outboxevent e : outboxrepo . findtop100bypublishedfalseorderbycreatedatasc ()) { try { kafka . send ( \"order-events\" , e . getaggregateid (), e . getpayload ()) . get ( 5 , timeunit . seconds ); // wait for kafka ack e . setpublished ( true ); } catch ( exception ex ) { log . warn ( \"publish failed for {}, will retry\" , e . getid (), ex ); break ; // keep order; try next round } } } } with many app instances, avoid two pollers taking the same rows: use select ... for update skip locked or a lock tool like shedlock . at-least-once delivery if kafka send succeeds but the app crashes before published = true is saved, the poller sends the same event again next time. so: delivery is at-least-once (maybe duplicates, never lost). consumers must be idempotent – e.g. store the event id in a processed_events table and skip duplicates. using aggregateid as kafka key keeps events of the same order in order . polling vs cdc (change data capture) polling cdc (e.g. debezium) simple: a @scheduled query reads the db's transaction log (binlog / wal) adds load to db with frequent queries very low latency, no polling queries small delay (poll interval) more infrastructure to run (kafka connect + debezium) great to start great at scale clean up delete published rows older than n days with another scheduled job, or the table keeps growing. points to explain in an interview the dual-write problem and why outbox fixes it. at-least-once delivery → consumers must be idempotent. polling vs cdc . works hand-in-hand with saga and event sourcing . quick revision save data + event in one db transaction. a poller/cdc publishes the outbox to the broker. duplicates possible → idempotent consumers."},{"id":"ratelimit","n":"Rate Limiter","p":2,"focus":"Cap how fast a client can call you.","build":"Token bucket in code, then compare with a fixed window.","trade":"token bucket vs leaky bucket vs sliding window","day":8,"theme":"Protecting services","title":"Rate Limiter","lede":"Limit <strong>how many requests<\/strong> a client can make in a given time (e.g. 100 requests per minute). Extra requests get <code>429 Too Many Requests<\/code>.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>An <strong>ATM<\/strong> lets you withdraw only a fixed amount per day. Or a <strong>water tap with a small hole<\/strong> – no matter how much you open it, water only flows at a fixed speed.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Stops one user/bot from overloading your server.<\/li>\n<li>Protects against brute-force login attacks and scraping.<\/li>\n<li>Gives fair usage to all customers (free plan: 100/min, paid plan: 1000/min).<\/li>\n<li>Protects costly downstream services.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-idea\" id=\"common-algorithms\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Common algorithms<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Algorithm<\/th>\n<th>How it works (simple)<\/th>\n<th>Good / Bad<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Fixed window<\/strong><\/td>\n<td>Count requests in each minute (12:00–12:01). Reset at the start of each minute.<\/td>\n<td>Simple. But a burst at the edge: 100 at 12:00:59 + 100 at 12:01:00 = 200 in 2 sec.<\/td>\n<\/tr>\n<tr>\n<td><strong>Sliding window<\/strong><\/td>\n<td>Look at the <em>last 60 seconds<\/em> from now (log or weighted count).<\/td>\n<td>Smooth, accurate. Needs more memory/math.<\/td>\n<\/tr>\n<tr>\n<td><strong>Token bucket<\/strong><\/td>\n<td>A bucket holds up to N tokens; tokens are added at a fixed rate. Each request takes one token. No token → rejected.<\/td>\n<td>Allows <strong>short bursts<\/strong> up to bucket size, then a steady rate. Most popular.<\/td>\n<\/tr>\n<tr>\n<td><strong>Leaky bucket<\/strong><\/td>\n<td>Requests go into a queue that \"leaks\" (is processed) at a fixed rate. Full queue → rejected.<\/td>\n<td>Output is perfectly <strong>smooth<\/strong>; bursts wait in queue.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div><\/div><\/section>\n<section class=\"sec k-build\" id=\"token-bucket-in-plain-java-build-task\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Token bucket in plain Java (build task)<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">TokenBucket<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"kt\">long<\/span><span class=\"w\"> <\/span><span class=\"n\">capacity<\/span><span class=\"p\">;<\/span><span class=\"w\">         <\/span><span class=\"c1\">// max tokens (burst size)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span> pan>\n<span class=\"w\">    <\/span><span class=\"nd\">@Override<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">addInterceptors<\/span><span class=\"p\">(<\/span><span class=\"n\">InterceptorRegistry<\/span><span class=\"w\"> <\/span><span class=\"n\">r<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">r<\/span><span class=\"p\">.<\/span><span class=\"na\">addInterceptor<\/span><span class=\"p\">(<\/span><span class=\"n\">interceptor<\/span><span class=\"p\">).<\/span><span class=\"na\">addPathPatterns<\/span><span class=\"p\">(<\/span><span class=\"s\">\"/api/**\"<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>⚠️ This only works for <strong>one instance<\/strong>. With 5 instances, each has its own buckets. For a shared limit use <strong>Redis<\/strong> (e.g. Bucket4j + Redis, or Spring Cloud Gateway's <code>RequestRateLimiter<\/code>, which is a Redis token bucket).<\/p>\n<h3>Resilience4j RateLimiter (limit calls <em>you make<\/em> to another service)<\/h3>\n<figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">resilience4j<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">ratelimiter<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">instances<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">smsProvider<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">limit-for-period<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">50<\/span><span class=\"w\">          <\/span><span class=\"c1\"># 50 calls<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">limit-refresh-period<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">1s<\/span><span class=\"w\">      <\/span><span class=\"c1\"># per second<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">timeout-duration<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">0<\/span><span class=\"w\">           <\/span><span class=\"c1\"># don't wait, fail immediately<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@RateLimiter<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"smsProvider\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"queueSms\"<\/span><span class=\"p\">)<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kt\">void<\/span><span class=\"w\"> <\/span><span class=\"nf\">sendSms<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"kd\">to<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">msg<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"p\">...<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-explain\" id=\"points-to-explain-in-an-interview\" data-kind=\"explain\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Points to explain in an interview<\/span><\/h2><div class=\"sec-body\"><ul>\n<li><strong>Token bucket vs leaky bucket vs sliding window<\/strong> (table above). Token bucket allows bursts; leaky bucket smooths output; sliding window avoids the fixed-window edge burst.<\/li>\n<li>What key to limit on: user id, API key, IP.<\/li>\n<li>Distributed limiting needs a shared store (Redis) with atomic operations (Lua script).<\/li>\n<li>Return <code>429<\/code> + <code>Retry-After<\/code> header.<\/li>\n<\/ul><\/div><\/section>\n<section class=\"sec k-revision\" id=\"quick-revision\" data-kind=\"revision\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Quick revision<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Limit requests per time per client.<\/li>\n<li>Token bucket is the common choice.<\/li>\n<li>Many instances → keep counters in Redis.<\/li>\n<\/ul><\/div><\/section>","toc":[{"id":"real-life-example","t":"Think of it like this","k":"example"},{"id":"what-problem-does-it-solve","t":"What problem does it solve?","k":"problem"},{"id":"common-algorithms","t":"Common algorithms","k":"idea"},{"id":"token-bucket-in-plain-java-build-task","t":"Token bucket in plain Java (build task)","k":"build"},{"id":"fixed-window-in-plain-java-to-compare","t":"Fixed window in plain Java (to compare)","k":"code"},{"id":"spring-boot-per-client-limiter-as-an-interceptor","t":"Spring Boot – per-client limiter as an interceptor","k":"code"},{"id":"points-to-explain-in-an-interview","t":"Points to explain in an interview","k":"explain"},{"id":"quick-revision","t":"Quick revision","k":"revision"}],"mins":5,"text":"think of it like this an atm lets you withdraw only a fixed amount per day. or a water tap with a small hole – no matter how much you open it, water only flows at a fixed speed. what problem does it solve? stops one user/bot from overloading your server. protects against brute-force login attacks and scraping. gives fair usage to all customers (free plan: 100/min, paid plan: 1000/min). protects costly downstream services. common algorithms algorithm how it works (simple) good / bad fixed window count requests in each minute (12:00–12:01). reset at the start of each minute. simple. but a burst at the edge: 100 at 12:00:59 + 100 at 12:01:00 = 200 in 2 sec. sliding window look at the last 60 seconds from now (log or weighted count). smooth, accurate. needs more memory/math. token bucket a bucket holds up to n tokens; tokens are added at a fixed rate. each request takes one token. no token → rejected. allows short bursts up to bucket size, then a steady rate. most popular. leaky bucket requests go into a queue that \"leaks\" (is processed) at a fixed rate. full queue → rejected. output is perfectly smooth ; bursts wait in queue. token bucket in plain java (build task) java copy public class tokenbucket { private final long capacity ; // max tokens (burst size) private final double refillperms ; // tokens added per millisecond private double tokens ; private long lastrefill ; public tokenbucket ( long capacity , long refillpersecond ) { this . capacity = capacity ; this . refillperms = refillpersecond / 1000.0 ; this . tokens = capacity ; this . lastrefill = system . currenttimemillis (); } public synchronized boolean tryconsume () { long now = system . currenttimemillis (); tokens = math . min ( capacity , tokens + ( now - lastrefill ) * refillperms ); // refill lastrefill = now ; if ( tokens >= 1 ) { tokens -= 1 ; return true ; // allowed } return false ; // rejected } } fixed window in plain java (to compare) java copy public class fixedwindowlimiter { private final int limit ; private final long windowms ; private final map < string , long []> counters = new concurrenthashmap <> (); // key → [windowstart, count] public fixedwindowlimiter ( int limit , long windowms ) { this . limit = limit ; this . windowms = windowms ; } public synchronized boolean allow ( string clientid ) { long now = system . currenttimemillis (); long [] c = counters . computeifabsent ( clientid , k -> new long [] { now , 0 }); if ( now - c [ 0 ] >= windowms ) { c [ 0 ] = now ; c [ 1 ] = 0 ; } // new window if ( c [ 1 ] < limit ) { c [ 1 ]++ ; return true ; } return false ; } } spring boot – per-client limiter as an interceptor java copy @component public class ratelimitinterceptor implements handlerinterceptor { private final map < string , tokenbucket > buckets = new concurrenthashmap <> (); @override public boolean prehandle ( httpservletrequest req , httpservletresponse res , object handler ) { string key = optional . ofnullable ( req . getheader ( \"x-api-key\" )). orelse ( req . getremoteaddr ()); tokenbucket bucket = buckets . computeifabsent ( key , k -> new tokenbucket ( 20 , 10 )); // burst 20, 10/s if ( bucket . tryconsume ()) return true ; res . setstatus ( 429 ); res . setheader ( \"retry-after\" , \"1\" ); return false ; } } @configuration @requiredargsconstructor public class webconfig implements webmvcconfigurer { private final ratelimitinterceptor interceptor ; @override public void addinterceptors ( interceptorregistry r ) { r . addinterceptor ( interceptor ). addpathpatterns ( \"/api/**\" ); } } ⚠️ this only works for one instance . with 5 instances, each has its own buckets. for a shared limit use redis (e.g. bucket4j + redis, or spring cloud gateway's requestratelimiter , which is a redis token bucket). resilience4j ratelimiter (limit calls you make to another service) application.yml copy resilience4j : ratelimiter : instances : smsprovider : limit-for-period : 50 # 50 calls limit-refresh-period : 1s # per second timeout-duration : 0 # don't wait, fail immediately java copy @ratelimiter ( name = \"smsprovider\" , fallbackmethod = \"queuesms\" ) public void sendsms ( string to , string msg ) { ... } points to explain in an interview token bucket vs leaky bucket vs sliding window (table above). token bucket allows bursts; leaky bucket smooths output; sliding window avoids the fixed-window edge burst. what key to limit on: user id, api key, ip. distributed limiting needs a shared store (redis) with atomic operations (lua script). return 429 + retry-after header. quick revision limit requests per time per client. token bucket is the common choice. many instances → keep counters in redis."},{"id":"bulkhead","n":"Bulkhead","p":2,"focus":"Isolate resources so one failure does not sink everything.","build":"Separate thread pools per downstream dependency.","trade":"pool sizing, bulkhead vs circuit breaker","day":8,"theme":"Protecting services","title":"Bulkhead","lede":"Split your resources (threads, connections) into <strong>separate compartments<\/strong>, so if one part is flooded, the others keep working.","html":"<section class=\"sec k-example\" id=\"real-life-example\" data-kind=\"example\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Think of it like this<\/span><\/h2><div class=\"sec-body\"><p>A <strong>ship<\/strong> is divided into watertight compartments called bulkheads. If one part gets a hole, only that compartment fills with water – the ship doesn't sink.<\/p><\/div><\/section>\n<section class=\"sec k-problem\" id=\"what-problem-does-it-solve\" data-kind=\"problem\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">What problem does it solve?<\/span><\/h2><div class=\"sec-body\"><p>Your app calls two services: <strong>Payment<\/strong> (important) and <strong>Recommendations<\/strong> (nice-to-have). Both share one pool of 200 threads.<\/p>\n<p>Recommendations becomes very slow → all 200 threads get stuck waiting for it → payment requests have no thread left → <strong>checkout is down because of recommendations!<\/strong><\/p>\n<p>Bulkhead: give Recommendations its own small pool (e.g. 20 threads). If it gets stuck, only those 20 are stuck. Payment still has its own threads.<\/p><\/div><\/section>\n<section class=\"sec k-idea\" id=\"two-types\" data-kind=\"idea\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Two types<\/span><\/h2><div class=\"sec-body\"><div class=\"table-wrap\"><table>\n<thead>\n<tr>\n<th>Type<\/th>\n<th>How<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>Semaphore bulkhead<\/strong><\/td>\n<td>Limit the number of <strong>concurrent calls<\/strong> (e.g. max 10 at a time) on the caller's thread.<\/td>\n<\/tr>\n<tr>\n<td><strong>Thread-pool bulkhead<\/strong><\/td>\n<td>Each dependency gets its <strong>own thread pool + queue<\/strong>.<\/td>\n<\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>Bigger scale bulkheads: separate connection pools, separate service instances for important customers, separate Kubernetes node pools.<\/p><\/div><\/section>\n<section class=\"sec k-build\" id=\"plain-java-separate-thread-pools-build-task\" data-kind=\"build\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Plain Java – separate thread pools (build task)<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">Clients<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ExecutorService<\/span><span class=\"w\"> <\/span><span class=\"n\">paymentPool<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Executors<\/span><span class=\"p\">.<\/span><span class=\"na\">newFixedThreadPool<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">ExecutorService<\/span><span class=\"w\"> <\/span><span class=\"n\">recoPool<\/span><span class=\"w\">    <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Executors<\/span><span class=\"p\">.<\/span><span class=\"na\">newFixedThreadPool<\/span><span class=\"p\">(<\/span><span class=\"mi\">10<\/span><span class=\"p\">);<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">id<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"p\">.<\/span><span class=\"na\">supplyAsync<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">callPayment<\/span><span class=\"p\">(<\/span><span class=\"n\">id<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">paymentPool<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">recommendations<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">user<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"p\">.<\/span><span class=\"na\">supplyAsync<\/span><span class=\"p\">(()<\/span><span class=\"w\"> <\/span><span class=\"o\">-&gt;<\/span><span class=\"w\"> <\/span><span class=\"n\">callReco<\/span><span class=\"p\">(<\/span><span class=\"n\">user<\/span><span class=\"p\">),<\/span><span class=\"w\"> <\/span><span class=\"n\">recoPool<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">                <\/span><span class=\"p\">.<\/span><span class=\"na\">completeOnTimeout<\/span><span class=\"p\">(<\/span><span class=\"n\">List<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">(),<\/span><span class=\"w\"> <\/span><span class=\"mi\">500<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">TimeUnit<\/span><span class=\"p\">.<\/span><span class=\"na\">MILLISECONDS<\/span><span class=\"p\">);<\/span><span class=\"w\">   <\/span><span class=\"c1\">// fallback<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure>\n<p>A semaphore version:<\/p>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"kd\">final<\/span><span class=\"w\"> <\/span><span class=\"n\">Semaphore<\/span><span class=\"w\"> <\/span><span class=\"n\">recoSlots<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"k\">new<\/span><span class=\"w\"> <\/span><span class=\"n\">Semaphore<\/span><span class=\"p\">(<\/span><span class=\"mi\">10<\/span><span class=\"p\">);<\/span>\n\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">recommendations<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">user<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">if<\/span><span class=\"w\"> <\/span><span class=\"p\">(<\/span><span class=\"o\">!<\/span><span class=\"n\">recoSlots<\/span><span class=\"p\">.<\/span><span class=\"na\">tryAcquire<\/span><span class=\"p\">())<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">();<\/span><span class=\"w\">     <\/span><span class=\"c1\">// compartment full → fallback<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">try<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">callReco<\/span><span class=\"p\">(<\/span><span class=\"n\">user<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"w\">    <\/span><span class=\"k\">finally<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"n\">recoSlots<\/span><span class=\"p\">.<\/span><span class=\"na\">release<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-code\" id=\"spring-boot-resilience4j-bulkhead\" data-kind=\"code\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Spring Boot – Resilience4j Bulkhead<\/span><\/h2><div class=\"sec-body\"><figure class=\"code\" data-lang=\"yaml\"><figcaption><span class=\"lang\">application.yml<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nt\">resilience4j<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">bulkhead<\/span><span class=\"p\">:<\/span><span class=\"w\">                         <\/span><span class=\"c1\"># semaphore type<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">instances<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">recommendations<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">max-concurrent-calls<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">10<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">max-wait-duration<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">0<\/span><span class=\"w\">        <\/span><span class=\"c1\"># don't wait, reject immediately<\/span>\n<span class=\"w\">  <\/span><span class=\"nt\">thread-pool-bulkhead<\/span><span class=\"p\">:<\/span><span class=\"w\">             <\/span><span class=\"c1\"># thread-pool type<\/span>\n<span class=\"w\">    <\/span><span class=\"nt\">instances<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">      <\/span><span class=\"nt\">payment<\/span><span class=\"p\">:<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">core-thread-pool-size<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">20<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">max-thread-pool-size<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">30<\/span>\n<span class=\"w\">        <\/span><span class=\"nt\">queue-capacity<\/span><span class=\"p\">:<\/span><span class=\"w\"> <\/span><span class=\"l l-Scalar l-Scalar-Plain\">50<\/span><\/code><\/pre><\/figure>\n<figure class=\"code\" data-lang=\"java\"><figcaption><span class=\"lang\">Java<\/span><button type=\"button\" class=\"copy\" aria-label=\"Copy code\">Copy<\/button><\/figcaption><pre><code><span class=\"nd\">@Service<\/span>\n<span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"kd\">class<\/span> <span class=\"nc\">ShopClients<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bulkhead<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"recommendations\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"noRecos\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">recommendations<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">userId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">recoClient<\/span><span class=\"p\">.<\/span><span class=\"na\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">userId<\/span><span class=\"p\">);<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">noRecos<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">userId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Throwable<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span><span class=\"w\"> <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">List<\/span><span class=\"p\">.<\/span><span class=\"na\">of<\/span><span class=\"p\">();<\/span><span class=\"w\"> <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"nd\">@Bulkhead<\/span><span class=\"p\">(<\/span><span class=\"n\">name<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payment\"<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">type<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"n\">Bulkhead<\/span><span class=\"p\">.<\/span><span class=\"na\">Type<\/span><span class=\"p\">.<\/span><span class=\"na\">THREADPOOL<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">fallbackMethod<\/span><span class=\"w\"> <\/span><span class=\"o\">=<\/span><span class=\"w\"> <\/span><span class=\"s\">\"payLater\"<\/span><span class=\"p\">)<\/span>\n<span class=\"w\">    <\/span><span class=\"kd\">public<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"p\">.<\/span><span class=\"na\">completedFuture<\/span><span class=\"p\">(<\/span><span class=\"n\">paymentClient<\/span><span class=\"p\">.<\/span><span class=\"na\">pay<\/span><span class=\"p\">(<\/span><span class=\"n\">orderId<\/span><span class=\"p\">));<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n\n<span class=\"w\">    <\/span><span class=\"kd\">private<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"o\">&lt;<\/span><span class=\"n\">String<\/span><span class=\"o\">&gt;<\/span><span class=\"w\"> <\/span><span class=\"nf\">payLater<\/span><span class=\"p\">(<\/span><span class=\"n\">String<\/span><span class=\"w\"> <\/span><span class=\"n\">orderId<\/span><span class=\"p\">,<\/span><span class=\"w\"> <\/span><span class=\"n\">Throwable<\/span><span class=\"w\"> <\/span><span class=\"n\">t<\/span><span class=\"p\">)<\/span><span class=\"w\"> <\/span><span class=\"p\">{<\/span>\n<span class=\"w\">        <\/span><span class=\"k\">return<\/span><span class=\"w\"> <\/span><span class=\"n\">CompletableFuture<\/span><span class=\"p\">.<\/span><span class=\"na\">completedFuture<\/span><span class=\"p\">(<\/span><span class=\"s\">\"PENDING\"<\/span><span class=\"p\">);<\/span>\n<span class=\"w\">    <\/span><span class=\"p\">}<\/span>\n<span class=\"p\">}<\/span><\/code><\/pre><\/figure><\/div><\/section>\n<section class=\"sec k-default\" id=\"pool-sizing\" data-kind=\"default\"><h2><span class=\"ico\" aria-hidden=\"true\"><\/span><span class=\"h2t\">Pool sizing<\/span><\/h2><div class=\"sec-body\"><ul>\n<li>Rough formula (Little's Law): <strong>threads needed ≈ requests per second × average time per call (in seconds)<\/strong>.\n  Example: 50 req/s × 0.2 s = 10 threads. Add some headroom.<\/li>\n<li>Too small → rejects norm
